ow will that affect the family’s lifestyle? Support, empower, communicate."},{"id":"qc9c83ccdd5","quiz":"a-tus","sys":"prof","pts":1,"q":"In the Therapeutic Use of Self lecture, what is a nurse’s professional “agency” used for?","qh":"<p>In the Therapeutic Use of Self lecture, what is a nurse’s professional “agency” used for?</p>","qt":"In the Therapeutic Use of Self lecture, what is a nurse’s professional “agency” used for?","imgs":[],"type":"mcq","authored":1,"opts":["Meeting the nurse’s own need to feel useful","Service to the patient — that is, for therapeutic benefit","Acting on the employer’s behalf","Gaining authority over the patient’s decisions"],"key":["Service to the patient — that is, for therapeutic benefit"],"src":"the Therapeutic Use of Self deck, slides 5–6","why":"A therapeutic agent acts on behalf of someone or takes an active role. A nurse’s professional agency is employed in service to the patient, for therapeutic benefit — nurses understand they can make a difference and know how to use their professional influence and knowledge to benefit patients."},{"id":"q6859b914fb","quiz":"a-tus","sys":"prof","pts":1,"q":"Which theorist’s Theory of Human Caring — caring moments, carative factors, transpersonal caring — does the Therapeutic Use of Self lecture teach?","qh":"<p>Which theorist’s Theory of Human Caring — caring moments, carative factors, transpersonal caring — does the Therapeutic Use of Self lecture teach?</p>","qt":"Which theorist’s Theory of Human Caring — caring moments, carative factors, transpersonal caring — does the Therapeutic Use of Self lecture teach?","imgs":[],"type":"mcq","authored":1,"opts":["Jean Watson","Florence Nightingale","Patricia Benner","Dorothea Orem"],"key":["Jean Watson"],"src":"the Therapeutic Use of Self deck, slides 10–12","why":"Jean Watson’s Theory of Human Caring: caring is the heart of nursing — caring for the whole person, not just the illness. Every nurse–patient interaction is a caring moment; the ten carative factors are its guiding principles."},{"id":"q76a6ad0126","quiz":"a-tus","sys":"prof","pts":1,"q":"The Therapeutic Use of Self lecture names two things through which a nurse develops therapeutic agency. Which are they?","qh":"<p>The Therapeutic Use of Self lecture names two things through which a nurse develops therapeutic agency. Which are they?</p>","qt":"The Therapeutic Use of Self lecture names two things through which a nurse develops therapeutic agency. Which are they?","imgs":[],"type":"mcq","authored":1,"opts":["Advanced clinical skills and good time management","Seniority in the team and specialisation in one area","Competent communication and emotional intelligence","Assertiveness and professional detachment"],"key":["Competent communication and emotional intelligence"],"src":"the Therapeutic Use of Self deck, slides 13 and 38","why":"“Developing Therapeutic Agency”: competent communication and emotional intelligence. The lecture notes add that a sense of agency develops through continual learning from clinical experience, and through reflecting on and evaluating your own performance."},{"id":"q9bda1a2a16","quiz":"a-tus","sys":"prof","pts":1,"q":"A frightened patient says “nobody has explained this properly”, and the nurse responds with empathy and active listening before doing anything else. Which type of communication technique is this?","qh":"<p>A frightened patient says “nobody has explained this properly”, and the nurse responds with empathy and active listening before doing anything else. Which type of communication technique is this?</p>","qt":"A frightened patient says “nobody has explained this properly”, and the nurse responds with empathy and active listening before doing anything else. Which type of communication technique is this?","imgs":[],"type":"mcq","authored":1,"opts":["Assertive","Closed questioning","Surface acting","Responsive"],"key":["Responsive"],"src":"the Therapeutic Use of Self deck, slides 21–24","why":"Responsive techniques build mutual understanding from the same point of view — empathy, listening, validation — and are used to build relationships with patients and families. Assertive techniques promote understanding of DIFFERING points of view and are often used when advocating for clients."},{"id":"q16c186b465","quiz":"a-tus","sys":"prof","pts":1,"q":"When does the Therapeutic Use of Self lecture say assertive communication skills are often used?","qh":"<p>When does the Therapeutic Use of Self lecture say assertive communication skills are often used?</p>","qt":"When does the Therapeutic Use of Self lecture say assertive communication skills are often used?","imgs":[],"type":"mcq","authored":1,"opts":["When advocating for clients","When building rapport at a first meeting","When a patient needs comforting","When documenting care"],"key":["When advocating for clients"],"src":"the Therapeutic Use of Self deck, slides 21–23 and 25","why":"Assertive skills are often used when advocating for clients; responsive skills are for building relationships. Effective communicators blend and balance the two — asserting their own ideas while responding with understanding to other people’s."},{"id":"q84581eae5b","quiz":"a-tus","sys":"prof","pts":1,"q":"At the end of a long shift a nurse does not feel calm, but keeps a calm, kind manner with an angry patient — “putting on a mask”. What is this called?","qh":"<p>At the end of a long shift a nurse does not feel calm, but keeps a calm, kind manner with an angry patient — “putting on a mask”. What is this called?</p>","qt":"At the end of a long shift a nurse does not feel calm, but keeps a calm, kind manner with an angry patient — “putting on a mask”. What is this called?","imgs":[],"type":"mcq","authored":1,"opts":["Deep acting","Surface acting","Self-awareness","Transpersonal caring"],"key":["Surface acting"],"src":"the Therapeutic Use of Self deck, slides 28–30","why":"Surface acting is the overt expression of an emotion the person does not feel but thinks the situation needs. Deep acting is a genuine shift in the nurse’s own feelings, reached by trying to understand the situation from the patient’s perspective. Both are part of emotional labour, under self-regulation."},{"id":"q3231992740","quiz":"a-tus","sys":"prof","pts":1,"q":"Which component of emotional intelligence involves reflecting on your own judgements of patients, rather than denying or ignoring them?","qh":"<p>Which component of emotional intelligence involves reflecting on your own judgements of patients, rather than denying or ignoring them?</p>","qt":"Which component of emotional intelligence involves reflecting on your own judgements of patients, rather than denying or ignoring them?","imgs":[],"type":"mcq","authored":1,"opts":["Motivation","Social skills","Self-awareness","Self-regulation"],"key":["Self-awareness"],"src":"the Therapeutic Use of Self deck, slides 26–27","why":"Self-awareness is the accurate assessment and knowledge of self in relation to others: bringing negative evaluations of patients into conscious awareness so their meaning can be explored and corrective action taken. It is the base of the deck’s emotional-intelligence hierarchy."},{"id":"q1bee8c7d26","quiz":"a-tus","sys":"prof","pts":1,"q":"In the Therapeutic Use of Self lecture, what does “motivation” mean as a component of emotional intelligence?","qh":"<p>In the Therapeutic Use of Self lecture, what does “motivation” mean as a component of emotional intelligence?</p>","qt":"In the Therapeutic Use of Self lecture, what does “motivation” mean as a component of emotional intelligence?","imgs":[],"type":"mcq","authored":1,"opts":["Working hard in order to earn praise, good grades and other rewards","Encouraging patients to stick to their treatment by setting goals with them","Keeping your own emotions hidden from patients so that they feel safe and comfortable","Being driven by internal values and commitment rather than external rewards"],"key":["Being driven by internal values and commitment rather than external rewards"],"src":"the Therapeutic Use of Self deck, slides 31–32","why":"Motivation: driven by internal factors rather than external rewards — a strong desire to meet personal and professional goals and a commitment to ethics and personal values. “Motivation keeps nurses practising ethically, even when no one is watching.”"},{"id":"q452619d406","quiz":"a-roles","sys":"prof","pts":1,"q":"In the aged-care section of the Roles of Nurses lecture, what is “multi-morbidity”?","qh":"<p>In the aged-care section of the Roles of Nurses lecture, what is “multi-morbidity”?</p>","qt":"In the aged-care section of the Roles of Nurses lecture, what is “multi-morbidity”?","imgs":[],"type":"mcq","authored":1,"opts":["Several chronic diseases at once — a result and a cause of functional decline","Dying from more than one cause listed on the death certificate","Taking five or more regular medicines at once, with the risk of interactions","Being admitted to hospital three or more times within a single year"],"key":["Several chronic diseases at once — a result and a cause of functional decline"],"src":"the Roles of Nurses deck, slide 4","why":"Ageing is a major risk factor for developing chronic diseases — a state called multi-morbidity, which is the result (and cause) of functional decline in older age. Lost function means difficulty with activities of daily living, and with that a reduction in social life and wellbeing."},{"id":"q9195f49a21","quiz":"a-roles","sys":"prof","pts":1,"q":"Which are the three levels of RESIDENTIAL-based aged care in New Zealand named in the Roles of Nurses lecture?","qh":"<p>Which are the three levels of RESIDENTIAL-based aged care in New Zealand named in the Roles of Nurses lecture?</p>","qt":"Which are the three levels of RESIDENTIAL-based aged care in New Zealand named in the Roles of Nurses lecture?","imgs":[],"type":"mcq","authored":1,"opts":["Private house, retirement village, assisted living","Primary, secondary and tertiary care","Rest home, hospital and dementia level of care","Respite, rehabilitation and palliative care"],"key":["Rest home, hospital and dementia level of care"],"src":"the Roles of Nurses deck, slide 5","why":"Residential-based care: rest home level, hospital level and dementia level of care — 24-hour care from trained staff. Private houses, retirement villages and assisted living are the “extra-mural” settings, where services support the older person to keep living independently."},{"id":"qc795cc439f","quiz":"a-roles","sys":"prof","pts":1,"q":"How does the Roles of Nurses lecture define primary healthcare?","qh":"<p>How does the Roles of Nurses lecture define primary healthcare?</p>","qt":"How does the Roles of Nurses lecture define primary healthcare?","imgs":[],"type":"mcq","authored":1,"opts":["The first treatment a patient receives in the emergency department","Healthcare services provided outside the hospital","Care delivered only by general practitioners","The most urgent tier of hospital care"],"key":["Healthcare services provided outside the hospital"],"src":"the Roles of Nurses deck, slides 10–11","why":"Primary healthcare is healthcare provided outside the hospital. Community-based nursing takes place where clients live, work and play — a school, a work site, a home — with clients from pre-birth to very old age, across the whole continuum from health promotion to care of illness."},{"id":"q206363b178","quiz":"a-roles","sys":"prof","pts":1,"q":"Which definition of acute care matches the Roles of Nurses lecture?","qh":"<p>Which definition of acute care matches the Roles of Nurses lecture?</p>","qt":"Which definition of acute care matches the Roles of Nurses lecture?","imgs":[],"type":"mcq","authored":1,"opts":["Long-term management of chronic conditions in the community, to keep people well and out of hospital for as long as possible","Any care provided by a registered nurse in a hospital, as opposed to care provided in the home or a clinic","Care for people in the last days or weeks of life, focused on comfort and on support for their family","Treatment of sudden, urgent or emergent illness or injury that could cause death or disability without rapid intervention"],"key":["Treatment of sudden, urgent or emergent illness or injury that could cause death or disability without rapid intervention"],"src":"the Roles of Nurses deck, slide 16","why":"Acute care: the parts of the health system used to treat sudden, often unexpected, urgent or emergent episodes of injury and illness that can lead to death or disability without rapid intervention — emergency, trauma, acute surgery, critical care, urgent care and short-term inpatient stabilisation."},{"id":"q1adf67fc6d","quiz":"a-roles","sys":"prof","pts":1,"q":"In mental health nursing today, what does “recovery” mean?","qh":"<p>In mental health nursing today, what does “recovery” mean?</p>","qt":"In mental health nursing today, what does “recovery” mean?","imgs":[],"type":"mcq","authored":1,"opts":["Living well with mental health problems, with hope at the centre — not “cure”","Complete and permanent cure of the illness, confirmed by a psychiatrist’s review","Discharge from the inpatient unit back to the care of the GP","No longer needing any medication or contact with services"],"key":["Living well with mental health problems, with hope at the centre — not “cure”"],"src":"the Roles of Nurses deck, slide 26","why":"The current concept of recovery does not mean “cure” as it does elsewhere in healthcare; it refers to living with mental health problems. Hope is central — it sustains people through distress and supports them in keeping their personal life goals."},{"id":"q1fba6800a6","quiz":"a-roles","sys":"prof","pts":1,"q":"Mental health nursing is underpinned by interpersonal theory. What does that theory place at the centre of mental healthcare?","qh":"<p>Mental health nursing is underpinned by interpersonal theory. What does that theory place at the centre of mental healthcare?</p>","qt":"Mental health nursing is underpinned by interpersonal theory. What does that theory place at the centre of mental healthcare?","imgs":[],"type":"mcq","authored":1,"opts":["The diagnosis and its classification","The medication regimen and the person’s adherence to taking it","The relationship between the service user and the nurse","The routine and structure of the inpatient ward"],"key":["The relationship between the service user and the nurse"],"src":"the Roles of Nurses deck, slide 26","why":"Interpersonal theory places the relationship between service user and nurse at the centre of mental healthcare, and uses that relationship to help service users reach their health goals."},{"id":"q927d29845a","quiz":"a-roles","sys":"prof","pts":1,"q":"A nurse phones the doctor about a deteriorating patient using ISBAR. What belongs under “B”?","qh":"<p>A nurse phones the doctor about a deteriorating patient using ISBAR. What belongs under “B”?</p>","qt":"A nurse phones the doctor about a deteriorating patient using ISBAR. What belongs under “B”?","imgs":[],"type":"mcq","authored":1,"opts":["“My assessment is that she is becoming septic.”","“By way of background, she is day two after a bowel resection.”","“I recommend you review her now.”","“The situation is her blood pressure has dropped to 85/50.”"],"key":["“By way of background, she is day two after a bowel resection.”"],"src":"the Roles of Nurses deck, slide 29","why":"Introduction/Identify (who and where you are, why you are calling) → Situation (what is happening now) → Background (what led to the situation) → Assessment (what you consider the problem is) → Request/Recommend (what should be done)."},{"id":"q0ef4bc092d","quiz":"a-roles","sys":"prof","pts":1,"q":"Which is an example of nursing informatics given in the Roles of Nurses lecture?","qh":"<p>Which is an example of nursing informatics given in the Roles of Nurses lecture?</p>","qt":"Which is an example of nursing informatics given in the Roles of Nurses lecture?","imgs":[],"type":"mcq","authored":1,"opts":["A nurse’s handwritten reflective journal kept for their portfolio","Hand hygiene between patients, audited with a paper checklist","A face-to-face verbal handover at the bedside at the change of shift","The NHI number, electronic charts and computerised drug cupboards"],"key":["The NHI number, electronic charts and computerised drug cupboards"],"src":"the Roles of Nurses deck, slide 31 and the speaker notes to slide 1","why":"Nursing informatics is the use of computer technology to support nursing — clinical practice, administration, education and research. The deck’s examples: NHI, care plans and charts, staff email and automated rostering, data collection, computerised drug cupboards, patient education."},{"id":"q3c0d75b466","quiz":"a-cna","sys":"pop","pts":4,"q":"Name the four steps of McMurray’s Community Assessment Framework in order, and say briefly what the nurse does in each.","qh":"<p>Name the four steps of McMurray’s Community Assessment Framework in order, and say briefly what the nurse does in each.</p>","qt":"Name the four steps of McMurray’s Community Assessment Framework in order, and say briefly what the nurse does in each.","imgs":[],"type":"essay","authored":1,"saq":{"steps":["ENGAGE — approach key community members (elders/kaumātua, local health providers, teachers, board members), gain their consent, and be guided by their perceptions and priorities.","MAP — map the community’s strengths, resources and risks by talking with everyday community members and collecting information, organised with the Social Determinants of Health Assessment Circle.","ANALYSE — go deeper into what is helping or harming health (for example with a SWOT analysis), keeping the interpretation aligned with the community’s own perceptions and priorities.","EMPOWER — share the findings with the community and work with them to develop intervention strategies and measures that sustain positive community life."],"src":"Question and model answer are the tool’s · from the Community Needs Assessment Framework deck, slides 10, 12, 18, 32 and 39"}},{"id":"q94aa751ed3","quiz":"a-cna","sys":"pop","pts":3,"q":"What is a windscreen survey? Give two things a nurse would look for, and state whether the information is primary or secondary data.","qh":"<p>What is a windscreen survey? Give two things a nurse would look for, and state whether the information is primary or secondary data.</p>","qt":"What is a windscreen survey? Give two things a nurse would look for, and state whether the information is primary or secondary data.","imgs":[],"type":"essay","authored":1,"saq":{"steps":["A quick overview (“snapshot”) of a community gained by driving through it and observing, taking notes to analyse later — the aim is a general sense of its strengths and needs.","Any two of: parks and recreation spaces · schools and childcare · shops, supermarkets and food access · housing conditions · transport and access · clinics, hospitals and pharmacies · visible health behaviours such as people out walking.","It is PRIMARY data — what you observe yourself. It should then be confirmed by talking with community groups and by records such as immunisation rates and public health indicators."],"src":"Question and model answer are the tool’s · from the Community Needs Assessment Framework deck, slides 27, 29 and 30"}},{"id":"q3534a4f475","quiz":"a-cna","sys":"pop","pts":4,"q":"A nurse analyses community information with a SWOT analysis. State what each of the four letters asks, and which two are “helpful” and which two “harmful” to health.","qh":"<p>A nurse analyses community information with a SWOT analysis. State what each of the four letters asks, and which two are “helpful” and which two “harmful” to health.</p>","qt":"A nurse analyses community information with a SWOT analysis. State what each of the four letters asks, and which two are “helpful” and which two “harmful” to health.","imgs":[],"type":"essay","authored":1,"saq":{"steps":["Strengths (helpful) — what makes this community’s wellbeing thrive; what is working well. Example from the lecture notes: strong whānau networks.","Weaknesses (harmful) — what is harming health now; issues that could lead to health problems. Example: limited GP access, high deprivation.","Opportunities (helpful) — the possibilities: new services on the horizon or existing trends that could benefit the community. Example: mobile health services.","Threats (harmful) — what health issues could arise, or what could worsen inequities if unaddressed; they can be planned for so their impact is reduced. Example: cost-of-living pressure."],"src":"Question and model answer are the tool’s · from the Community Needs Assessment Framework deck, slide 33 and the speaker notes to slide 11"}},{"id":"q405648f0e0","quiz":"a-tikanga","sys":"prof","pts":3,"q":"Define Kawa Whakaruruhau (cultural safety) and state two things it requires of the nurse.","qh":"<p>Define Kawa Whakaruruhau (cultural safety) and state two things it requires of the nurse.</p>","qt":"Define Kawa Whakaruruhau (cultural safety) and state two things it requires of the nurse.","imgs":[],"type":"essay","authored":1,"saq":{"steps":["Definition: cultural safety is care that is judged safe by the RECIPIENT of care — the person’s and whānau experience defines the quality of the care, with the aim of equitable outcomes for Māori.","It requires critical self-reflection: the nurse examines how their own biases and attitudes affect their relationships with individuals, whānau and other health professionals.","It requires the nurse to recognise and address power imbalance, bias and racism — nurses are inadvertent bearers of power — and it goes beyond cultural awareness, sensitivity or competence."],"src":"Question and model answer are the tool’s · from the Tikanga Best Practice and Kawa Whakaruruhau deck, slides 2 and 6"}},{"id":"q6036700e6c","quiz":"a-tikanga","sys":"prof","pts":3,"q":"Define tapu and noa, and give one way a nurse respects these concepts in practice.","qh":"<p>Define tapu and noa, and give one way a nurse respects these concepts in practice.</p>","qt":"Define tapu and noa, and give one way a nurse respects these concepts in practice.","imgs":[],"type":"essay","authored":1,"saq":{"steps":["Tapu: something sacred, prohibited, restricted or set apart. Today it is understood in a protective sense — Durie relates it to safety and risk precautions. It can apply to people, places, events and relationships, permanently or for a time.","Noa: made neutral, ordinary or unrestricted — free from the extensions of tapu. Tapu and noa together mark out safe and unsafe practices.","In practice (any one): the head, genitalia and heart are tapu, so ask and explain before touching rather than assume · support karakia and spiritual practices · protect taonga and personal items."],"src":"Question and model answer are the tool’s · from the Tikanga Best Practice and Kawa Whakaruruhau deck, slides 9–11, 14 and 19"}},{"id":"q8e6c0ca244","quiz":"a-tikanga","sys":"prof","pts":3,"q":"Name three of the Tikanga & Kawa Whakaruruhau lecture’s principles of tikanga best practice and give one nursing action for each.","qh":"<p>Name three of the Tikanga &amp; Kawa Whakaruruhau lecture’s principles of tikanga best practice and give one nursing action for each.</p>","qt":"Name three of the Tikanga & Kawa Whakaruruhau lecture’s principles of tikanga best practice and give one nursing action for each.","imgs":[],"type":"essay","authored":1,"saq":{"steps":["Any three principles, one mark each with its action. Whakawhanaungatanga — build a trusting relationship: introduce yourself and your role, pronounce the person’s name correctly.","Whānau-centred care / partnership and shared decision-making — include whānau where consent is given, support collective decision-making, recognise that whānau structures differ.","Respect for tikanga and taonga (or manaakitanga) — support karakia, protect taonga and personal items, respect tapu and noa, ask rather than assume."],"src":"Question and model answer are the tool’s · from the Tikanga Best Practice and Kawa Whakaruruhau deck, slides 16–19"}},{"id":"qd7c1545086","quiz":"a-pain","sys":"care","pts":4,"q":"OLDCARTS is the structured pain assessment tool taught in this course. State what each of its eight letters stands for.","qh":"<p>OLDCARTS is the structured pain assessment tool taught in this course. State what each of its eight letters stands for.</p>","qt":"OLDCARTS is the structured pain assessment tool taught in this course. State what each of its eight letters stands for.","imgs":[],"type":"essay","authored":1,"saq":{"steps":["O = Onset (when did it start?) · L = Location (where is it? does it radiate?)","D = Duration (how long does it last? does it come and go?) · C = Characteristics (what does it feel like?)","A = Aggravating factors (what makes it worse?) · R = Relieving factors (what makes it better — medications and other interventions)","T = Timing (pattern or frequency, day or night) · S = Severity (rated with an appropriate pain scale, e.g. 0–10 at rest and on movement)"],"src":"Question and model answer are the tool’s · from the Pain Assessment deck, slides 33–42"}},{"id":"qd2311c4fec","quiz":"a-pain","sys":"care","pts":4,"q":"Distinguish nociceptive pain from neuropathic pain. For each, give the cause and how the person typically describes it.","qh":"<p>Distinguish nociceptive pain from neuropathic pain. For each, give the cause and how the person typically describes it.</p>","qt":"Distinguish nociceptive pain from neuropathic pain. For each, give the cause and how the person typically describes it.","imgs":[],"type":"essay","authored":1,"saq":{"steps":["Nociceptive (physiological) pain — cause: damage to somatic or visceral tissue activates the normal pain pathway (e.g. cuts, fractures, burns, post-operative pain).","Nociceptive pain feels: somatic = localised, sharp, aching, throbbing; visceral = diffuse or referred, crampy, squeezing, colicky, gnawing.","Neuropathic (pathophysiological) pain — cause: injury, lesion or dysfunction of the peripheral or central nervous system, so stimuli are processed abnormally (e.g. diabetes, shingles, multiple sclerosis, herniated disc).","Neuropathic pain feels: burning, shooting, stabbing, electric-shock-like, numbness, pain on light touch and increased sensitivity to pain."],"src":"Question and model answer are the tool’s · from the Pain Assessment deck, slides 12–18"}},{"id":"q57bc6d0e47","quiz":"a-pain","sys":"care","pts":3,"q":"Give two voluntary (behavioural) and two involuntary (physiological) responses to pain. Must a person show these signs to be in pain?","qh":"<p>Give two voluntary (behavioural) and two involuntary (physiological) responses to pain. Must a person show these signs to be in pain?</p>","qt":"Give two voluntary (behavioural) and two involuntary (physiological) responses to pain. Must a person show these signs to be in pain?","imgs":[],"type":"essay","authored":1,"saq":{"steps":["Voluntary / behavioural (any two): moving away from the painful stimulus · grimacing, moaning, crying · restlessness · guarding — protecting the area and refusing to move.","Involuntary / physiological (any two): sympathetic — raised BP, pulse and respiratory rate, dilated pupils, muscle tension, pallor; or parasympathetic — nausea and vomiting, fainting, lowered BP and pulse.","No. Pain is subjective — it is what the person says it is. Some people are stoic or whakamā about admitting pain, or want to appear strong, so the absence of signs does not mean the absence of pain."],"src":"Question and model answer are the tool’s · from the Pain Assessment deck, slides 7 and 26–28"}},{"id":"q24f27c30de","quiz":"a-fcc","sys":"care","pts":3,"q":"Name the three elements of facilitating family-centred care and give one nursing action for each.","qh":"<p>Name the three elements of facilitating family-centred care and give one nursing action for each.</p>","qt":"Name the three elements of facilitating family-centred care and give one nursing action for each.","imgs":[],"type":"essay","authored":1,"saq":{"steps":["Relationship — establish a genuine, positive, mutually respectful partnership: find common ground, invest time in building trust, and (with the person’s permission) share relevant information.","Participation and involvement — enable the person and family to take part in care in a way that respects their autonomy: involve them in care, keep up communication, find out what is important to them.","Tailoring care — design care around the person’s and family’s needs, strengths, limitations and context: help them make informed decisions and plan care that is realistic (early intervention, health promotion, discharge planning)."],"src":"Question and model answer are the tool’s · from the Family Centred Care deck, slides 27–29 and 31–35"}},{"id":"q8c10359be0","quiz":"a-fcc","sys":"care","pts":3,"q":"State three situations in which the Family-centred Care lecture says a patient’s health information may be collected from or shared with family.","qh":"<p>State three situations in which the Family-centred Care lecture says a patient’s health information may be collected from or shared with family.</p>","qt":"State three situations in which the Family-centred Care lecture says a patient’s health information may be collected from or shared with family.","imgs":[],"type":"essay","authored":1,"saq":{"steps":["Information about a family member’s health may be collected when preparing a family or genetic history.","A patient’s presence, condition and progress may be disclosed to caregivers or close relatives, in line with recognised professional practice — unless the patient has vetoed that disclosure.","Information may be disclosed where necessary to deal with a serious threat to anyone’s health or safety — for example abuse, or a threat of self-harm."],"src":"Question and model answer are the tool’s · from the Family Centred Care deck, slide 18 (Health Information Privacy Code)"}},{"id":"q96c41cc04a","quiz":"a-nzhs","sys":"pop","pts":3,"q":"Define health equity, explain how it differs from equality, and name one group the New Zealand Health Strategy prioritises for equity.","qh":"<p>Define health equity, explain how it differs from equality, and name one group the New Zealand Health Strategy prioritises for equity.</p>","qt":"Define health equity, explain how it differs from equality, and name one group the New Zealand Health Strategy prioritises for equity.","imgs":[],"type":"essay","authored":1,"saq":{"steps":["Health equity: everyone has a fair and just opportunity to be as healthy as possible — which means removing obstacles to health such as poverty, discrimination and their consequences.","Difference: equality gives everyone the SAME resources; equity gives people what they NEED in order to reach similar outcomes.","Any one of: Māori · Pacific peoples · disabled people · other groups with poorer outcomes (the deck also names rural and low-income communities). In the strategy equity rests on ōritetanga from Te Tiriti o Waitangi."],"src":"Question and model answer are the tool’s · from the New Zealand Health Strategy 2023 deck, slides 5, 9–10 and 16"}},{"id":"qe2d1c086d3","quiz":"a-nzhs","sys":"pop","pts":6,"q":"List the six priority areas for change in the New Zealand Health Strategy 2023.","qh":"<p>List the six priority areas for change in the New Zealand Health Strategy 2023.</p>","qt":"List the six priority areas for change in the New Zealand Health Strategy 2023.","imgs":[],"type":"essay","authored":1,"saq":{"steps":["Priority 1 — Voice at the heart of the system","Priority 2 — Flexible, appropriate care","Priority 3 — Valuing our workforce","Priority 4 — A learning culture","Priority 5 — A resilient and sustainable system","Priority 6 — Partnerships for health and wellbeing"],"src":"Question and model answer are the tool’s · from the New Zealand Health Strategy 2023 deck, slides 19–27"}},{"id":"q502d13e735","quiz":"a-nzhs","sys":"pop","pts":3,"q":"Give three ways a nurse puts equity into action in everyday practice, according to the NZ Health Strategy lecture.","qh":"<p>Give three ways a nurse puts equity into action in everyday practice, according to the NZ Health Strategy lecture.</p>","qt":"Give three ways a nurse puts equity into action in everyday practice, according to the NZ Health Strategy lecture.","imgs":[],"type":"essay","authored":1,"saq":{"steps":["Any three, one mark each. Understand the cultural, social and economic context of each patient, and notice the barriers that make it hard for them to get help.","Advocate — speak up for patients who face barriers to accessing care.","Practise in a culturally safe way and uphold Te Tiriti o Waitangi principles; be aware of your own unconscious bias and work to eliminate it; listen so that patients and whānau feel heard."],"src":"Question and model answer are the tool’s · from the New Zealand Health Strategy 2023 deck, slides 35 and 38"}},{"id":"q4f37b4878a","quiz":"a-discharge","sys":"care","pts":3,"q":"Define discharge planning and state two benefits of doing it well.","qh":"<p>Define discharge planning and state two benefits of doing it well.</p>","qt":"Define discharge planning and state two benefits of doing it well.","imgs":[],"type":"essay","authored":1,"saq":{"steps":["Definition: an interdisciplinary approach to continuity of care — a process (identification, assessment, goal setting, planning, implementation, coordination, evaluation) that helps a person move smoothly from one setting or level of care to another without losing the progress already made. It begins at admission.","Benefit (any two, one mark each): fewer readmissions · shorter length of hospital stay · less follow-up community care needed.","Also accepted as a benefit: the patient and family leave understanding their medicines, warning signs, follow-up and who to contact — a safe link between hospital, community services and carers."],"src":"Question and model answer are the tool’s · from the Discharge Planning deck, slides 3, 6, 8 and 10"}},{"id":"q9f3ec6523c","quiz":"a-discharge","sys":"care","pts":4,"q":"Mr Lear, 60, was admitted with cellulitis of his right lower leg and has finished IV antibiotics. He was unsteady on admission, fell at home before coming in, and lives alone; his daughter lives five minutes away. Give four things the nurse must address in his discharge plan.","qh":"<p>Mr Lear, 60, was admitted with cellulitis of his right lower leg and has finished IV antibiotics. He was unsteady on admission, fell at home before coming in, and lives alone; his daughter lives five minutes away. Give four things the nurse must address in his discharge plan.</p>","qt":"Mr Lear, 60, was admitted with cellulitis of his right lower leg and has finished IV antibiotics. He was unsteady on admission, fell at home before coming in, and lives alone; his daughter lives five minutes away. Give four things the nurse must address in his discharge plan.","imgs":[],"type":"essay","authored":1,"saq":{"steps":["Medicines: explain what he is going home with (antibiotics? pain relief? regular medicines), how and when to take them, and what to do if pain increases despite taking them.","Wound: a District Nurse referral to monitor the wound and change dressings; education — written in words he can read — on the signs of infection and who to contact.","Mobility and falls risk: physiotherapy review before discharge (is he safe on stairs? does he need a mobility aid or an exercise programme?) and home safety.","Support at home: can he cook, shop and shower? Involve his daughter with his consent, or set up supports (needs assessment, home care, meals on wheels); arrange transport home and follow-up appointments."],"src":"Question and model answer are the tool’s · from the Discharge Planning deck, slides 29–37 (the Cyril Lear scenario)"}},{"id":"qab64ab96b8","quiz":"a-discharge","sys":"care","pts":4,"q":"List four items that a written discharge summary should contain for the patient.","qh":"<p>List four items that a written discharge summary should contain for the patient.</p>","qt":"List four items that a written discharge summary should contain for the patient.","imgs":[],"type":"essay","authored":1,"saq":{"steps":["Any four, one mark each: mode of discharge (ambulatory, wheelchair, stretcher) · instructions for self-care — medicines, diet, wound care, pain management, treatments.","Signs and symptoms of complications or drug reactions, and the action to take.","Permissible activities (e.g. lifting, driving) · correct settings for any equipment · health-promoting education.","Follow-up instructions and appointments · what to do if things do not go well — emergency procedures explained in meaningful language or print."],"src":"Question and model answer are the tool’s · from the Discharge Planning deck, slide 40"}},{"id":"q283689a1b2","quiz":"a-tus","sys":"prof","pts":5,"q":"Name the five components of emotional intelligence taught in the Therapeutic Use of Self lecture and say in a few words what each means for a nurse.","qh":"<p>Name the five components of emotional intelligence taught in the Therapeutic Use of Self lecture and say in a few words what each means for a nurse.</p>","qt":"Name the five components of emotional intelligence taught in the Therapeutic Use of Self lecture and say in a few words what each means for a nurse.","imgs":[],"type":"essay","authored":1,"saq":{"steps":["Self-awareness — accurate knowledge of yourself in relation to others; noticing your own judgements of patients so you can act on them.","Self-regulation — managing your natural emotional responses so that you respond in a way that gives safety and comfort (emotional labour: surface and deep acting).","Motivation — driven by your own values, goals and ethics, not by external reward.","Empathy — understanding the situation from the other person’s point of view and responding with care and compassion.","Social skills — communicating, managing conflict, cooperating and collaborating with patients, families and the team."],"src":"Question and model answer are the tool’s · from the Therapeutic Use of Self deck, slides 26–34"}},{"id":"qf6ebfc539d","quiz":"a-tus","sys":"prof","pts":3,"q":"Define surface acting and deep acting, and say which component of emotional intelligence they belong to.","qh":"<p>Define surface acting and deep acting, and say which component of emotional intelligence they belong to.</p>","qt":"Define surface acting and deep acting, and say which component of emotional intelligence they belong to.","imgs":[],"type":"essay","authored":1,"saq":{"steps":["Surface acting: outwardly expressing an emotion you do not feel because the situation needs it — “putting on a mask” (“I don’t feel calm or kind, but I act calm and kind anyway”).","Deep acting: a real shift in how the nurse feels, reached by actively trying to understand the situation from the patient’s perspective.","Both are forms of emotional labour, which belongs to SELF-REGULATION — nurses still feel emotions, but not so intensely that they cannot function."],"src":"Question and model answer are the tool’s · from the Therapeutic Use of Self deck, slides 28–29"}},{"id":"qdb8919eac6","quiz":"a-tus","sys":"prof","pts":3,"q":"Distinguish responsive from assertive communication techniques and give a nursing example of each.","qh":"<p>Distinguish responsive from assertive communication techniques and give a nursing example of each.</p>","qt":"Distinguish responsive from assertive communication techniques and give a nursing example of each.","imgs":[],"type":"essay","authored":1,"saq":{"steps":["Responsive techniques build mutual understanding from the SAME point of view and are used to build relationships with patients and families. Example: expressing empathy to a frightened patient and listening to their feelings before trying to fix the problem.","Assertive techniques promote understanding of DIFFERING points of view and are often used in advocacy. Example: acknowledging why a patient is refusing a medicine while clearly explaining why it matters, or speaking up for the patient to the team.","Skilled communicators blend and balance both — asserting their own ideas while responding with understanding to others’."],"src":"Question and model answer are the tool’s · from the Therapeutic Use of Self deck, slides 21–25"}},{"id":"qce7c3bfad3","quiz":"a-roles","sys":"prof","pts":5,"q":"State what each part of the ISBAR handover tool stands for and what the nurse says under it.","qh":"<p>State what each part of the ISBAR handover tool stands for and what the nurse says under it.</p>","qt":"State what each part of the ISBAR handover tool stands for and what the nurse says under it.","imgs":[],"type":"essay","authored":1,"saq":{"steps":["I — Introduction / Identify: who you are, where you are, why you are calling (and is this a good time to talk?).","S — Situation: what is happening now — “The situation is…”.","B — Background: what led to the situation — “By way of background…”.","A — Assessment: what you consider the problem to be — “My assessment is…”.","R — Request / Recommend: what should be done to correct the problem — “I recommend…”."],"src":"Question and model answer are the tool’s · from the Roles of Nurses deck, slide 29"}},{"id":"q2c61584f47","quiz":"a-roles","sys":"prof","pts":3,"q":"Define primary healthcare and give two examples of where or how nurses work in it.","qh":"<p>Define primary healthcare and give two examples of where or how nurses work in it.</p>","qt":"Define primary healthcare and give two examples of where or how nurses work in it.","imgs":[],"type":"essay","authored":1,"saq":{"steps":["Definition: healthcare services provided outside the hospital — community-based nursing takes place where clients live, work and play, for clients from pre-birth to very old age, from health promotion and prevention through to care of illness.","Example (any two, one mark each): district nursing — seeing patients in their homes or running a clinic · Plunket / Well Child clinics and home visits.","General practice / primary care nursing — booked appointments or drop-in clinics, patient education, wound care, screening, immunisation · school or workplace nursing."],"src":"Question and model answer are the tool’s · from the Roles of Nurses deck, slides 10–11 and 15"}},{"id":"qa51930fa43","quiz":"a-roles","sys":"prof","pts":3,"q":"Give three skills the Roles of Nurses lecture says matter especially for nurses working in acute care.","qh":"<p>Give three skills the Roles of Nurses lecture says matter especially for nurses working in acute care.</p>","qt":"Give three skills the Roles of Nurses lecture says matter especially for nurses working in acute care.","imgs":[],"type":"essay","authored":1,"saq":{"steps":["Any three, one mark each: recognising and responding to patient deterioration · communicating assessment findings (e.g. with ISBAR).","Correct patient identification · delivering health education, particularly for discharge.","Quickly establishing rapport and really listening — admission brings fear, anxiety and loss of control for patients and families."],"src":"Question and model answer are the tool’s · from the Roles of Nurses deck, slides 18–19"}},{"id":"q1efc88a0f3","quiz":"w-care","sys":"care","pts":5,"q":"List the five steps of the nursing process in order and state briefly what happens in each.","qh":"<p>List the five steps of the nursing process in order and state briefly what happens in each.</p>","qt":"List the five steps of the nursing process in order and state briefly what happens in each.","imgs":[],"type":"essay","authored":1,"saq":{"steps":["Assessment — collect data about the patient by observation, interview and examination (subjective and objective), then validate and document it.","Diagnosis (nursing) — actual and potential problems found in the assessment are prioritised and written as diagnostic statements; not a medical diagnosis.","Planning — patient-centred goals and outcome criteria are set, with priorities and a time frame.","Implementation — the nursing interventions are carried out: evidence-based, safe, within the nurse’s scope and compatible with medical orders.","Evaluation — the patient’s response to each intervention is analysed and the goal is judged met, partially met or not met; the process is ongoing and cyclical."],"src":"Question and model answer are the tool’s · from The Nursing Process 2026 deck, slides 8, 11, 17, 23, 29 and 33"}},{"id":"qbfe57b6d7f","quiz":"w-care","sys":"care","pts":3,"q":"Explain how a nursing diagnosis differs from a medical diagnosis, and state the three parts of a nursing diagnostic statement.","qh":"<p>Explain how a nursing diagnosis differs from a medical diagnosis, and state the three parts of a nursing diagnostic statement.</p>","qt":"Explain how a nursing diagnosis differs from a medical diagnosis, and state the three parts of a nursing diagnostic statement.","imgs":[],"type":"essay","authored":1,"saq":{"steps":["A medical diagnosis defines the patient’s disease or condition. A nursing diagnosis defines the patient’s actual or potential RESPONSE to it that the nurse can manage — issues that can be prevented, reduced, resolved or enhanced through independent nursing interventions.","The statement has three parts: the problem (from the NANDA-I list) + “related to” the aetiology (its cause / the medical diagnosis) + “as evidenced by” the signs and symptoms (assessment findings).","Example: “Nausea related to appendicitis as evidenced by pallor, sweating and the patient reporting they are about to vomit.”"],"src":"Question and model answer are the tool’s · from The Nursing Process 2026 deck, slides 17 and 20–21; Nursing Care Plans 2026 deck, slide 9"}},{"id":"qff2d8ab668","quiz":"w-care","sys":"care","pts":5,"q":"Patient-centred goals in a nursing care plan must be SMART. State what each letter stands for.","qh":"<p>Patient-centred goals in a nursing care plan must be SMART. State what each letter stands for.</p>","qt":"Patient-centred goals in a nursing care plan must be SMART. State what each letter stands for.","imgs":[],"type":"essay","authored":1,"saq":{"steps":["S — Specific: states clearly what is to be achieved.","M — Measurable: quantifiable (e.g. “a soft stool, type 3 or 4 on the Bristol stool chart”).","A — Achievable: able to be achieved by the patient with the resources available.","R — Realistic: possible for this patient to achieve.","T — Timed: has a time limit by which the goal is achieved and evaluated (e.g. “within 12 hours”). The goal describes PATIENT behaviour, not nurse behaviour."],"src":"Question and model answer are the tool’s · from Nursing Care Plans 2026 deck, slides 16–17; The Nursing Process 2026 deck, slide 26"}},{"id":"q30bef76aaa","quiz":"w-care","sys":"care","pts":3,"q":"Evaluation is the last column of a nursing care plan. State what must be written there, and the three possible verdicts on the goal.","qh":"<p>Evaluation is the last column of a nursing care plan. State what must be written there, and the three possible verdicts on the goal.</p>","qt":"Evaluation is the last column of a nursing care plan. State what must be written there, and the three possible verdicts on the goal.","imgs":[],"type":"essay","authored":1,"saq":{"steps":["An evaluation statement for EACH intervention — the patient’s response to it — each one dated, timed and signed (initialled).","ONE overarching statement about the goal.","The verdicts: MET (the response matches or exceeds the outcome criteria), PARTIALLY MET (behaviour is beginning to change but does not yet meet the criteria), NOT MET (no progress)."],"src":"Question and model answer are the tool’s · from Nursing Care Plans 2026 deck, slides 24–25"}},{"id":"q512085f5ef","quiz":"w-care","sys":"care","pts":4,"q":"Define objective data and subjective data, and give one example of each from a patient admitted with nausea.","qh":"<p>Define objective data and subjective data, and give one example of each from a patient admitted with nausea.</p>","qt":"Define objective data and subjective data, and give one example of each from a patient admitted with nausea.","imgs":[],"type":"essay","authored":1,"saq":{"steps":["Objective data: observable and measurable facts — signs.","Example: pallor, sweating, a measured temperature or pulse, an observed vomit.","Subjective data: information that only the patient can feel and describe — symptoms.","Example: the patient saying “I feel like I’m about to be sick” or rating their nausea."],"src":"Question and model answer are the tool’s · from Holistic Health Assessment 2026 deck, slide 9; example from The Nursing Process 2026 deck, slide 21"}},{"id":"q9699157ec4","quiz":"w-care","sys":"care","pts":4,"q":"Define holism, and name the aspects of a person that a holistic health assessment covers.","qh":"<p>Define holism, and name the aspects of a person that a holistic health assessment covers.</p>","qt":"Define holism, and name the aspects of a person that a holistic health assessment covers.","imgs":[],"type":"essay","authored":1,"saq":{"steps":["Holism (from the Greek holos — entire, whole): the body, mind, emotions and spirit are interconnected rather than a collection of parts, so the nurse focuses on the patient as a whole rather than just the healthcare problem.","Physical — body systems, ADLs and independence, mobility and falls risk, skin integrity, sleep, diet, vital signs, diagnostic tests.","Psychological — orientation and cognition, communication, mental health history, stressors and coping, pain.","Social (including cultural) and spiritual — family situation, community, finances, lifestyle, language; beliefs, values, meaning, concerns about death and dying. Each aspect is linked to and influences the others."],"src":"Question and model answer are the tool’s · from Holistic Health Assessment 2026 deck, slides 3–4, 14, 20 and 26–30"}},{"id":"q4132224a2d","quiz":"w-care","sys":"care","pts":3,"q":"Give the three reasons nurses document that are taught in this course, with one sentence on each.","qh":"<p>Give the three reasons nurses document that are taught in this course, with one sentence on each.</p>","qt":"Give the three reasons nurses document that are taught in this course, with one sentence on each.","imgs":[],"type":"essay","authored":1,"saq":{"steps":["A legal requirement — the clinical record is a legal document and evidence of your practice; it may be examined months or years later (“if it isn’t documented, it didn’t happen”).","A professional responsibility — the Nursing Council’s standards of competence and Code of Conduct require clear, accurate, legible, timely records, signed, dated and timed.","A communication tool — it carries information between the multi-disciplinary team, gives an accurate account of care, allows problems to be detected early and supports continuity of care."],"src":"Question and model answer are the tool’s · from Clinical Documentation 2026 deck, slides 4–10"}},{"id":"q727dbde20b","quiz":"w-care","sys":"care","pts":3,"q":"A nurse writes an entry in the wrong patient’s paper notes. State how the error must be corrected, and give two other “don’ts” of documentation.","qh":"<p>A nurse writes an entry in the wrong patient’s paper notes. State how the error must be corrected, and give two other “don’ts” of documentation.</p>","qt":"A nurse writes an entry in the wrong patient’s paper notes. State how the error must be corrected, and give two other “don’ts” of documentation.","imgs":[],"type":"essay","authored":1,"saq":{"steps":["Cross the entry out with ONE line so the original can still be read, note that it is an error and sign it — never erase it or use “white out”.","Don’t (any two, one mark each): rely on memory · leave blank spaces · make entries on behalf of another health professional · use unapproved abbreviations.","Don’t: add information later without marking it as retrospective (with both date/times and a signature) · use generalisations such as “condition unchanged” · make assumptions · use subjective, judgemental or unprofessional language."],"src":"Question and model answer are the tool’s · from Clinical Documentation 2026 deck, slides 20 and 22–23"}},{"id":"q08f2420f4d","quiz":"w-care","sys":"care","pts":3,"q":"AI²DET guides how staff speak with patients and whānau. State what its letters stand for, and why it was introduced.","qh":"<p>AI²DET guides how staff speak with patients and whānau. State what its letters stand for, and why it was introduced.</p>","qt":"AI²DET guides how staff speak with patients and whānau. State what its letters stand for, and why it was introduced.","imgs":[],"type":"essay","authored":1,"saq":{"steps":["A = Acknowledge · I = Introduce · I = Identify","D = Duration · E = Explanation · T = Thank you","It was introduced at Counties Manukau Health in 2011 by Māori Health after patient complaints — “people are talking about us and not to us”, “we don’t know who is in the room”, “we feel invisible”. It also opens the bedside handover checklist."],"src":"Question and model answer are the tool’s · from Clinical Documentation 2026 deck, slides 36–38"}},{"id":"q3adeb84c53","quiz":"w-clin","sys":"clin","pts":5,"q":"A primary survey gives essential information about a patient in order of clinical importance. State what each letter of A–E stands for and what the nurse assesses under it.","qh":"<p>A primary survey gives essential information about a patient in order of clinical importance. State what each letter of A–E stands for and what the nurse assesses under it.</p>","qt":"A primary survey gives essential information about a patient in order of clinical importance. State what each letter of A–E stands for and what the nurse assesses under it.","imgs":[],"type":"essay","authored":1,"saq":{"steps":["A — Airway: is the patient alert, talking normally, able to cough? Anything blocking the airway, drooling, distress? Obstruction can be life-threatening within minutes.","B — Breathing: respiratory rate, pattern, depth and sounds, work of breathing, and oxygen saturation.","C — Circulation: blood pressure and pulse (rate, rhythm, strength, equality).","D — Disability: level of consciousness — AVPU (Alert, responds to Voice, responds to Pain, Unresponsive) or the Glasgow Coma Scale.","E — Exposure: temperature."],"src":"Question and model answer are the tool’s · from Vital Signs 2026 deck, slides 3, 6–8, 15 and 27–28"}},{"id":"qfe9b0fe412","quiz":"w-clin","sys":"clin","pts":4,"q":"Give the normal adult ranges taught in this course for oxygen saturation, blood pressure (systolic and diastolic) and temperature, and define tachycardia and bradycardia.","qh":"<p>Give the normal adult ranges taught in this course for oxygen saturation, blood pressure (systolic and diastolic) and temperature, and define tachycardia and bradycardia.</p>","qt":"Give the normal adult ranges taught in this course for oxygen saturation, blood pressure (systolic and diastolic) and temperature, and define tachycardia and bradycardia.","imgs":[],"type":"essay","authored":1,"saq":{"steps":["SpO2: 95–100%.","Blood pressure: systolic usually 110–140 mmHg, diastolic usually 60–90 mmHg.","Temperature: 36.5–37.5 °C (36–36.4 °C is usually considered safe; 37.6–37.9 °C is a low-grade fever; above 38 °C is pyrexia; below 35 °C is hypothermia).","Tachycardia: heart rate above 100 bpm. Bradycardia: heart rate below 60 bpm."],"src":"Question and model answer are the tool’s · from Vital Signs 2026 deck, slides 13, 17, 24 and 30–32"}},{"id":"q8ada67fa3a","quiz":"w-clin","sys":"clin","pts":3,"q":"What is the New Zealand Early Warning Score (NZEWS), what is it calculated from, and what does it trigger?","qh":"<p>What is the New Zealand Early Warning Score (NZEWS), what is it calculated from, and what does it trigger?</p>","qt":"What is the New Zealand Early Warning Score (NZEWS), what is it calculated from, and what does it trigger?","imgs":[],"type":"essay","authored":1,"saq":{"steps":["A safety tool on the national vital signs chart for adult patients who acutely deteriorate in hospital: each vital sign is scored 0–3, scoring higher the further it is from normal, and the scores are added to give the total EWS.","It is calculated from seven routine measurements: respiratory rate, oxygen supplementation, oxygen saturation, heart rate, blood pressure (systolic is the trigger), temperature and level of consciousness.","The total — or any single significantly abnormal vital sign (red or blue zone) — triggers an escalating clinical response, so clinicians intervene and manage the deterioration."],"src":"Question and model answer are the tool’s · from Vital Signs 2026 deck, slides 40–41"}},{"id":"qd936bc40a1","quiz":"w-clin","sys":"clin","pts":3,"q":"Define a healthcare-associated infection (HAI) and name three common types.","qh":"<p>Define a healthcare-associated infection (HAI) and name three common types.</p>","qt":"Define a healthcare-associated infection (HAI) and name three common types.","imgs":[],"type":"essay","authored":1,"saq":{"steps":["Definition: an infection that was not apparent or incubating at the time of admission but appears at least 48 hours after admission (previously called nosocomial infection). It may be exogenous or endogenous.","Types (any three): surgical site infection · urinary tract infection · pneumonia · bloodstream infection.","Multi-drug resistant organisms are one of the main causes; up to 10% of patients admitted to hospital in the developed world develop one or more HAI."],"src":"Question and model answer are the tool’s · from Infection Prevention & Control 2026 deck, slides 7, 9 and 11"}},{"id":"q5a9612bb16","quiz":"w-clin","sys":"clin","pts":6,"q":"Name the six links of the chain of infection in order.","qh":"<p>Name the six links of the chain of infection in order.</p>","qt":"Name the six links of the chain of infection in order.","imgs":[],"type":"essay","authored":1,"saq":{"steps":["Infectious agent — bacteria, viruses, fungi, protozoa.","Reservoir — where the agent survives: the human body, water, food, soil, animals, fomites.","Portal of exit — how it escapes the reservoir: respiratory, GI, urinary or reproductive tract, skin, mucous membranes, blood.","Mode of transmission — contact, droplet, airborne, ingestion, fomites, vector.","Portal of entry — how it enters the new host: mucous membranes, broken skin, respiratory, GI or urinary tract, blood.","Susceptible host — babies and children, pregnant women, the elderly, people with weakened immune systems, hospital patients, the unvaccinated."],"src":"Question and model answer are the tool’s · from Infection Prevention & Control 2026 deck, slides 15–22"}},{"id":"q6a565f86cd","quiz":"w-clin","sys":"clin","pts":4,"q":"Define standard precautions, and distinguish them from transmission-based precautions, naming the three types of the latter.","qh":"<p>Define standard precautions, and distinguish them from transmission-based precautions, naming the three types of the latter.</p>","qt":"Define standard precautions, and distinguish them from transmission-based precautions, naming the three types of the latter.","imgs":[],"type":"essay","authored":1,"saq":{"steps":["Standard precautions: the MINIMUM precautions for ALL patients, whatever their known infection status, whenever contact with blood or body fluids is possible — because you cannot tell by looking who is infectious.","They include hand hygiene, PPE, respiratory hygiene and cough etiquette, safe sharps practice, linen and waste management, aseptic technique, reprocessing of equipment, and environmental cleaning.","Transmission-based precautions are ADDED for a known or suspected pathogen, according to how it spreads — PPE, single-room allocation, air-quality controls.","The three types: contact (e.g. MRSA, gastro infections), droplet (e.g. influenza, mumps, meningitis) and airborne (e.g. measles, chickenpox, TB, COVID-19 — N95/P2 respirator and a negative-pressure room)."],"src":"Question and model answer are the tool’s · from Infection Prevention & Control 2026 deck, slides 24, 26–27 and 48–52"}},{"id":"qc5a6a22572","quiz":"w-clin","sys":"clin","pts":4,"q":"Compare type 1 and type 2 diabetes mellitus: the cause of each and how each is managed.","qh":"<p>Compare type 1 and type 2 diabetes mellitus: the cause of each and how each is managed.</p>","qt":"Compare type 1 and type 2 diabetes mellitus: the cause of each and how each is managed.","imgs":[],"type":"essay","authored":1,"saq":{"steps":["Type 1 — cause: an auto-immune disease in which the immune system destroys the insulin-making (beta) cells of the pancreas, so no insulin is made. About 5–10% of people with diabetes; usually begins under 40.","Type 1 — management: insulin therapy, blood glucose monitoring, healthy eating, physical activity.","Type 2 — cause: the body becomes resistant to insulin or secretes too little; linked to genetics, lifestyle factors and obesity. About 90–95% of people with diabetes; usually adult onset, increasingly seen in younger people.","Type 2 — management: diet control, physical activity, oral medicines, possibly insulin, blood glucose monitoring."],"src":"Question and model answer are the tool’s · from Diabetes Mellitus deck, slides 10–12 and 16"}},{"id":"q1c156cf256","quiz":"w-clin","sys":"clin","pts":4,"q":"Define hypoglycaemia. Give two causes and two symptoms.","qh":"<p>Define hypoglycaemia. Give two causes and two symptoms.</p>","qt":"Define hypoglycaemia. Give two causes and two symptoms.","imgs":[],"type":"essay","authored":1,"saq":{"steps":["Definition: low blood glucose — a level below 4 mmol/L, or symptoms of hypoglycaemia at a level close to this (normal without diabetes is 4–7.5 mmol/L).","Causes (any two): too little carbohydrate with a meal · a missed or delayed meal or snack · physical activity without adjusting insulin or eating more · too much insulin · alcohol in excess or without food.","Symptoms (any two): shaky, sweaty or suddenly unwell · racing pulse · tingling around the mouth and tongue · suddenly “strange” and unable to concentrate · suddenly very hungry · pale · headache · restless or anxious.","Why it happens on insulin: injected insulin cannot be “switched off”, so glucose keeps moving into the cells and the liver does not release its store — the level keeps falling."],"src":"Question and model answer are the tool’s · from Diabetes Mellitus deck, slides 17 and 19–22"}},{"id":"qbf444e7538","quiz":"w-clin","sys":"clin","pts":3,"q":"Define health literacy at its two levels, and name the three steps to better health literacy.","qh":"<p>Define health literacy at its two levels, and name the three steps to better health literacy.</p>","qt":"Define health literacy at its two levels, and name the three steps to better health literacy.","imgs":[],"type":"essay","authored":1,"saq":{"steps":["Personal health literacy: an individual’s ability to find, understand and use information and services to inform health-related decisions and actions for themselves and others. It is not determined by intelligence.","Organisational health literacy: the degree to which organisations equitably ENABLE individuals to find, understand and use that information and those services.","The three steps: Ask · Build · Check — with teach-back (“tell and show me what you understand”) as the gold standard for checking."],"src":"Question and model answer are the tool’s · from Health Literacy & Patient Education 2026 deck, slides 3, 11, 16 and 34"}},{"id":"q3a774d2cfe","quiz":"w-pop","sys":"pop","pts":3,"q":"Define the social determinants of health and give two examples, saying how each affects health.","qh":"<p>Define the social determinants of health and give two examples, saying how each affects health.</p>","qt":"Define the social determinants of health and give two examples, saying how each affects health.","imgs":[],"type":"essay","authored":1,"saq":{"steps":["Definition: the conditions in which people are born, grow, live, work and age — the societal factors that give rise to social position (access to power, money and resources) and therefore to health. They account for at least half of health outcomes and inequities.","Example (any two, one mark each, with the effect): housing — cold, damp, overcrowded homes lead to respiratory illness and communicable disease · food environments — food deserts and swamps in low-income areas drive obesity, cardiovascular disease and type 2 diabetes.","Work and employment — insecure or unsafe work raises physical and mental health risk · education — linked to better income, job stability and health · transport — poor public transport limits access to care, work and education · the health system itself — how accessible and affordable care is."],"src":"Question and model answer are the tool’s · from Social Determinants of Health deck, slides 7, 9, 16–17 and 28–39"}},{"id":"q171369dd54","quiz":"w-pop","sys":"pop","pts":3,"q":"Distinguish health inequality from health inequity, and explain what “the social gradient in health” means.","qh":"<p>Distinguish health inequality from health inequity, and explain what “the social gradient in health” means.</p>","qt":"Distinguish health inequality from health inequity, and explain what “the social gradient in health” means.","imgs":[],"type":"essay","authored":1,"saq":{"steps":["Health inequality: differences in health between population groups — it describes WHAT is happening, not why.","Health inequity: differences that are UNFAIR and AVOIDABLE, arising from systemic barriers and the unequal allocation of power, money and resources; they could be reduced by the right mix of government policies.","The social gradient: health follows socioeconomic position step by step — the lower the position, the worse the health; the higher, the progressively better the health."],"src":"Question and model answer are the tool’s · from Social Determinants of Health deck, slides 10–11 and 26–27; Population Health vs Personal Health deck, slide 17"}},{"id":"qf9fdff64dd","quiz":"w-pop","sys":"pop","pts":3,"q":"Distinguish population health from personal health, and give one nursing intervention at each level.","qh":"<p>Distinguish population health from personal health, and give one nursing intervention at each level.</p>","qt":"Distinguish population health from personal health, and give one nursing intervention at each level.","imgs":[],"type":"essay","authored":1,"saq":{"steps":["Population health looks at the health outcomes of a GROUP of people, how those outcomes are distributed, and the social, economic and environmental factors and policies behind them; personal health concerns one individual’s own circumstances, risk factors and symptoms.","Population-level intervention (any one): health education programmes · community health campaigns · health policy advocacy · national screening · the Healthy Homes Initiative.","Personal-level intervention (any one): direct patient care · one-to-one health education with a GP or practice nurse, tailored to the person’s life."],"src":"Question and model answer are the tool’s · from Population Health vs Personal Health deck, slides 9, 11, 13–14, 16 and 36"}},{"id":"qdb011b35e5","quiz":"w-pop","sys":"pop","pts":5,"q":"The Waitangi Tribunal recommended five principles of Te Tiriti o Waitangi for the health sector. Name them (in te reo Māori or English) with a brief meaning for nursing.","qh":"<p>The Waitangi Tribunal recommended five principles of Te Tiriti o Waitangi for the health sector. Name them (in te reo Māori or English) with a brief meaning for nursing.</p>","qt":"The Waitangi Tribunal recommended five principles of Te Tiriti o Waitangi for the health sector. Name them (in te reo Māori or English) with a brief meaning for nursing.","imgs":[],"type":"essay","authored":1,"saq":{"steps":["Tino rangatiratanga — self-determination: Māori lead decisions about Māori health; nurses work alongside Māori, not for Māori.","Mana taurite — equity: a fair opportunity for good health; resources targeted where need is greatest — not the same thing for everyone.","Whakamarumarutia — active protection: health is a taonga; act to prevent harm and address inequities rather than only responding to problems.","Kōwhiringa — options: properly resourced, culturally appropriate choices, including kaupapa Māori services and Māori models of health.","Pātuitanga — partnership: Māori involved in planning, delivering and evaluating services — decisions made with the community, not for it. (The “three Ps” are outdated and should not be used.)"],"src":"Question and model answer are the tool’s · from Population Health vs Personal Health deck, slides 20–31"}},{"id":"qaa237acc18","quiz":"w-pop","sys":"pop","pts":4,"q":"PROGRESS is the equity framework taught in this course. State what it is used for and list what its letters stand for.","qh":"<p>PROGRESS is the equity framework taught in this course. State what it is used for and list what its letters stand for.</p>","qt":"PROGRESS is the equity framework taught in this course. State what it is used for and list what its letters stand for.","imgs":[],"type":"essay","authored":1,"saq":{"steps":["Purpose: a mnemonic for the social factors that shape who gets sick, why, and who benefits from health interventions — it helps a nurse ask who is benefiting, who is missing out, and which barriers are systemic rather than individual.","P — Place of residence · R — Race / ethnicity / culture / language","O — Occupation · G — Gender / sex · R — Religion","E — Education · S — Socioeconomic status · S — Social capital (support, networks, relationships)"],"src":"Question and model answer are the tool’s · from Population Health vs Personal Health deck, slides 32–34"}},{"id":"q4c5a2cf9ba","quiz":"w-pop","sys":"pop","pts":2,"q":"Define demography and epidemiology.","qh":"<p>Define demography and epidemiology.</p>","qt":"Define demography and epidemiology.","imgs":[],"type":"essay","authored":1,"saq":{"steps":["Demography: the study of the size, distribution and characteristics of human populations (demographers study fertility, mortality, marriage, migration and social mobility).","Epidemiology: the study of the patterns, causes and control of disease in groups of people."],"src":"Question and model answer are the tool’s · from Demography & Epidemiology deck, slides 11 and 13"}},{"id":"q157b864eba","quiz":"w-pop","sys":"pop","pts":4,"q":"Name the three parts of the epidemiological triangle, and give one way of breaking the triangle at each part.","qh":"<p>Name the three parts of the epidemiological triangle, and give one way of breaking the triangle at each part.</p>","qt":"Name the three parts of the epidemiological triangle, and give one way of breaking the triangle at each part.","imgs":[],"type":"essay","authored":1,"saq":{"steps":["Agent — the cause of the disease (virus, bacterium, parasite). Break it by removing the agent, e.g. with medicine.","Host — the person or animal that gets sick. Protect the host, e.g. by vaccination.","Environment — everything around the host that helps the agent spread (air, water, other people). Change it, e.g. by improving hygiene and sanitation.","Disease occurs when all three meet; breaking any one connection stops it."],"src":"Question and model answer are the tool’s · from Demography & Epidemiology deck, slides 33–35"}},{"id":"q6d84562104","quiz":"w-pop","sys":"pop","pts":4,"q":"Define primordial, primary, secondary and tertiary prevention and give an example of each.","qh":"<p>Define primordial, primary, secondary and tertiary prevention and give an example of each.</p>","qt":"Define primordial, primary, secondary and tertiary prevention and give an example of each.","imgs":[],"type":"essay","authored":1,"saq":{"steps":["Primordial — prevents risk factors from developing in a population, through large-scale social and environmental change. Example: the Healthy Homes Initiative.","Primary (“Prevent”) — action before the onset of disease so that it never occurs. Example: vaccination clinics, sexual health education, PPE at work.","Secondary (“Screen”) — detect disease early and stop it progressing. Example: cervical screening, mammograms, colonoscopy.","Tertiary (“Treatment”) — manage an existing condition to prevent it worsening, further disability or death. Example: an insulin regime in diabetes to prevent cardiovascular or renal disease."],"src":"Question and model answer are the tool’s · from Demography & Epidemiology deck, slides 38–45"}},{"id":"q605087238b","quiz":"w-pop","sys":"pop","pts":2,"q":"Define “epidemic” and “endemic”.","qh":"<p>Define “epidemic” and “endemic”.</p>","qt":"Define “epidemic” and “endemic”.","imgs":[],"type":"essay","authored":1,"saq":{"steps":["Epidemic: the occurrence of cases in excess of what is normally expected in a community or region.","Endemic: a relatively stable pattern of occurrence in a given geographical area or population group."],"src":"Question and model answer are the tool’s · from Demography & Epidemiology deck, slide 36"}},{"id":"qbc6c2ac958","quiz":"w-prof","sys":"prof","pts":3,"q":"Define informed consent, and name the two pieces of New Zealand law that make it a requirement.","qh":"<p>Define informed consent, and name the two pieces of New Zealand law that make it a requirement.</p>","qt":"Define informed consent, and name the two pieces of New Zealand law that make it a requirement.","imgs":[],"type":"essay","authored":1,"saq":{"steps":["Definition: the PROCESS of communicating to a patient the benefits, risks and alternatives of a procedure or treatment, so that the patient can make an informed decision to accept it or not — more than a signature on a piece of paper.","The Code of Health and Disability Services Consumers’ Rights, Right 7 — the right to make an informed choice and give informed consent (the Code is a regulation under the Health and Disability Commissioner Act 1994).","The New Zealand Bill of Rights Act 1990, section 11 — the right to refuse to undergo medical treatment."],"src":"Question and model answer are the tool’s · from Informed consent 2026 deck, slides 3–4 and 28"}},{"id":"qb8d2121e59","quiz":"w-prof","sys":"prof","pts":4,"q":"List four pieces of information a patient must be given before they can give informed consent to a procedure.","qh":"<p>List four pieces of information a patient must be given before they can give informed consent to a procedure.</p>","qt":"List four pieces of information a patient must be given before they can give informed consent to a procedure.","imgs":[],"type":"essay","authored":1,"saq":{"steps":["Any four, one mark each: the diagnosis, if known · the nature and purpose of the proposed treatment or procedure — what happens during it and what to expect afterwards.","The risks and benefits of the treatment or procedure.","Who will be performing it.","What other options there are, with their risks and benefits · the risks and benefits of having no treatment at all. (All of it in a language and way the patient can understand, with an interpreter and a support person if wanted.)"],"src":"Question and model answer are the tool’s · from Informed consent 2026 deck, slides 6 and 9"}},{"id":"q0bc7ba99d3","quiz":"w-prof","sys":"prof","pts":3,"q":"Who can give consent to treatment in New Zealand? Cover an adult, a 14-year-old, and an adult who is not competent.","qh":"<p>Who can give consent to treatment in New Zealand? Cover an adult, a 14-year-old, and an adult who is not competent.</p>","qt":"Who can give consent to treatment in New Zealand? Cover an adult, a 14-year-old, and an adult who is not competent.","imgs":[],"type":"essay","authored":1,"saq":{"steps":["Anyone aged 16 or over can consent to — or refuse — their own treatment.","Under 16: a parent, guardian or other person acting in the place of a parent gives consent (or a court order).","A person aged 16 or over who is not competent: a legal guardian or someone holding a current enduring power of attorney. The nurse must still act in the person’s best interests and take reasonable steps to find out their views."],"src":"Question and model answer are the tool’s · from Informed consent 2026 deck, slides 8 and 21"}},{"id":"q0986adbe84","quiz":"w-prof","sys":"prof","pts":3,"q":"Describe the nurse’s role in the informed consent process.","qh":"<p>Describe the nurse’s role in the informed consent process.</p>","qt":"Describe the nurse’s role in the informed consent process.","imgs":[],"type":"essay","authored":1,"saq":{"steps":["Advocate for the patient: arrange an interpreter if required and whānau support if appropriate.","Make sure the medical team has given all the information the patient needs in a way they understand, and that the patient has had the chance to ask questions — if not, call the team back.","Be knowledgeable about the proposed treatment; the nurse may be accountable for witnessing that the patient (or legal representative) signed the form in their presence and is of legal age and competent."],"src":"Question and model answer are the tool’s · from Informed consent 2026 deck, slides 24–25"}},{"id":"q49db232e0a","quiz":"w-prof","sys":"prof","pts":3,"q":"Define evidence-based practice and name the three things it integrates.","qh":"<p>Define evidence-based practice and name the three things it integrates.</p>","qt":"Define evidence-based practice and name the three things it integrates.","imgs":[],"type":"essay","authored":1,"saq":{"steps":["Definition: a shift away from basing decisions on opinion and past practice, towards research and evidence guiding clinical decision-making, in order to improve patient outcomes.","It integrates (1) the best research evidence and (2) clinical expertise…","…and (3) the patient’s values and preferences."],"src":"Question and model answer are the tool’s · from Evidence-based Practice 2026 deck, slides 11 and 13"}},{"id":"qea8726f531","quiz":"w-prof","sys":"prof","pts":5,"q":"List the five steps of the evidence-based practice methodology in order.","qh":"<p>List the five steps of the evidence-based practice methodology in order.</p>","qt":"List the five steps of the evidence-based practice methodology in order.","imgs":[],"type":"essay","authored":1,"saq":{"steps":["Develop a research (clinical) question.","Find the research evidence — e.g. CINAHL, the Cochrane Library, JBI, PubMed.","Appraise the evidence — systematic reviews are the strongest level, expert opinion the weakest.","Implement the evidence in practice.","Evaluate the practice change and patient outcomes — has it made a difference?"],"src":"Question and model answer are the tool’s · from Evidence-based Practice 2026 deck, slides 22–24"}},{"id":"qc59ed99f35","quiz":"w-prof","sys":"prof","pts":4,"q":"Define burnout and compassion fatigue, and give two differences between them.","qh":"<p>Define burnout and compassion fatigue, and give two differences between them.</p>","qt":"Define burnout and compassion fatigue, and give two differences between them.","imgs":[],"type":"essay","authored":1,"saq":{"steps":["Burnout: an occupational phenomenon (not a medical condition) — a syndrome from long-term, unmanaged WORKPLACE stress, marked by exhaustion, mental distance or cynicism about the job, and reduced professional efficacy.","Compassion fatigue: physical, psychological and spiritual exhaustion from the emotional demands of caring for suffering patients — absorbing their suffering as secondary trauma — leading to a loss of empathy.","Difference: in burnout the nurse still feels compassion; compassion fatigue affects the ability to feel compassion. Burnout is caused by a stressful work environment; compassion fatigue by the impact of caring for others.","Difference: burnout builds up over time and may not affect relationships outside wor
