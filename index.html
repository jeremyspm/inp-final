<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- shared with a study group by link; the lecturers' quiz questions stay out of search engines -->
<meta name="robots" content="noindex, nofollow">
<title>Paper Sim</title>
<style>
/* ── estate tokens (house.css contract, dark default) ─────────────── */
:root{
  --bg:hsl(225 33% 5%); --fg:hsl(225 31% 95%); --card:hsl(224 44% 10%);
  --primary:hsl(218 91% 64%); --onprimary:hsl(225 33% 5%);
  --muted:hsl(220 38% 13%); --muted-fg:hsl(218 19% 67%);
  --accent:hsl(219 40% 18%); --danger:hsl(0 84% 60%); --ok:hsl(158 64% 42%);
  --warn:hsl(38 92% 55%); --border:hsl(222 27% 19%); --radius:.625rem;
  --dur:200ms; --ease:cubic-bezier(.4,0,.2,1);
}
:root[data-theme=light]{
  --bg:hsl(214 47% 97%); --fg:hsl(222 47% 11%); --card:hsl(0 0% 100%);
  --onprimary:#fff; --muted:hsl(215 40% 93%); --muted-fg:hsl(220 12% 40%);
  --accent:hsl(216 45% 91%); --border:hsl(215 33% 89%); --warn:hsl(38 92% 40%);
}
*{box-sizing:border-box;min-width:0}
[hidden]{display:none!important}   /* .btn sets display, which would otherwise beat the attribute */
body{margin:0;background:var(--bg);color:var(--fg);
  font:16px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  -webkit-text-size-adjust:100%}
header{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--border);
  display:flex;align-items:center;gap:10px;padding:10px 14px}
header h1{font-size:1rem;margin:0;flex:1;font-weight:700}
header .d{color:var(--muted-fg);font-size:.8rem;white-space:nowrap}
/* phone: title over countdown on the left, buttons full height on the right (was one flex row: the title got squeezed to a word per line) */
@media(max-width:560px){
  header{display:grid;grid-template-columns:minmax(0,1fr);grid-auto-columns:auto;gap:0 8px;padding:8px 12px}
  header h1{grid-area:1/1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  header .d{grid-area:2/1;white-space:normal;font-size:.76rem;line-height:1.3}
  header .btn{grid-row:1/span 2;padding:8px 10px;min-width:40px}
}
main{max-width:720px;margin:0 auto;padding:14px 14px 90px}
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);
  padding:14px;margin:0 0 12px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;cursor:pointer;
  border:1px solid var(--border);background:var(--muted);color:var(--fg);
  border-radius:var(--radius);padding:10px 14px;font:inherit;font-weight:600;
  transition:background var(--dur) var(--ease)}
.btn.primary{background:var(--primary);border-color:var(--primary);color:var(--onprimary)}
.btn.ghost{background:transparent}
.btn.wide{width:100%;margin-top:8px}
a.btn{text-decoration:none}
.btn:disabled{opacity:.45;cursor:default}
.door h2{margin:.1rem 0 .3rem;font-size:1.02rem}
.door p{margin:.2rem 0 .6rem;color:var(--muted-fg);font-size:.88rem}
.qlist{display:flex;flex-direction:column;gap:6px;margin-top:8px}
/* a quiz row: tag + name, then count + Learn + Sit as one group that drops to a
   second line at phone width instead of squeezing the name into four lines */
.qrow{display:flex;flex-wrap:wrap;align-items:center;gap:6px 8px;border:1px solid var(--border);
  border-radius:var(--radius);padding:8px 10px;background:var(--muted)}
.qrow b{flex:1 1 150px;font-size:.86rem;font-weight:600}
.qrow .m{color:var(--muted-fg);font-size:.76rem;white-space:nowrap}
.qrow .acts{margin-left:auto;display:flex;gap:6px;align-items:center}
.sysrow{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0 2px}
/* quiz selection: tick any rows (or a whole system) and the bottom bar runs them as one */
.qrow{cursor:pointer}
.qrow.on{border-color:var(--primary);box-shadow:inset 0 0 0 1px var(--primary)}
.qrow>input.pk{flex:0 0 auto;width:18px;height:18px;margin:0;accent-color:var(--primary);cursor:pointer}
.chips{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:8px 0 4px;font-size:.8rem;color:var(--muted-fg)}
.chip{border:1px solid var(--border);border-radius:99px;padding:4px 11px;background:transparent;color:var(--fg);
  cursor:pointer;font:inherit;font-size:.8rem;font-weight:600;line-height:1.3}
.chip.on{background:var(--primary);border-color:var(--primary);color:var(--onprimary)}
.footbar .btn.x{flex:0 0 auto}
/* ── focus checklist ─────────────────────────────────────────────────── */
.fhead{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 10px;margin:2px 0 8px}
.fbar{height:6px;border-radius:99px;background:var(--accent);overflow:hidden;flex:1 1 140px;min-width:120px}
.fbar i{display:block;height:100%;background:var(--ok);transition:width .25s}
.ftier{font-weight:700;font-size:.82rem;margin:14px 0 6px;display:flex;align-items:center;gap:8px}
.ftier b{font-weight:700}
.ftier .fnum{font-weight:400;color:var(--muted-fg)}
.frow{display:flex;gap:9px;align-items:flex-start;padding:8px 10px;margin-bottom:6px;
  border:1px solid var(--border);border-radius:var(--radius);background:var(--muted);
  border-left:3px solid var(--tc,var(--border))}
.frow.on{opacity:.62}
.frow.on .ft{text-decoration:line-through}
.frow>input.fchk{flex:0 0 auto;width:18px;height:18px;margin-top:2px;accent-color:var(--ok);cursor:pointer}
.fbody{flex:1 1 auto;min-width:0}
.fbody>summary{cursor:pointer;list-style:none;display:block}
.fbody>summary::-webkit-details-marker{display:none}
.ft{font-weight:650;font-size:.92rem;display:block}
.fmeta{display:flex;flex-wrap:wrap;gap:4px;margin-top:4px}
.fchip{font-size:.68rem;padding:1px 7px;border-radius:99px;background:var(--accent);color:var(--muted-fg);white-space:nowrap}
.fchip.her{background:hsl(38 92% 55% / .18);color:var(--warn)}
.fchip.tape{background:hsl(0 84% 60% / .16);color:var(--danger)}
.fchip.saq{background:hsl(218 91% 64% / .16);color:var(--primary)}
.fchip.sys{background:transparent;border:1px solid var(--border)}
.fchip.hl{background:hsl(158 64% 42% / .2);color:var(--ok);font-weight:650}
.fchip.rev{background:hsl(158 64% 42% / .12);color:var(--ok)}
.fchip.kh{background:hsl(280 60% 60% / .16);color:hsl(280 70% 72%)}
.hlans{margin-top:8px;border:1px solid var(--border);border-radius:var(--radius);background:var(--bg);overflow:hidden}
.hlans>summary{cursor:pointer;padding:7px 10px;font-weight:650;font-size:.84rem;color:var(--ok);list-style:none}
.hlans>summary::-webkit-details-marker{display:none}
.hlans .hlbody{padding:0 10px 10px;font-size:.83rem;line-height:1.55;white-space:pre-wrap}
.hlans .hlh{font-weight:700;margin:8px 0 4px;font-size:.8rem;letter-spacing:.02em}
.fdet{font-size:.85rem;line-height:1.5;margin-top:8px;padding-top:8px;border-top:1px solid var(--border)}
.fdet p{margin:0 0 7px}
.fdet .fcap{color:var(--muted-fg)}
.fwhy{font-size:.8rem;line-height:1.5;color:var(--muted-fg);margin:0 0 4px}
@media(max-width:400px){ .ft{font-size:.88rem} .fdet{font-size:.82rem} }
.tag{font-size:.72rem;padding:2px 8px;border-radius:99px;background:var(--accent);color:var(--muted-fg)}
.tag.mixed,.tag.authored{color:var(--muted-fg)}
/* one colour per group: written at load from META.hue (see "chrome") */
/* sitting */
.qhead{display:flex;align-items:center;flex-wrap:wrap;gap:4px 10px;margin-bottom:8px}
.qhead .n{font-weight:700}
.qhead .timer{margin-left:auto;font-variant-numeric:tabular-nums;color:var(--muted-fg)}
.qhead .timer.low{color:var(--danger);font-weight:700}
.stem{white-space:pre-wrap;margin-bottom:10px}
.stem img,.qimg{max-width:100%;border-radius:8px;background:#fff;display:block;margin:8px 0}
/* structured stem: her paragraphs, lists and table rows survive; a Canvas layout
   table becomes stacked cells at phone width and side-by-side from 560px */
.stem.rich{white-space:normal;line-height:1.5}
.stem.rich p{margin:.4em 0}
.stem.rich ul,.stem.rich ol{margin:.3em 0;padding-left:1.35em}
.stem.rich li{margin:.15em 0}
.stem.rich li>p{margin:.1em 0}
.stem.rich div{margin:.15em 0}
.stem.rich .tbl{display:flex;flex-direction:column;gap:8px;margin:10px 0}
.stem.rich .tr{display:flex;flex-wrap:wrap;gap:8px 14px;border:1px solid var(--border);border-radius:8px;padding:8px 10px;background:var(--muted)}
.stem.rich .td{flex:1 1 220px;min-width:0}
.stem.rich .td>p:first-child{margin-top:0}
.stem.rich .td img{margin:0 0 4px;max-height:280px;width:auto}
.stem.rich img{max-height:520px;width:auto}
.inl{display:inline-block;width:auto;max-width:100%;padding:5px 8px;margin:2px 0;vertical-align:baseline;
  font-size:.95em;border:1px solid var(--primary);background:var(--card);color:var(--fg);border-radius:6px}
input.inl{min-width:7ch}
.inl:focus{outline:2px solid var(--primary);outline-offset:1px}
.opt{display:flex;gap:10px;align-items:flex-start;border:1px solid var(--border);
  border-radius:var(--radius);padding:10px;margin:6px 0;cursor:pointer;background:var(--muted)}
.opt input{margin-top:3px;flex:none}
.opt.sel{border-color:var(--primary);background:var(--accent)}
/* learn mode: a checked question locks and colours itself in place */
.opt.k{border-color:var(--ok);box-shadow:inset 0 0 0 1px var(--ok)}
.opt.x{border-color:var(--danger);box-shadow:inset 0 0 0 1px var(--danger)}
.opt.lock{cursor:default}
.lres{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:10px 0 0}
.lres .hint{font-size:.76rem;color:var(--muted-fg)}
.lres .qr-pane{flex-basis:100%;padding:6px 0 0}
.mk .verdict{font-weight:700;margin:0 0 4px}
.mk.right .verdict{color:var(--ok)} .mk.wrong .verdict{color:var(--danger)} .mk.saq{border-color:var(--primary)}
.pip.ok{background:var(--ok);border-color:var(--ok)} .pip.bad{background:var(--danger);border-color:var(--danger)}
.qrow .btn{padding:6px 10px;font-size:.8rem}
.qrow .btn.learn{border-color:var(--primary);color:var(--primary)}
.blankrow{display:flex;flex-direction:column;gap:4px;margin:8px 0}
.blankrow label{font-size:.82rem;color:var(--muted-fg)}
select,input[type=text],textarea{font:inherit;color:var(--fg);background:var(--muted);
  border:1px solid var(--border);border-radius:8px;padding:9px;width:100%}
textarea{min-height:120px}
.pips{display:flex;gap:3px;flex-wrap:wrap;margin:10px 0 2px}
.pip{width:14px;height:6px;border-radius:3px;background:var(--muted);border:1px solid var(--border)}
.pip.done{background:var(--primary);border-color:var(--primary)}
.pip.cur{outline:2px solid var(--primary);outline-offset:1px}
/* marking */
.mk{border-left:4px solid var(--border);padding-left:10px;margin:14px 0}
.mk.right{border-color:var(--ok)}.mk.wrong{border-color:var(--danger)}
.mk .you{color:var(--muted-fg);font-size:.9rem}
.mk .keyline{color:var(--ok);font-weight:600}
.mk .marks{font-size:.8rem;color:var(--muted-fg)}
.steps label{display:flex;gap:8px;align-items:flex-start;margin:6px 0;cursor:pointer}
.refq{font-size:.85rem;color:var(--muted-fg);margin:8px 0 2px;padding:8px 10px;background:var(--muted);border-radius:8px}
.refq.slide{padding:6px}
.refq.patton{border-left:3px solid var(--primary)}
.refq i{color:var(--fg)}
.slideimg{max-width:100%;background:#fff;border-radius:6px;display:block;margin:0 0 4px}
.keyrows{margin:6px 0}
.krow{font-size:.85rem;padding:3px 0;border-bottom:1px dashed var(--border)}
.krow b{color:var(--ok);font-weight:600}
.krow.kok{opacity:.55}
.kyou{color:var(--danger);font-size:.78rem}
.kref{font-size:.84rem;color:var(--muted-fg);margin:4px 0 6px 14px;padding:6px 10px;background:var(--muted);border-radius:8px;line-height:1.45}
.kref i{color:var(--fg)}
.kref .refsrc{display:inline}
.refsrc{font-size:.74rem;color:var(--muted-fg);opacity:.8}
.vidrow{font-size:.86rem;margin:6px 0}
.vidrow a{font-weight:600}
.askai{padding:3px 10px;font-size:.76rem;margin-top:6px}
.aiwrap{display:flex;flex-wrap:wrap;gap:4px 10px;align-items:center;margin:8px 0 4px}
.aitext{flex-basis:100%;width:100%;min-height:150px;font-size:.78rem;margin-top:6px}
.aisplit{display:flex;flex-wrap:wrap;gap:4px 8px;align-items:center;margin-top:6px}
.aisplit .askai{margin-top:0}
.vclip{margin:.5rem 0}
.vframe{position:relative;aspect-ratio:16/9;width:100%;max-width:460px;background:#000;border-radius:8px;overflow:hidden;cursor:pointer}
.vframe img,.vframe iframe{width:100%;height:100%;display:block;border:0;object-fit:cover}
.vplay{position:absolute;inset:0;margin:auto;width:54px;height:54px;border-radius:50%;background:rgba(20,20,28,.72);color:#fff;border:2px solid #fff;font-size:1.3rem;cursor:pointer;line-height:1}
.vbadge{position:absolute;left:6px;bottom:6px;background:rgba(0,0,0,.8);color:#fff;font-size:.72rem;padding:2px 6px;border-radius:4px;pointer-events:none}
.vmeta{font-size:.82rem;margin-top:5px;display:flex;flex-wrap:wrap;gap:6px 8px;align-items:center}
.vch{font-weight:600}
.vfull{padding:2px 8px;font-size:.74rem}
.rev-ctl{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin:6px 0 10px;font-size:.85rem}
.rev-ctl .wo{display:flex;gap:6px;align-items:center;cursor:pointer;user-select:none}
.systally{display:flex;flex-wrap:wrap}
.systally .tag{display:inline-block;background:var(--muted);padding:2px 9px;border-radius:11px;margin:2px 5px 2px 0;font-size:.74rem}
.systally .tag.ok{color:var(--ok)}
.qr{border:1px solid var(--muted);border-left-width:4px;border-radius:9px;margin:6px 0;background:var(--card)}
.qr.right{border-left-color:var(--ok)} .qr.partial{border-left-color:var(--warn)} .qr.wrong{border-left-color:var(--danger)} .qr.saq{border-left-color:var(--primary)}
.qr-head{display:flex;gap:10px;align-items:flex-start;padding:9px 11px 7px}
.qr-mk{font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap;padding:2px 8px;border-radius:6px;font-size:.82rem;background:var(--muted)}
.qr.right .qr-mk{background:var(--ok);color:var(--onprimary)} .qr.partial .qr-mk{background:var(--warn);color:var(--onprimary)} .qr.wrong .qr-mk{background:var(--danger);color:#fff}
.qr-stem{font-size:.9rem;line-height:1.35;flex:1}
.qr-acts{display:flex;flex-wrap:wrap;gap:6px;align-items:center;padding:0 11px 9px}
.qa{padding:3px 11px;font-size:.77rem;border:1px solid var(--muted);border-radius:14px;background:transparent;color:inherit;cursor:pointer}
.qa:hover{border-color:var(--primary)} .qa.on{background:var(--primary);color:var(--onprimary);border-color:var(--primary)}
.qr-pane{padding:2px 11px 11px}
.qr .src{font-size:.72rem;color:var(--primary);margin-right:auto;opacity:.85}
.qr .you{font-size:.8rem;padding:2px 11px 4px;opacity:.85}
.qr .steps{padding:2px 11px 6px}
.score-hero{font-size:2.2rem;font-weight:800;text-align:center;margin:.3rem 0 0}
.score-sub{text-align:center;color:var(--muted-fg);margin:0 0 10px}
/* chart */
.spark{width:100%;height:84px;display:block}
.hist{font-size:.82rem;color:var(--muted-fg)}
.hist td{padding:2px 8px 2px 0}
/* chain warmup */
.chain{display:flex;flex-direction:column;gap:2px;margin:8px 0}
.bead{background:var(--accent);border:1px solid var(--border);border-radius:8px;padding:7px 10px;font-size:.9rem}
.bead.blank{border-style:dashed;color:var(--warn);text-align:center}
.verb{color:var(--muted-fg);font-size:.78rem;padding:0 12px}
.note{border:1px solid var(--border);border-left:4px solid var(--warn);border-radius:8px;
  padding:8px 10px;font-size:.84rem;color:var(--muted-fg);margin:10px 0}
.src{font-size:.75rem;color:var(--muted-fg);margin-top:6px}
dialog{background:var(--card);color:var(--fg);border:1px solid var(--border);
  border-radius:var(--radius);max-width:640px;width:calc(100% - 32px);padding:18px}
dialog::backdrop{background:rgb(0 0 0 / .6)}
h3{margin:14px 0 4px;font-size:.95rem}
.footbar{position:fixed;bottom:0;left:0;right:0;background:var(--bg);
  border-top:1px solid var(--border);padding:10px 14px;display:none;gap:8px;z-index:5}
.footbar.on{display:flex}
.footbar .btn{flex:1}
a{color:var(--primary)}
/* ── home: one screen of row cards, each opening its own screen (was one 5-6 screen scroll) ── */
.hero{display:flex;align-items:center;gap:12px;width:100%;text-align:left;font:inherit;color:var(--fg);cursor:pointer;
  background:color-mix(in srgb,var(--primary) 14%,var(--card));border:1px solid color-mix(in srgb,var(--primary) 45%,transparent);
  border-radius:12px;padding:12px 14px;margin:2px 0 4px}
.hero small{display:block;font-size:.76rem;color:var(--primary);font-weight:650}
.hero b{display:block;font-size:1rem;line-height:1.35;margin-top:2px}
.hero .go{flex:0 0 auto;margin-left:auto;width:42px;height:42px;border-radius:50%;background:var(--primary);color:var(--onprimary);
  display:flex;align-items:center;justify-content:center;font-size:1rem}
.lsec{font-size:.72rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted-fg);margin:12px 4px 5px}
.lrow{display:flex;align-items:center;gap:12px;width:100%;text-align:left;font:inherit;color:var(--fg);cursor:pointer;
  background:var(--card);border:1px solid var(--border);border-radius:12px;padding:8px 12px;margin:0 0 7px;
  transition:border-color var(--dur) var(--ease)}
.lrow:hover{border-color:color-mix(in srgb,var(--primary) 55%,var(--border))}
.lic{flex:0 0 40px;height:40px;border-radius:10px;background:var(--muted);display:flex;align-items:center;justify-content:center;font-size:1.15rem}
.ltx{flex:1 1 auto;min-width:0}
.ltx b{display:block;font-size:.97rem;font-weight:650}
.ltx small{display:block;font-size:.8rem;color:var(--muted-fg);line-height:1.35;margin-top:1px}
.lch{flex:0 0 auto;color:var(--muted-fg);font-size:1.3rem;line-height:1}
/* the paper's banner on home: its bold first sentence always shows, the rest is one tap away */
.bnote{margin:0 0 10px}
.bnote>summary{cursor:pointer;list-style:none}
.bnote>summary::-webkit-details-marker{display:none}
.bnote>summary::after{content:' · more';color:var(--primary);font-size:.8rem;font-weight:650}
.bnote[open]>summary::after{content:''}
.shead{display:flex;align-items:center;gap:10px;margin:0 0 12px}
.shead h2{margin:0;font-size:1.1rem;flex:1}
.shead .btn{padding:6px 12px;flex:0 0 auto}
.card .lead{margin:0 0 4px;color:var(--muted-fg);font-size:.9rem;line-height:1.5}
/* each screen's full explanation, folded under its one-line lead (self-explaining, but out of the way) */
.how{margin:0 0 6px}
.how>summary{cursor:pointer;font-size:.82rem;font-weight:650;color:var(--primary);list-style:none;display:inline-block;padding:2px 0}
.how>summary::-webkit-details-marker{display:none}
.how>summary::before{content:'ⓘ '}
.how[open]{border-left:2px solid var(--border);padding-left:10px;margin:4px 0 10px}
.how p,.how .note{font-size:.86rem;color:var(--muted-fg);margin:.4rem 0}
</style>
</head>
<body>
<header>
  <h1 id="h1">Paper Sim</h1>
  <span class="d" id="countdown"></span>
  <a class="btn ghost" id="plBtn" hidden target="_blank" rel="noopener" title="Every video behind this paper, by topic">▶</a>
  <button class="btn ghost" id="themeBtn" title="theme">◐</button>
  <button class="btn ghost" id="helpBtn" title="what is this?">?</button>
</header>
<main id="view"></main>
<div class="footbar" id="footbar"></div>

 highest level of evidence in evidence-based practice?","imgs":[],"qh":"<p>What type of research is considered the highest level of evidence in evidence-based practice?</p>","qt":"What type of research is considered the highest level of evidence in evidence-based practice?","type":"mcq","opts":["Systematic reviews","Randomised controlled trials","Expert opinion","Case studies"],"key":["Systematic reviews"]},{"id":"q88cbcd43a9","quiz":"210129","sys":"prof","pts":1,"q":"Which database is commonly used to find evidence-based research articles?","imgs":[],"qh":"<p>Which database is commonly used to find evidence-based research articles?</p>","qt":"Which database is commonly used to find evidence-based research articles?","type":"mcq","opts":["Facebook","Cochrane library","Wikipedia","Google Scholar"],"key":["Cochrane library"]},{"id":"q0d2b9d47a9","quiz":"210129","sys":"prof","pts":1,"q":"What is the role of a systematic review in evidence-based practice?","imgs":[],"qh":"<p>What is the role of a systematic review in evidence-based practice?</p>","qt":"What is the role of a systematic review in evidence-based practice?","type":"mcq","opts":["To offer personal opinions on clinical practice","To describe individual patient cases","To outline hospital policies","To provide a summary of research on a specific topic"],"key":["To provide a summary of research on a specific topic"]},{"id":"q46d0f0adbf","quiz":"210129","sys":"prof","pts":1,"q":"What is the purpose of critically appraising research evidence?","imgs":[],"qh":"<p>What is the purpose of critically appraising research evidence?</p>","qt":"What is the purpose of critically appraising research evidence?","type":"mcq","opts":["To assess the validity and reliability of the findings","To publish the research in a journal","To determine the cost of the research","To summarise the research in a brief report"],"key":["To assess the validity and reliability of the findings"]},{"id":"qacad8172c7","quiz":"210129","sys":"prof","pts":1,"q":"Which of the following best describes the concept of “clinical expertise” in evidence-based practice?","imgs":[],"qh":"<p>Which of the following best describes the concept of “clinical expertise” in evidence-based practice?</p>","qt":"Which of the following best describes the concept of “clinical expertise” in evidence-based practice?","type":"mcq","opts":["Skills and knowledge acquired through clinical experience","Knowledge gained from textbooks","Opinions of senior nurses","Guidelines provided by healthcare organisation"],"key":["Skills and knowledge acquired through clinical experience"]},{"id":"q791865ffe7","quiz":"210129","sys":"prof","pts":1,"q":"Nurse Inquiry involves:","imgs":[],"qh":"<p>Nurse Inquiry involves:</p>","qt":"Nurse Inquiry involves:","type":"mcq","opts":["Experiential learning","Reflection","Participation in quality improvement programmes","All of these"],"key":["All of these"]},{"id":"qad880fc739","quiz":"210130","sys":"clin","pts":1,"q":"Which of the following best describes health literacy?","imgs":[],"qh":"<p>Which of the following best describes health literacy?</p>","qt":"Which of the following best describes health literacy?","type":"mcq","opts":["The ability to understand and use health information to make informed decisions","The ability to read and write","The ability to diagnose and treat medical conditions","The ability to perform nursing procedures"],"key":["The ability to understand and use health information to make informed decisions"]},{"id":"qdb7b1847b9","quiz":"210130","sys":"clin","pts":1,"q":"What is the teach-back method in patient education?","imgs":[],"qh":"<p>What is the teach-back method in patient education?</p>","qt":"What is the teach-back method in patient education?","type":"mcq","opts":["A strategy where patients teach other patients","A strategy where the nurse teaches the patient","A method where patients are asked to repeat back the information to confirm understanding","A technique where the nurse repeats information multiple times"],"key":["A method where patients are asked to repeat back the information to confirm understanding"]},{"id":"qa2dbd06f9f","quiz":"210130","sys":"clin","pts":1,"q":"What is the primary goal of patient education in nursing?","imgs":[],"qh":"<p>What is the primary goal of patient education in nursing?</p>","qt":"What is the primary goal of patient education in nursing?","type":"mcq","opts":["To improve patient health outcomes and self-management","To increase patient dependence on healthcare providers","To reduce the workload of nurses","To promote the use of medical jargon"],"key":["To improve patient health outcomes and self-management"]},{"id":"q1cc64337c4","quiz":"210130","sys":"clin","pts":1,"q":"What impact does low health literacy have on patient outcomes?","imgs":[],"qh":"<p>What impact does low health literacy have on patient outcomes?</p>","qt":"What impact does low health literacy have on patient outcomes?","type":"mcq","opts":["Improved health outcomes","Increased risk of hospitalisation and poor health outcomes","Decreased healthcare costs","No impact on health outcomes"],"key":["Increased risk of hospitalisation and poor health outcomes"]},{"id":"qa477254180","quiz":"210130","sys":"clin","pts":1,"q":"A six year old child needs an IV luer inserted. An appropriate technique to teach them about this could be?","imgs":[],"qh":"<p>A six year old child needs an IV luer inserted. An appropriate technique to teach them about this could be?</p>","qt":"A six year old child needs an IV luer inserted. An appropriate technique to teach them about this could be?","type":"mcq","opts":["Talking to them","Don't tell them as it will only upset them","An information pamphlet for them to read","Play therapy"],"key":["Play therapy"]},{"id":"q63b4aaa629","quiz":"210130","sys":"clin","pts":1,"q":"What is an example of step 1 (A) in the A, B, C of patient education to improve health literacy?","imgs":[],"qh":"<p>What is an example of step 1 (A) in the A, B, C of patient education to improve health literacy?</p>","qt":"What is an example of step 1 (A) in the A, B, C of patient education to improve health literacy?","type":"mcq","opts":["\"Can you please explain what I told you about the side effects of amoxicillin?\"","\"Some common side effects of amoxicillin are nausea and diarrhoea\"","\"You need to take amoxicillin until you finish the prescription\"","\"Have you heard of the medication amoxicillin and what do you already know about it?\""],"key":["\"Have you heard of the medication amoxicillin and what do you already know about it?\""]},{"id":"q75367192e5","quiz":"210130","sys":"clin","pts":1,"q":"A 55-year-old patient with type 2 diabetes mellitus is having difficulty understanding how to manage their condition. What is the most effective way for the nurse to teach the patient about their diabetes management plan?","imgs":[],"qh":"<p>A 55-year-old patient with type 2 diabetes mellitus is having difficulty understanding how to manage their condition. What is the most effective way for the nurse to teach the patient about their diabetes management plan?</p>","qt":"A 55-year-old patient with type 2 diabetes mellitus is having difficulty understanding how to manage their condition. What is the most effective way for the nurse to teach the patient about their diabetes management plan?","type":"mcq","opts":["Provide a detailed pamphlet with medical jargon","Use simple language and visual aids to explain the plan","Schedule a follow-up appointment without further explanation","Give the patient a list of websites to read"],"key":["Use simple language and visual aids to explain the plan"]},{"id":"q682be08b32","quiz":"210130","sys":"clin","pts":1,"q":"A patient is prescribed a new medication and is unsure about how to take it properly. What should the nurse do to enhance the patient’s understanding of the medication regimen?","imgs":[],"qh":"<p>A patient is prescribed a new medication and is unsure about how to take it properly. What should the nurse do to enhance the patient’s understanding of the medication regimen?</p>","qt":"A patient is prescribed a new medication and is unsure about how to take it properly. What should the nurse do to enhance the patient’s understanding of the medication regimen?","type":"mcq","opts":["Tell the patient to read the instructions on the bottle","Provide a scientific article about the medication","Demonstrate how to take the medication and ask the patient to repeat the instructions","Tell the patient to call the pharmacy if they have questions"],"key":["Demonstrate how to take the medication and ask the patient to repeat the instructions"]},{"id":"q38c07beaf7","quiz":"210130","sys":"clin","pts":1,"q":"A nurse is educating a patient with low health literacy about managing hypertension. Which strategy should the nurse use to improve the patient’s understanding?","imgs":[],"qh":"<p>A nurse is educating a patient with low health literacy about managing hypertension. Which strategy should the nurse use to improve the patient’s understanding?</p>","qt":"A nurse is educating a patient with low health literacy about managing hypertension. Which strategy should the nurse use to improve the patient’s understanding?","type":"mcq","opts":["Provide a pamphlet with detailed information","Use medical terminology to sound professional","Use teach-back method to confirm understanding","Speak quickly to cover all the information"],"key":["Use teach-back method to confirm understanding"]},{"id":"q1564fcc732","quiz":"210130","sys":"clin","pts":1,"q":"A consideration for optimal learning is","imgs":[],"qh":"<p>A consideration for optimal learning is</p>","qt":"A consideration for optimal learning is","type":"mcq","opts":["The learning environment","The patient's motivation to learn","Appropriate resources","All of these"],"key":["All of these"]},{"id":"qc66fadd154","quiz":"a-cna","sys":"pop","pts":1,"q":"McMurray’s Community Assessment Framework has four steps. Which list gives them in the right order?","qh":"<p>McMurray’s Community Assessment Framework has four steps. Which list gives them in the right order?</p>","qt":"McMurray’s Community Assessment Framework has four steps. Which list gives them in the right order?","imgs":[],"type":"mcq","authored":1,"opts":["Map → Engage → Empower → Analyse","Engage → Map → Analyse → Empower","Analyse → Engage → Map → Empower","Engage → Analyse → Map → Empower"],"key":["Engage → Map → Analyse → Empower"],"src":"the Community Needs Assessment Framework deck, slides 10 and 38","why":"The deck repeats the same four-step strip throughout: ENGAGE with the community, MAP strengths, resources and risks, ANALYSE the information gathered, EMPOWER the community. You cannot analyse before you have mapped, and nothing starts until the community has been engaged."},{"id":"q25eebb5eee","quiz":"a-cna","sys":"pop","pts":1,"q":"In the ENGAGE step a nurse first approaches “key community members”. Who does the Community Needs Assessment lecture mean by that?","qh":"<p>In the ENGAGE step a nurse first approaches “key community members”. Who does the Community Needs Assessment lecture mean by that?</p>","qt":"In the ENGAGE step a nurse first approaches “key community members”. Who does the Community Needs Assessment lecture mean by that?","imgs":[],"type":"mcq","authored":1,"opts":["The residents with the poorest health outcomes, because the need is greatest there","Whoever responds to a random household survey, so that the sample is unbiased","People who hold respect or authority in the community, formally or informally","Only elected officials such as the local council, who alone can give formal consent"],"key":["People who hold respect or authority in the community, formally or informally"],"src":"the Community Needs Assessment Framework deck, slides 12–13","why":"Key community members are those who hold positions of respect and/or authority, through formal OR informal leadership — community elders and kaumātua, local healthcare providers, teachers, social workers, council or community board members, and others who provide services there."},{"id":"qaa6afcc463","quiz":"a-cna","sys":"pop","pts":1,"q":"A student nurse drives slowly through a suburb noting the state of the housing, the bus routes, the parks and where the nearest pharmacy is. What is this method, and what kind of data does it produce?","qh":"<p>A student nurse drives slowly through a suburb noting the state of the housing, the bus routes, the parks and where the nearest pharmacy is. What is this method, and what kind of data does it produce?</p>","qt":"A student nurse drives slowly through a suburb noting the state of the housing, the bus routes, the parks and where the nearest pharmacy is. What is this method, and what kind of data does it produce?","imgs":[],"type":"mcq","authored":1,"opts":["A windscreen survey — primary data","A windscreen survey — secondary data","A SWOT analysis — primary data","A census — secondary data"],"key":["A windscreen survey — primary data"],"src":"the Community Needs Assessment Framework deck, slides 27 and 29","why":"A windscreen survey is a quick overview of a community gained by driving around and observing. Primary data is what you observe yourself — observations of community life; secondary data is your research into what others have already collected."},{"id":"qfb235c2748","quiz":"a-cna","sys":"pop","pts":1,"q":"Which of these is SECONDARY data for a community assessment?","qh":"<p>Which of these is SECONDARY data for a community assessment?</p>","qt":"Which of these is SECONDARY data for a community assessment?","imgs":[],"type":"mcq","authored":1,"opts":["Notes from your own windscreen survey","What a kaumātua tells you about local priorities","Your observation of older people doing Tai Chi in the park","Census figures for the suburb from Stats NZ"],"key":["Census figures for the suburb from Stats NZ"],"src":"the Community Needs Assessment Framework deck, slides 26–28","why":"Secondary data is your research: Stats NZ, Ministry of Health publications, the New Zealand Health Survey, library databases. The other three are all things you saw or heard yourself in the community — primary data."},{"id":"q607daf395f","quiz":"a-cna","sys":"pop","pts":1,"q":"In the MAP step, what does the Community Needs Assessment lecture tell you to use as the framework for organising the information you collect?","qh":"<p>In the MAP step, what does the Community Needs Assessment lecture tell you to use as the framework for organising the information you collect?</p>","qt":"In the MAP step, what does the Community Needs Assessment lecture tell you to use as the framework for organising the information you collect?","imgs":[],"type":"mcq","authored":1,"opts":["The five steps of the nursing process (ADPIE)","The Social Determinants of Health Assessment Circle","The four walls of Te Whare Tapa Whā","A SWOT grid of strengths, weaknesses, opportunities and threats"],"key":["The Social Determinants of Health Assessment Circle"],"src":"the Community Needs Assessment Framework deck, slides 18 and 20","why":"MAP = talk with everyday community members, and collect information using the Social Determinants of Health Assessment Circle as the framework for organising the data. The SWOT grid belongs to the next step, ANALYSE."},{"id":"qede8f5e3b4","quiz":"a-cna","sys":"pop","pts":1,"q":"In the Community Needs Assessment lecture’s SWOT analysis, which two headings sit under “harmful to health”?","qh":"<p>In the Community Needs Assessment lecture’s SWOT analysis, which two headings sit under “harmful to health”?</p>","qt":"In the Community Needs Assessment lecture’s SWOT analysis, which two headings sit under “harmful to health”?","imgs":[],"type":"mcq","authored":1,"opts":["Strengths and Opportunities","Weaknesses and Opportunities","Weaknesses and Threats","Strengths and Threats"],"key":["Weaknesses and Threats"],"src":"the Community Needs Assessment Framework deck, slide 33","why":"Helpful to health: Strengths (what is working well) and Opportunities (the possibilities — new services, beneficial trends). Harmful to health: Weaknesses (what is harming health now) and Threats (what health issues could arise, what could worsen inequities if unaddressed)."},{"id":"qb2b1d85ab7","quiz":"a-cna","sys":"pop","pts":1,"q":"A community assessment finds high rates of respiratory illness linked to cold, damp housing, and the nurse advocates for a healthy-homes initiative. Which Te Tiriti principle does the Community Needs Assessment lecture use this example for?","qh":"<p>A community assessment finds high rates of respiratory illness linked to cold, damp housing, and the nurse advocates for a healthy-homes initiative. Which Te Tiriti principle does the Community Needs Assessment lecture use this example for?</p>","qt":"A community assessment finds high rates of respiratory illness linked to cold, damp housing, and the nurse advocates for a healthy-homes initiative. Which Te Tiriti principle does the Community Needs Assessment lecture use this example for?","imgs":[],"type":"mcq","authored":1,"opts":["Whakamarumarutia — active protection","Kōwhiringa — options","Pātuitanga — partnership","Tino rangatiratanga — self-determination"],"key":["Whakamarumarutia — active protection"],"src":"the Community Needs Assessment Framework deck, slide 34","why":"Active protection asks “what health risks require protection, and are they being protected?” — the deck’s own example is respiratory illness linked to poor housing, prompting advocacy for healthy homes. Options is about culturally appropriate services being available; partnership is about who nurses work alongside."},{"id":"q97006b6a75","quiz":"a-tikanga","sys":"prof","pts":1,"q":"Under Kawa Whakaruruhau (cultural safety), who decides whether the care given was culturally safe?","qh":"<p>Under Kawa Whakaruruhau (cultural safety), who decides whether the care given was culturally safe?</p>","qt":"Under Kawa Whakaruruhau (cultural safety), who decides whether the care given was culturally safe?","imgs":[],"type":"mcq","authored":1,"opts":["The nurse who gave the care","The person and whānau receiving the care","The charge nurse auditing the ward","The Nursing Council of New Zealand"],"key":["The person and whānau receiving the care"],"src":"the Tikanga Best Practice and Kawa Whakaruruhau deck, slides 2 and 6","why":"The deck’s first line on Kawa Whakaruruhau: cultural safety is determined by the recipient of care. It focuses on the individual’s and whānau experience to define and improve the quality of care — the nurse cannot declare their own practice safe."},{"id":"q335c94621b","quiz":"a-tikanga","sys":"prof","pts":1,"q":"Which statement about cultural safety matches the Tikanga & Kawa Whakaruruhau lecture?","qh":"<p>Which statement about cultural safety matches the Tikanga &amp; Kawa Whakaruruhau lecture?</p>","qt":"Which statement about cultural safety matches the Tikanga & Kawa Whakaruruhau lecture?","imgs":[],"type":"mcq","authored":1,"opts":["It is another name for cultural awareness, which is where safe practice ends","It is achieved once a nurse has learned the customs of each culture they will meet","It means treating every patient identically, regardless of culture or background","It goes beyond cultural awareness and sensitivity; competence alone is not enough"],"key":["It goes beyond cultural awareness and sensitivity; competence alone is not enough"],"src":"the Tikanga Best Practice and Kawa Whakaruruhau deck, slide 6","why":"Cultural safety extends beyond cultural awareness and cultural sensitivity; cultural competence may contribute to delivering health care but is not enough to improve health outcomes. It also recognises nurses as inadvertent bearers of power who must reflect on their own biases."},{"id":"q044f09850e","quiz":"a-tikanga","sys":"prof","pts":1,"q":"Tikanga is described as “the Māori way of doing things”. Which word is it derived from, and what does that word mean?","qh":"<p>Tikanga is described as “the Māori way of doing things”. Which word is it derived from, and what does that word mean?</p>","qt":"Tikanga is described as “the Māori way of doing things”. Which word is it derived from, and what does that word mean?","imgs":[],"type":"mcq","authored":1,"opts":["Tika — right or correct","Tapu — sacred or restricted","Taonga — something treasured","Tinana — the physical body"],"key":["Tika — right or correct"],"src":"the Tikanga Best Practice and Kawa Whakaruruhau deck, slide 8","why":"Tikanga comes from tika, meaning “right” or “correct”. Kawa, its partner term, is customs, protocols and etiquette; together they are the lores and mores that form the cornerstone of life for Māori."},{"id":"qb5dcbf8a73","quiz":"a-tikanga","sys":"prof","pts":1,"q":"What does noa mean?","qh":"<p>What does noa mean?</p>","qt":"What does noa mean?","imgs":[],"type":"mcq","authored":1,"opts":["Sacred, prohibited, restricted or set apart from ordinary use","A treasured possession handed down through the whānau","Neutral, ordinary or unrestricted — free from tapu","The spiritual dimension of a person’s wellbeing"],"key":["Neutral, ordinary or unrestricted — free from tapu"],"src":"the Tikanga Best Practice and Kawa Whakaruruhau deck, slide 9","why":"Noa is to be made neutral, ordinary or unrestricted, freed from the extensions of tapu. Tapu and noa together form the basis of law and order, of safe and unsafe practices."},{"id":"q12ad9c13a7","quiz":"a-tikanga","sys":"prof","pts":1,"q":"According to the Tikanga & Kawa Whakaruruhau lecture, which parts of the body are tapu?","qh":"<p>According to the Tikanga &amp; Kawa Whakaruruhau lecture, which parts of the body are tapu?</p>","qt":"According to the Tikanga & Kawa Whakaruruhau lecture, which parts of the body are tapu?","imgs":[],"type":"mcq","authored":1,"opts":["The hands, feet and back","The head, genitalia and heart","The eyes, ears and mouth","Only the head"],"key":["The head, genitalia and heart"],"src":"the Tikanga Best Practice and Kawa Whakaruruhau deck, slides 14 and 19","why":"The deck (citing Durie, 1998) names the head, genitalia and heart — and notes that people can also be tapu at different times and in differing circumstances. This is why “ask rather than assume” sits under respecting tikanga."},{"id":"q70c98e887d","quiz":"a-tikanga","sys":"prof","pts":1,"q":"Sir Mason Durie’s reading of tapu, quoted in the Tikanga & Kawa Whakaruruhau lecture, relates it to what in modern terms?","qh":"<p>Sir Mason Durie’s reading of tapu, quoted in the Tikanga &amp; Kawa Whakaruruhau lecture, relates it to what in modern terms?</p>","qt":"Sir Mason Durie’s reading of tapu, quoted in the Tikanga & Kawa Whakaruruhau lecture, relates it to what in modern terms?","imgs":[],"type":"mcq","authored":1,"opts":["Punishment for wrongdoing","Ownership of land","Rank within the iwi","Safety and risk precautions"],"key":["Safety and risk precautions"],"src":"the Tikanga Best Practice and Kawa Whakaruruhau deck, slides 10–11","why":"For modern times tapu has been reframed in a protective sense: according to Durie it relates to safety and risk precautions, and restrictions and prohibitions protect tapu from violation. It is viewed as a preventive measure as well as a cause of illness."},{"id":"q9be10864e7","quiz":"a-tikanga","sys":"prof","pts":1,"q":"A nurse meets a new patient, introduces themself and their role, checks how to pronounce the patient’s name correctly and takes a moment to find a point of connection before starting the admission. Which principle of tikanga best practice is this?","qh":"<p>A nurse meets a new patient, introduces themself and their role, checks how to pronounce the patient’s name correctly and takes a moment to find a point of connection before starting the admission. Which principle of tikanga best practice is this?</p>","qt":"A nurse meets a new patient, introduces themself and their role, checks how to pronounce the patient’s name correctly and takes a moment to find a point of connection before starting the admission. Which principle of tikanga best practice is this?","imgs":[],"type":"mcq","authored":1,"opts":["Whakawhanaungatanga","Whakamarumarutia","Tino rangatiratanga","Whatumanawa"],"key":["Whakawhanaungatanga"],"src":"the Tikanga Best Practice and Kawa Whakaruruhau deck, slide 17 and the speaker notes to slide 12","why":"Whakawhanaungatanga: build trusting relationships, pronounce names correctly, introduce yourself and your role, create meaningful connections. The lecture note on it is “relationship before task”."},{"id":"q64037c7068","quiz":"a-pain","sys":"care","pts":1,"q":"“Pain is whatever the experiencing person says it is, existing wherever they say it does.” What does this definition mean for a nurse assessing pain?","qh":"<p>“Pain is whatever the experiencing person says it is, existing wherever they say it does.” What does this definition mean for a nurse assessing pain?</p>","qt":"“Pain is whatever the experiencing person says it is, existing wherever they say it does.” What does this definition mean for a nurse assessing pain?","imgs":[],"type":"mcq","authored":1,"opts":["Pain is only real when vital signs have changed","The person’s own report is the measure that matters — pain is subjective","Pain should be rated by the nurse from the person’s behaviour","Pain without a visible injury should be recorded as anxiety"],"key":["The person’s own report is the measure that matters — pain is subjective"],"src":"the Pain Assessment deck, slides 7–8 and the speaker notes to slide 34","why":"McCaffery’s definition makes pain subjective: an individual, multifactorial experience shaped by culture and previous pain. The lecture notes say it outright — always remember that the patient’s rating is what matters."},{"id":"q839b40fa92","quiz":"a-pain","sys":"care","pts":1,"q":"Nociception communicates tissue damage to the central nervous system through four processes. Which list names them?","qh":"<p>Nociception communicates tissue damage to the central nervous system through four processes. Which list names them?</p>","qt":"Nociception communicates tissue damage to the central nervous system through four processes. Which list names them?","imgs":[],"type":"mcq","authored":1,"opts":["Transduction, transmission, perception, modulation","Onset, location, duration, severity","Absorption, distribution, metabolism, excretion","Sensation, reflex, response, recovery"],"key":["Transduction, transmission, perception, modulation"],"src":"the Pain Assessment deck, slides 9 and 11","why":"Nociception is the physiological process that communicates tissue damage to the CNS: transduction, transmission, perception and modulation. Perception is where pain is recognised and given meaning — in the brain, at no single known location."},{"id":"q129e5c56c0","quiz":"a-pain","sys":"care","pts":1,"q":"A man with long-standing diabetes describes the pain in his feet as burning and shooting, “like electric shocks”, and says even the bed sheet touching them hurts. Which type of pain is this?","qh":"<p>A man with long-standing diabetes describes the pain in his feet as burning and shooting, “like electric shocks”, and says even the bed sheet touching them hurts. Which type of pain is this?</p>","qt":"A man with long-standing diabetes describes the pain in his feet as burning and shooting, “like electric shocks”, and says even the bed sheet touching them hurts. Which type of pain is this?","imgs":[],"type":"mcq","authored":1,"opts":["Superficial somatic pain","Visceral pain","Neuropathic pain","Referred pain"],"key":["Neuropathic pain"],"src":"the Pain Assessment deck, slides 16–18","why":"Neuropathic pain comes from injury or dysfunction of the nervous system — abnormal processing of stimuli. It feels shooting, burning, numb or electric-shock-like, with pain on light touch. Diabetes, shingles and multiple sclerosis are the deck’s common causes."},{"id":"q9ad87c89c6","quiz":"a-pain","sys":"care","pts":1,"q":"A woman describes her abdominal pain as crampy, squeezing and hard to point to — “it’s sort of all through here”. Which type of pain do these words suggest?","qh":"<p>A woman describes her abdominal pain as crampy, squeezing and hard to point to — “it’s sort of all through here”. Which type of pain do these words suggest?</p>","qt":"A woman describes her abdominal pain as crampy, squeezing and hard to point to — “it’s sort of all through here”. Which type of pain do these words suggest?","imgs":[],"type":"mcq","authored":1,"opts":["Visceral nociceptive pain","Superficial somatic pain","Neuropathic pain","Deep somatic pain"],"key":["Visceral nociceptive pain"],"src":"the Pain Assessment deck, slides 13–14 and 37","why":"Visceral pain comes from nociceptors in the internal organs and body-cavity linings (inflammation, stretching, ischaemia). It is diffuse and may be referred, and feels crampy, squeezing, colicky or gnawing. Somatic pain is localised — sharp, aching, throbbing."},{"id":"q8ba0c9c403","quiz":"a-pain","sys":"care","pts":1,"q":"Which statement about acute pain matches the Pain Assessment lecture?","qh":"<p>Which statement about acute pain matches the Pain Assessment lecture?</p>","qt":"Which statement about acute pain matches the Pain Assessment lecture?","imgs":[],"type":"mcq","authored":1,"opts":["It persists beyond the expected time of healing","Its cause is usually unknown","It is characterised by periods of waxing and waning","It lasts less than 3–6 months and warns of injury"],"key":["It lasts less than 3–6 months and warns of injury"],"src":"the Pain Assessment deck, slides 23–25","why":"Acute pain warns of injury and limits further damage, lasts less than 3–6 months, usually has an identifiable cause and fades as recovery occurs (post-operative, labour, trauma). The other three describe chronic pain. Unrelieved acute pain can lead to chronic pain."},{"id":"q8ce2ceac44","quiz":"a-pain","sys":"care","pts":1,"q":"Which set of findings is the SYMPATHETIC (“fight or flight”) response to pain?","qh":"<p>Which set of findings is the SYMPATHETIC (“fight or flight”) response to pain?</p>","qt":"Which set of findings is the SYMPATHETIC (“fight or flight”) response to pain?","imgs":[],"type":"mcq","authored":1,"opts":["Nausea and vomiting, fainting, and a fall in blood pressure and pulse rate","Raised blood pressure, pulse and respiratory rate, dilated pupils, pallor","Grimacing, moaning, guarding the painful area and refusing to move","A slow pulse, warm flushed skin, constricted pupils and slow breathing"],"key":["Raised blood pressure, pulse and respiratory rate, dilated pupils, pallor"],"src":"the Pain Assessment deck, slides 26–27","why":"Sympathetic: increased BP, pulse and respiratory rate, pupil dilation, muscle tension and rigidity, pallor. Parasympathetic: nausea and vomiting, fainting, decreased BP and pulse. Grimacing and guarding are voluntary (behavioural) responses. A person does not have to show any of them to be in pain."},{"id":"q8662298349","quiz":"a-pain","sys":"care","pts":1,"q":"During a pain assessment a man says his flank pain “gets worse when I move or pass urine”. Under which letter of OLDCARTS does the nurse record this?","qh":"<p>During a pain assessment a man says his flank pain “gets worse when I move or pass urine”. Under which letter of OLDCARTS does the nurse record this?</p>","qt":"During a pain assessment a man says his flank pain “gets worse when I move or pass urine”. Under which letter of OLDCARTS does the nurse record this?","imgs":[],"type":"mcq","authored":1,"opts":["O","C","A","T"],"key":["A"],"src":"the Pain Assessment deck, slides 33 and 38; scenario from the Pain Assessment Practice Handout (James)","why":"A = Aggravating factors — what makes it worse (moving, walking, breathing, urinating, swallowing…). O is onset, C is characteristics (what it feels like) and T is timing (pattern and frequency, day or night)."},{"id":"qeab802b57c","quiz":"a-pain","sys":"care","pts":1,"q":"For which group does the Pain Assessment lecture say the Wong-Baker FACES scale is especially helpful?","qh":"<p>For which group does the Pain Assessment lecture say the Wong-Baker FACES scale is especially helpful?</p>","qt":"For which group does the Pain Assessment lecture say the Wong-Baker FACES scale is especially helpful?","imgs":[],"type":"mcq","authored":1,"opts":["Adults with chronic pain who already keep a daily pain diary","Patients on opioid infusions or patient-controlled analgesia","Anyone whose pain has already been rated above 7/10 on a numerical scale","Children, non-verbal people, or where there is a language barrier"],"key":["Children, non-verbal people, or where there is a language barrier"],"src":"the Pain Assessment deck, slides 41 and 43","why":"FACES is especially helpful for children, non-verbal persons or if there is a language barrier: the person picks the face that shows how they feel right now. Whatever scale is used, use the same one each time so the effect of pain relief can be compared."},{"id":"q2f458f09f0","quiz":"a-pain","sys":"care","pts":1,"q":"The Pain Assessment lecture calls pain “the 5th vital sign”. When does it say pain should be assessed?","qh":"<p>The Pain Assessment lecture calls pain “the 5th vital sign”. When does it say pain should be assessed?</p>","qt":"The Pain Assessment lecture calls pain “the 5th vital sign”. When does it say pain should be assessed?","imgs":[],"type":"mcq","authored":1,"opts":["Only when the person reports pain or asks for pain relief","Regularly, and before and after any therapeutic intervention","Once per shift, at the same time as the other four vital signs","On admission, and again when the person is ready for discharge"],"key":["Regularly, and before and after any therapeutic intervention"],"src":"the Pain Assessment deck, slides 31 and 47","why":"Pain should be assessed on a regular basis and before and after any therapeutic intervention, and documented in the care plan and the patient’s notes using a standardised tool — that is how the team knows whether the intervention worked."},{"id":"qdb15d86dea","quiz":"a-fcc","sys":"care","pts":1,"q":"How does Stats NZ define a family?","qh":"<p>How does Stats NZ define a family?</p>","qt":"How does Stats NZ define a family?","imgs":[],"type":"mcq","authored":1,"opts":["Anyone the person identifies as family, whether or not they are related to them or share a household","Two or more people in one household: a couple (with or without children) or one parent with children","Three or more generations of related people who live together at one address","People related to one another by birth, marriage or adoption, wherever in the country they live"],"key":["Two or more people in one household: a couple (with or without children) or one parent with children"],"src":"the Family Centred Care deck, slide 5 and the speaker notes to slide 6","why":"The Stats NZ definition is household-based: two or more people living in the same household who are a couple (with or without children) or one parent and their children. The deck’s point is that family is often more than who lives in our household — and that official definitions can decide access to resources."},{"id":"qa615a5035e","quiz":"a-fcc","sys":"care","pts":1,"q":"Which definition of family does the Family-centred Care lecture give for NURSING practice?","qh":"<p>Which definition of family does the Family-centred Care lecture give for NURSING practice?</p>","qt":"Which definition of family does the Family-centred Care lecture give for NURSING practice?","imgs":[],"type":"mcq","authored":1,"opts":["Whoever the person identifies as family, with or without biological or legal ties","The person recorded in the clinical notes as the patient’s legal next of kin","The people who usually live at the same address as the patient, related or not","Blood relatives and spouses only, because they are the people with legal standing"],"key":["Whoever the person identifies as family, with or without biological or legal ties"],"src":"the Family Centred Care deck, slide 15","why":"“Family in nursing”: a set of relationships that the person identifies as family, or a network of individuals who influence each other’s lives, whether or not there are actual biological or legal ties. The person defines their family — the nurse does not."},{"id":"qbd6d278aeb","quiz":"a-fcc","sys":"care","pts":1,"q":"The Family-centred Care lecture builds “facilitating family-centred care” from three elements. Which are they?","qh":"<p>The Family-centred Care lecture builds “facilitating family-centred care” from three elements. Which are they?</p>","qt":"The Family-centred Care lecture builds “facilitating family-centred care” from three elements. Which are they?","imgs":[],"type":"mcq","authored":1,"opts":["Assessment, planning and implementation, evaluation","Communication and advocacy, privacy, and respect for the person","Relationship, participation and involvement, tailoring care","Engaging the family, mapping its resources, empowering it"],"key":["Relationship, participation and involvement, tailoring care"],"src":"the Family Centred Care deck, slides 27–28, 31 and 33","why":"Relationship (a genuine, positive, mutually respectful partnership), Participation & Involvement (respecting the autonomy of the individual and family), and Tailoring Care (care designed around the patient’s and family’s needs and context)."},{"id":"q53c70f5ed6","quiz":"a-fcc","sys":"care","pts":1,"q":"What are a genogram and an ecomap used for?","qh":"<p>What are a genogram and an ecomap used for?</p>","qt":"What are a genogram and an ecomap used for?","imgs":[],"type":"mcq","authored":1,"opts":["Recording the immunisation history of every member of a family across generations","Screening the members of a household for partner, child or elder abuse","Calculating a family’s deprivation score from its address, income and household size","Showing a person’s family structure and relationships, within and beyond the family"],"key":["Showing a person’s family structure and relationships, within and beyond the family"],"src":"the Family Centred Care deck, slide 30","why":"They are visual representations of a person and their relationships to the family structure, and of relationships within and beyond the family’s boundaries — a useful way of engaging people and families in an active discussion about their relationships."},{"id":"q788157cb1f","quiz":"a-fcc","sys":"care","pts":1,"q":"A patient’s daughter, who is his main caregiver, asks the nurse how her father is doing. He has not objected to her being told. What does the Family-centred Care lecture say about privacy here?","qh":"<p>A patient’s daughter, who is his main caregiver, asks the nurse how her father is doing. He has not objected to her being told. What does the Family-centred Care lecture say about privacy here?</p>","qt":"A patient’s daughter, who is his main caregiver, asks the nurse how her father is doing. He has not objected to her being told. What does the Family-centred Care lecture say about privacy here?","imgs":[],"type":"mcq","authored":1,"opts":["Nothing at all may be shared with her until he has given consent in writing, because she is not the patient","His presence, condition and progress may be shared with her in line with professional practice, unless he vetoes it","Only the doctor in charge of his care may speak to family members about his condition or progress","Everything in his clinical record may be shared with any relative who asks for it, because family are partners in his care"],"key":["His presence, condition and progress may be shared with her in line with professional practice, unless he vetoes it"],"src":"the Family Centred Care deck, slide 18 (Health Information Privacy Code)","why":"Health professionals can disclose information about a patient’s presence, condition and progress to caregivers or close relatives in line with recognised professional practice — as long as the patient has not vetoed that disclosure. That is not the whole record, and the patient’s veto stands."},{"id":"qf97bdfde45","quiz":"a-fcc","sys":"care","pts":1,"q":"Which three forms of abuse does the Family-centred Care lecture group together as “family violence”?","qh":"<p>Which three forms of abuse does the Family-centred Care lecture group together as “family violence”?</p>","qt":"Which three forms of abuse does the Family-centred Care lecture group together as “family violence”?","imgs":[],"type":"mcq","authored":1,"opts":["Partner abuse, child abuse and elder abuse","Physical, verbal and financial abuse","Child abuse, bullying and neglect","Partner abuse, workplace abuse and elder abuse"],"key":["Partner abuse, child abuse and elder abuse"],"src":"the Family Centred Care deck, slide 19","why":"Partner abuse, child abuse and elder abuse are collectively termed family violence. Nurses have a key role in identifying and supporting people experiencing it, and screening is done in most health care facilities."},{"id":"q5b6de9439a","quiz":"a-fcc","sys":"care","pts":1,"q":"Which statement about the Whānau Ora initiative matches the Family-centred Care lecture?","qh":"<p>Which statement about the Whānau Ora initiative matches the Family-centred Care lecture?</p>","qt":"Which statement about the Whānau Ora initiative matches the Family-centred Care lecture?","imgs":[],"type":"mcq","authored":1,"opts":["It is a hospital discharge programme run by Health NZ for Māori patients going home","It pays funding directly to individuals, according to their household income","It was launched in 2010, led by Dame Tariana Turia, and is overseen by Te Puni Kōkiri","It replaced the New Zealand Health Strategy in 2023 under the Pae Ora (Healthy Futures) Act"],"key":["It was launched in 2010, led by Dame Tariana Turia, and is overseen by Te Puni Kōkiri"],"src":"the Family Centred Care deck, slide 23","why":"Whānau Ora was launched in 2010, led by Dame Tariana Turia and overseen by Te Puni Kōkiri (the Ministry of Māori Development). Funding is allocated according to Māori population by area, from census data; community agencies use it to work with whānau — a culturally grounded, holistic approach that addresses individual needs in a whānau context."},{"id":"qf346d3f164","quiz":"a-fcc","sys":"care","pts":1,"q":"Which of these is one of the four shared core functions of families listed in the Family-centred Care lecture?","qh":"<p>Which of these is one of the four shared core functions of families listed in the Family-centred Care lecture?</p>","qt":"Which of these is one of the four shared core functions of families listed in the Family-centred Care lecture?","imgs":[],"type":"mcq","authored":1,"opts":["Deciding what medical treatment each member will accept","Replacing the need for health services","Keeping health information from outsiders","Being direct providers of healthcare to other members"],"key":["Being direct providers of healthcare to other members"],"src":"the Family Centred Care deck, slide 8","why":"The four: to care for, nurture and support each other; to share financial and material resources; to provide socialisation, guidance, identification and a sense of belonging; and to be direct providers of healthcare to other members. How much each matters varies with a family’s own values and beliefs."},{"id":"qe9b2291602","quiz":"a-nzhs","sys":"pop","pts":1,"q":"What are the TWO long-term goals that underpin the New Zealand Health Strategy’s vision of pae ora?","qh":"<p>What are the TWO long-term goals that underpin the New Zealand Health Strategy’s vision of pae ora?</p>","qt":"What are the TWO long-term goals that underpin the New Zealand Health Strategy’s vision of pae ora?","imgs":[],"type":"mcq","authored":1,"opts":["To shorten hospital waiting lists and to reduce overall health spending","To achieve health equity and to improve health outcomes for all New Zealanders","To train more nurses and doctors and to build more hospitals in the regions","To centralise health services nationally and to expand telehealth to every region"],"key":["To achieve health equity and to improve health outcomes for all New Zealanders"],"src":"the New Zealand Health Strategy 2023 deck, slide 16","why":"Goal 1: achieve health equity — especially for Māori, Pacific, disabled and other groups who currently have poorer outcomes. Goal 2: improve health outcomes for all New Zealanders, so everyone can live longer, healthier and more independent lives."},{"id":"q0b9a4cf287","quiz":"a-nzhs","sys":"pop","pts":1,"q":"Which Act reformed the health system by replacing the District Health Boards with Health New Zealand?","qh":"<p>Which Act reformed the health system by replacing the District Health Boards with Health New Zealand?</p>","qt":"Which Act reformed the health system by replacing the District Health Boards with Health New Zealand?","imgs":[],"type":"mcq","authored":1,"opts":["The Pae Ora (Healthy Futures) Act 2022","The Health Practitioners Competence Assurance Act 2003","The New Zealand Public Health and Disability Act 2000","The Health and Disability Commissioner Act 1994"],"key":["The Pae Ora (Healthy Futures) Act 2022"],"src":"the New Zealand Health Strategy 2023 deck, slide 6 and the speaker notes to slide 2","why":"The Pae Ora (Healthy Futures) Act 2022 replaced the DHB system with Health New Zealand (Te Whatu Ora), established the Māori Health Authority (Te Aka Whai Ora — since disestablished, 2024) and the Public Health Agency. The lecture note: the Pae Ora Act is the “how” behind the Health Strategy."},{"id":"q11a06cc4a3","quiz":"a-nzhs","sys":"pop","pts":1,"q":"The NZ Health Strategy lecture separates equity from equality. Which statement describes EQUITY?","qh":"<p>The NZ Health Strategy lecture separates equity from equality. Which statement describes EQUITY?</p>","qt":"The NZ Health Strategy lecture separates equity from equality. Which statement describes EQUITY?","imgs":[],"type":"mcq","authored":1,"opts":["Everyone receives exactly the same resources","Services are funded according to how many people use them","People are given what they need in order to reach similar outcomes","Care is provided only to those who can show need"],"key":["People are given what they need in order to reach similar outcomes"],"src":"the New Zealand Health Strategy 2023 deck, slide 10","why":"Equality gives everyone the same resources; equity gives people what they need to achieve similar outcomes. Health equity means everyone has a fair and just opportunity to be as healthy as possible, which requires removing obstacles such as poverty and discrimination."},{"id":"q8ab578f5d4","quiz":"a-nzhs","sys":"pop","pts":1,"q":"Over what time span does the New Zealand Health Strategy set the direction for improving health?","qh":"<p>Over what time span does the New Zealand Health Strategy set the direction for improving health?</p>","qt":"Over what time span does the New Zealand Health Strategy set the direction for improving health?","imgs":[],"type":"mcq","authored":1,"opts":["The next three years","One parliamentary term","The next twelve months","The next ten years"],"key":["The next ten years"],"src":"the New Zealand Health Strategy 2023 deck, slides 14–15 and 31","why":"The strategy sets the direction for improving the health of all New Zealanders over the next ten years (a long-term, 5–10 year direction). The three-year document is a different one: the Government Policy Statement on Health 2024–2027."},{"id":"q7f6738ff57","quiz":"a-nzhs","sys":"pop","pts":1,"q":"“More preventive support, closer to home; a focus on the early years; parity between mental and physical health.” Which of the six priority areas is this?","qh":"<p>“More preventive support, closer to home; a focus on the early years; parity between mental and physical health.” Which of the six priority areas is this?</p>","qt":"“More preventive support, closer to home; a focus on the early years; parity between mental and physical health.” Which of the six priority areas is this?","imgs":[],"type":"mcq","authored":1,"opts":["Priority 1 — Voice at the heart of the system","Priority 2 — Flexible, appropriate care","Priority 4 — A learning culture","Priority 6 — Partnerships for health and wellbeing"],"key":["Priority 2 — Flexible, appropriate care"],"src":"the New Zealand Health Strategy 2023 deck, slide 20","why":"Priority 2, Flexible, appropriate care: services focused on preventing illness and delivering care closer to home, with access for the most under-served communities — preventive support, the early years, responsive primary and community services, tackling barriers to access, and parity between mental and physical health."},{"id":"q9a1013204e","quiz":"a-nzhs","sys":"pop","pts":1,"q":"Which priority area is about people and communities having greater control over the design of services and the decisions made about their care?","qh":"<p>Which priority area is about people and communities having greater control over the design of services and the decisions made about their care?</p>","qt":"Which priority area is about people and communities having greater control over the design of services and the decisions made about their care?","imgs":[],"type":"mcq","authored":1,"opts":["Voice at the heart of the system","Valuing our workforce","A resilient and sustainable system","A learning culture"],"key":["Voice at the heart of the system"],"src":"the New Zealand Health Strategy 2023 deck, slide 19","why":"Priority 1, Voice at the heart of the system: recognising and responding to the voices of people and communities throughout the health system — further honouring Te Tiriti, adapting to diverse communities, including those who have been under-served, and more locally led approaches."},{"id":"q798e5202bb","quiz":"a-nzhs","sys":"pop","pts":1,"q":"The Government Policy Statement on Health 2024–2027 names three priority areas for action. Which are they?","qh":"<p>The Government Policy Statement on Health 2024–2027 names three priority areas for action. Which are they?</p>","qt":"The Government Policy Statement on Health 2024–2027 names three priority areas for action. Which are they?","imgs":[],"type":"mcq","authored":1,"opts":["Equity, partnership and protection","Prevention, workforce and funding","Access, timeliness and quality","Voice, learning and resilience"],"key":["Access, timeliness and quality"],"src":"the New Zealand Health Strategy 2023 deck, slides 31–34","why":"Access (equitable access wherever a person lives), Timeliness (care when it is needed, promptly and efficiently) and Quality (safe, easy to navigate, understandable, welcoming and continuously improving — including cultural safety and the Code of Rights)."},{"id":"qa14693a1b3","quiz":"a-nzhs","sys":"pop","pts":1,"q":"Which strategy works in partnership with the New Zealand Health Strategy and is specifically the Hauora Māori strategy?","qh":"<p>Which strategy works in partnership with the New Zealand Health Strategy and is specifically the Hauora Māori strategy?</p>","qt":"Which strategy works in partnership with the New Zealand Health Strategy and is specifically the Hauora Māori strategy?","imgs":[],"type":"mcq","authored":1,"opts":["Te Mana Ola","Kia Manawanui Aotearoa","Te Aorerekura","Pae Tū"],"key":["Pae Tū"],"src":"the New Zealand Health Strategy 2023 deck, slides 11, 13 and 29–30","why":"Pae Tū: Hauora Māori Strategy works in partnership with the NZ Health Strategy. Te Mana Ola is the Pacific Health Strategy; Kia Manawanui Aotearoa is the mental wellbeing strategy; Te Aorerekura is the national strategy to eliminate family violence and sexual violence."},{"id":"q00e0c721b6","quiz":"a-discharge","sys":"care","pts":1,"q":"According to the Discharge Planning lecture, when does discharge planning begin?","qh":"<p>According to the Discharge Planning lecture, when does discharge planning begin?</p>","qt":"According to the Discharge Planning lecture, when does discharge planning begin?","imgs":[],"type":"mcq","authored":1,"opts":["When the medical team decides the patient is fit to go","The day before the expected discharge date","At the time of admission","Once the discharge summary has been written"],"key":["At the time of admission"],"src":"the Discharge Planning deck, slides 10, 14 and 31","why":"The deck puts it in capitals: DISCHARGE PLANNING BEGINS AT THE TIME OF ADMISSION. Gathering information from admission — “what brought you to hospital? how have you been managing?” — is already the start of the discharge process."},{"id":"q0ed86b5353","quiz":"a-discharge","sys":"care","pts":1,"q":"Which is the Discharge Planning lecture’s definition of discharge planning?","qh":"<p>Which is the Discharge Planning lecture’s definition of discharge planning?</p>","qt":"Which is the Discharge Planning lecture’s definition of discharge planning?","imgs":[],"type":"mcq","authored":1,"opts":["An interdisciplinary approach to continuity of care, linking hospital, community services and carers","The medical team’s decision that a patient is clinically well enough to give up a hospital bed","The summary, prescription and other paperwork completed on the day a patient leaves hospital","A nursing follow-up task carried out by phone once the patient has gone home, to check how they are managing"],"key":["An interdisciplinary approach to continuity of care, linking hospital, community services and carers"],"src":"the Discharge Planning deck, slides 3 and 6","why":"Discharge planning is an interdisciplinary approach to continuity of care: a process of identification, assessment, goal setting, planning, implementation, coordination and evaluation, and the quality link between hospitals, community-based services, non-government organisations and carers."},{"id":"q665d123559","quiz":"a-discharge","sys":"care","pts":1,"q":"Effective discharge planning is associated with which outcomes?","qh":"<p>Effective discharge planning is associated with which outcomes?</p>","qt":"Effective discharge planning is associated with which outcomes?","imgs":[],"type":"mcq","authored":1,"opts":["More follow-up community care, longer stays and more referrals","Fewer referrals, less patient education and fewer follow-up appointments","Higher bed occupancy, more ED presentations and quicker medical discharge decisions","Fewer readmissions, shorter hospital stays and less follow-up community care"],"key":["Fewer readmissions, shorter hospital stays and less follow-up community care"],"src":"the Discharge Planning deck, slide 8","why":"Effective discharge planning is associated with a decrease in readmission rates, a reduction in length of hospital stay and a reduction in the degree of follow-up community care. Poor planning — poor instruction, inadequate information, poor coordination and communication — leads the other way."},{"id":"qe0b7afbc44","quiz":"a-discharge","sys":"care","pts":1,"q":"Which list gives the Discharge Planning lecture’s four key elements of discharge planning?","qh":"<p>Which list gives the Discharge Planning lecture’s four key elements of discharge planning?</p>","qt":"Which list gives the Discharge Planning lecture’s four key elements of discharge planning?","imgs":[],"type":"mcq","authored":1,"opts":["A confirmed diagnosis, a discharge prescription, transport home and a follow-up appointment with the GP","Collaboration with person and family, efficient communication, interdisciplinary approach, prompt assessment of needs at home","The hospital’s bed status, the acuity of waiting patients, expected length of stay and readmission risk","Informed consent, complete documentation, a verbal handover to the community team and an audit of the written discharge summary"],"key":["Collaboration with person and family, efficient communication, interdisciplinary approach, prompt assessment of needs at home"],"src":"the Discharge Planning deck, slide 10","why":"The four key elements: collaboration with the person and family; efficient communication; an interdisciplinary approach; and prompt assessment of potential interventions needed at home."},{"id":"q497dd8f667","quiz":"a-discharge","sys":"care","pts":1,"q":"How does the Discharge Planning lecture describe the nurse’s role in discharge?","qh":"<p>How does the Discharge Planning lecture describe the nurse’s role in discharge?</p>","qt":"How does the Discharge Planning lecture describe the nurse’s role in discharge?","imgs":[],"type":"mcq","authored":1,"opts":["The decision-maker, who judges from the clinical picture and the bed status when the patient is medically fit to be discharged home","A referrer, whose part in the discharge ends once the referral forms have been sent to the community services","The coordinator or “middle-man”, often the last point of contact, who checks the patient and family understand the plan","A bystander, who hands the whole discharge over to the social worker and needs assessor once the date has been set"],"key":["The coordinator or “middle-man”, often the last point of contact, who checks the patient and family understand the plan"],"src":"the Discharge Planning deck, slides 12 and 14","why":"The nurse coordinates the discharge process — the “middle-man”, often the final point of contact before the patient leaves — and ensures the patient and family understand and agree with the plan and have all the information and tools to transition home or to another facility."},{"id":"qd414bafe5d","quiz":"a-discharge","sys":"care","pts":1,"q":"A nurse has explained the discharge medicines and the patient nods. Why does the Discharge Planning lecture say the nurse should still use teach-back?","qh":"<p>A nurse has explained the discharge medicines and the patient nods. Why does the Discharge Planning lecture say the nurse should still use teach-back?</p>","qt":"A nurse has explained the discharge medicines and the patient nods. Why does the Discharge Planning lecture say the nurse should still use teach-back?","imgs":[],"type":"mcq","authored":1,"opts":["Patients often nod even when confused — stress, pain and fatigue affect recall","Teach-back is a legal requirement that must be documented before any discharge","It replaces the written discharge summary for patients who cannot read English","It tests whether the patient was listening, so the nurse knows who needs a reminder"],"key":["Patients often nod even when confused — stress, pain and fatigue affect recall"],"src":"the Discharge Planning deck, slides 19–20","why":"Teach-back is a safety tool: patients often nod even when confused, and stress, pain, fatigue and health literacy affect recall. Ask–Build–Check, plain words instead of abbreviations, an interpreter or written and visual resources where needed, and a support person present."},{"id":"qebd952d542","quiz":"a-discharge","sys":"care","pts":1,"q":"The Discharge Planning lecture’s discharge process is “A P (& prepare) I E”. What does the added “prepare” refer to?","qh":"<p>The Discharge Planning lecture’s discharge process is “A P (&amp; prepare) I E”. What does the added “prepare” refer to?</p>","qt":"The Discharge Planning lecture’s discharge process is “A P (& prepare) I E”. What does the added “prepare” refer to?","imgs":[],"type":"mcq","authored":1,"opts":["Preparing the bed space and equipment for the next admission to the ward","Preparing the discharge prescription and the medicines to take home","Preparing the ambulance or hospital transport booking for the patient’s journey home","Psychological preparation — feeling mentally and emotionally ready to go home"],"key":["Psychological preparation — feeling mentally and emotionally ready to go home"],"src":"the Discharge Planning deck, slides 11, 38 and 43","why":"Psychological preparation: what will life look like at home, day to day and in the longer term? Does the patient or their caregiver feel confident to continue care? What limitations will they have, and h
