k; compassion fatigue can follow straight after secondary trauma and may interfere with relationships outside work."],"src":"Question and model answer are the tool’s · from Self-care in nursing deck, slides 11 and 13–14"}},{"id":"qa695bd1676","quiz":"w-prof","sys":"prof","pts":3,"q":"Define self-care and resilience, and explain how the two are linked.","qh":"<p>Define self-care and resilience, and explain how the two are linked.</p>","qt":"Define self-care and resilience, and explain how the two are linked.","imgs":[],"type":"essay","authored":1,"saq":{"steps":["Self-care: deliberate actions to take care of all aspects of our health and wellbeing — enjoyable, re-energising and not selfish (and not activities that numb or avoid reality).","Resilience: the ability to adapt positively to stress, cope with difficult situations and recover quickly from difficulties, by learning new ways of thinking and behaving.","Link: self-care builds resilience, and resilience protects nurses from the effects of stress that lead to burnout and compassion fatigue."],"src":"Question and model answer are the tool’s · from Self-care in nursing deck, slides 20, 22 and 25–26"}}],"chains":[],"cases":[],"focus":[{"id":"nursing-process","sys":"care","tier":1,"t":"The nursing process (ADPIE)","flag":"LO1 X","done":"Name the five steps in order and say what happens in each; tell subjective from objective data; recognise a nursing diagnosis (not a medical one) and write one in three parts — problem, related to, as evidenced by; say what makes a goal well written; say what evaluation decides (met / partially met / not met).","ask":"Ten single-best-answer questions at definition level: “which is the first step”, “which is an example of subjective data”, “which is a nursing diagnosis” (Risk for infection), “which is a measurable outcome” (walk 50 metres with assistance within 48 hours). No scenario longer than a line.","cap":"The quiz never asks you to WRITE a diagnosis or a goal — it asks you to recognise a good one. Writing them is the short-answer risk, and the Case Study assessment already made you do it. LO1 is literally “apply the nursing process”, and ADPIE returns in Care Plans, Holistic Assessment and Discharge Planning.","src":"The Nursing Process 2026 deck · Nursing Process quiz","n":12,"all":12,"pts":18,"qz":2,"saq":2,"na":2},{"id":"care-plans","sys":"care","tier":1,"t":"Nursing care plans — diagnosis, SMART goal, interventions, rationale, evaluation","flag":"LO1 X","done":"Say what a care plan is for; pick the correctly prioritised NANDA-I diagnosis for a patient (life-threatening → safety → patient-identified → nurse-identified); spell out SMART; tell a short-term from a long-term goal; tell a nurse-initiated (independent) from a collaborative intervention; say what goes in the evaluation column and the three verdicts.","ask":"One-line patients: fractured ribs → Acute pain; immobile → Risk for Impaired Skin Integrity; “which outcome shows the plan is working” (pain 2/10) or “needs revision” (frequent hypoglycaemia). Plus one piece of trivia — what NANDA stood for before 2002.","cap":"You are not asked to produce a full five-column plan in a multi-choice. Rationale with citations was for the assignment, not the exam. Know the columns and what belongs in each.","src":"Nursing Care Plans 2026 deck · Nursing Care Plans quiz","n":12,"all":12,"pts":18,"qz":2,"saq":2,"na":2},{"id":"hha","sys":"care","tier":1,"t":"Holistic health assessment","flag":"LO1 LO3 X","done":"Define holism; list what each of the four aspects covers — physical, psychological, social (with cultural) and spiritual — and give a question you would ask under each; tell primary from secondary sources and subjective from objective data; know the two physical assessments the lecturers single out (vital signs, falls risk) and the Morse Fall Scale bands (<25 low · 25–45 moderate · >45 high).","ask":"“Which question assesses the PSYCHOLOGICAL aspect”, “which is an open-ended question”, “a family member tells you their mother is in pain — what source is this?” (secondary), “name two physical assessments done in a holistic assessment”.","cap":"The wound mnemonic T.I.M.E. and the Lily scenario are in the deck but nothing in the quiz touches them. It is the first stage of the nursing process — expect it to be asked as that.","src":"Holistic Health Assessment 2026 deck · Holistic Health Assessment quiz","n":12,"all":12,"pts":18,"qz":2,"saq":2,"na":2},{"id":"sdoh","sys":"pop","tier":1,"t":"Social determinants of health, equity and the social gradient","flag":"LO2 X","done":"Define the social determinants; take any one — housing, food environment, work, education, transport, early childhood, stress, addiction, social exclusion — and say HOW it changes health; separate equity from equality and inequality from inequity; explain the social gradient; say why Te Tiriti makes equity an obligation.","ask":"“How does [stress / work / food / social exclusion / addiction] function as a determinant?” — the right answer is always the full causal sentence, the wrong ones are partial or blame the individual. Two straight equity questions and one on Te Tiriti. 14 questions: the biggest lecturer block in the bank.","cap":"No statistics are asked — not the 50% figure, not the disability numbers. The Rio Declaration is on a slide and nowhere in the quiz. LO2 is this lecture almost word for word, and equity-vs-equality comes back in Population Health, the Health Strategy and Community Needs Assessment.","src":"Social Determinants of Health deck · Social Determinants of Health quiz","n":16,"all":16,"pts":20,"qz":2,"saq":2,"na":2},{"id":"pop-health","sys":"pop","tier":1,"t":"Population health, the five Te Tiriti principles and PROGRESS","flag":"LO1 LO2 X","done":"Tell population health from personal health and give a nursing intervention at each level; name public-health measures and what each is for (smokefree, water quality, vaccination, emergency planning); name the five Tribunal principles — tino rangatiratanga, mana taurite, whakamarumarutia, kōwhiringa, pātuitanga — with a nursing meaning for each; spell out PROGRESS.","ask":"The quiz stays on the population/personal distinction and on everyday public health — “why is water quality relevant”, “the objective of smokefree environments” — plus one recall item (whooping cough = pertussis).","cap":"The lecturers’ quiz asks NOTHING on the five principles or PROGRESS, yet the deck spends a third of its slides on them and says outright never to use the “three Ps”. That gap is why they are in the tool’s written section. The five principles return in Community Needs Assessment and Tikanga — learn them once, here.","src":"Population Health vs Personal Health deck · Population Health quiz","n":13,"all":13,"pts":22,"qz":2,"saq":3,"na":3},{"id":"ebp","sys":"prof","tier":1,"t":"Evidence-based practice and nurse inquiry","flag":"LO3","done":"Define EBP as three things integrated — best research evidence, clinical expertise, patient values and preferences; give the five steps in order (question → find → appraise → implement → evaluate); rank the levels of evidence (systematic review at the top, expert opinion at the bottom); name a database (Cochrane, CINAHL, JBI); say what nurse inquiry is.","ask":"“Primary goal of EBP” (improve patient outcomes), “first step” (formulate a clinical question), “highest level of evidence” (systematic reviews), “which database”, “what is clinical expertise”. Two keys are “All of these”.","cap":"Gibbs and Kolb are pictured in the deck and never asked. No research-methods detail (RCT design, qualitative vs quantitative) is tested beyond the pyramid. LO3 opens with “discuss evidence-based practice”, which is why this small quiz sits in tier 1.","src":"Evidence-based Practice 2026 deck · Evidence-based Practice quiz","n":11,"all":11,"pts":17,"qz":2,"saq":2,"na":2},{"id":"documentation","sys":"care","tier":1,"t":"Clinical documentation, ISBAR and SOAP","flag":"LO4 X","done":"Give the three reasons nurses document (legal, professional, communication); state the rules — black or blue pen, 24-hour time, sign with designation, no gaps, correct an error with ONE line plus “error” and initials, retrospective entries marked as such; say who owns the notes (the organisation); place a statement under the right ISBAR letter; say what each SOAP/SOAPIER letter stands for; give AI²DET.","ask":"Rule-recall: “what colour pen”, “why no gaps”, “who owns the notes”, “what do you do if you make a mistake”, “what is the P in SOAP”, and one applied item — which statement is the A in ISBAR (“temperature 39.3 and she is confused”). One on terminology: write cyanosis, not “blue lips”.","cap":"Abbreviation lists are in the deck; the quiz asks none. The legislation slide (HPCAA, HDC Act, Privacy Act) is not tested here — it is tested in the Knowledge Check and Informed Consent. ISBAR returns in Roles of Nurses with the same letters.","src":"Clinical Documentation 2026 deck · Clinical Documentation quiz","n":13,"all":13,"pts":19,"qz":2,"saq":3,"na":3},{"id":"health-literacy","sys":"clin","tier":1,"t":"Health literacy and patient education — Ask · Build · Check, teach-back","flag":"LO4 X","done":"Define health literacy at both levels (personal and organisational) and say it is not intelligence; give the consequences of low health literacy; run Ask–Build–Check on a patient and say what an “Ask” question sounds like; explain teach-back; adapt teaching to a child (play therapy) and to an adult; list practical steps — plain language, 3–5 key points, demonstrate, interpreter.","ask":"Half the quiz is small scenarios with the same right answer in different clothes: plain language + visual aids, demonstrate and have them show you, teach-back to confirm. One asks for an example of step A (“what do you already know about…?”), one on a six-year-old and an IV line (play therapy).","cap":"The Kōrero Mārama survey findings and the NZ framework’s three levels are on slides and not asked. Teach-back comes back in Discharge Planning and Tikanga as the same idea — one thing to learn, three places it scores.","src":"Health Literacy & Patient Education 2026 deck · Health Literacy quiz","n":11,"all":11,"pts":13,"qz":2,"saq":1,"na":1},{"id":"vitals","sys":"clin","tier":2,"t":"Vital signs, the primary survey and the Early Warning Score","flag":"LO3","done":"Run A–E and say what is assessed under each; give the normal adult ranges (SpO₂ 95–100%, BP 110–140 / 60–90, temperature 36.5–37.5 °C) and the named alterations — tachy/bradypnoea, tachy/bradycardia, hypo/hypertension, pyrexia >38, hypothermia <35; AVPU; signs of respiratory distress; the first Korotkoff sound; when to count for a full minute; what the EWS is for and what triggers escalation.","ask":"Terminology and ranges: “RR of 32 is called…”, “temperature below 35 is…”, “normal SpO₂”, “what does A in AVPU stand for”, “first Korotkoff sound represents…”, “irregular pulse — what do you do”. Three keys are “All of these”.","cap":"You already passed the practical. The exam side is words and numbers, not technique. The exact EWS scoring bands are not asked — only its purpose.","src":"Vital Signs 2026 deck · Vital Signs quiz","n":13,"all":13,"pts":22,"qz":2,"saq":3,"na":3},{"id":"ipc","sys":"clin","tier":2,"t":"Infection prevention and control","flag":"LO3","done":"Define an HAI (appears 48 hours or more after admission) and name the common four; give the six links of the chain of infection in order; define standard precautions and list them; match a condition to contact, droplet or airborne precautions and the PPE each needs; give the donning order; say why hand hygiene comes first.","ask":"Match-the-precaution vignettes — diarrhoea → contact; a child with vesicles, suspected chickenpox → airborne; “what PPE for droplet” — plus “most effective method” (hand hygiene), the donning order, and two “All of these”.","cap":"Spaulding’s classification, sterilisation methods and the named organisms are in the deck and absent from the quiz. Doffing order is on a slide; only DONNING is asked.","src":"Infection Prevention & Control 2026 deck · IPC quiz","n":13,"all":13,"pts":23,"qz":2,"saq":3,"na":3},{"id":"diabetes","sys":"clin","tier":2,"t":"Diabetes mellitus — type 1 vs type 2, hypo- and hyperglycaemia, DKA","flag":"LO3","done":"Say what insulin does and where it is made; contrast type 1 (auto-immune, no insulin, usually young) with type 2 (resistance, lifestyle and genetics, 90–95%); give the normal blood glucose (4–7.5 mmol/L), the hypo line (<4) and its causes and symptoms; recognise DKA from a vignette — high glucose, ketones, vomiting, abdominal pain; list risk factors and long-term complications.","ask":"Eight plain recall questions: a common symptom (frequent urination), the hormone, which type in children, the normal fasting range, the cause of type 1 — and one vignette (glucose 30, ketones, vomiting → DKA). Two keys are “All of these”.","cap":"Treatment of hyperglycaemia step by step, HbA1c detail and the annual-check list are slides the quiz ignores. This is the only disease-specific lecture with a quiz — Long-term Conditions (9 Oct) may widen it.","src":"Diabetes Mellitus deck · Diabetes quiz","n":10,"all":10,"pts":16,"qz":2,"saq":2,"na":2},{"id":"demo-epi","sys":"pop","tier":2,"t":"Demography, epidemiology and the levels of prevention","flag":"LO2","done":"Define demography and epidemiology and say why a nurse needs each; give the five processes demographers study; tell observational from experimental studies; draw the epidemiological triangle and break it at each corner; define epidemic and endemic; place any example at primordial, primary, secondary or tertiary prevention.","ask":"Definitions first (“what is demography”, “which best describes epidemiology”), then prevention levels by example — preventing risk factors → primordial; an insulin regime for someone with diabetes → tertiary; preventing disease occurring → primary. One key term (incidence rate).","cap":"None of the New Zealand figures (fertility 1.83, life expectancy, the 90+ projections) is asked. The Prevent / Screen / Treat hooks from the deck are all the quiz needs.","src":"Demography & Epidemiology deck · Epidemiology & Demography quiz","n":14,"all":14,"pts":22,"qz":2,"saq":4,"na":4},{"id":"consent","sys":"prof","tier":2,"t":"Informed consent","flag":"LO1 LO4","done":"Define informed consent as a process; name its two legal roots (the Code of Rights, Right 7 · the NZ Bill of Rights Act, s 11); list what a patient must be told; say who can consent — 16 and over, a parent or guardian under 16, an EPOA or legal guardian for someone not competent; handle the three hard cases — emergency, surgery extended under anaesthetic, a patient under the Mental Health Act; give the nurse’s role (advocate, interpreter, call the team back, witness).","ask":"Short scenarios: limited English → professional interpreter; changes their mind mid-transfusion → stop and notify; dementia, not competent → legal guardian. Plus the age (16), who obtains consent (the person doing the procedure) and Gillick competence (true/false).","cap":"Gillick competence is asked in the quiz and is NOT on any slide in the deck — it is the one place the quiz reaches past the lecture, so read a paragraph on it. The NZNO duty-of-care slide is not tested.","src":"Informed consent 2026 deck · Informed Consent quiz","n":12,"all":12,"pts":21,"qz":2,"saq":4,"na":4},{"id":"pain","sys":"care","tier":2,"t":"Pain assessment — OLDCARTS, types of pain, pain scales","flag":"LO3 noquiz","done":"Give McCaffery’s definition and what it means for assessment; separate nociceptive (somatic, visceral) from neuropathic pain by cause and by the words a patient uses; separate acute from chronic; list behavioural and physiological responses; run OLDCARTS letter by letter; choose a scale for the patient in front of you (numeric, Wong-Baker FACES, FLACC); say when pain is assessed.","ask":"Nobody knows — the lecturers have set no question on this lecture. The tool’s questions copy the shape of the quizzed lectures: definitions, “which type of pain is this” from a one-line description, and which letter of OLDCARTS a statement belongs under.","cap":"The second half of the deck — analgesic ladder, NSAIDs, opioids, routes — is pharmacology and belongs to the Pharm paper; the tool wrote nothing from it. The practice handout’s scenarios are the best rehearsal for a short answer.","src":"Pain Assessment BN2 deck + the Pain Assessment Practice Handout","n":12,"all":12,"pts":20,"qz":1,"saq":3,"na":12},{"id":"discharge","sys":"care","tier":2,"t":"Discharge planning","flag":"LO1 noquiz X","done":"Define discharge planning and say when it starts (at admission); give the four key elements; give the nurse’s role as coordinator; walk A–P–(prepare)–I–E for a patient; list what a written discharge summary contains; say why teach-back is a safety tool; work the Cyril Lear scenario — medicines, wound and District Nurse, mobility and falls, support at home.","ask":"Nobody knows — no lecturer question exists. The Cyril Lear scenario in the deck is the closest thing to a ready-made short answer in the whole course.","cap":"The bed-pressure slides (red days, acuity) are context, not content. Discharge planning is also one slide of Holistic Health Assessment, where it is said the same way.","src":"Discharge Planning Lecture deck","n":10,"all":10,"pts":18,"qz":1,"saq":3,"na":10},{"id":"fcc","sys":"care","tier":2,"t":"Family-centred care and Whānau Ora","flag":"LO1 noquiz","done":"Give the Stats NZ definition of family beside the nursing one (whoever the person says); name the four shared functions of families; give the three elements of facilitating family-centred care with an action each; say what a genogram and ecomap are for; state what may be shared with family under the Health Information Privacy Code; define family violence; describe Whānau Ora — who, when, how it is funded, what it does.","ask":"Nobody knows — no lecturer question exists. The deck ends on a Menti “recap and quiz” that was run live and not posted.","cap":"The history-of-the-family slides are scene-setting. Health Strategy Priority 1 appears here too — it is counted under the Health Strategy row.","src":"Family Centred Care deck","n":10,"all":10,"pts":14,"qz":1,"saq":2,"na":10},{"id":"cna","sys":"pop","tier":2,"t":"Community needs assessment — McMurray’s framework","flag":"LO1 LO2 noquiz X","done":"Give the four steps in order — Engage, Map, Analyse, Empower — and what the nurse does in each; say who key community members are; tell primary from secondary data and place a windscreen survey; fill a SWOT grid and say which halves help and harm; apply a Te Tiriti principle to a finding.","ask":"Nobody knows — no lecturer question exists. You have already been assessed on this once: it is the framework behind the Community Profile presentation, and the lecture notes say ANALYSE is the step students skip.","cap":"The eight aspects of the community profile belong to the assignment brief, not the exam. The five Te Tiriti principles here are the same five as in Population Health.","src":"Community Needs Assessment Framework deck","n":10,"all":10,"pts":18,"qz":1,"saq":3,"na":10},{"id":"tikanga","sys":"prof","tier":2,"t":"Tikanga best practice and Kawa Whakaruruhau (cultural safety)","flag":"LO1 LO4 noquiz X","done":"Define cultural safety and say who decides whether care was safe (the recipient); say why awareness, sensitivity and competence are not enough; define kawa, tikanga, tapu and noa; name the parts of the body that are tapu; give the principles of tikanga best practice with an action each — whakawhanaungatanga, manaakitanga, whānau-centred care, respect for tikanga and taonga, shared decision-making.","ask":"Nobody knows — no lecturer question exists. Several of the deck’s slides are pictures with no text, so the tool’s questions come only from the slides that carry words.","cap":"A short deck (23 slides). Cultural safety is also a Nursing Council pou and turns up in the Pharm paper’s legal lecture — same definition.","src":"Tikanga Best Practice and Kawa Whakaruruhau deck","n":10,"all":10,"pts":16,"qz":1,"saq":3,"na":10},{"id":"nzhs","sys":"pop","tier":2,"t":"New Zealand Health Strategy 2023 and Pae Ora","flag":"LO2 noquiz X","done":"Say what the Pae Ora (Healthy Futures) Act 2022 changed; give the strategy’s two long-term goals; list the six priority areas and recognise any one from its description; separate equity from equality; name the partner strategies (Pae Tū, Te Mana Ola…); give the three priorities of the Government Policy Statement 2024–27 — access, timeliness, quality; say what equity in action looks like for a nurse.","ask":"Nobody knows — no lecturer question exists. The deck’s own learning outcomes are a list of things to “identify and describe” — 2 goals, 6 priorities — which is exactly how a short answer would be worded.","cap":"The politics of the Māori Health Authority’s disestablishment is context. The associated-strategies slides are a list nobody could be asked to reproduce.","src":"New Zealand Health Strategy 2023 deck","n":11,"all":11,"pts":20,"qz":1,"saq":3,"na":11},{"id":"tus","sys":"prof","tier":2,"t":"Therapeutic use of self — communication and emotional intelligence","flag":"LO4 noquiz","done":"Say what professional agency is for; name Watson’s theory and its idea of a caring moment; separate responsive from assertive communication with an example; list verbal and non-verbal elements and barriers; name the five components of emotional intelligence; separate surface acting from deep acting and place both under self-regulation.","ask":"Nobody knows — no lecturer question exists. The deck’s role-plays (the frightened patient, the refused medication, the angry patient at the end of a shift) are scenario stems waiting to be used.","cap":"Watson’s ten carative factors are a picture on one slide — not reproducible, so not written into a question.","src":"Therapeutic Use of Self BN2 deck","n":11,"all":11,"pts":19,"qz":1,"saq":3,"na":11},{"id":"rheumatic-fever","sys":"clin","tier":2,"t":"Rheumatic fever","flag":"noquiz","done":"Nothing can be listed yet: the lecture was taught, but as of the 19 Sep harvest there is no deck on Canvas and no quiz. If you have your own notes from it, they are the only source there is.","ask":"Unknown.","cap":"This row exists so that ticking every other row is not mistaken for covering the course. Check Canvas for the deck; when it appears the tool’s questions get written from it.","src":"No material on Canvas as of 19 Sep 2026","n":0,"all":0,"pts":0,"qz":0,"saq":0,"na":0},{"id":"ltc","sys":"clin","tier":2,"t":"Long-term conditions","flag":"untaught","done":"Not taught yet — Fri 9 Oct, 2:30 pm, room 301 (moved from 7 Oct).","ask":"Unknown until the lecture and any quiz are posted.","cap":"Sits straight on top of Diabetes and Health Literacy (self-management), so those two rows are the preparation.","src":"Canvas timetable","n":0,"all":0,"pts":0,"qz":0,"saq":0,"na":0},{"id":"phc","sys":"pop","tier":2,"t":"Primary health care and health promotion","flag":"untaught","done":"Not taught yet — Wed 14 Oct.","ask":"Unknown until the lecture and any quiz are posted.","cap":"The levels of prevention (Demography & Epidemiology) and the primary-care section of Roles of Nurses are the groundwork already in this bank.","src":"Canvas timetable","n":0,"all":0,"pts":0,"qz":0,"saq":0,"na":0},{"id":"screening","sys":"prof","tier":2,"t":"Health screening and the Standards of Competence","flag":"untaught","done":"Not taught yet — Tue 20 Oct.","ask":"Unknown until the lecture and any quiz are posted.","cap":"Secondary prevention = screening (already in Demography & Epidemiology). The Nursing Council Standards of Competence (2025, six pou) are on Canvas now as a PDF.","src":"Canvas timetable","n":0,"all":0,"pts":0,"qz":0,"saq":0,"na":0},{"id":"self-care","sys":"prof","tier":3,"t":"Self-care, burnout and resilience","flag":"","done":"Define stress, burnout, compassion fatigue, self-care and resilience; give two differences between burnout and compassion fatigue; name a physical and an emotional self-care activity; say who a struggling student turns to first (their preceptor).","ask":"Common-sense single answers — regular exercise, journalling, 7–9 hours’ sleep, prioritise with a schedule, “all of these” for the signs of burnout.","cap":"The quiz can be passed on general knowledge; only the burnout / compassion-fatigue distinction needs the deck. Eight marks, no learning outcome names it.","src":"Self-care in nursing deck · Self-care quiz","n":10,"all":10,"pts":15,"qz":2,"saq":2,"na":2},{"id":"roles","sys":"prof","tier":3,"t":"Roles of nurses — aged care, primary, acute, mental health, informatics","flag":"noquiz X","done":"Define multi-morbidity, primary healthcare and acute care; name the three residential levels of aged care; say what recovery means in mental health and what interpersonal theory puts at the centre; run ISBAR; give an example of nursing informatics.","ask":"Nobody knows — no lecturer question exists. The deck is mostly videos and “a day in the life” timetables.","cap":"A survey lecture: a definition from each of five settings is as deep as it can go. ISBAR is the part that scores elsewhere (Clinical Documentation).","src":"Roles of Nurses deck","n":11,"all":11,"pts":19,"qz":1,"saq":3,"na":11},{"id":"knowledge-check","sys":"prof","tier":3,"t":"Professional conduct basics (the orientation Knowledge Check)","flag":"","done":"Match Code of Conduct principles to their numbers (1 = dignity and individuality, 8 = public trust); name the NZNO social media guideline and the NCNZ Professional Boundaries guideline; state whose health information you may open on placement (only your own patients’).","ask":"“Which principle is this?” and “which guideline says this?” — six questions. The other ten in that quiz are about being a student here (attendance, extensions, plagiarism, online-exam rules) and are never dealt into a mock, so they are not counted on this row.","cap":"It sits in the orientation module, not the lecture series. The Code of Conduct’s eight principles are the only part with a life beyond this quiz — they return in the Pharm paper.","src":"Knowledge Check quiz (orientation module)","n":6,"all":6,"pts":6,"qz":1,"saq":0,"na":0}],"helpline":{},"held":[],"meta":{"id":"inp-final","prefix":"inpf.","title":"INP · Paper Sim — Final exam","h1":"INP · Paper Sim","short":"INP Paper Sim","paper":"Introduction to Nursing Practice","bankOf":"the INP lecturers’","who":"the INP lecturers","aiCtx":"I’m a first-year nursing student in New Zealand sitting the final exam for Introduction to Nursing Practice (60 multiple-choice + 10 short-answer questions).","sitting":{"what":"the INP final","date":"2026-11-04","when":"Wed 4 Nov · 1:00–3:40 pm (room opens 12:30)","cohortClose":null},"shape":{"closed":60,"saq":10,"minutes":160,"mini":12},"shapeNote":"The real paper is <b>160 minutes for 60 multi-choice + 10 short answers</b>, and a full mock here has that shape. The multi-choice are dealt mostly from the lecturers’ Canvas quizzes, plus some this tool wrote for lectures that have no quiz. <b>All ten short answers are this tool’s</b>, written from the lecture decks — Canvas has no written questions. The marks per short answer have not been published; here each is worth 2–6, one mark per point in its model answer.","sys":{"care":"Nursing process & assessment","clin":"Clinical knowledge","pop":"Population health & equity","prof":"Professional & legal"},"sysShort":{"care":"Process","clin":"Clinical","pop":"Population","prof":"Professional"},"hue":{"care":28,"clin":158,"pop":268,"prof":210},"playlist":null,"refLbl":{"slide":"Their slide","her":"Their notes","course":"Course file","patton":"Textbook"},"help":{"what":"Every practice quiz posted on Canvas for <b>Introduction to Nursing Practice</b>, unlocked: sit them as often as you like, marked instantly — or let the tool deal you mixed mock papers from the whole bank. The final is <b>Wed 4 Nov 2026 · 1:00–3:40 pm (160 min) · 60 multi-choice + 10 short-answer · 50% of the paper</b> (course syllabus and Canvas timetable).","groups":"The four groups (Process · Clinical · Population · Professional) are <b>this tool’s sorting</b> of the 15 quizzes, so a mock can be dealt in proportion and you can drill one area. The course itself runs by week, not by theme. One quiz = one lecture topic.","held":"<b>The lecturers’ quizzes cover 14 of the course’s 26 lectures.</b> Eight taught lectures with <b>no Canvas quiz</b> — Community Needs Assessment, Tikanga &amp; Kawa Whakaruruhau, Pain Assessment, Family-centred Care, NZ Health Strategy, Discharge Planning, Therapeutic Use of Self, Roles of Nurses — now have questions <b>written by this tool from their lecture decks</b> (the rows ending “the tool’s questions”), each naming its slide. They are a careful reading of the deck, not the lecturers’ wording. <b>Still not covered:</b> Rheumatic Fever (no deck on Canvas yet) and three lectures still to come after the break — Long-term Conditions (Fri 9 Oct), Primary Health Care &amp; Health Promotion (14 Oct), Health Screening &amp; Standards of Competence (20 Oct). All four are examinable and this bank cannot see them yet.","authored":"<b>Every row ending “the tool’s questions” was written by this tool, not the lecturers</b>: multi-choice and short-answer questions for the eight taught lectures that have no Canvas quiz, and a short-answer section for the quizzed topics — because the real paper has ten short answers and Canvas has none. Each one is labelled as the tool’s and names the deck and slide it was written from. Marks per short answer are the tool’s (one per point in the model answer); the course has not published them. "},"focusCopy":{"intro":"One row per lecture — all 26, plus the orientation Knowledge Check. Open a row for what you must be /* META is everything that makes this sim one paper rather than another — names, the

const META = DATA.meta;
const FC = META.focusCopy || {};

   her slide, her prose, Patton. A bank built with the older single q.ref still renders. */

const LS = k => { try { return JSON.parse(localStorage.getItem(META.prefix+k)) } catch(e){ return null } };
const SV = (k,v) => { try { localStorage.setItem(META.prefix+k, JSON.stringify(v)) } catch(e){} };

  scores: LS('scores')||[],   // {t, mode, got, tot, label}
  miss:   LS('miss')  ||{},   // qid -> wrong count
  seen:   LS('seen')  ||{},   // qid -> sittings
  mastery:LS('mastery')||{}, // focus topic id -> 1 when he can do it
  n:      LS('n')||12,       // how many a Learn deal hands out: 12 | 25 | 50 | 100 | 'all'
  pick:   LS('pick')||[],    // quiz ids ticked under Pick my rep, in tick order
};
if(![12,25,50,100,'all'].includes(S.n)) S.n = 12;
S.pick = (Array.isArray(S.pick)?S.pick:[]).filter(id=>DATA.quizzes.some(z=>z.id===id));
/* The sitting date is PER VIEWER: META.sitting.date is the default, and anyone with an
   extension or a different slot taps the countdown and sets their own, kept in their own
   browser. META.sitting.cohortClose (optional) is named in the prompt when it differs. */
const COHORT_CLOSE = META.sitting.cohortClose || null;
const DEFAULT_SITTING = META.sitting.date;
const sittingISO = () => LS('testday') || DEFAULT_SITTING;
const TESTDAY = () => new Date(sittingISO() + 'T12:00:00+12:00');
const daysLeft = () => Math.max(0, Math.ceil((TESTDAY() - Date.now())/864e5));
const sittingLabel = () => new Date(sittingISO() + 'T12:00:00+12:00')
  .toLocaleDateString('en-NZ', { day: 'numeric', month: 'short' });
function askSitting(){
  const cur = sittingISO();
  const v = prompt('When do you sit ' + META.sitting.what + '?  (YYYY-MM-DD)\n\n'
    + (COHORT_CLOSE ? 'The cohort window closes ' + COHORT_CLOSE + '. ' : '')
    + 'Set your own date if you have an extension or a different slot.', cur);
  if(!v) return;
  const t = v.trim();

    alert('Use the form YYYY-MM-DD, e.g. ' + DEFAULT_SITTING + '.'); return;
  }
  SV('testday', t); paintCountdown();
  if(document.querySelector('#fhead')) home();
}
function paintCountdown(){
  const el = $('#countdown'); if(!el) return;

  el.title = 'Your sitting is ' + sittingISO() + (COHORT_CLOSE ? '. The cohort window closes ' + COHORT_CLOSE : '')
           + '. Click to change yours — it is saved in this browser only.';

const $ = s => document.querySelector(s);
const esc = s => String(s??'').replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const shuffle = a => { a=a.slice(); for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]} return a };
const SYS = META.sys;

/* ── dealing ───────────────────────────────────────────────────────── */
const CLOSED = DATA.questions.filter(q=>!q.saq);
/* a question flagged nm stays in the bank (Learn, Pick my rep) but is never dealt into a
   MOCK paper — course-admin questions that are not exam material (sim.config.mjs NO_MOCK) */
const MOCKABLE = CLOSED.filter(q=>!q.nm);
const ESSAYS = DATA.questions.filter(q=>q.saq);
const MOCK_ESSAYS = ESSAYS.filter(q=>!q.nm);   // written questions a mock may deal (authored noMock stays out)
function pickN(pool, n, excl){
  const fresh = pool.filter(q=>!excl.has(q.id));
  /* Least-seen first: rank = times dealt, so nothing repeats an (n+1)th time
     until the whole pool has been dealt n times. Misses jump the queue (-2),
     Math.random() only breaks ties among equally-seen questions. */
  const rank = q => (S.miss[q.id]?-2:0) + (S.seen[q.id]||0) + Math.random();
  return fresh.sort((a,b)=>rank(a)-rank(b)).slice(0,n);
}
function dealStratified(n, pool=MOCKABLE){
  const out=[], excl=new Set();
  /* shares are DERIVED from the bank — her revealed question distribution —
     never typed. Announced emphasis does not get a vote. */
  const share = {};
  for(const q of pool) share[q.sys]=(share[q.sys]||0)+1/pool.length;
  for(const sys of Object.keys(share)){
    const want=Math.round(n*(share[sys]||0));
    for(const q of pickN(pool.filter(x=>x.sys===sys), want, excl)){ out.push(q); excl.add(q.id); }
  }
  while(out.length<n){
    const q=pickN(pool, 1, excl)[0]; if(!q)break; out.push(q); excl.add(q.id);
  }
  return shuffle(out).slice(0,n);
}
/* How many a Learn deal hands out is HIS call (the chips on the Learn door), saved in this
   browser. 'all' is the whole pool, least-seen first — so a run that stops halfway and is
   dealt again leads with the questions it never reached. A mock test keeps its own size. */
const NOPTS = [12,25,50,100,'all'];
const CAP = () => S.n==='all' ? Infinity : S.n;
const howMany = pool => Math.min(CAP(), pool);
function dealMini(n=META.shape.mini||12, pool=MOCKABLE){ return dealStratified(n, pool) }
function dealSys(s,n){ return shuffle(pickN(CLOSED.filter(q=>q.sys===s), n, new Set())) }
/* the full mock is the REAL paper's shape (META.shape): that many closed questions, then
   the written section — one case-study question per case pack, rotating with each full
   sitting, and the rest from the written questions, least-seen first. A bank with fewer
   written questions than the paper has deals what it has; the home screen says so. */
function dealFull(){
  const closed = dealStratified(META.shape.closed);
  const nth = S.scores.filter(s=>s.mode==='full').length;
  if(META.shape.saqMarks){
    /* the paper publishes marks, not a count: deal least-seen written questions, spread
       across the groups, until their marks reach the total (never past it by a whole question) */
    const out=[]; let m=0; const used=new Set();
    const ranked=pickN(MOCK_ESSAYS, MOCK_ESSAYS.length, new Set());
    for(let pass=0; pass<2 && m<META.shape.saqMarks; pass++) for(const q of ranked){
      if(used.has(q.id)||m+q.pts>META.shape.saqMarks) continue;
      if(!pass && out.some(x=>x.quiz===q.quiz)) continue;      // first pass: one per topic
      out.push(q); used.add(q.id); m+=q.pts; if(m>=META.shape.saqMarks) break; }
    return closed.concat(shuffle(out));
  }
  const saqs = (DATA.cases||[]).slice(0, META.shape.saq).map(c=>mkCaseQ(c, c.questions[nth % c.questions.length]));
  const rest = Math.max(0, META.shape.saq - saqs.length);
  return closed.concat(saqs, shuffle(pickN(MOCK_ESSAYS, rest, new Set())));
}
function mkCaseQ(c, cq){
  return { id:'case-'+c.id+'-'+cq.q.slice(0,24).replace(/\W/g,''), quiz:'case:'+c.id, sys:c.sys, type:'essay',
    pts:cq.marks, q:cq.q, imgs:[], saq:{steps:cq.steps, src:c.name+' — model answer is the tool’s'},
    scenario: c.scenario };
}
const FULL_SAQ = () => Math.min(META.shape.saq||0, (DATA.cases||[]).length + MOCK_ESSAYS.length);
/* the misses pile, worst first: once four or more have been missed twice, only those */
function missPool(){
  let ids = Object.keys(S.miss).filter(id=>S.miss[id]>=2);
  if(ids.length<4) ids = Object.keys(S.miss);
  return CLOSED.filter(q=>ids.includes(q.id));
}
function dealMisses(n=12){ return shuffle(missPool()).slice(0,n) }
/* the ticked quizzes, whole (written questions included), in the order the list shows
   them — one run, no cap: you chose the quizzes, you get their questions */
function dealPick(){
  const on = new Set(S.pick);
  return DATA.quizzes.filter(z=>on.has(z.id)).flatMap(z=>DATA.questions.filter(q=>q.quiz===z.id));
}

let SIT=null;

   never timed, never on the score chart (see the learn-mode block below) */
/* a Learn run is saved as it goes (deck ids + every mark), so a phone that drops the tab

function saveRun(){

function start(mode,learn=false){
  let deck,label,timed=false;
  if(learn){const r=LS('resume');
    if(r&&r.ids&&r.ids.length&&!confirm(`You have a Learn run waiting (Q${Math.min((r.i|0)+1,r.ids.length)} of ${r.ids.length} · ${r.label}). Drop it and start this one?`))return}
  if(mode==='mini'){
    if(learn){deck=dealMini(howMany(CLOSED.length),CLOSED);label=deck.length===CLOSED.length?'the whole bank':`${deck.length} from the bank`}
    else{deck=dealMini();label='mini mock'}}

  else if(mode==='miss'){deck=dealMisses(learn?CAP():12);label=learn?'my misses':'redo misses'}

    label=k===1?(DATA.quizzes.find(z=>z.id===S.pick[0])||{}).name||'1 quiz':`${k} quizzes · ${deck.length} Q`}
  else if(mode.startsWith('quiz:')){const z=DATA.quizzes.find(x=>x.id===mode.slice(5));
    deck=DATA.questions.filter(q=>q.quiz===z.id);label=z.name}
  else if(mode.startsWith('sys:')){const s=mode.slice(4), pool=CLOSED.filter(q=>q.sys===s).length;

  enterSit(learn?'learn':'mock');

  if(mode==='mini'&&DATA.chains.length){warmup();return}
  renderQ();
}

  } else if(q.type==='match'){

      <select data-i="${i}"><option value="">— choose —</option>

  } else if(q.type==='essay'){

      ${q.authored&&DATA.stats.nAuthored<DATA.stats.n?`<div class="note">This question was written by this tool from the lecture decks — it is not one the lecturers set. It is here because the real paper has a written section and the Canvas quizzes have none.</div>`:''}

    <div class="qhead"><span class="n">Q${SIT.i+1}/${SIT.deck.length}</span>
      <span class="tag ${q.sys}">${esc(sysTag(q.sys))}</span><span class="tag">${q.pts} mk</span>${q.authored&&DATA.stats.nAuthored<DATA.stats.n?'<span class="tag authored" title="written by this tool from the lecture decks — not one the lecturers set">tool’s question</span>':''}${SIT.learn?'<span class="tag" style="color:var(--ok)">learn</span>':''}

      <button class="btn ghost" id="exitB" title="${SIT.learn?'stop learning':'abandon mock test'}" style="padding:2px 10px">✕</button></div>

    <div class="pips">${SIT.deck.map((_,i)=>{const id=SIT.deck[i].id,c=SIT.learn&&SIT.chk[id];

function shuffleStable(seed,arr){
  let h=0;for(const c of String(seed))h=(h*31+c.charCodeAt(0))>>>0;
  return arr.map((v,i)=>({v,k:(h=(h*1103515245+12345)>>>0)})).sort((a,b)=>a.k-b.k).map(x=>x.v);
}
function saveAns(){
  const q=SIT.deck[SIT.i];
  if(q.type==='essay'){const t=document.querySelector('[data-essay]');if(t&&t.value.trim())SIT.ans[q.id]={text:t.value};return}
  if(q.type==='match'||q.type==='cloze'){
    const pick={};let any=false;
    document.querySelectorAll('[data-i]').forEach(el=>{if(el.value){pick[el.dataset.i]=el.value;any=true}});
    if(any)SIT.ans[q.id]={pick};return}
  const sel=[...document.querySelectorAll('.opt input:checked')].map(i=>+i.value);
  if(sel.length)SIT.ans[q.id]={sel};
}
/* ── learn mode ────────────────────────────────────────────────────────

   the answer, her slide and the matched video sit right under it — the results
   accordion brought forward to the moment you still care. Slide and video can be
   opened BEFORE answering; that counts as a peek, and a right answer after a peek
   does not clear a miss. Check with nothing picked = "show me" = a miss. Learn
   sittings feed the misses pile and the least-seen dealer, never the score chart. */
function learnChipsHTML(q){
  const chips=[];
  if(q.vid)chips.push(`<button class="qa" data-act="vid">▶ Video · from ${mmss(Number.isInteger(q.vid.at)?q.vid.at:0)}</button>`);
  for(const r of q.refs)chips.push(`<button class="qa" data-act="${r.k}">${REF[r.k].ic} ${REF[r.k].lbl}${r.k==='patton'?' p. '+r.pp:''}</button>`);
  if(hasHer(q))chips.push('<button class="qa" data-act="hl">✅ Her worked answer</button>');
  const hint=chips.length?(SIT.chk[q.id]?'':'<span class="hint">open before or after you answer</span>')
    :`<span class="hint">${NOREF_HINT}</span>`;
  return `<div class="lres" data-qid="${q.id}">${chips.join('')}${hint}<div class="qr-pane" hidden></div></div>`;
}
/* resources open by themselves for: written questions, skipped ones, anything not fully right */
const learnOpen=(q,chk)=>!chk.r||!SIT.ans[q.id]||chk.r.got<chk.r.tot;
function learnCheck(){
  saveAns();
  const q=SIT.deck[SIT.i], a=SIT.ans[q.id];
  const r=markQ(q,a), peeked=!!SIT.peek[q.id];
  SIT.chk[q.id]={r,peeked,ticks:[]};
  S.seen[q.id]=(S.seen[q.id]||0)+1;
  if(r){ if(!a||r.got<r.tot)S.miss[q.id]=(S.miss[q.id]||0)+1; else if(!peeked&&S.miss[q.id])delete S.miss[q.id]; }
  SV('miss',S.miss);SV('seen',S.seen);

function saveLearnSaq(){

function learnMkHTML(q,chk){

  else if(!a){verdict='Skipped — read this one';cls='wrong'}
  else if(r.got>=r.tot){verdict=chk.peeked?'✓ Right (after a peek)':'✓ Right';cls='right'}
  else if(r.got>0){verdict=`Partly right · ${+r.got.toFixed(1)}/${r.tot}`;cls='wrong'}
  else{verdict='✗ Not quite';cls='wrong'}

    ? `${a&&a.text?'':'<div class="you">— nothing written — read the model, then say it out loud</div>'}<div class="steps">${q.saq.steps.map((s,i)=>`<label><input type="checkbox" data-lsaq ${chk.ticks.includes(i)?'checked':''}> <span>${esc(s)}</span></label>${partRefHTML(q,i)}`).join('')}</div><div class="refsrc">${esc(q.saq.src)}</div>`

/* lock the widgets and colour them: the key green, a wrong pick red, per part for matching and blanks */
function paintChecked(q){
  const a=SIT.ans[q.id]||{};

    document.querySelectorAll('.opt').forEach(o=>{const inp=o.querySelector('input'),opt=q.opts[+inp.value];
      inp.disabled=true;o.classList.add('lock');

/* ── marking ───────────────────────────────────────────────────────── */
function markQ(q,a){
  if(q.type==='essay')return null; // self-marked
  if(!a)return{got:0,tot:q.pts,detail:'no answer'};
  if(q.type==='mcq'||q.type==='tf'||q.type==='multi'){
    const chosen=(a.sel||[]).map(i=>q.opts[i]);
    const right=chosen.length===q.key.length&&q.key.every(k=>chosen.includes(k));
    return{got:right?q.pts:0,tot:q.pts,you:chosen.map(o=>optLabel(q,o)).join(' · ')}}
  if(q.type==='match'){
    let got=0;q.pairs.forEach((p,i)=>{if((a.pick||{})[i]===p.right)got++});
    return{got:got*q.pts/q.pairs.length,tot:q.pts,you:q.pairs.map((p,i)=>(a.pick||{})[i]||'—').join(' · ')}}
  if(q.type==='cloze'){
    let got=0;
    q.blanks.forEach((b,i)=>{if(blankOK(q,b,(a.pick||{})[i]))got++});
    return{got:got*q.pts/q.blanks.length,tot:q.pts,you:q.blanks.map((b,i)=>(a.pick||{})[i]||'—').join(' · ')}}
}
/* dropdown: only her marked option is right. Typed: every accepted spelling is. */
function blankOK(q,b,v){
  /* phones type curly quotes; a trailing full stop is not a wrong answer */
  const nrm=s=>String(s||'').toLowerCase().replace(/[’‘`´]/g,"'").replace(/[“”]/g,'"').replace(/\s+/g,' ').trim().replace(/[.]+$/,'');
  const x=nrm(v);if(!x)return false;
  const also=(b.also||[]).some(o=>nrm(o)===x);
  return q.bk==='dd' ? (x===nrm(b.correct)||also) : (b.options.some(o=>nrm(o)===x)||also);
}
function blankLabel(b,i){return b.ctx?`${b.ctx} ___`:(b.label&&!/^Answer \d+:?$/.test(b.label)?b.label.replace(/:$/,''):`Blank ${i+1}`)}

    <div class="rev-ctl"><label class="wo"><input type="checkbox" id="wrongOnly" ${rows.some(x=>x.saq||(x.r&&x.r.got<x.r.tot))?'checked':''}> Wrong only</label><span class="systally" id="systally"></span></div>
    ${rows.map(({q,r,saq},i)=>{

        ${a&&a.text?`<div class="you">You wrote: ${esc(a.text.slice(0,240)).replace(/\n/g,' ')}${a.text.length>240?'…':''}</div>`:'<div class="you">— no answer written —</div>'}

        <div class="qr-acts"><span class="src">${esc(q.saq.src)}</span>${q.vid?btn('vid','▶ Video'):''}${refBtns(q,btn)}${hasHer(q)?btn('hl','✅ Her answer'):''}</div><div class="qr-pane" hidden></div></div>`}

        <div class="qr-acts">${btn('ans','✓ Answer')}${q.vid?btn('vid','▶ Video'):''}${refBtns(q,btn)}${hasHer(q)?btn('hl','✅ Her answer'):''}</div>

  {const ms={};rows.forEach(({q,r,saq})=>{if(!saq&&r&&r.got<r.tot)ms[q.sys]=(ms[q.sys]||0)+1});

  $('#doneB').onclick=()=>{
    S.scores.push({t:Date.now(),mode:SIT.mode,label:SIT.label,got:SIT.final.got,tot:SIT.final.tot});

  SV('miss',S.miss);SV('seen',S.seen);
  window.scrollTo(0,0);

/* the explain row: her material first, then the right-sized video, then Ask AI.

/* the review is an accordion: each question collapses to a mark + one-line stem, and

/* one reference, by kind: her slide is the rendered image (or, for a deck never rendered,

function refHTML(r){

  if(r.k==='patton')return `<div class="refq patton">📕 <i>“${esc(r.t)}”</i><span class="refsrc"> — ${esc(r.src)}${r.fig?` · Figure ${esc(r.fig)}${r.assigned?' (a figure she set in her learning page)':''}`:''}</span></div>`;
  return `<div class="refq">${REF[r.k].ic} <i>“${esc(r.t)}”</i><span class="refsrc"> — ${esc(r.src)}</span></div>`;

  if(e.target.id==='shareBtn'){
  const l=S.scores[S.scores.length-1];
  const line=`${META.short} — ${l.got}/${l.tot} (${Math.round(100*l.got/l.tot)}%) · ${l.label} · ${daysLeft()}d to my sitting`;
  navigator.clipboard&&navigator.clipboard.writeText(line);
