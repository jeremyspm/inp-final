<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- shared with a study group by link; the lecturers' quiz questions stay out of search engines -->
<meta name="robots" content="noindex, nofollow">
<title>Paper Sim</title>
<style>
/* ── estate tokens (house.css contract, dark default) ─────────────── */
:root{
  --bg0:hsl(225 33% 5%); --fg:hsl(225 31% 95%); --card:hsl(224 44% 10%);
  --primary:hsl(218 91% 64%); --onprimary:hsl(225 33% 5%);
  --muted:hsl(220 38% 13%); --muted-fg:hsl(218 19% 67%);
  --accent:hsl(219 40% 18%); --danger:hsl(0 84% 60%); --ok:hsl(158 64% 42%);
  --warn:hsl(38 92% 55%); --border:hsl(222 27% 19%); --radius:.625rem;
  --dur:200ms; --ease:cubic-bezier(.4,0,.2,1);
}
:root[data-theme=light]{
  --bg0:hsl(214 47% 97%); --fg:hsl(222 47% 11%); --card:hsl(0 0% 100%);
  --onprimary:#fff; --muted:hsl(215 40% 93%); --muted-fg:hsl(220 12% 40%);
  --accent:hsl(216 45% 91%); --border:hsl(215 33% 89%); --warn:hsl(38 92% 40%);
}
*{box-sizing:border-box;min-width:0}
[hidden]{display:none!important}   /* .btn sets display, which would otherwise beat the attribute */
body{margin:0;background:var(--bg);color:var(--fg);
  font:16px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  -webkit-text-size-adjust:100%}
header{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--border);
  display:flex;align-items:center;gap:10px;padding:10px 14px}
header h1{font-size:1rem;margin:0;flex:1;font-weight:700}
header .d{color:var(--muted-fg);font-size:.8rem;white-space:nowrap}
header .back{text-decoration:none;white-space:nowrap}
/* phone: title over countdown on the left, buttons full height on the right (was one flex row: the title got squeezed to a word per line) */
@media(max-width:560px){
  header{display:grid;grid-template-columns:auto minmax(0,1fr);grid-auto-columns:auto;gap:0 8px;padding:8px 12px}
  header .back{grid-area:1/1/span 2/2}
  header h1{grid-area:1/2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  header .d{grid-area:2/2;white-space:normal;font-size:.76rem;line-height:1.3}
  header .btn{grid-row:1/span 2;padding:8px 10px;min-width:40px}
}
/* ── the paper's colour (15 Oct 2026: "it should SCREAM Test 3, not look like INP"). --tool is the PAPER's colour,
   the same one jeremyspm.github.io uses (HS2 blue, INP green, Pharm purple), set from TOOL at load. 27 Oct: toned
   down ("the CSS is way too much"): a line under the header, a faint page tint, buttons and links as --primary. ── */
:root{--bg:color-mix(in srgb,var(--tool,var(--bg0)) 3%,var(--bg0));
  --tool-deep:color-mix(in srgb,var(--tool,#4f46e5) 72%,#000);
  --primary:color-mix(in srgb,var(--tool,hsl(218 91% 64%)) 70%,#fff)}
:root[data-theme=light]{--primary:color-mix(in srgb,var(--tool,hsl(218 91% 64%)) 88%,#000)}
header{border-bottom:2px solid var(--tool,var(--border))}
main{max-width:720px;margin:0 auto;padding:14px 14px 90px}
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);
  padding:14px;margin:0 0 12px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;cursor:pointer;
  border:1px solid var(--border);background:var(--muted);color:var(--fg);
  border-radius:var(--radius);padding:10px 14px;font:inherit;font-weight:600;
  transition:background var(--dur) var(--ease)}
.btn.primary{background:var(--primary);border-color:var(--primary);color:var(--onprimary)}
.btn.ghost{background:transparent}
.btn.wide{width:100%;margin-top:8px}
a.btn{text-decoration:none}
.btn:disabled{opacity:.45;cursor:default}
.door h2{margin:.1rem 0 .3rem;font-size:1.02rem}
.door p{margin:.2rem 0 .6rem;color:var(--muted-fg);font-size:.88rem}
.qlist{display:flex;flex-direction:column;gap:6px;margin-top:8px}
/* a quiz row: tag + name, then count + Learn + Sit as one group that drops to a
   second line at phone width instead of squeezing the name into four lines */
.qrow{display:flex;flex-wrap:wrap;align-items:center;gap:6px 8px;border:1px solid var(--border);
  border-radius:var(--radius);padding:8px 10px;background:var(--muted)}
.qrow b{flex:1 1 150px;font-size:.86rem;font-weight:600}
.qrow .m{color:var(--muted-fg);font-size:.76rem;white-space:nowrap}
.qrow .acts{margin-left:auto;display:flex;gap:6px;align-items:center}
.sysrow{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0 2px}
/* quiz selection: tick any rows (or a whole system) and the bottom bar runs them as one */
.qrow{cursor:pointer}
.qrow.on{border-color:var(--primary);box-shadow:inset 0 0 0 1px var(--primary)}
.qrow>input.pk{flex:0 0 auto;width:18px;height:18px;margin:0;accent-color:var(--primary);cursor:pointer}
.chips{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:8px 0 4px;font-size:.8rem;color:var(--muted-fg)}
.chip{border:1px solid var(--border);border-radius:99px;padding:4px 11px;background:transparent;color:var(--fg);
  cursor:pointer;font:inherit;font-size:.8rem;font-weight:600;line-height:1.3}
.chip.on{background:var(--primary);border-color:var(--primary);color:var(--onprimary)}
.footbar .btn.x{flex:0 0 auto}
/* ── focus checklist ─────────────────────────────────────────────────── */
.fhead{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 10px;margin:2px 0 8px}
.fbar{height:6px;border-radius:99px;background:var(--accent);overflow:hidden;flex:1 1 140px;min-width:120px}
.fbar i{display:block;height:100%;background:var(--ok);transition:width .25s}
.ftier{font-weight:700;font-size:.82rem;margin:14px 0 6px;display:flex;align-items:center;gap:8px}
.ftier b{font-weight:700}
.ftier .fnum{font-weight:400;color:var(--muted-fg)}
.frow{display:flex;gap:9px;align-items:flex-start;padding:8px 10px;margin-bottom:6px;
  border:1px solid var(--border);border-radius:var(--radius);background:var(--muted);
  border-left:3px solid var(--tc,var(--border))}
.frow.on{opacity:.62}
.frow.on .ft{text-decoration:line-through}
.frow>input.fchk{flex:0 0 auto;width:18px;height:18px;margin-top:2px;accent-color:var(--ok);cursor:pointer}
.fbody{flex:1 1 auto;min-width:0}
.fbody>summary{cursor:pointer;list-style:none;display:block}
.fbody>summary::-webkit-details-marker{display:none}
.ft{font-weight:650;font-size:.92rem;display:block}
.fmeta{display:flex;flex-wrap:wrap;gap:4px;margin-top:4px}
.fchip{font-size:.68rem;padding:1px 7px;border-radius:99px;background:var(--accent);color:var(--muted-fg);white-space:nowrap}
.fchip.her{background:hsl(38 92% 55% / .18);color:var(--warn)}
.fchip.tape{background:hsl(0 84% 60% / .16);color:var(--danger)}
.fchip.saq{background:hsl(218 91% 64% / .16);color:var(--primary)}
.fchip.sys{background:transparent;border:1px solid var(--border)}
.fchip.hl{background:hsl(158 64% 42% / .2);color:var(--ok);font-weight:650}
.fchip.rev{background:hsl(158 64% 42% / .12);color:var(--ok)}
.fchip.kh{background:hsl(280 60% 60% / .16);color:hsl(280 70% 72%)}
.hlans{margin-top:8px;border:1px solid var(--border);border-radius:var(--radius);background:var(--bg);overflow:hidden}
.hlans>summary{cursor:pointer;padding:7px 10px;font-weight:650;font-size:.84rem;color:var(--ok);list-style:none}
.hlans>summary::-webkit-details-marker{display:none}
.hlans .hlbody{padding:0 10px 10px;font-size:.83rem;line-height:1.55;white-space:pre-wrap}
.hlans .hlh{font-weight:700;margin:8px 0 4px;font-size:.8rem;letter-spacing:.02em}
.fdet{font-size:.85rem;line-height:1.5;margin-top:8px;padding-top:8px;border-top:1px solid var(--border)}
.fdet p{margin:0 0 7px}
.fdet .fcap{color:var(--muted-fg)}
.fwhy{font-size:.8rem;line-height:1.5;color:var(--muted-fg);margin:0 0 4px}
@media(max-width:400px){ .ft{font-size:.88rem} .fdet{font-size:.82rem} }
.tag{font-size:.72rem;padding:2px 8px;border-radius:99px;background:var(--accent);color:var(--muted-fg)}
.tag.mixed,.tag.authored{color:var(--muted-fg)}
/* one colour per group: written at load from META.hue (see "chrome") */
/* sitting */
.qhead{display:flex;align-items:center;flex-wrap:wrap;gap:4px 10px;margin-bottom:8px}
.qhead .n{font-weight:700}
.qhead .timer{margin-left:auto;font-variant-numeric:tabular-nums;color:var(--muted-fg)}
.qhead .timer.low{color:var(--danger);font-weight:700}
.stem{white-space:pre-wrap;margin-bottom:10px}
.stem img,.qimg{max-width:100%;border-radius:8px;background:#fff;display:block;margin:8px 0}
/* structured stem: her paragraphs, lists and table rows survive; a Canvas layout
   table becomes stacked cells at phone width and side-by-side from 560px */
.stem.rich{white-space:normal;line-height:1.5}
.stem.rich p{margin:.4em 0}
.stem.rich ul,.stem.rich ol{margin:.3em 0;padding-left:1.35em}
.stem.rich li{margin:.15em 0}
.stem.rich li>p{margin:.1em 0}
.stem.rich div{margin:.15em 0}
.stem.rich .tbl{display:flex;flex-direction:column;gap:8px;margin:10px 0}
.stem.rich .tr{display:flex;flex-wrap:wrap;gap:8px 14px;border:1px solid var(--border);border-radius:8px;padding:8px 10px;background:var(--muted)}
.stem.rich .td{flex:1 1 220px;min-width:0}
.stem.rich .td>p:first-child{margin-top:0}
.stem.rich .td img{margin:0 0 4px;max-height:280px;width:auto}
.stem.rich img{max-height:520px;width:auto}
.inl{display:inline-block;width:auto;max-width:100%;padding:5px 8px;margin:2px 0;vertical-align:baseline;
  font-size:.95em;border:1px solid var(--primary);background:var(--card);color:var(--fg);border-radius:6px}
input.inl{min-width:7ch}
.inl:focus{outline:2px solid var(--primary);outline-offset:1px}
.opt{display:flex;gap:10px;align-items:flex-start;border:1px solid var(--border);
  border-radius:var(--radius);padding:10px;margin:6px 0;cursor:pointer;background:var(--muted)}
.opt input{margin-top:3px;flex:none}
.opt.sel{border-color:var(--primary);background:var(--accent)}
/* learn mode: a checked question locks and colours itself in place */
.opt.k{border-color:var(--ok);box-shadow:inset 0 0 0 1px var(--ok)}
.opt.x{border-color:var(--danger);box-shadow:inset 0 0 0 1px var(--danger)}
.opt.lock{cursor:default}
.lres{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:10px 0 0}
.lres .hint{font-size:.76rem;color:var(--muted-fg)}
.lres .qr-pane{flex-basis:100%;padding:6px 0 0}
.mk .verdict{font-weight:700;margin:0 0 4px}
.mk.right .verdict{color:var(--ok)} .mk.wrong .verdict{color:var(--danger)} .mk.saq{border-color:var(--primary)}
.pip.ok{background:var(--ok);border-color:var(--ok)} .pip.bad{background:var(--danger);border-color:var(--danger)}
.qrow .btn{padding:6px 10px;font-size:.8rem}
.qrow .btn.learn{border-color:var(--primary);color:var(--primary)}
.blankrow{display:flex;flex-direction:column;gap:4px;margin:8px 0}
.blankrow label{font-size:.82rem;color:var(--muted-fg)}
select,input[type=text],textarea{font:inherit;color:var(--fg);background:var(--muted);
  border:1px solid var(--border);border-radius:8px;padding:9px;width:100%}
textarea{min-height:120px}
.pips{display:flex;gap:3px;flex-wrap:wrap;margin:10px 0 2px}
.pip{width:14px;height:6px;border-radius:3px;background:var(--muted);border:1px solid var(--border)}
.pip.done{background:var(--primary);border-color:var(--primary)}
.pip.cur{outline:2px solid var(--primary);outline-offset:1px}
/* marking */
.mk{border-left:4px solid var(--border);padding-left:10px;margin:14px 0}
.mk.right{border-color:var(--ok)}.mk.wrong{border-color:var(--danger)}
.mk .you{color:var(--muted-fg);font-size:.9rem}
.mk .keyline{color:var(--ok);font-weight:600}
.mk .marks{font-size:.8rem;color:var(--muted-fg)}
.steps label{display:flex;gap:8px;align-items:flex-start;margin:6px 0;cursor:pointer}
.refq{font-size:.85rem;color:var(--muted-fg);margin:8px 0 2px;padding:8px 10px;background:var(--muted);border-radius:8px}
.refq.slide{padding:6px}
.refq.patton{border-left:3px solid var(--primary)}
.refq i{color:var(--fg)}
.slideimg{max-width:100%;background:#fff;border-radius:6px;display:block;margin:0 0 4px}
.keyrows{margin:6px 0}
.krow{font-size:.85rem;padding:3px 0;border-bottom:1px dashed var(--border)}
.krow b{color:var(--ok);font-weight:600}
.krow.kok{opacity:.55}
.kyou{color:var(--danger);font-size:.78rem}
.kref{font-size:.84rem;color:var(--muted-fg);margin:4px 0 6px 14px;padding:6px 10px;background:var(--muted);border-radius:8px;line-height:1.45}
.kref i{color:var(--fg)}
.kref .refsrc{display:inline}
.refsrc{font-size:.74rem;color:var(--muted-fg);opacity:.8}
.vidrow{font-size:.86rem;margin:6px 0}
.vidrow a{font-weight:600}
.askai{padding:3px 10px;font-size:.76rem;margin-top:6px}
.aiwrap{display:flex;flex-wrap:wrap;gap:4px 10px;align-items:center;margin:8px 0 4px}
.aitext{flex-basis:100%;width:100%;min-height:150px;font-size:.78rem;margin-top:6px}
.aisplit{display:flex;flex-wrap:wrap;gap:4px 8px;align-items:center;margin-top:6px}
.aisplit .askai{margin-top:0}
.vclip{margin:.5rem 0}
.vframe{position:relative;aspect-ratio:16/9;width:100%;max-width:460px;background:#000;border-radius:8px;overflow:hidden;cursor:pointer}
.vframe img,.vframe iframe{width:100%;height:100%;display:block;border:0;object-fit:cover}
.vplay{position:absolute;inset:0;margin:auto;width:54px;height:54px;border-radius:50%;background:rgba(20,20,28,.72);color:#fff;border:2px solid #fff;font-size:1.3rem;cursor:pointer;line-height:1}
.vbadge{position:absolute;left:6px;bottom:6px;background:rgba(0,0,0,.8);color:#fff;font-size:.72rem;padding:2px 6px;border-radius:4px;pointer-events:none}
.vmeta{font-size:.82rem;margin-top:5px;display:flex;flex-wrap:wrap;gap:6px 8px;align-items:center}
.vch{font-weight:600}
.vfull{padding:2px 8px;font-size:.74rem}
.rev-ctl{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin:6px 0 10px;font-size:.85rem}
.rev-ctl .wo{display:flex;gap:6px;align-items:center;cursor:pointer;user-select:none}
.systally{display:flex;flex-wrap:wrap}
.systally .tag{display:inline-block;background:var(--muted);padding:2px 9px;border-radius:11px;margin:2px 5px 2px 0;font-size:.74rem}
.systally .tag.ok{color:var(--ok)}
.qr{border:1px solid var(--muted);border-left-width:4px;border-radius:9px;margin:6px 0;background:var(--card)}
.qr.right{border-left-color:var(--ok)} .qr.partial{border-left-color:var(--warn)} .qr.wrong{border-left-color:var(--danger)} .qr.saq{border-left-color:var(--primary)}
.qr-head{display:flex;gap:10px;align-items:flex-start;padding:9px 11px 7px}
.qr-mk{font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap;padding:2px 8px;border-radius:6px;font-size:.82rem;background:var(--muted)}
.qr.right .qr-mk{background:var(--ok);color:var(--onprimary)} .qr.partial .qr-mk{background:var(--warn);color:var(--onprimary)} .qr.wrong .qr-mk{background:var(--danger);color:#fff}
.qr-stem{font-size:.9rem;line-height:1.35;flex:1}
.qr-acts{display:flex;flex-wrap:wrap;gap:6px;align-items:center;padding:0 11px 9px}
.qa{padding:3px 11px;font-size:.77rem;border:1px solid var(--muted);border-radius:14px;background:transparent;color:inherit;cursor:pointer}
.qa:hover{border-color:var(--primary)} .qa.on{background:var(--primary);color:var(--onprimary);border-color:var(--primary)}
.qr-pane{padding:2px 11px 11px}
.qr .src{font-size:.72rem;color:var(--primary);margin-right:auto;opacity:.85}
.qr .you{font-size:.8rem;padding:2px 11px 4px;opacity:.85}
.qr .steps{padding:2px 11px 6px}
.score-hero{font-size:2.2rem;font-weight:800;text-align:center;margin:.3rem 0 0}
.score-sub{text-align:center;color:var(--muted-fg);margin:0 0 10px}
/* chart */
.spark{width:100%;height:84px;display:block}
.hist{font-size:.82rem;color:var(--muted-fg)}
.hist td{padding:2px 8px 2px 0}
/* chain warmup */
.chain{display:flex;flex-direction:column;gap:2px;margin:8px 0}
.bead{background:var(--accent);border:1px solid var(--border);border-radius:8px;padding:7px 10px;font-size:.9rem}
.bead.blank{border-style:dashed;color:var(--warn);text-align:center}
.verb{color:var(--muted-fg);font-size:.78rem;padding:0 12px}
.note{border:1px solid var(--border);border-left:4px solid var(--warn);border-radius:8px;
  padding:8px 10px;font-size:.84rem;color:var(--muted-fg);margin:10px 0}
.src{font-size:.75rem;color:var(--muted-fg);margin-top:6px}
dialog{background:var(--card);color:var(--fg);border:1px solid var(--border);
  border-radius:var(--radius);max-width:640px;width:calc(100% - 32px);padding:18px}
dialog::backdrop{background:rgb(0 0 0 / .6)}
h3{margin:14px 0 4px;font-size:.95rem}
.footbar{position:fixed;bottom:0;left:0;right:0;background:var(--bg);
  border-top:1px solid var(--border);padding:10px 14px;display:none;gap:8px;z-index:5}
.footbar.on{display:flex}
.footbar .btn{flex:1}
a{color:var(--primary)}
/* ── home: one screen of row cards, each opening its own screen (was one 5-6 screen scroll) ── */
.hero{display:flex;align-items:center;gap:12px;width:100%;text-align:left;font:inherit;color:var(--fg);cursor:pointer;
  background:color-mix(in srgb,var(--primary) 14%,var(--card));border:1px solid color-mix(in srgb,var(--primary) 45%,transparent);
  border-radius:12px;padding:12px 14px;margin:2px 0 4px}
.hero small{display:block;font-size:.76rem;color:var(--primary);font-weight:650}
.hero b{display:block;font-size:1rem;line-height:1.35;margin-top:2px}
.hero .go{flex:0 0 auto;margin-left:auto;width:42px;height:42px;border-radius:50%;background:var(--primary);color:var(--onprimary);
  display:flex;align-items:center;justify-content:center;font-size:1rem}
.lsec{font-size:.72rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted-fg);margin:12px 4px 5px}
.lrow{display:flex;align-items:center;gap:12px;width:100%;text-align:left;font:inherit;color:var(--fg);cursor:pointer;
  background:var(--card);border:1px solid var(--border);border-radius:12px;padding:8px 12px;margin:0 0 7px;
  transition:border-color var(--dur) var(--ease)}
.lrow:hover{border-color:color-mix(in srgb,var(--primary) 55%,var(--border))}
.lic{flex:0 0 40px;height:40px;border-radius:10px;background:var(--muted);display:flex;align-items:center;justify-content:center;font-size:1.15rem}
.ltx{flex:1 1 auto;min-width:0}
.ltx b{display:block;font-size:.97rem;font-weight:650}
.ltx small{display:block;font-size:.8rem;color:var(--muted-fg);line-height:1.35;margin-top:1px}
.lch{flex:0 0 auto;color:var(--muted-fg);font-size:1.3rem;line-height:1}
a.lrow{text-decoration:none}   /* a row that opens another page of this tool (META.more) */
/* a featured row (META.more[].hl, 2 Oct 2026 — his pick "B, exactly like B" for pharm-final's Chart Sim): a taller card
   in its own colour (--hl, --hl2 for the text), a kicker line and a go link; since 27 Oct no gradient, glow or specks */
.lrow.fb{border-color:color-mix(in srgb,var(--hl) 45%,var(--border))}
.lrow.fb:hover{border-color:var(--hl)}
.fb .lic{color:var(--hl);background:color-mix(in srgb,var(--hl) 16%,transparent)}
.fb .kick{display:block;font-size:.7rem;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--hl2)}
.fb .go{flex:0 0 auto;font-size:.8rem;font-weight:650;color:var(--hl2);white-space:nowrap}
.fb .dot{display:none}
:root[data-theme=light] .fb .kick,:root[data-theme=light] .fb .go{color:color-mix(in srgb,var(--hl) 80%,#000)}
/* the paper's banner on home: its bold first sentence always shows, the rest is one tap away */
.bnote{margin:0 0 10px}
.bnote>summary{cursor:pointer;list-style:none}
.bnote>summary::-webkit-details-marker{display:none}
.bnote>summary::after{content:' · more';color:var(--primary);font-size:.8rem;font-weight:650}
.bnote[open]>summary::after{content:''}
.shead{display:flex;align-items:center;gap:10px;margin:0 0 12px}
.shead h2{margin:0;font-size:1.1rem;flex:1}
/* the tool's own name (26 Sep 2026): a plain title block since 27 Oct, no banner, no watermark */
.idcard{margin:4px 2px 14px}
.idic{display:none}
.idtx small{display:block;font-size:.75rem;font-weight:600;color:var(--muted-fg)}
.idtx b{display:block;font-size:1.45rem;line-height:1.2;margin:2px 0 4px;font-weight:750;letter-spacing:-.01em}
.idtx>span{display:block;font-size:.88rem;color:var(--muted-fg);line-height:1.4}
.idtx .idwhen{display:inline-block;margin-top:6px;font-size:.8rem;font-weight:650;color:var(--primary)}

ear old child needs an IV luer inserted. An appropriate technique to teach them about this could be?</p>","qt":"A six year old child needs an IV luer inserted. An appropriate technique to teach them about this could be?","type":"mcq","opts":["Talking to them","Don't tell them as it will only upset them","An information pamphlet for them to read","Play therapy"],"key":["Play therapy"]},{"id":"q63b4aaa629","quiz":"210130","sys":"clin","pts":1,"q":"What is an example of step 1 (A) in the A, B, C of patient education to improve health literacy?","imgs":[],"qh":"<p>What is an example of step 1 (A) in the A, B, C of patient education to improve health literacy?</p>","qt":"What is an example of step 1 (A) in the A, B, C of patient education to improve health literacy?","type":"mcq","opts":["\"Can you please explain what I told you about the side effects of amoxicillin?\"","\"Some common side effects of amoxicillin are nausea and diarrhoea\"","\"You need to take amoxicillin until you finish the prescription\"","\"Have you heard of the medication amoxicillin and what do you already know about it?\""],"key":["\"Have you heard of the medication amoxicillin and what do you already know about it?\""]},{"id":"q75367192e5","quiz":"210130","sys":"clin","pts":1,"q":"A 55-year-old patient with type 2 diabetes mellitus is having difficulty understanding how to manage their condition. What is the most effective way for the nurse to teach the patient about their diabetes management plan?","imgs":[],"qh":"<p>A 55-year-old patient with type 2 diabetes mellitus is having difficulty understanding how to manage their condition. What is the most effective way for the nurse to teach the patient about their diabetes management plan?</p>","qt":"A 55-year-old patient with type 2 diabetes mellitus is having difficulty understanding how to manage their condition. What is the most effective way for the nurse to teach the patient about their diabetes management plan?","type":"mcq","opts":["Provide a detailed pamphlet with medical jargon","Use simple language and visual aids to explain the plan","Schedule a follow-up appointment without further explanation","Give the patient a list of websites to read"],"key":["Use simple language and visual aids to explain the plan"]},{"id":"q682be08b32","quiz":"210130","sys":"clin","pts":1,"q":"A patient is prescribed a new medication and is unsure about how to take it properly. What should the nurse do to enhance the patient’s understanding of the medication regimen?","imgs":[],"qh":"<p>A patient is prescribed a new medication and is unsure about how to take it properly. What should the nurse do to enhance the patient’s understanding of the medication regimen?</p>","qt":"A patient is prescribed a new medication and is unsure about how to take it properly. What should the nurse do to enhance the patient’s understanding of the medication regimen?","type":"mcq","opts":["Tell the patient to read the instructions on the bottle","Provide a scientific article about the medication","Demonstrate how to take the medication and ask the patient to repeat the instructions","Tell the patient to call the pharmacy if they have questions"],"key":["Demonstrate how to take the medication and ask the patient to repeat the instructions"]},{"id":"q38c07beaf7","quiz":"210130","sys":"clin","pts":1,"q":"A nurse is educating a patient with low health literacy about managing hypertension. Which strategy should the nurse use to improve the patient’s understanding?","imgs":[],"qh":"<p>A nurse is educating a patient with low health literacy about managing hypertension. Which strategy should the nurse use to improve the patient’s understanding?</p>","qt":"A nurse is educating a patient with low health literacy about managing hypertension. Which strategy should the nurse use to improve the patient’s understanding?","type":"mcq","opts":["Provide a pamphlet with detailed information","Use medical terminology to sound professional","Use teach-back method to confirm understanding","Speak quickly to cover all the information"],"key":["Use teach-back method to confirm understanding"]},{"id":"q1564fcc732","quiz":"210130","sys":"clin","pts":1,"q":"A consideration for optimal learning is","imgs":[],"qh":"<p>A consideration for optimal learning is</p>","qt":"A consideration for optimal learning is","type":"mcq","opts":["The learning environment","The patient's motivation to learn","Appropriate resources","All of these"],"key":["All of these"]},{"id":"q20331940c8","quiz":"a-cna","sys":"pop","pts":1,"q":"Put the four steps of McMurray’s Community Assessment Framework in order.","qh":"<p>Put the four steps of McMurray’s Community Assessment Framework in order.</p>","qt":"Put the four steps of McMurray’s Community Assessment Framework in order.","imgs":[],"type":"mcq","authored":1,"opts":["Map, Engage, Empower, Analyse","Engage, Map, Analyse, Empower","Analyse, Engage, Map, Empower","Engage, Analyse, Map, Empower"],"key":["Engage, Map, Analyse, Empower"],"src":"the Community Needs Assessment Framework deck, slides 10 and 38","why":"The deck repeats the same four-step strip throughout: ENGAGE with the community, MAP strengths, resources and risks, ANALYSE the information gathered, EMPOWER the community. You cannot analyse before you have mapped, and nothing starts until the community has been engaged."},{"id":"q36a646090b","quiz":"a-cna","sys":"pop","pts":1,"q":"A nurse drives through a suburb noting housing, bus routes and parks. This is:","qh":"<p>A nurse drives through a suburb noting housing, bus routes and parks. This is:</p>","qt":"A nurse drives through a suburb noting housing, bus routes and parks. This is:","imgs":[],"type":"mcq","authored":1,"opts":["A windscreen survey","A SWOT analysis","A census","A focus group"],"key":["A windscreen survey"],"src":"the Community Needs Assessment Framework deck, slides 27 and 29","why":"A windscreen survey is a quick overview of a community gained by driving around and observing. Primary data is what you observe yourself — observations of community life; secondary data is your research into what others have already collected."},{"id":"q79c0bba897","quiz":"a-cna","sys":"pop","pts":1,"q":"Which of these is secondary data for a community assessment?","qh":"<p>Which of these is secondary data for a community assessment?</p>","qt":"Which of these is secondary data for a community assessment?","imgs":[],"type":"mcq","authored":1,"opts":["Your windscreen survey notes","A kaumātua’s view of local priorities","Your observations in the park","Stats NZ census figures"],"key":["Stats NZ census figures"],"src":"the Community Needs Assessment Framework deck, slides 26–28","why":"Secondary data is your research: Stats NZ, Ministry of Health publications, the New Zealand Health Survey, library databases. The other three are all things you saw or heard yourself in the community — primary data."},{"id":"q521d44bac2","quiz":"a-cna","sys":"pop","pts":1,"q":"In the MAP step, which framework organises the community information?","qh":"<p>In the MAP step, which framework organises the community information?</p>","qt":"In the MAP step, which framework organises the community information?","imgs":[],"type":"mcq","authored":1,"opts":["The nursing process (ADPIE)","The Social Determinants of Health Assessment Circle","Te Whare Tapa Whā","A SWOT grid"],"key":["The Social Determinants of Health Assessment Circle"],"src":"the Community Needs Assessment Framework deck, slides 18 and 20","why":"MAP = talk with everyday community members, and collect information using the Social Determinants of Health Assessment Circle as the framework for organising the data. The SWOT grid belongs to the next step, ANALYSE."},{"id":"q0f85ed3d3b","quiz":"a-cna","sys":"pop","pts":1,"q":"In a SWOT analysis, which two headings are harmful to health?","qh":"<p>In a SWOT analysis, which two headings are harmful to health?</p>","qt":"In a SWOT analysis, which two headings are harmful to health?","imgs":[],"type":"mcq","authored":1,"opts":["Strengths and Opportunities","Weaknesses and Opportunities","Weaknesses and Threats","Strengths and Threats"],"key":["Weaknesses and Threats"],"src":"the Community Needs Assessment Framework deck, slide 33","why":"Helpful to health: Strengths (what is working well) and Opportunities (the possibilities — new services, beneficial trends). Harmful to health: Weaknesses (what is harming health now) and Threats (what health issues could arise, what could worsen inequities if unaddressed)."},{"id":"q83b5ee335c","quiz":"a-tikanga","sys":"prof","pts":1,"q":"Under Kawa Whakaruruhau (cultural safety), who decides whether care was culturally safe?","qh":"<p>Under Kawa Whakaruruhau (cultural safety), who decides whether care was culturally safe?</p>","qt":"Under Kawa Whakaruruhau (cultural safety), who decides whether care was culturally safe?","imgs":[],"type":"mcq","authored":1,"opts":["The nurse giving the care","The person and whānau receiving it","The charge nurse","The Nursing Council"],"key":["The person and whānau receiving it"],"src":"the Tikanga Best Practice and Kawa Whakaruruhau deck, slides 2 and 6","why":"The deck’s first line on Kawa Whakaruruhau: cultural safety is determined by the recipient of care. It focuses on the individual’s and whānau experience to define and improve the quality of care — the nurse cannot declare their own practice safe."},{"id":"qfbda5b940b","quiz":"a-tikanga","sys":"prof","pts":1,"q":"Tikanga comes from the word “tika”. What does tika mean?","qh":"<p>Tikanga comes from the word “tika”. What does tika mean?</p>","qt":"Tikanga comes from the word “tika”. What does tika mean?","imgs":[],"type":"mcq","authored":1,"opts":["Right or correct","Sacred or restricted","Treasured","The physical body"],"key":["Right or correct"],"src":"the Tikanga Best Practice and Kawa Whakaruruhau deck, slide 8","why":"Tikanga comes from tika, meaning “right” or “correct”. Kawa, its partner term, is customs, protocols and etiquette; together they are the lores and mores that form the cornerstone of life for Māori."},{"id":"qd1a514788c","quiz":"a-tikanga","sys":"prof","pts":1,"q":"What does noa mean?","qh":"<p>What does noa mean?</p>","qt":"What does noa mean?","imgs":[],"type":"mcq","authored":1,"opts":["Sacred or restricted","A treasured possession","Ordinary, free from tapu","Spiritual wellbeing"],"key":["Ordinary, free from tapu"],"src":"the Tikanga Best Practice and Kawa Whakaruruhau deck, slide 9","why":"Noa is to be made neutral, ordinary or unrestricted, freed from the extensions of tapu. Tapu and noa together form the basis of law and order, of safe and unsafe practices."},{"id":"qbc94beac69","quiz":"a-tikanga","sys":"prof","pts":1,"q":"Which parts of the body are tapu?","qh":"<p>Which parts of the body are tapu?</p>","qt":"Which parts of the body are tapu?","imgs":[],"type":"mcq","authored":1,"opts":["Hands, feet and back","Head, genitalia and heart","Eyes, ears and mouth","The head only"],"key":["Head, genitalia and heart"],"src":"the Tikanga Best Practice and Kawa Whakaruruhau deck, slides 14 and 19","why":"The deck (citing Durie, 1998) names the head, genitalia and heart — and notes that people can also be tapu at different times and in differing circumstances. This is why “ask rather than assume” sits under respecting tikanga."},{"id":"qebe705dd65","quiz":"a-tikanga","sys":"prof","pts":1,"q":"A nurse introduces themself, checks how to say the patient’s name and finds a point of connection. This is:","qh":"<p>A nurse introduces themself, checks how to say the patient’s name and finds a point of connection. This is:</p>","qt":"A nurse introduces themself, checks how to say the patient’s name and finds a point of connection. This is:","imgs":[],"type":"mcq","authored":1,"opts":["Whakawhanaungatanga","Whakamarumarutia","Tino rangatiratanga","Whatumanawa"],"key":["Whakawhanaungatanga"],"src":"the Tikanga Best Practice and Kawa Whakaruruhau deck, slide 17 and the speaker notes to slide 12","why":"Whakawhanaungatanga: build trusting relationships, pronounce names correctly, introduce yourself and your role, create meaningful connections. The lecture note on it is “relationship before task”."},{"id":"q2785823567","quiz":"a-pain","sys":"care","pts":1,"q":"A man with diabetes describes burning, shooting pain in his feet. This is:","qh":"<p>A man with diabetes describes burning, shooting pain in his feet. This is:</p>","qt":"A man with diabetes describes burning, shooting pain in his feet. This is:","imgs":[],"type":"mcq","authored":1,"opts":["Superficial somatic pain","Visceral pain","Neuropathic pain","Referred pain"],"key":["Neuropathic pain"],"src":"the Pain Assessment deck, slides 16–18","why":"Neuropathic pain comes from injury or dysfunction of the nervous system — abnormal processing of stimuli. It feels shooting, burning, numb or electric-shock-like, with pain on light touch. Diabetes, shingles and multiple sclerosis are the deck’s common causes."},{"id":"q488edabb89","quiz":"a-pain","sys":"care","pts":1,"q":"A man says his flank pain is worse when he moves. Which letter of OLDCARTS is this?","qh":"<p>A man says his flank pain is worse when he moves. Which letter of OLDCARTS is this?</p>","qt":"A man says his flank pain is worse when he moves. Which letter of OLDCARTS is this?","imgs":[],"type":"mcq","authored":1,"opts":["O","C","A","T"],"key":["A"],"src":"the Pain Assessment deck, slides 33 and 38; scenario from the Pain Assessment Practice Handout (James)","why":"A = Aggravating factors — what makes it worse (moving, walking, breathing, urinating, swallowing…). O is onset, C is characteristics (what it feels like) and T is timing (pattern and frequency, day or night)."},{"id":"q1eb010d505","quiz":"a-pain","sys":"care","pts":1,"q":"The Wong-Baker FACES scale is especially helpful for:","qh":"<p>The Wong-Baker FACES scale is especially helpful for:</p>","qt":"The Wong-Baker FACES scale is especially helpful for:","imgs":[],"type":"mcq","authored":1,"opts":["Adults with chronic pain","Patients on opioid infusions","Anyone scoring above 7/10","Children, or where there is a language barrier"],"key":["Children, or where there is a language barrier"],"src":"the Pain Assessment deck, slides 41 and 43","why":"FACES is especially helpful for children, non-verbal persons or if there is a language barrier: the person picks the face that shows how they feel right now. Whatever scale is used, use the same one each time so the effect of pain relief can be compared."},{"id":"qb05e21081f","quiz":"a-fcc","sys":"care","pts":1,"q":"In nursing practice, who is a person’s family?","qh":"<p>In nursing practice, who is a person’s family?</p>","qt":"In nursing practice, who is a person’s family?","imgs":[],"type":"mcq","authored":1,"opts":["Whoever the person says is family","The next of kin in the notes","People living at the same address","Blood relatives and spouses only"],"key":["Whoever the person says is family"],"src":"the Family Centred Care deck, slide 15","why":"“Family in nursing”: a set of relationships that the person identifies as family, or a network of individuals who influence each other’s lives, whether or not there are actual biological or legal ties. The person defines their family — the nurse does not."},{"id":"qef96e956e3","quiz":"a-fcc","sys":"care","pts":1,"q":"A genogram and an ecomap are used to:","qh":"<p>A genogram and an ecomap are used to:</p>","qt":"A genogram and an ecomap are used to:","imgs":[],"type":"mcq","authored":1,"opts":["Record immunisation history","Screen for family violence","Calculate a deprivation score","Show family structure and relationships"],"key":["Show family structure and relationships"],"src":"the Family Centred Care deck, slide 30","why":"They are visual representations of a person and their relationships to the family structure, and of relationships within and beyond the family’s boundaries — a useful way of engaging people and families in an active discussion about their relationships."},{"id":"q028532f2d5","quiz":"a-fcc","sys":"care","pts":1,"q":"Which three forms of abuse make up “family violence”?","qh":"<p>Which three forms of abuse make up “family violence”?</p>","qt":"Which three forms of abuse make up “family violence”?","imgs":[],"type":"mcq","authored":1,"opts":["Partner, child and elder abuse","Physical, verbal and financial abuse","Child abuse, bullying and neglect","Partner, workplace and elder abuse"],"key":["Partner, child and elder abuse"],"src":"the Family Centred Care deck, slide 19","why":"Partner abuse, child abuse and elder abuse are collectively termed family violence. Nurses have a key role in identifying and supporting people experiencing it, and screening is done in most health care facilities."},{"id":"qad873bc071","quiz":"a-nzhs","sys":"pop","pts":1,"q":"What are the two long-term goals of the New Zealand Health Strategy?","qh":"<p>What are the two long-term goals of the New Zealand Health Strategy?</p>","qt":"What are the two long-term goals of the New Zealand Health Strategy?","imgs":[],"type":"mcq","authored":1,"opts":["Shorter waiting lists and lower costs","Health equity and better health outcomes","More nurses and more hospitals","Centralised services and telehealth"],"key":["Health equity and better health outcomes"],"src":"the New Zealand Health Strategy 2023 deck, slide 16","why":"Goal 1: achieve health equity — especially for Māori, Pacific, disabled and other groups who currently have poorer outcomes. Goal 2: improve health outcomes for all New Zealanders, so everyone can live longer, healthier and more independent lives."},{"id":"q67e4a6d9cf","quiz":"a-nzhs","sys":"pop","pts":1,"q":"Which Act replaced the District Health Boards with Health New Zealand?","qh":"<p>Which Act replaced the District Health Boards with Health New Zealand?</p>","qt":"Which Act replaced the District Health Boards with Health New Zealand?","imgs":[],"type":"mcq","authored":1,"opts":["Pae Ora (Healthy Futures) Act 2022","HPCA Act 2003","NZ Public Health and Disability Act 2000","Health and Disability Commissioner Act 1994"],"key":["Pae Ora (Healthy Futures) Act 2022"],"src":"the New Zealand Health Strategy 2023 deck, slide 6 and the speaker notes to slide 2","why":"The Pae Ora (Healthy Futures) Act 2022 replaced the DHB system with Health New Zealand (Te Whatu Ora), established the Māori Health Authority (Te Aka Whai Ora — since disestablished, 2024) and the Public Health Agency. The lecture note: the Pae Ora Act is the “how” behind the Health Strategy."},{"id":"q9b9ce5aa64","quiz":"a-nzhs","sys":"pop","pts":1,"q":"Which statement describes health equity?","qh":"<p>Which statement describes health equity?</p>","qt":"Which statement describes health equity?","imgs":[],"type":"mcq","authored":1,"opts":["Everyone gets the same resources","Funding follows how many people use a service","People get what they need to reach similar outcomes","Care only for those who can show need"],"key":["People get what they need to reach similar outcomes"],"src":"the New Zealand Health Strategy 2023 deck, slide 10","why":"Equality gives everyone the same resources; equity gives people what they need to achieve similar outcomes. Health equity means everyone has a fair and just opportunity to be as healthy as possible, which requires removing obstacles such as poverty and discrimination."},{"id":"q427ba81d42","quiz":"a-discharge","sys":"care","pts":1,"q":"When does discharge planning begin?","qh":"<p>When does discharge planning begin?</p>","qt":"When does discharge planning begin?","imgs":[],"type":"mcq","authored":1,"opts":["When the doctor says the patient is fit to go","The day before discharge","On admission","Once the discharge summary is written"],"key":["On admission"],"src":"the Discharge Planning deck, slides 10, 14 and 31","why":"The deck puts it in capitals: DISCHARGE PLANNING BEGINS AT THE TIME OF ADMISSION. Gathering information from admission — “what brought you to hospital? how have you been managing?” — is already the start of the discharge process."},{"id":"q092c162053","quiz":"a-discharge","sys":"care","pts":1,"q":"Discharge planning is best defined as:","qh":"<p>Discharge planning is best defined as:</p>","qt":"Discharge planning is best defined as:","imgs":[],"type":"mcq","authored":1,"opts":["An interdisciplinary approach to continuity of care","The doctor’s decision that a patient is well","The paperwork done on the day of discharge","A phone follow-up after discharge"],"key":["An interdisciplinary approach to continuity of care"],"src":"the Discharge Planning deck, slides 3 and 6","why":"Discharge planning is an interdisciplinary approach to continuity of care: a process of identification, assessment, goal setting, planning, implementation, coordination and evaluation, and the quality link between hospitals, community-based services, non-government organisations and carers."},{"id":"qa0739cf563","quiz":"a-discharge","sys":"care","pts":1,"q":"Effective discharge planning leads to:","qh":"<p>Effective discharge planning leads to:</p>","qt":"Effective discharge planning leads to:","imgs":[],"type":"mcq","authored":1,"opts":["Longer hospital stays","More readmissions","Fewer readmissions and shorter stays","More emergency presentations"],"key":["Fewer readmissions and shorter stays"],"src":"the Discharge Planning deck, slide 8","why":"Effective discharge planning is associated with a decrease in readmission rates, a reduction in length of hospital stay and a reduction in the degree of follow-up community care. Poor planning — poor instruction, inadequate information, poor coordination and communication — leads the other way."},{"id":"q43295bf778","quiz":"a-discharge","sys":"care","pts":1,"q":"The nurse’s role in discharge is best described as:","qh":"<p>The nurse’s role in discharge is best described as:</p>","qt":"The nurse’s role in discharge is best described as:","imgs":[],"type":"mcq","authored":1,"opts":["The decision-maker","The coordinator","A bystander","The referrer only"],"key":["The coordinator"],"src":"the Discharge Planning deck, slides 12 and 14","why":"The nurse coordinates the discharge process — the “middle-man”, often the final point of contact before the patient leaves — and ensures the patient and family understand and agree with the plan and have all the information and tools to transition home or to another facility."},{"id":"qfc7ab0518d","quiz":"a-discharge","sys":"care","pts":1,"q":"The patient nods after you explain the discharge medicines. You should still:","qh":"<p>The patient nods after you explain the discharge medicines. You should still:</p>","qt":"The patient nods after you explain the discharge medicines. You should still:","imgs":[],"type":"mcq","authored":1,"opts":["Use teach-back to check understanding","Document that teaching is complete","Give the written summary only","Ask the family to explain it later"],"key":["Use teach-back to check understanding"],"src":"the Discharge Planning deck, slides 19–20","why":"Teach-back is a safety tool: patients often nod even when confused, and stress, pain, fatigue and health literacy affect recall. Ask–Build–Check, plain words instead of abbreviations, an interpreter or written and visual resources where needed, and a support person present."},{"id":"q4b00f6973a","quiz":"a-tus","sys":"prof","pts":1,"q":"Whose Theory of Human Caring is taught in Therapeutic Use of Self?","qh":"<p>Whose Theory of Human Caring is taught in Therapeutic Use of Self?</p>","qt":"Whose Theory of Human Caring is taught in Therapeutic Use of Self?","imgs":[],"type":"mcq","authored":1,"opts":["Jean Watson","Florence Nightingale","Patricia Benner","Dorothea Orem"],"key":["Jean Watson"],"src":"the Therapeutic Use of Self deck, slides 10–12","why":"Jean Watson’s Theory of Human Caring: caring is the heart of nursing — caring for the whole person, not just the illness. Every nurse–patient interaction is a caring moment; the ten carative factors are its guiding principles."},{"id":"q73cd24dbfd","quiz":"a-tus","sys":"prof","pts":1,"q":"A tired nurse keeps a calm, kind manner with an angry patient — “putting on a mask”. This is:","qh":"<p>A tired nurse keeps a calm, kind manner with an angry patient — “putting on a mask”. This is:</p>","qt":"A tired nurse keeps a calm, kind manner with an angry patient — “putting on a mask”. This is:","imgs":[],"type":"mcq","authored":1,"opts":["Deep acting","Surface acting","Self-awareness","Transpersonal caring"],"key":["Surface acting"],"src":"the Therapeutic Use of Self deck, slides 28–30","why":"Surface acting is the overt expression of an emotion the person does not feel but thinks the situation needs. Deep acting is a genuine shift in the nurse’s own feelings, reached by trying to understand the situation from the patient’s perspective. Both are part of emotional labour, under self-regulation."},{"id":"q0e48ef07fd","quiz":"a-tus","sys":"prof","pts":1,"q":"Reflecting on your own judgements of patients is which part of emotional intelligence?","qh":"<p>Reflecting on your own judgements of patients is which part of emotional intelligence?</p>","qt":"Reflecting on your own judgements of patients is which part of emotional intelligence?","imgs":[],"type":"mcq","authored":1,"opts":["Motivation","Social skills","Self-awareness","Self-regulation"],"key":["Self-awareness"],"src":"the Therapeutic Use of Self deck, slides 26–27","why":"Self-awareness is the accurate assessment and knowledge of self in relation to others: bringing negative evaluations of patients into conscious awareness so their meaning can be explored and corrective action taken. It is the base of the deck’s emotional-intelligence hierarchy."},{"id":"q90eb6bd5b9","quiz":"a-roles","sys":"prof","pts":1,"q":"Primary healthcare is:","qh":"<p>Primary healthcare is:</p>","qt":"Primary healthcare is:","imgs":[],"type":"mcq","authored":1,"opts":["First treatment in the emergency department","Healthcare provided outside the hospital","Care given only by GPs","The most urgent hospital care"],"key":["Healthcare provided outside the hospital"],"src":"the Roles of Nurses deck, slides 10–11","why":"Primary healthcare is healthcare provided outside the hospital. Community-based nursing takes place where clients live, work and play — a school, a work site, a home — with clients from pre-birth to very old age, across the whole continuum from health promotion to care of illness."},{"id":"qb724b2492f","quiz":"a-roles","sys":"prof","pts":1,"q":"In mental health nursing, “recovery” means:","qh":"<p>In mental health nursing, “recovery” means:</p>","qt":"In mental health nursing, “recovery” means:","imgs":[],"type":"mcq","authored":1,"opts":["Living well, with hope at the centre","A complete and permanent cure","Discharge back to the GP","No longer needing medication"],"key":["Living well, with hope at the centre"],"src":"the Roles of Nurses deck, slide 26","why":"The current concept of recovery does not mean “cure” as it does elsewhere in healthcare; it refers to living with mental health problems. Hope is central — it sustains people through distress and supports them in keeping their personal life goals."},{"id":"qa38656890a","quiz":"a-roles","sys":"prof","pts":1,"q":"Using ISBAR, what belongs under “B”?","qh":"<p>Using ISBAR, what belongs under “B”?</p>","qt":"Using ISBAR, what belongs under “B”?","imgs":[],"type":"mcq","authored":1,"opts":["“I think she is becoming septic”","“She is day two after a bowel resection”","“I recommend you review her now”","“Her blood pressure has dropped to 85/50”"],"key":["“She is day two after a bowel resection”"],"src":"the Roles of Nurses deck, slide 29","why":"Introduction/Identify (who and where you are, why you are calling) → Situation (what is happening now) → Background (what led to the situation) → Assessment (what you consider the problem is) → Request/Recommend (what should be done)."},{"id":"qfa453af78a","quiz":"a-rf","sys":"clin","pts":1,"q":"Rheumatic fever is:","qh":"<p>Rheumatic fever is:</p>","qt":"Rheumatic fever is:","imgs":[],"type":"mcq","authored":1,"opts":["A bacterial infection of the heart valves","An auto-immune response to a Group A Strep throat infection","A viral childhood illness","A form of juvenile arthritis"],"key":["An auto-immune response to a Group A Strep throat infection"],"src":"the Rheumatic Fever lecture deck, slides 3–4","why":"Rheumatic fever is a serious auto-immune disease that can affect the heart, joints, brain and skin. It can develop when strep throat, strep skin infections or scarlet fever are not treated properly: the immune system responds to the earlier infection with a generalised inflammatory response in other parts of the body."},{"id":"qd4613ebb74","quiz":"a-rf","sys":"clin","pts":1,"q":"In New Zealand, rheumatic fever mainly affects:","qh":"<p>In New Zealand, rheumatic fever mainly affects:</p>","qt":"In New Zealand, rheumatic fever mainly affects:","imgs":[],"type":"mcq","authored":1,"opts":["Māori and Pacific children and teenagers","Older adults living alone","Babies in day-care","Adults with type 2 diabetes"],"key":["Māori and Pacific children and teenagers"],"src":"the Rheumatic Fever lecture deck, slide 6","why":"Anyone can get rheumatic fever, but it is more common in children and teenagers (aged 4 to 19), and in New Zealand it mainly affects Māori and Pacific children. It is common in families where others have had it, and someone who has had it before is more likely to get it again with another strep throat."},{"id":"q525a0772fe","quiz":"a-rf","sys":"clin","pts":1,"q":"A child develops jerky movements she cannot control two weeks after a sore throat. This is:","qh":"<p>A child develops jerky movements she cannot control two weeks after a sore throat. This is:</p>","qt":"A child develops jerky movements she cannot control two weeks after a sore throat. This is:","imgs":[],"type":"mcq","authored":1,"opts":["Ataxia","Chorea","A febrile seizure","Tetany"],"key":["Chorea"],"src":"the Rheumatic Fever lecture deck, slides 3 and 9; the guest speaker’s Rheumatic Fever deck (Jessica Murray, CNS KidzFirst), slide 6","why":"Chorea — fidgety, jerky movements — is on the lecture’s list of symptoms; the guest speaker calls it uncoordinated movements and jerking. It is the brain being part of the auto-immune inflammation (heart, joints, brain and skin)."},{"id":"qa33d4c7414","quiz":"a-rf","sys":"clin","pts":1,"q":"After rheumatic fever, penicillin injections are given:","qh":"<p>After rheumatic fever, penicillin injections are given:</p>","qt":"After rheumatic fever, penicillin injections are given:","imgs":[],"type":"mcq","authored":1,"opts":["Every 7 days for a year","Every 3 months","Once a year","Every 28 days for at least 10 years"],"key":["Every 28 days for at least 10 years"],"src":"the Rheumatic Fever lecture deck, slides 10–12","why":"To avoid strep throat and rheumatic fever again, a child needs penicillin injections every 28 days for at least 10 years or until they are 21, whichever is longer — longer still if the heart valves are damaged. The first is given before leaving hospital, and penicillin is never stopped without discussing it with the child’s doctor."},{"id":"q62ea56d50e","quiz":"a-rf","sys":"clin","pts":1,"q":"Rheumatic heart disease most often damages which valves?","qh":"<p>Rheumatic heart disease most often damages which valves?</p>","qt":"Rheumatic heart disease most often damages which valves?","imgs":[],"type":"mcq","authored":1,"opts":["Tricuspid and pulmonary","Pulmonary only","Mitral and/or aortic","All four equally"],"key":["Mitral and/or aortic"],"src":"the guest speaker’s Rheumatic Fever deck (Jessica Murray, CNS KidzFirst), slide 8; the Rheumatic Fever lecture deck, slides 15–16","why":"Inflammation in the body scars the heart valves — normally the mitral and/or aortic valve. A damaged valve can leak, letting blood flow the wrong way (heard as a murmur). Carditis ranges from mild to severe and can lead to heart surgery, complications and death; symptoms include breathlessness lying flat or on exertion and lacking energy."},{"id":"qd1a786cf23","quiz":"a-inject","sys":"clin","pts":1,"q":"At what angle is the needle inserted for an intramuscular injection?","qh":"<p>At what angle is the needle inserted for an intramuscular injection?</p>","qt":"At what angle is the needle inserted for an intramuscular injection?","imgs":[],"type":"mcq","authored":1,"opts":["15 degrees","45 degrees","90 degrees","30 degrees"],"key":["90 degrees"],"src":"the CLS page “Inpatient Prep – Injections”, the angles figure and “Intramuscular injections”","why":"Angles of insertion: intramuscular 90°, subcutaneous 45° (90° when 5 cm of tissue can be grasped), intradermal 15°. An IM needle is longer and heavier-gauge, to pass through the subcutaneous tissue into deep muscle."},{"id":"q267eaff3b4","quiz":"a-inject","sys":"clin","pts":1,"q":"An intradermal injection is given into the:","qh":"<p>An intradermal injection is given into the:</p>","qt":"An intradermal injection is given into the:","imgs":[],"type":"mcq","authored":1,"opts":["Muscle","Dermis","Subcutaneous tissue","Vein"],"key":["Dermis"],"src":"the CLS page “Inpatient Prep – Injections”, the list of major injection sites","why":"Intradermal (ID): into the dermis immediately below the epidermis, at 15°. Subcutaneous (SC): into the tissues just below the dermis. Intramuscular (IM): into a muscle. Intravenous (IV): into a vein. All four are parenteral — given by injection, bypassing the skin and mucous membranes."},{"id":"qca36d8a398","quiz":"a-inject","sys":"clin","pts":1,"q":"Which site is most often recommended for heparin and insulin injections?","qh":"<p>Which site is most often recommended for heparin and insulin injections?</p>","qt":"Which site is most often recommended for heparin and insulin injections?","imgs":[],"type":"mcq","authored":1,"opts":["Deltoid","Ventrogluteal","Vastus lateralis","Abdomen"],"key":["Abdomen"],"src":"the CLS page “Inpatient Prep – Injections”, “Subcutaneous injections”","why":"The best subcutaneous sites are the outer posterior upper arms, the abdomen (from below the costal margins to the iliac crests) and the anterior thighs; the abdomen is the site most often recommended for heparin and insulin. The site should be free of skin lesions, bony prominences and large underlying muscles or nerves."},{"id":"qe705795c3e","quiz":"a-inject","sys":"clin","pts":1,"q":"Which intramuscular site is safe for all patients, up to 4 mL?","qh":"<p>Which intramuscular site is safe for all patients, up to 4 mL?</p>","qt":"Which intramuscular site is safe for all patients, up to 4 mL?","imgs":[],"type":"mcq","authored":1,"opts":["Deltoid","Ventrogluteal","Vastus lateralis","Dorsogluteal"],"key":["Ventrogluteal"],"src":"the CLS page “Inpatient Prep – Injections”, “Characteristics of intramuscular injection sites”","why":"Ventrogluteal: safe for all patients, maximum 4 ml — a deep site away from major nerves and blood vessels, with less chance of contamination in incontinent adults or infants, and injuries are rare. The patient lies on their side or back with knee and hip flexed. Vastus lateralis takes up to 5 ml; deltoid 2 ml or less."},{"id":"q2aad53a082","quiz":"a-inject","sys":"clin","pts":1,"q":"Subcutaneous, intramuscular and intradermal injections are avoided in a patient:","qh":"<p>Subcutaneous, intramuscular and intradermal injections are avoided in a patient:</p>","qt":"Subcutaneous, intramuscular and intradermal injections are avoided in a patient:","imgs":[],"type":"mcq","authored":1,"opts":["Who is anxious about needles","Who is nil by mouth","With diabetes","With a bleeding tendency"],"key":["With a bleeding tendency"],"src":"the CLS page “Inpatient Prep – Injections”, the advantages and disadvantages table","why":"The subcut, IM and ID routes are avoided in patients with bleeding tendencies. The page’s other disadvantages: risk of infection, cost, repeated needle-sticks, tissue damage with subcut, rapid absorption making IM and IV dangerous, and considerable anxiety — especially in children."},{"id":"qb81b0d83aa","quiz":"a-phc","sys":"pop","pts":1,"q":"Which of these is a principle of primary health care?","qh":"<p>Which of these is a principle of primary health care?</p>","qt":"Which of these is a principle of primary health care?","imgs":[],"type":"mcq","authored":1,"opts":["Hospital-based specialist care","User-pays services","Community participation","Disease-centred treatment"],"key":["Community participation"],"src":"the Primary Health Care & Health Promotion deck, slides 4, 7 and 9","why":"The Alma-Ata Declaration (1978) set out five principles of primary health care: accessibility, community participation, health promotion, appropriate technology and inter-sectoral collaboration. Primary health care is people-centred rather than disease-centred."},{"id":"q951f1113e0","quiz":"a-phc","sys":"pop","pts":1,"q":"The Alma-Ata Declaration (1978) defined primary health care as essential care that is:","qh":"<p>The Alma-Ata Declaration (1978) defined primary health care as essential care that is:</p>","qt":"The Alma-Ata Declaration (1978) defined primary health care as essential care that is:","imgs":[],"type":"mcq","authored":1,"opts":["Accessible, affordable and appropriate for all","Led by specialists in large hospitals","Free for those who can show need","Paid for through private health insurance schemes"],"key":["Accessible, affordable and appropriate for all"],"src":"the Primary Health Care & Health Promotion deck, slides 6–7","why":"Alma-Ata, the first international conference on primary health care, defined it as essential care that is accessible, affordable and appropriate FOR ALL. It moved away from a medical approach towards human rights, equity and community participation."},{"id":"q1ed0aa2907","quiz":"a-phc","sys":"pop","pts":1,"q":"Public health nurses working with housing and transport to build safe cycle paths is:","qh":"<p>Public health nurses working with housing and transport to build safe cycle paths is:</p>","qt":"Public health nurses working with housing and transport to build safe cycle paths is:","imgs":[],"type":"mcq","authored":1,"opts":["Appropriate technology","Accessibility","Community participation","Inter-sectoral collaboration"],"key":["Inter-sectoral collaboration"],"src":"the Primary Health Care & Health Promotion deck, slides 18–19","why":"Inter-sectoral collaboration is coordinated action across sectors — health, education, housing, transport, social services — to address the broader determinants of health. The deck’s example is public health nurses working with local government, housing and transport on housing conditions and safe walking and cycling paths."},{"id":"q84dc9b3048","quiz":"a-phc","sys":"pop","pts":1,"q":"Which is an upstream approach to health promotion?","qh":"<p>Which is an upstream approach to health promotion?</p>","qt":"Which is an upstream approach to health promotion?","imgs":[],"type":"mcq","authored":1,"opts":["Insulin teaching for a newly diagnosed patient","A blood glucose screening clinic","Legislation limiting tobacco availability","Wound care in a district nursing clinic"],"key":["Legislation limiting tobacco availability"],"src":"the Primary Health Care & Health Promotion deck, slides 34 and 39–42","why":"Upstream approaches address the root causes — social, economic and environmental conditions — through policy and community engagement, before health issues start. Screening and education are midstream (changing individual behaviour once issues have started); treating people already unwell is downstream. The deck’s policy example is the Smokefree Environments and Regulated Products (Smoked Tobacco) Amendment Act 2022."},{"id":"qe11e9d585e","quiz":"a-phc","sys":"pop","pts":1,"q":"The “Slip, Slop, Slap and Wrap” campaign is which part of the health promotion continuum?","qh":"<p>The “Slip, Slop, Slap and Wrap” campaign is which part of the health promotion continuum?</p>","qt":"The “Slip, Slop, Slap and Wrap” campaign is which part of the health promotion continuum?","imgs":[],"type":"mcq","authored":1,"opts":["Influencing policy","Social marketing","Community action","Health screening"],"key":["Social marketing"],"src":"the Primary Health Care & Health Promotion deck, slides 29 and 33","why":"The health promotion continuum runs health education, health screening, community action, social marketing and influencing policy. Social marketing uses marketing strategies to influence health behaviours for the public good, raising awareness through media; Slip, Slop, Slap and Wrap promotes sun safety to reduce New Zealand’s high skin cancer rates."},{"id":"q73dc01dd1b","quiz":"a-screen","sys":"pop","pts":1,"q":"A false-negative screening result can lead to:","qh":"<p>A false-negative screening result can lead to:</p>","qt":"A false-negative screening result can lead to:","imgs":[],"type":"mcq","authored":1,"opts":["Increased anxiety and further tests","False reassurance and delayed diagnosis","An immediate diagnosis of the condition","Referral for a colonoscopy"],"key":["False reassurance and delayed diagnosis"],"src":"the Health Screening deck, slide 9","why":"A false negative puts a person who DOES have the condition in the lower-chance group: it gives false reassurance and delays diagnosis and treatment. A false positive is the reverse — increased anxiety and referral for diagnostic tests."},{"id":"q348c4dde1c","quiz":"a-screen","sys":"pop","pts":1,"q":"A person with a positive screening result will be:","qh":"<p>A person with a positive screening result will be:</p>","qt":"A person with a positive screening result will be:","imgs":[],"type":"mcq","authored":1,"opts":["Diagnosed with the condition","Re-screened in five years","Discharged from the programme","Offered a diagnostic test"],"key":["Offered a diagnostic test"],"src":"the Health Screening deck, slides 6 and 15–16","why":"Screening does not give a diagnosis. A positive result means an increased chance of the condition, so the person is offered a diagnostic test; a negative result means no diagnostic test, though they may be invited back for screening later."},{"id":"q761b778254","quiz":"a-screen","sys":"pop","pts":1,"q":"Student nurses check blood pressures at a wellness clinic in a school. This is:","qh":"<p>Student nurses check blood pressures at a wellness clinic in a school. This is:</p>","qt":"Student nurses check blood pressures at a wellness clinic in a school. This is:","imgs":[],"type":"mcq","authored":1,"opts":["Opportunistic screening","Organised screening","A diagnostic test","Diagnostic testing for hypertension"],"key":["Opportunistic screening"],"src":"the Health Screening deck, slides 24–26","why":"Opportunistic screening happens when a person asks for a check, or a health professional — such as MIT student nurses — offers one. Organised screening is a national programme that invites set population groups, overseen by the National Screening Unit."},{"id":"qcd4ac0cff0","quiz":"a-screen","sys":"pop","pts":1,"q":"BreastScreen Aotearoa offers free mammograms every two years to women aged:","qh":"<p>BreastScreen Aotearoa offers free mammograms every two years to women aged:</p>","qt":"BreastScreen Aotearoa offers free mammograms every two years to women aged:","imgs":[],"type":"mcq","authored":1,"opts":["25–69","45–69","50–74","60–74"],"key":["45–69"],"src":"the Health Screening deck, slide 19","why":"BreastScreen Aotearoa: free mammograms every 2 years for asymptomatic women aged 45–69 who are eligible for public health services (not pregnant, no mammogram in the last 12 months). Women with symptoms are referred through their GP."},{"id":"qc861549be0","quiz":"a-screen","sys":"pop","pts":1,"q":"The newborn metabolic screening heel-prick test is taken:","qh":"<p>The newborn metabolic screening heel-prick test is taken:</p>","qt":"The newborn metabolic screening heel-prick test is taken:","imgs":[],"type":"mcq","authored":1,"opts":["Before the cord is cut","At the six-week check","At 24–48 hours after birth","Before school entry"],"key":["At 24–48 hours after birth"],"src":"the Health Screening deck, slide 22","why":"The heel-prick blood spot is taken 24–48 hours after birth and screens for rare but treatable metabolic and genetic disorders such as cystic fibrosis. It is free for every baby born in New Zealand, optional but strongly recommended; results come back within 10 days."},{"id":"q94aa751ed3","quiz":"a-cna","sys":"pop","pts":3,"q":"What is a windscreen survey? Give two things a nurse would look for, and state whether the information is primary or secondary data.","qh":"<p>What is a windscreen survey? Give two things a nurse would look for, and state whether the information is primary or secondary data.</p>","qt":"What is a windscreen survey? Give two things a nurse would look for, and state whether the information is primary or secondary data.","imgs":[],"type":"essay","authored":1,"saq":{"steps":["A quick overview (“snapshot”) of a community gained by driving through it and observing, taking notes to analyse later — the aim is a general sense of its strengths and needs.","Any two of: parks and recreation spaces · schools and childcare · shops, supermarkets and food access · housing conditions · transport and access · clinics, hospitals and pharmacies · visible health behaviours such as people out walking.","It is PRIMARY data — what you observe yourself. It should then be confirmed by talking with community groups and by records such as immunisation rates and public health indicators."],"src":"Question and model answer are the tool’s · from the Community Needs Assessment Framework deck, slides 27, 29 and 30"}},{"id":"q405648f0e0","quiz":"a-tikanga","sys":"prof","pts":3,"q":"Define Kawa Whakaruruhau (cultural safety) and state two things it requires of the nurse.","qh":"<p>Define Kawa Whakaruruhau (cultural safety) and state two things it requires of the nurse.</p>","qt":"Define Kawa Whakaruruhau (cultural safety) and state two things it requires of the nurse.","imgs":[],"type":"essay","authored":1,"saq":{"steps":["Definition: cultural safety is care that is judged safe by the RECIPIENT of care — the person’s and whānau experience defines the quality of the care, with the aim of equitable outcomes for Māori.","It requires critical self-reflection: the nurse examines how their own biases and attitudes affect their relationships with individuals, whānau and other health professionals.","It requires the nurse to recognise and address power imbalance, bias and racism — nurses are inadvertent bearers of power — and it goes beyond cultural awareness, sensitivity or competence."],"src":"Question and model answer are the tool’s · from the Tikanga Best Practice and Kawa Whakaruruhau deck, slides 2 and 6"}},{"id":"qd7c1545086","quiz":"a-pain","sys":"care","pts":4,"q":"OLDCARTS is the structured pain assessment tool taught in this course. State what each of its eight letters stands for.","qh":"<p>OLDCARTS is the structured pain assessment tool taught in this course. State what each of its eight letters stands for.</p>","qt":"OLDCARTS is the structured pain assessment tool taught in this course. State what each of its eight letters stands for.","imgs":[],"type":"essay","authored":1,"saq":{"steps":["O = Onset (when did it start?) · L = Location (where is it? does it radiate?)","D = Duration (how long does it last? does it come and go?) · C = Characteristics (what does it feel like?)","A = Aggravating factors (what makes it worse?) · R = Relieving factors (what makes it better — medications and other interventions)","T = Timing (pattern or frequency, day or night) · S = Severity (rated with an appropriate pain scale, e.g. 0–10 at rest and on movement)"],"src":"Question and model answer are the tool’s · from the Pain Assessment deck, slides 33–42"}},{"id":"q24f27c30de","quiz":"a-fcc","sys":"care","pts":3,"q":"Name the three elements of facilitating family-centred care and give one nursing action for each.","qh":"<p>Name the three elements of facilitating family-centred care and give one nursing action for each.</p>","qt":"Name the three elements of facilitating family-centred care and give one nursing action for each.","imgs":[],"type":"essay","authored":1,"saq":{"steps":["Relationship — establish a genuine, positive, mutually respectful partnership: find common ground, invest time in building trust, and (with the person’s permission) share relevant information.","Participation and involvement — enable the person and family to take part in care in a way that respects their autonomy: involve them in care, keep up communication, find out what is important to them.","Tailoring care — design care around the person’s and family’s needs, strengths, limitations and context: help them make informed decisions and plan care that is realistic (early intervention, health promotion, discharge planning)."],"src":"Question and model answer are the tool’s · from the Family Centred Care deck, slides 27–29 and 31–35"}},{"id":"q96c41cc04a","quiz":"a-nzhs","sys":"pop","pts":3,"q":"Define health equity, explain how it differs from equality, and name one group the New Zealand Health Strategy prioritises for equity.","qh":"<p>Define health equity, explain how it differs from equality, and name one group the New Zealand Health Strategy prioritises for equity.</p>","qt":"Define health equity, explain how it differs from equality, and name one group the New Zealand Health Strategy prioritises for equity.","imgs":[],"type":"essay","authored":1,"saq":{"steps":["Health equity: everyone has a fair and just opportunity to be as healthy as possible — which means removing obstacles to health such as poverty, discrimination and their consequences.","Difference: equality gives everyone the SAME resources; equity gives people what they NEED in order to reach similar outcomes.","Any one of: Māori · Pacific peoples · disabled people · other groups with poorer outcomes (the deck also names rural and low-income communities). In the strategy equity rests on ōritetanga from Te Tiriti o Waitangi."],"src":"Question and model answer are the tool’s · from the New Zealand Health Strategy 2023 deck, slides 5, 9–10 and 16"}},{"id":"q4f37b4878a","quiz":"a-discharge","sys":"care","pts":3,"q":"Define discharge planning and state two benefits of doing it well.","qh":"<p>Define discharge planning and state two benefits of doing it well.</p>","qt":"Define discharge planning and state two benefits of doing it well.","imgs":[],"type":"essay","authored":1,"saq":{"steps":["Definition: an interdisciplinary approach to continuity of care — a process (identification, assessment, goal setting, planning, implementation, coordination, evaluation) that helps a person move smoothly from one setting or level of care to another without losing the progress already made. It begins at admission.","Benefit (any two, one mark each): fewer readmissions · shorter length of hospital stay · less follow-up community care needed.","Also accepted as a benefit: the patient and family leave understanding their medicines, warning signs, follow-up and who to contact — a safe link between hospital, community services and carers."],"src":"Question and model answer are the tool’s · from the Discharge Planning deck, slides 3, 6, 8 and 10"}},{"id":"qf6ebfc539d","quiz":"a-tus","sys":"prof","pts":3,"q":"Define surface acting and deep acting, and say which component of emotional intelligence they belong to.","qh":"<p>Define surface acting and deep acting, and say which component of emotional intelligence they belong to.</p>","qt":"Define surface acting and deep acting, and say which component of emotional intelligence they belong to.","imgs":[],"type":"essay","authored":1,"saq":{"steps":["Surface acting: outwardly expressing an emotion you do not feel because the situation needs it — “putting on a mask” (“I don’t feel calm or kind, but I act calm and kind anyway”).","Deep acting: a real shift in how the nurse feels, reached by actively trying to understand the situation from the patient’s perspective.","Both are forms of emotional labour, which belongs to SELF-REGULATION — nurses still feel emotions, but not so intensely that they cannot function."],"src":"Question and model answer are the tool’s · from the Therapeutic Use of Self deck, slides 28–29"}},{"id":"qce7c3bfad3","quiz":"a-roles","sys":"prof","pts":5,"q":"State what each part of the ISBAR handover tool stands for and what the nurse says under it.","qh":"<p>State what each part of the ISBAR handover tool stands for and what the nurse says under it.</p>","qt":"State what each part of the ISBAR handover tool stands for and what the nurse says under it.","imgs":[],"type":"essay","authored":1,"saq":{"steps":["I — Introduction / Identify: who you are, where you are, why you are calling (and is this a good time to talk?).","S — Situation: what is happening now — “The situation is…”.","B — Background: what led to the situation — “By way of background…”.","A — Assessment: what you consider the problem to be — “My assessment is…”.","R — Request / Recommend: what should be done to correct the problem — “I recommend…”."],"src":"Question and model answer are the tool’s · from the Roles of Nurses deck, slide 29"}},{"id":"q5ccbdd42fa","quiz":"a-rf","sys":"clin","pts":4,"q":"A 12-year-old is going home after treatment for rheumatic fever. Describe the ongoing management and protection the nurse would teach the child and their whānau.","qh":"<p>A 12-year-old is going home after treatment for rheumatic fever. Describe the ongoing management and protection the nurse would teach the child and their whānau.</p>","qt":"A 12-year-old is going home after treatment for rheumatic fever. Describe the ongoing management and protection the nurse would teach the child and their whānau.","imgs":[],"type":"essay","authored":1,"saq":{"steps":["Penicillin injections every 28 days for at least 10 years or until age 21, whichever is longer; the first is given before leaving hospital.","Never miss or stop them without the doctor: on holiday or moving, get it early or arranged elsewhere; district nurses can give it at school, at home or in a clinic.","Extra antibiotic cover before medical procedures, operations or dental visits, and carry the rheumatic fever wallet card to show the dentist or doctor.","Get every sore throat checked; good dental hygiene; regular exercise once the doctor says it is safe; a healthy weight; be smoke-free."],"src":"Question and model answer are the tool’s · from the Rheumatic Fever lecture deck, slides 10–14; the guest speaker’s Rheumatic Fever deck (Jessica Murray, CNS KidzFirst), slide 13"}},{"id":"q24514917c6","quiz":"a-ltc","sys":"clin","pts":3,"q":"Define a long-term condition, self-management, and self-management support.","qh":"<p>Define a long-term condition, self-management, and self-management support.</p>","qt":"Define a long-term condition, self-management, and self-management support.","imgs":[],"type":"essay","authored":1,"saq":{"steps":["Long-term condition: any condition lasting, or expected to last, longer than 6 months — ongoing or recurring — with a significant impact on people’s lives (also called NCDs or chronic conditions).","Self-management: any way in which a person with an LTC manages their condition(s) themselves — an ongoing process, not a one-time event.","Self-management support: the help, tools and techniques given to people with LTCs to manage their health day to day — educating and motivating them, in a collaborative partnership."],"src":"Question and model answer are the tool’s · from the Long-term Conditions lecture deck (Self-management support for people with long-term conditions 2026), slides 3, 6–7, 13 and 45"}},{"id":"q66b40d9553","quiz":"a-inject","sys":"clin","pts":4,"q":"Name the four parenteral injection routes. For each, say where the medicine is deposited and, where the CLS Inpatient Prep page gives one, the needle angle.","qh":"<p>Name the four parenteral injection routes. For each, say where the medicine is deposited and, where the CLS Inpatient Prep page gives one, the needle angle.</p>","qt":"Name the four parenteral injection routes. For each, say where the medicine is deposited and, where the CLS Inpatient Prep page gives one, the needle angle.","imgs":[],"type":"essay","authored":1,"saq":{"steps":["Intradermal (ID): into the dermis, just below the epidermis — 15°.","Subcutaneous (SC): into the tissue just below the dermis — 45°, or 90° if 5 cm of tissue can be grasped.","Intramuscular (IM): into a muscle — 90°.","Intravenous (IV): into a vein."],"src":"Question and model answer are the tool’s · from the CLS page “Inpatient Prep – Injections”, the list of injection sites, the angles figure and “Subcutaneous injections”"}},{"id":"q3307488a1c","quiz":"a-phc","sys":"pop","pts":3,"q":"Name the five principles of primary health care from the Alma-Ata Declaration, and describe two of them with a nursing example.","qh":"<p>Name the five principles of primary health care from the Alma-Ata Declaration, and describe two of them with a nursing example.</p>","qt":"Name the five principles of primary health care from the Alma-Ata Declaration, and describe two of them with a nursing example.","imgs":[],"type":"essay","authored":1,"saq":{"steps":["The five principles (Alma-Ata Declaration, 1978): accessibility, community participation, health promotion, appropriate technology and inter-sectoral collaboration.","Accessibility, the first and most important: health services are available, affordable and reachable for all, regardless of location or socioeconomic status — e.g. rural health nurses bringing care to remote communities.","A second, any one of: community participation — the community is involved in planning, implementing and maintaining its health services (Whānau Ora nurses); health promotion — enabling people to increase control over their health (school nurses); appropriate technology — affordable, sustainable and culturally acceptable (telehealth); inter-sectoral collaboration — health working with education, housing and transport (public health nurses)."],"src":"Question and model answer are the tool’s · from the Primary Health Care & Health Promotion deck, slides 7 and 9–19"}},{"id":"q1bc2c12197","quiz":"a-phc","sys":"pop","pts":3,"q":"Health promotion can be upstream, midstream or downstream. Describe each approach and give a nursing intervention for each.","qh":"<p>Health promotion can be upstream, midstream or downstream. Describe each approach and give a nursing intervention for each.</p>","qt":"Health promotion can be upstream, midstream or downstream. Describe each approach and give a nursing intervention for each.","imgs":[],"type":"essay","authored":1,"saq":{"steps":["Upstream: addresses the root causes of health issues — social, economic and environmental conditions — through policy and community engagement, to prevent health issues before they start; e.g. policy changes, community development, improving living conditions.","Midstream: modifies individual behaviours and lifestyle factors once issues have started to show, to stop them getting worse; e.g. screenings, referrals, support services, health education and social marketing.","Downstream: clinical care and treatment for people already experiencing health problems; e.g. managing chronic conditions such as diabetes or hypertension, acute care, administering medications, rehabilitation."],"src":"Question and model answer are the tool’s · from the Primary Health Care & Health Promotion deck, slides 37–47"}},{"id":"q1b6d6b9dab","quiz":"a-screen","sys":"pop","pts":4,"q":"Explain the purpose of health screening, the difference between organised and opportunistic screening, and the nurse’s role in screening.","qh":"<p>Explain the purpose of health screening, the difference between organised and opportunistic screening, a
