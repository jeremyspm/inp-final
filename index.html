s":[{"t":"**Māori**, **Pacific peoples** or **disabled people**","of":[2]},{"t":"Equity rests on **ōritetanga** from **Te Tiriti o Waitangi**","of":[2]}]}]},"q3a774d2cfe":{"id":"w-pop:define the social determinants","title":"Social determinants of health","hook":"Where you are born, live, work and age shapes your health.","groups":[{"q":"Define them","facts":[{"t":"The conditions people are **born, grow, live, work and age** in","of":[0]},{"t":"They set **social position**: access to **power, money and resources**","of":[0]},{"t":"They account for **at least half** of health outcomes","of":[0]}]},{"q":"Two examples, with the effect","facts":[{"t":"**Housing**: **cold, damp, overcrowded** homes → **respiratory illness**","of":[1]},{"t":"**Food environments**: **food deserts** → **obesity**, **type 2 diabetes**","of":[1]},{"t":"**Work**: **insecure or unsafe** work → physical and **mental health risk**","of":[2]},{"t":"**Transport**: poor public transport **limits access** to care","of":[2]}]}]},"qdb011b35e5":{"id":"w-pop:the waitangi tribunal","title":"Te Tiriti: the five health principles","hook":"Self-determination, equity, active protection, options, partnership.","groups":[{"q":"The five principles","facts":[{"t":"**Tino rangatiratanga**: **self-determination**; Māori **lead** Māori health","of":[0]},{"t":"**Mana taurite**: **equity**, resources where **need is greatest**","of":[1]},{"t":"**Whakamarumarutia**: **active protection**; health is a **taonga**","of":[2]},{"t":"**Kōwhiringa**: **options**, including **kaupapa Māori services**","of":[3]},{"t":"**Pātuitanga**: **partnership** in planning, delivering and evaluating","of":[4]},{"t":"The old **“three Ps”** are **outdated**","of":[4]}]}]},"q6d84562104":{"id":"w-pop:define primordial","title":"The four levels of prevention","hook":"Before the risk, before the disease, catch it early, stop it worsening.","groups":[{"q":"Each level, with an example","facts":[{"t":"**Primordial**: stop **risk factors from developing**; e.g. **Healthy Homes Initiative**","of":[0]},{"t":"**Primary** (“**Prevent**”): **before the onset**; e.g. **vaccination**","of":[1]},{"t":"**Secondary** (“**Screen**”): **detect disease early**; e.g. **cervical screening**","of":[2]},{"t":"**Tertiary** (“**Treatment**”): stop it **worsening**; e.g. an **insulin regime**","of":[3]}]}]},"qce7c3bfad3":{"id":"a-roles:state what each part of the isbar","title":"ISBAR: what each part stands for","hook":"Who I am, what’s happening, what led here, what I think, what I want.","groups":[{"q":"Each part, and what you say","facts":[{"t":"I · **Introduction** / **Identify**: who and where you are, why calling","of":[0]},{"t":"S · **Situation**: what is happening **now**","of":[1]},{"t":"B · **Background**: what **led to** the situation","of":[2]},{"t":"A · **Assessment**: what you consider **the problem** to be","of":[3]},{"t":"R · **Request** / **Recommend**: what should be done","of":[4]}]}]},"qf6ebfc539d":{"id":"a-tus:define surface acting","title":"Surface acting and deep acting","hook":"Surface = a mask. Deep = a real change of heart.","groups":[{"q":"Define them","facts":[{"t":"**Surface acting**: **expressing an emotion you do not feel**","of":[0]},{"t":"“**Putting on a mask**”","of":[0]},{"t":"**Deep acting**: a **real shift in how the nurse feels**","of":[1]},{"t":"… reached by seeing it from the **patient’s perspective**","of":[1]}]},{"q":"Which component?","facts":[{"t":"Both are **emotional labour**, which belongs to **self-regulation**","of":[2]}]}]},"q405648f0e0":{"id":"a-tikanga:define kawa whakaruruhau","title":"Kawa Whakaruruhau (cultural safety)","hook":"The PATIENT decides whether the care was safe, not the nurse.","groups":[{"q":"Define it","facts":[{"t":"Care **judged safe by the recipient** of care","of":[0]},{"t":"Aim: **equitable outcomes for Māori**","of":[0]}]},{"q":"Two things it requires","facts":[{"t":"**Critical self-reflection**: how your **own biases** affect relationships","of":[1]},{"t":"Recognising and addressing **power imbalance**, **bias and racism**","of":[2]},{"t":"It goes **beyond cultural awareness**, sensitivity or competence","of":[2]}]}]},"qbc6c2ac958":{"id":"w-prof:define informed consent","title":"Informed consent and the two laws","hook":"A PROCESS, not a signature. Code Right 7 + Bill of Rights s 11.","groups":[{"q":"Define it","facts":[{"t":"A **process** of communicating the **benefits, risks and alternatives**","of":[0]},{"t":"So the patient makes an **informed decision**: **more than a signature**","of":[0]}]},{"q":"The two laws","facts":[{"t":"The **Code of Health and Disability Services Consumers’ Rights**, **Right 7**","of":[1]},{"t":"The **Bill of Rights Act 1990**, **section 11**: the **right to refuse**","of":[2]}]}]},"q0bc7ba99d3":{"id":"w-prof:who can give consent","title":"Who can consent to treatment in NZ","hook":"16 and over: yourself. Under 16: a parent. Not competent: a guardian or attorney.","groups":[{"q":"Each person","facts":[{"t":"An adult: anyone **16 or over** can **consent to or refuse**","of":[0]},{"t":"A 14-year-old: a **parent, guardian** (or a **court order**)","of":[1]},{"t":"An adult **not competent**: a **legal guardian** or **enduring power of attorney**","of":[2]},{"t":"Still act in their **best interests**; find out **their views**","of":[2]}]}]},"q49db232e0a":{"id":"w-prof:define evidence based practice","title":"Evidence-based practice: the three parts","hook":"Evidence + expertise + the patient.","groups":[{"q":"Define it","facts":[{"t":"A shift away from **opinion and past practice**","of":[0]},{"t":"… to **research and evidence** guiding decisions, to **improve patient outcomes**","of":[0]}]},{"q":"It integrates","facts":[{"t":"The **best research evidence**","of":[1]},{"t":"**Clinical expertise**","of":[1]},{"t":"The **patient’s values and preferences**","of":[2]}]}]}};
for(const q of DATA.questions) if(SHORTS[q.id]){
  q.short = SHORTS[q.id];
  const F = q.short.groups.flatMap(g=>g.facts);
  q.saq = {...q.saq, full:q.saq.steps, steps:F.map(f=>f.t.replace(/\*\*/g,'')+(f.fix?` (⚠ corrected: ${f.fix.split('. ')[0]})`:''))};
  /* a step's quote (q.prefs, judged per step of the full answer) moves with its step: it shows under the FIRST short line
     cut from that step (f.of), never under whichever line happens to share the step's number (hs2-final's 26 Sep bug). A
     step with no line of its own (a sub-question heading) hands its quote to the answer that follows it; the same quote
     twice under one line shows once. */
  if(q.prefs){
    const n = q.saq.full.length, line = s => F.findIndex(f=>f.of.includes(s)), seen = new Set();
    const at = s => { for(let t=s; t<n; t++) if(line(t)>=0) return line(t); for(let t=s-1; t>=0; t--) if(line(t)>=0) return line(t); return -1; };
    q.prefs = q.prefs.map(p=>({...p, i:at(p.i-1)+1})).filter(p=>{ const k=p.i+'|'+p.t; return p.i>0 && !seen.has(k) && seen.add(k); });
  }
}
/* the full model answer, folded under a short answer's tick list (every model answer in this pipeline is the tool's) */
const fullAns = q => q.saq&&q.saq.full ? `<details class="hlans"><summary>📄 The full answer (this tool’s)</summary><div class="hlbody">${q.saq.full.map(s=>esc(s)).join(String.fromCharCode(10))}</div></details>` : '';
/* ── state ─────────────────────────────────────────────────────────── */
const LS = k => { try { return JSON.parse(localStorage.getItem(META.prefix+k)) } catch(e){ return null } };
const SV = (k,v) => { try { localStorage.setItem(META.prefix+k, JSON.stringify(v)) } catch(e){} };
let S = {
  scores: LS('scores')||[],   // {t, mode, got, tot, label}
  miss:   LS('miss')  ||{},   // qid -> wrong count
  seen:   LS('seen')  ||{},   // qid -> sittings
  mastery:LS('mastery')||{}, // focus topic id -> 1 when he can do it
  n:      LS('n')||12,       // how many a Learn deal hands out: 12 | 25 | 50 | 100 | 'all'
  pick:   LS('pick')||[],    // quiz ids ticked under Pick my rep, in tick order
};
if(![12,25,50,100,'all'].includes(S.n)) S.n = 12;
S.pick = (Array.isArray(S.pick)?S.pick:[]).filter(id=>DATA.quizzes.some(z=>z.id===id));
/* The sitting date is PER VIEWER: META.sitting.date is the default, and anyone with an
   extension or a different slot taps the countdown and sets their own, kept in their own
   browser. META.sitting.cohortClose (optional) is named in the prompt when it differs. */
const COHORT_CLOSE = META.sitting.cohortClose || null;
const DEFAULT_SITTING = META.sitting.date;
const sittingISO = () => LS('testday') || DEFAULT_SITTING;
const TESTDAY = () => new Date(sittingISO() + 'T12:00:00+12:00');
const daysLeft = () => Math.max(0, Math.ceil((TESTDAY() - Date.now())/864e5));
const sittingLabel = () => new Date(sittingISO() + 'T12:00:00+12:00')
  .toLocaleDateString('en-NZ', { day: 'numeric', month: 'short' });
function askSitting(){
  const cur = sittingISO();
  const v = prompt('When do you sit ' + META.sitting.what + '?  (YYYY-MM-DD)\n\n'
    + (COHORT_CLOSE ? 'The cohort window closes ' + COHORT_CLOSE + '. ' : '')
    + 'Set your own date if you have an extension or a different slot.', cur);
  if(!v) return;
  const t = v.trim();
  if(!/^\d{4}-\d{2}-\d{2}$/.test(t) || isNaN(new Date(t + 'T12:00:00+12:00'))){
    alert('Use the form YYYY-MM-DD, e.g. ' + DEFAULT_SITTING + '.'); return;
  }
  SV('testday', t); paintCountdown();
  if(document.querySelector('#fhead')) home();
}
function paintCountdown(){
  const el = $('#countdown'); if(!el) return;
  el.textContent = `${daysLeft()}d to your sitting · ${sittingLabel()}`;
  el.title = 'Your sitting is ' + sittingISO() + (COHORT_CLOSE ? '. The cohort window closes ' + COHORT_CLOSE : '')
           + '. Click to change yours — it is saved in this browser only.';
  el.style.cursor = 'pointer';
  el.onclick = askSitting;
}
const $ = s => document.querySelector(s);
/* this tool's identity (META.tool): the four Paper Sims share one layout, so the name, colour and tab icon are what tell them apart */
const TOOL = Object.assign({kick:'Paper Sim', name:META.h1, sub:'', icon:'📝', hue:'#4f46e5'}, META.tool||{});
function paintTool(){
  document.documentElement.style.setProperty('--tool', TOOL.hue);
  const svg = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64"><rect width="64" height="64" rx="14" fill="${TOOL.hue}"/><text x="32" y="45" font-size="38" text-anchor="middle">${TOOL.icon}</text></svg>`;
  let l = document.querySelector('link[rel=icon]');
  if(!l){ l = document.createElement('link'); l.rel = 'icon'; document.head.appendChild(l); }
  l.href = 'data:image/svg+xml,' + encodeURIComponent(svg);
}
const idWhen = () => { const n = daysLeft(); return n > 0 ? `${n} day${n === 1 ? '' : 's'} to your sitting · ${sittingLabel()}` : `Your sitting · ${sittingLabel()}`; };
const idCard = () => `<div class="idcard"><span class="idic" aria-hidden="true">${TOOL.icon}</span><span class="idtx"><small>${TOOL.kick}</small><b>${TOOL.name}</b><span>${TOOL.sub}</span><span class="idwhen">${idWhen()}</span></span></div>`;
const esc = s => String(s??'').replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const shuffle = a => { a=a.slice(); for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]} return a };
const SYS = META.sys;
const SYSKEYS = Object.keys(SYS).filter(k=>k!=='mixed');             // the groups that get their own buttons
const sysTag = s => (META.sysShort||{})[s] || (s==='authored'?'written':s);   // the short word on a tag or button

/* ── dealing ───────────────────────────────────────────────────────── */
const CLOSED = DATA.questions.filter(q=>!q.saq);
/* a question flagged nm stays in the bank (Learn, Pick my rep) but is never dealt into a
   MOCK paper — course-admin questions that are not exam material (sim.config.mjs NO_MOCK) */
const MOCKABLE = CLOSED.filter(q=>!q.nm);
const ESSAYS = DATA.questions.filter(q=>q.saq);
const MOCK_ESSAYS = ESSAYS.filter(q=>!q.nm);   // written questions a mock may deal (authored noMock stays out)
/* a written answer's marks per ticked line. `saq.any = k`: the model answer lists alternatives and any k of them earn the
   marks (content/hers.js), so a line is worth pts/k and the question never scores past its marks */
const saqPt = q => q.pts/(q.saq.any||q.saq.steps.length);
const saqGot = (q,nTicked) => Math.min(q.pts, nTicked*saqPt(q));
const anyNote = q => q.saq&&q.saq.any?`<div class="note">The model answer lists alternatives — any ${q.saq.any} of them earn${q.saq.any===1?'s':''} the ${q.pts} mark${q.pts===1?'':'s'}.</div>`:'';
function pickN(pool, n, excl){
  const fresh = pool.filter(q=>!excl.has(q.id));
  /* Least-seen first: rank = times dealt, so nothing repeats an (n+1)th time
     until the whole pool has been dealt n times. Misses jump the queue (-2).
     Among equally-seen questions the lecturer's own come before the tool's
     (+0.5), and Math.random() only breaks ties within each. */
  const rank = q => (S.miss[q.id]?-2:0) + (S.seen[q.id]||0) + (q.authored?0.5:0) + Math.random()/2;
  return fresh.sort((a,b)=>rank(a)-rank(b)).slice(0,n);
}
function dealStratified(n, pool=MOCKABLE){
  const out=[], excl=new Set();
  /* shares are DERIVED from the bank — her revealed question distribution —
     never typed. Announced emphasis does not get a vote. */
  const share = {};
  for(const q of pool) share[q.sys]=(share[q.sys]||0)+1/pool.length;
  for(const sys of Object.keys(share)){
    const want=Math.round(n*(share[sys]||0));
    for(const q of pickN(pool.filter(x=>x.sys===sys), want, excl)){ out.push(q); excl.add(q.id); }
  }
  while(out.length<n){
    const q=pickN(pool, 1, excl)[0]; if(!q)break; out.push(q); excl.add(q.id);
  }
  return shuffle(out).slice(0,n);
}
/* How many a Learn deal hands out is HIS call (the chips on the Learn door), saved in this
   browser. 'all' is the whole pool, least-seen first — so a run that stops halfway and is
   dealt again leads with the questions it never reached. A mock test keeps its own size. */
const NOPTS = [12,25,50,100,'all'];
const CAP = () => S.n==='all' ? Infinity : S.n;
const howMany = pool => Math.min(CAP(), pool);
function dealMini(n=META.shape.mini||12, pool=MOCKABLE){ return dealStratified(n, pool) }
function dealSys(s,n){ return shuffle(pickN(CLOSED.filter(q=>q.sys===s), n, new Set())) }
/* the full mock is the REAL paper's shape (META.shape): that many closed questions, then
   the written section — one case-study question per case pack, rotating with each full
   sitting, and the rest from the written questions, least-seen first. A bank with fewer
   written questions than the paper has deals what it has; the home screen says so. */
function dealFull(){
  const closed = dealStratified(META.shape.closed);
  const nth = S.scores.filter(s=>s.mode==='full').length;
  if(META.shape.saqMarks){
    /* the paper publishes marks, not a count: deal least-seen written questions, spread
       across the groups, until their marks reach the total (never past it by a whole question) */
    const out=[]; let m=0; const used=new Set();
    const ranked=pickN(MOCK_ESSAYS, MOCK_ESSAYS.length, new Set());
    /* when the paper ALSO publishes the count (shape.saq), stop at that many, and leave at least a mark for each slot
       still to fill — 11 questions for 20 marks cannot open on a run of 3-markers */
    const N=META.shape.saq||Infinity, room=()=>META.shape.saqMarks-m-(N===Infinity?0:N-out.length-1);
    /* second pass: no question smaller than the marks still owed per open slot, so a run of 1-markers cannot fill
       the count short of the marks; the third takes whatever still fits */
    const owed=()=>N===Infinity?0:Math.floor((META.shape.saqMarks-m)/(N-out.length));
    for(let pass=0; pass<3 && m<META.shape.saqMarks && out.length<N; pass++) for(const q of ranked){
      if(used.has(q.id)||q.pts>room()) continue;
      if(pass===1 && q.pts<owed()) continue;
      /* first pass: one per topic (group, not quiz row — a lecturer's mini-exam is one row across every topic,
         so one per row would cap her questions at one per mini-exam and fill the rest with the tool's) */
      if(!pass && out.some(x=>x.sys===q.sys)) continue;
      out.push(q); used.add(q.id); m+=q.pts; if(m>=META.shape.saqMarks||out.length>=N) break; }
    return closed.concat(shuffle(out));
  }
  const saqs = (DATA.cases||[]).slice(0, META.shape.saq).map(c=>mkCaseQ(c, c.questions[nth % c.questions.length]));
  const rest = Math.max(0, META.shape.saq - saqs.length);
  return closed.concat(saqs, shuffle(pickN(MOCK_ESSAYS, rest, new Set())));
}
function mkCaseQ(c, cq){
  return { id:'case-'+c.id+'-'+cq.q.slice(0,24).replace(/\W/g,''), quiz:'case:'+c.id, sys:c.sys, type:'essay',
    pts:cq.marks, q:cq.q, imgs:[], saq:{steps:cq.steps, src:c.name+' — model answer is the tool’s'},
    scenario: c.scenario };
}
const FULL_SAQ = () => Math.min(META.shape.saq||0, (DATA.cases||[]).length + MOCK_ESSAYS.length);
/* the misses pile, worst first: once four or more have been missed twice, only those */
function missPool(){
  let ids = Object.keys(S.miss).filter(id=>S.miss[id]>=2);
  if(ids.length<4) ids = Object.keys(S.miss);
  return CLOSED.filter(q=>ids.includes(q.id));
}
function dealMisses(n=12){ return shuffle(missPool()).slice(0,n) }
/* the ticked quizzes, whole (written questions included), in the order the list shows
   them — one run, no cap: you chose the quizzes, you get their questions */
function dealPick(){
  const on = new Set(S.pick);
  return DATA.quizzes.filter(z=>on.has(z.id)).flatMap(z=>DATA.questions.filter(q=>q.quiz===z.id));
}

const FTIER = {

  const rows = t => DATA.focus.filter(f=>f.tier===t).map(f=>{

      <input type="checkbox" class="fchk" ${on?'checked':''} aria-label="I can do this: ${esc(f.t)}">

      </summary>

  const tier = t => `<div class="ftier" style="color:${FTIER[t].c}">${FTIER[t].n}
      <span class="fnum">· ${DATA.focus.filter(f=>f.tier===t).length} topic${DATA.focus.filter(f=>f.tier===t).length===1?'':'s'}</span></div>
    <div class="fwhy">${FTIER[t].w}</div>${rows(t)}`;
  return `<div class="card" style="border-left:4px solid var(--warn)">
      <div>

        <details class="how"><summary>How this list was made</summary>
          <p class="fwhy">${FC.intro||''}</p>
          ${FC.how ? `<p class="fwhy"><b>Where the ranking comes from.</b> ${FC.how}</p>` : ''}
        </details>
        ${[0,1,2,3].filter(t=>DATA.focus.some(f=>f.tier===t)).map(tier).join('')}
        <div class="refsrc" style="margin-top:10px">${FC.sources ? 'Sources: '+FC.sources+' ' : ''}Ticks are saved in this browser only.</div>

}

  const x=SQR.x, P=sqPoints(x), s=sqS(x.id), n=ticks.filter(Boolean).length, pct=Math.min(1,n/(x.q.saq.any||ticks.length)), miss=pct>=1?[]:ticks.map((t,i)=>t?-1:i).filter(i=>i>=0);
  const pts=Math.round(pct*x.marks*2)/2;
  s.tries=(s.tries||0)+1; s.best=Math.max(s.best||0,pct); if(pct>=0.8) s.lock=1; s.last=SQR.cold?SQR.cold.text:''; sqSave();
  const nx=sqNext(), locked=pct>=0.8;
  $('#view').innerHTML=`<div class="card">${sqHead()}
    <p class="sres">≈${pts}/${x.marks}</p>
    <p class="score-sub">${n} of ${ticks.length} lines · ${locked?'✓ Locked. That answer would score.':'not locked yet (80% locks it). What was missing:'}</p>
    ${miss.length?`<ol class="ssteps">${miss.map(i=>`<li value="${i+1}">${mdB(P[i])}</li>`).join('')}</ol>`:''}
    ${locked&&nx&&nx!==x?`<button class="btn primary wide" id="sqNx">▶ Next: ${esc(nx.title)}</button>`:''}
    <button class="btn ${locked?'':'primary '}wide" id="sqAgainCold">✍️ Write it again${miss.length?' (read the missing lines first)':''}</button>
    <button class="btn ghost wide" id="sqGapsAgain">🕳 Fill the gaps again</button>
    <button class="btn ghost wide" id="sqHomeB">← All SAQs</button></div>`;
  sqBindHead(); window.scrollTo(0,0);
  const b=$('#sqNx'); if(b) b.onclick=()=>sqOpen(nx.id,'read');
  $('#sqAgainCold').onclick=()=>{SQR.cold=null;SQR.stage='cold';sqCold();window.scrollTo(0,0)};
  $('#sqGapsAgain').onclick=()=>{SQR.cold=null;SQR.gap=null;SQR.stage='gaps';sqGaps();window.scrollTo(0,0)};
  $('#sqHomeB').onclick=sqHome;
}
/* 📄 last-look sheet: every short answer on one page, quiz row by quiz row, for the final read-through */
function sqSheet(){
  enterSit('saq'); SQR=null;
  let cur='', body='';
  for(const x of SAQD){
    if(x.quiz!==cur){ cur=x.quiz; body+=`<div class="qmod">${esc(rowName(x.cse))}</div>`; }
    const P=sqPoints(x), F=sqFacts(x);
    body+=`<div class="sheeti"><h3>${esc(x.title)} <span class="tag">${sqMk(x.marks)}</span></h3><div class="shook">🧠 ${esc(x.short.hook)}</div>${sqShortHTML(x, i=>`<li value="${i+1}">${mdB(P[i])}${sqFix(F[i])}</li>`)}</div>`;
  }
  $('#view').innerHTML=`<div class="card sheet"><div class="qhead"><button class="btn ghost" id="sqBack" style="padding:4px 10px">← List</button><span class="n">📄 Last-look sheet</span></div>
    <p class="hist" style="margin:0">All ${SAQD.length} short answers, one fact a line, quiz row by quiz row. Bold = the words that earn the mark.</p>
    ${body}
    <button class="btn ghost wide" id="sqHomeB">← All SAQs</button></div>`;
  $('#sqBack').onclick=sqHome; $('#sqHomeB').onclick=sqHome; window.scrollTo(0,0);
}
function bindView(){
  bindFocus();
  bindSaq();
  document.querySelectorAll('[data-scr]').forEach(b=>b.onclick=()=>nav(b.dataset.scr));
  const hb=$('[data-hero]'); if(hb) hb.onclick=()=>HERO[hb.dataset.hero]();
  /* opened straight at a screen (the hub's Rep / Write buttons do that), ‹ Home goes back to the exam on the hub */
  const bk=$('#homeB'); if(bk) bk.onclick=()=>{ if(history.state&&history.state.scr&&!history.state.sit) history.back();
    else if(HUB) location.assign(HUB+'/'+(['saq','mock'].includes(curScr())?'write':'rep')); else nav('') };
  document.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>start(b.dataset.go,!!b.dataset.learn));
  document.querySelectorAll('[data-quiz]').forEach(b=>b.onclick=()=>start('quiz:'+b.dataset.quiz,!!b.dataset.learn));
  document.querySelectorAll('[data-sys]').forEach(b=>b.onclick=()=>start('sys:'+b.dataset.sys,!!b.dataset.learn));
  document.querySelectorAll('[data-n]').forEach(b=>b.onclick=()=>{S.n=b.dataset.n==='all'?'all':+b.dataset.n;SV('n',S.n);const y=window.scrollY;home();window.scrollTo(0,y)});
  const rb=$('#resumeB'); if(rb) rb.onclick=resumeLearn;
  /* a tap anywhere on a quiz row ticks it — except on its own Learn / Sit buttons */
  document.querySelectorAll('.qrow').forEach(r=>r.onclick=e=>{
    if(e.target.closest('button'))return;
    const cb=r.querySelector('.pk'); if(e.target!==cb)cb.checked=!cb.checked;
    setPick(r.dataset.z,cb.checked)});
  document.querySelectorAll('[data-pk]').forEach(b=>b.onclick=()=>{
    const zs=DATA.quizzes.filter(z=>b.dataset.pk==='all'||z.sys===b.dataset.pk).map(z=>z.id);
    const all=zs.every(id=>S.pick.includes(id));
    zs.forEach(id=>setPick(id,!all,true)); paintPick()});
  paintPick();
}
function setPick(id,on,quiet){
  const has=S.pick.includes(id);
  if(on&&!has)S.pick.push(id); else if(!on&&has)S.pick=S.pick.filter(x=>x!==id);
  if(!quiet)paintPick();
}
/* the ticked rows light up, a system chip lights when every quiz of it is ticked, and the
   bottom bar carries the run — Learn or Sit every ticked quiz as one deck, or clear the ticks */
function paintPick(){
  SV('pick',S.pick);
  document.querySelectorAll('.qrow').forEach(r=>{const on=S.pick.includes(r.dataset.z);r.classList.toggle('on',on);r.querySelector('.pk').checked=on});
  document.querySelectorAll('[data-pk]').forEach(b=>{const zs=DATA.quizzes.filter(z=>b.dataset.pk==='all'||z.sys===b.dataset.pk);b.classList.toggle('on',zs.length>0&&zs.every(z=>S.pick.includes(z.id)))});
  const fb=$('#footbar'), k=S.pick.length, m=dealPick().length;
  if(!k||!$('.qlist')){fb.classList.remove('on');return}
  fb.classList.add('on');
  fb.innerHTML=`<button class="btn primary" id="pkLearn">Learn ${k===1?'this quiz':k+' quizzes'} · ${m} Q</button><button class="btn" id="pkSit">Sit · ${m} Q</button><button class="btn ghost x" id="pkClear" title="clear the ticks" aria-label="clear the ticks">✕</button>`;
  $('#pkLearn').onclick=()=>start('pick',true);
  $('#pkSit').onclick=()=>start('pick',false);
  $('#pkClear').onclick=()=>{S.pick=[];paintPick()};
}
function sparkCard(){
  if(!S.scores.length) return `<div class="card"><b>No sittings yet.</b>
    <p class="hist" style="margin:.4rem 0 0">Your first mock test is the baseline — the whole game is the climb from there. ${daysLeft()} days to go.</p></div>`;
  const pts=S.scores.slice(-30).map(s=>s.got/s.tot);
  const W=600,H=70,P=6;
  const x=i=>P+i*(W-2*P)/Math.max(1,pts.length-1), y=v=>H-P-v*(H-2*P);
  const path=pts.map((v,i)=>(i?'L':'M')+x(i).toFixed(1)+' '+y(v).toFixed(1)).join(' ');
  const last=S.scores[S.scores.length-1], pct=Math.round(100*last.got/last.tot);
  const best=Math.max(...S.scores.map(s=>s.got/s.tot));
  return `<div class="card">
    <div style="display:flex;align-items:baseline;gap:10px">
      <b style="font-size:1.3rem">${last.got}/${last.tot}</b>
      <span class="hist">${pct}% · ${esc(last.label)}</span>
      <span class="hist" style="margin-left:auto">best ${Math.round(best*100)}% · ${S.scores.length} sat</span>
    </div>
    <svg class="spark" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" role="img" aria-label="score history">
      <line x1="${P}" y1="${y(.5)}" x2="${W-P}" y2="${y(.5)}" stroke="var(--border)" stroke-dasharray="4 4"/>
      <path d="${path}" fill="none" stroke="var(--primary)" stroke-width="2.5" stroke-linecap="round"/>
      <circle cx="${x(pts.length-1)}" cy="${y(pts[pts.length-1])}" r="4" fill="var(--primary)"/>
    </svg>
    <div class="hist">dashed line = 50%. <button class="btn ghost" id="shareBtn" style="padding:2px 10px;font-size:.78rem">Copy score line</button></div>
  </div>`;
}

/* ── sitting ───────────────────────────────────────────────────────── */
let SIT=null;
/* `learn` sits the same deck in Learn mode: marked per question, resources in place,
   never timed, never on the score chart (see the learn-mode block below) */
/* a Learn run is saved as it goes (deck ids + every mark), so a phone that drops the tab
   halfway through 200 questions loses nothing: home offers to pick it up. A mock is one go. */
function saveRun(){
  if(!SIT||!SIT.learn)return;
  SV('resume',{ids:SIT.deck.map(q=>q.id),i:SIT.i,ans:SIT.ans,chk:SIT.chk,peek:SIT.peek,label:SIT.label,mode:SIT.mode,t0:SIT.t0});
}
function resumeLearn(){
  const r=LS('resume');
  const byId=new Map(DATA.questions.map(q=>[q.id,q]));
  const deck=r&&Array.isArray(r.ids)?r.ids.map(id=>byId.get(id)).filter(Boolean):[];
  if(!deck.length){SV('resume',null);home();return}
  enterSit('learn');
  SIT={deck,label:r.label||'picked up',mode:r.mode||'mini',i:Math.min(Math.max(r.i|0,0),deck.length-1),ans:r.ans||{},t0:r.t0||Date.now(),timed:false,end:null,learn:true,chk:r.chk||{},peek:r.peek||{}};
  renderQ();window.scrollTo(0,0);
}
function start(mode,learn=false){
  let deck,label,timed=false;
  if(learn){const r=LS('resume');
    if(r&&r.ids&&r.ids.length&&!confirm(`You have a Learn run waiting (Q${Math.min((r.i|0)+1,r.ids.length)} of ${r.ids.length} · ${r.label}). Drop it and start this one?`))return}
  if(mode==='mini'){
    if(learn){deck=dealMini(howMany(CLOSED.length),CLOSED);label=deck.length===CLOSED.length?'the whole bank':`${deck.length} from the bank`}
    else{deck=dealMini();label='mini mock'}}
  else if(mode==='full'){deck=dealFull();label='full mock';timed=!!META.shape.minutes}
  else if(mode==='miss'){deck=dealMisses(learn?CAP():12);label=learn?'my misses':'redo misses'}
  else if(mode==='pick'){deck=dealPick();const k=S.pick.length;
    label=k===1?(DATA.quizzes.find(z=>z.id===S.pick[0])||{}).name||'1 quiz':`${k} quizzes · ${deck.length} Q`}
  else if(mode.startsWith('quiz:')){const z=DATA.quizzes.find(x=>x.id===mode.slice(5));
    deck=DATA.questions.filter(q=>q.quiz===z.id);label=z.name}
  else if(mode.startsWith('sys:')){const s=mode.slice(4), pool=CLOSED.filter(q=>q.sys===s).length;
    deck=dealSys(s,howMany(pool));label=`${deck.length===pool?'all ':''}${deck.length} ${sysTag(s)}`}
  if(!deck||!deck.length){alert('Nothing to deal here yet.');return}
  enterSit(learn?'learn':'mock');
  if(learn){timed=false;SV('resume',null)}
  SIT={deck,label,mode,i:0,ans:{},t0:Date.now(),timed,end:timed?Date.now()+META.shape.minutes*60*1000:null,learn,chk:{},peek:{}};
  if(mode==='mini'&&DATA.chains.length){warmup();return}
  renderQ();
}
function warmup(){
  const ch=DATA.chains[Math.random()*DATA.chains.length|0];
  const beads=ch.beads.filter(b=>b.t);
  const bi=1+Math.random()*(beads.length-1)|0;
  const answer=beads[bi].t;
  const others=shuffle(DATA.chains.filter(c=>c!==ch).flatMap(c=>c.beads.filter(b=>b.t).map(b=>b.t))).slice(0,3);
  const opts=shuffle([answer,...others]);
  $('#view').innerHTML=`<div class="card">
    <b>30-second warm-up · ${esc(ch.name)}</b>
    <div class="chain">${ch.beads.map(b=> b.t
      ? `<div class="bead ${b.t===answer?'blank':''}">${b.t===answer?'?':esc(b.t)}</div>`
      : `<div class="verb">${esc(b.v)} ↓</div>`).join('')}</div>
    ${opts.map(o=>`<label class="opt"><input type="radio" name="wu"><span>${esc(o)}</span></label>`).join('')}
    <div class="src">${esc(ch.src)} — a scaffold built from her decks, not her material.</div>
    <button class="btn primary wide" id="wuGo">${SIT.learn?'Check → start learning':'Check → start the mock test'}</button>
    <button class="btn ghost wide" id="wuSkip">Skip warm-up</button></div>`;
  document.querySelectorAll('.opt').forEach(o=>o.onclick=()=>{document.querySelectorAll('.opt').forEach(x=>x.classList.remove('sel'));o.classList.add('sel');o.querySelector('input').checked=true});
  $('#wuGo').onclick=()=>{const sel=document.querySelector('.opt.sel span');
    if(sel){sel.closest('.opt').style.borderColor = sel.textContent===answer?'var(--ok)':'var(--danger)';
      setTimeout(renderQ, sel.textContent===answer?450:1400);
      if(sel.textContent!==answer){const right=[...document.querySelectorAll('.opt span')].find(s=>s.textContent===answer);right.closest('.opt').style.borderColor='var(--ok)';}
    } else renderQ()};
  $('#wuSkip').onclick=renderQ;
}
let timerIv=null;
function renderQ(){
  clearInterval(timerIv);
  const q=SIT.deck[SIT.i];
  const fb=$('#footbar');fb.classList.add('on');
  const last=SIT.i===SIT.deck.length-1, chk=SIT.learn?SIT.chk[q.id]:null;
  if(SIT.learn){
    /* learn mode: Check marks THIS question in place; Next only appears once it is marked */
    fb.innerHTML=`<button class="btn" id="prevB" ${SIT.i? '':'disabled'}>← Back</button>`+
      (chk?`<button class="btn primary" id="nextB">${last?'Finish':'Next →'}</button>`
          :`<button class="btn primary" id="chkB">Check ✓</button>`);
    $('#prevB').onclick=()=>{if(chk)saveLearnSaq();else saveAns();SIT.i--;renderQ()};
    if(chk)$('#nextB').onclick=()=>{saveLearnSaq();last?learnDone():(SIT.i++,renderQ())};
    else $('#chkB').onclick=learnCheck;
    saveRun();
  } else {
    fb.innerHTML=`<button class="btn" id="prevB" ${SIT.i? '':'disabled'}>← Back</button>
      <button class="btn primary" id="nextB">${last?'Finish & mark':'Next →'}</button>`;
    $('#prevB').onclick=()=>{saveAns();SIT.i--;renderQ()};
    $('#nextB').onclick=()=>{saveAns();last?mark():(SIT.i++,renderQ())};
  }
  setTimeout(()=>{const x=$('#exitB');if(x)x.onclick=()=>{if(confirm(SIT.learn?'Stop here? Everything you checked is already in your misses pile, and home will offer to pick this run up again.':'Abandon this mock test? Nothing is saved.')){clearInterval(timerIv);home();window.scrollTo(0,0)}}},0);
  const a=SIT.ans[q.id];
  const imgTag=f=>`<img class="qimg" src="img/${f}" alt="question figure" loading="lazy">`;
  /* the blank widget, inline where Canvas put it: her dropdown stays a dropdown
     (choices shuffled per sitting), her typed blank stays typed */
  const widget=(b,i)=> q.bk==='dd'
    ? `<select class="inl" data-i="${i}" aria-label="blank ${i+1}"><option value="">— choose —</option>${shuffleStable(q.id+i,b.options).map(o=>`<option ${a&&a.pick&&a.pick[i]===o?'selected':''}>${esc(o)}</option>`).join('')}</select>`
    : `<input type="text" class="inl" data-i="${i}" style="width:${Math.min(26,Math.max(7,Math.max(...b.options.map(o=>o.length))+3))}ch" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="type…" aria-label="blank ${i+1}" value="${a&&a.pick?esc(a.pick[i]||''):''}">`;
  /* structured stem: her paragraphs, lists and table rows, with [[IMG:…]] and
     [[BLANK:k]] markers resolved in place. Images the stem did not place still show
     below it, so no figure is ever lost. */
  const placed=new Set();
  let stemHTML=q.qh
    ? q.qh.replace(/\[\[IMG:([^\]]+)\]\]/g,(m,f)=>{placed.add(f);return imgTag(f)})
          .replace(/\[\[BLANK:(\d+)\]\]/g,(m,k)=>q.type==='cloze'&&q.blanks[+k]?widget(q.blanks[+k],+k):'____')
    : esc(q.q);
  const imgs=(q.imgs||[]).filter(f=>!placed.has(f)).map(imgTag).join('');
  const inlineBlanks=q.type==='cloze'&&q.qh&&/\[\[BLANK:\d+\]\]/.test(q.qh);
  let body='';
  if(q.type==='mcq'||q.type==='tf'||q.type==='multi'){
    const multi=q.type==='multi';
    body=q.opts.map((o,i)=>`<label class="opt ${a&&a.sel&&a.sel.includes(i)?'sel':''}">
      <input type="${multi?'checkbox':'radio'}" name="q" value="${i}" ${a&&a.sel&&a.sel.includes(i)?'checked':''}>
      <span>${esc(optLabel(q,o))}</span></label>`).join('');
    if(multi)body=`<div class="note">Tick every answer that applies — it may be just one.</div>`+body;
  } else if(q.type==='match'){
    const bank=shuffleStable(q.id,[...new Set(q.pairs.map(p=>p.right))]); // a right-hand item used twice is still ONE option
    body=q.pairs.map((p,i)=>`<div class="blankrow"><label>${esc(p.left)}</label>
      <select data-i="${i}"><option value="">— choose —</option>
      ${bank.map(r=>`<option ${a&&a.pick&&a.pick[i]===r?'selected':''}>${esc(r)}</option>`).join('')}</select></div>`).join('');
  } else if(q.type==='cloze'){
    body=inlineBlanks
      ? `<div class="note">${q.bk==='dd'?'Pick from each dropdown in the text.':'Type into each blank in the text — spelling counts, capitals don’t.'}</div>`
      : q.blanks.map((b,i)=>`<div class="blankrow"><label>${esc(blankLabel(b,i))}${q.bk==='dd'?'':' (type it)'}</label>${widget(b,i)}</div>`).join('');
  } else if(q.type==='essay'){
    body=`${q.scenario?`<div class="note">${esc(q.scenario)}</div>`:''}
      ${q.authored&&DATA.stats.nAuthored<DATA.stats.n?`<div class="note">This question was written by this tool from the lecture decks — it is not one the lecturers set. It is here because the real paper has a written section and the Canvas quizzes have none.</div>`:''}
      <div class="note">Written question · ${q.pts} marks — write ${q.pts} numbered points, ${META.saqHint||'one point each'}. You mark yourself against the model ${SIT.learn?'when you press Check':'at the end'}.</div>
      <textarea data-essay placeholder="1. …&#10;2. …">${a&&a.text?esc(a.text):''}</textarea>`;
  }
  /* learn mode: once checked, a wrong/skipped/written question already has its slide and
     video open inside the mark block, so the chips row is only shown while they are not */
  const open=chk&&learnOpen(q,chk);
  $('#view').innerHTML=`<div class="card">
    <div class="qhead"><span class="n">Q${SIT.i+1}/${SIT.deck.length}</span>
      <span class="tag ${q.sys}">${esc(sysTag(q.sys))}</span><span class="tag">${q.pts} mk</span>${q.authored&&DATA.stats.nAuthored<DATA.stats.n?'<span class="tag authored" title="written by this tool from the lecture decks — not one the lecturers set">tool’s question</span>':''}${SIT.learn?'<span class="tag" style="color:var(--ok)">learn</span>':''}
      <span class="timer" id="timer"></span>
      <button class="btn ghost" id="exitB" title="${SIT.learn?'stop learning':'abandon mock test'}" style="padding:2px 10px">✕</button></div>
    ${inlineBlanks?body:''}<div class="stem${q.qh?' rich':''}">${stemHTML}</div>${imgs}${inlineBlanks?'':body}
    ${chk?learnMkHTML(q,chk):''}${SIT.learn&&!open?learnChipsHTML(q):''}
    <div class="pips">${SIT.deck.map((_,i)=>{const id=SIT.deck[i].id,c=SIT.learn&&SIT.chk[id];
      const cls=c?(c.r?(c.r.got>=c.r.tot&&SIT.ans[id]?'ok':'bad'):'done'):(SIT.ans[id]?'done':'');
      return `<span class="pip ${cls} ${i===SIT.i?'cur':''}"></span>`}).join('')}</div>
  </div>`;
  if(chk)paintChecked(q);
  /* the label's own activation checks the box; we only mirror it on change. The old
     handler also flipped it by hand, and the two flips cancelled: tapping the WORDS of a
     "tick every answer that applies" option never ticked it (only the box itself did). */
  else document.querySelectorAll('.opt').forEach(o=>{const inp=o.querySelector('input');
    inp.onchange=()=>{if(inp.type==='radio')document.querySelectorAll('.opt').forEach(x=>x.classList.remove('sel'));o.classList.toggle('sel',inp.checked)}});
  if(SIT.timed){const t=$('#timer');const tick=()=>{const s=Math.max(0,(SIT.end-Date.now())/1000|0);
    t.textContent=`${s/60|0}:${String(s%60).padStart(2,'0')}`;t.classList.toggle('low',s<300);
    if(s<=0){clearInterval(timerIv);saveAns();mark()}};tick();timerIv=setInterval(tick,1000)}
}
function shuffleStable(seed,arr){
  let h=0;for(const c of String(seed))h=(h*31+c.charCodeAt(0))>>>0;
  return arr.map((v,i)=>({v,k:(h=(h*1103515245+12345)>>>0)})).sort((a,b)=>a.k-b.k).map(x=>x.v);
}
function saveAns(){
  const q=SIT.deck[SIT.i];
  if(q.type==='essay'){const t=document.querySelector('[data-essay]');if(t&&t.value.trim())SIT.ans[q.id]={text:t.value};return}
  if(q.type==='match'||q.type==='cloze'){
    const pick={};let any=false;
    document.querySelectorAll('[data-i]').forEach(el=>{if(el.value){pick[el.dataset.i]=el.value;any=true}});
    if(any)SIT.ans[q.id]={pick};return}
  const sel=[...document.querySelectorAll('.opt input:checked')].map(i=>+i.value);
  if(sel.length)SIT.ans[q.id]={sel};
}
/* ── learn mode ────────────────────────────────────────────────────────
   The same deck and the same marking, but per question: Check marks it in place and
   the answer, her slide and the matched video sit right under it — the results
   accordion brought forward to the moment you still care. Slide and video can be
   opened BEFORE answering; that counts as a peek, and a right answer after a peek
   does not clear a miss. Check with nothing picked = "show me" = a miss. Learn
   sittings feed the misses pile and the least-seen dealer, never the score chart. */
function learnChipsHTML(q){
  const chips=[];
  if(q.vid)chips.push(`<button class="qa" data-act="vid">▶ Video · from ${mmss(Number.isInteger(q.vid.at)?q.vid.at:0)}</button>`);
  for(const r of q.refs)chips.push(`<button class="qa" data-act="${r.k}">${REF[r.k].ic} ${REF[r.k].lbl}${r.k==='patton'?' p. '+r.pp:''}</button>`);
  if(hasHer(q))chips.push('<button class="qa" data-act="hl">✅ Her worked answer</button>');
  const hint=chips.length?(SIT.chk[q.id]?'':'<span class="hint">open before or after you answer</span>')
    :`<span class="hint">${NOREF_HINT}</span>`;
  return `<div class="lres" data-qid="${q.id}">${chips.join('')}${hint}<div class="qr-pane" hidden></div></div>`;
}

function markQ(q,a){
  if(q.type==='essay')return null; // self-marked
  if(!a)return{got:0,tot:q.pts,detail:'no answer'};
  if(q.type==='mcq'||q.type==='tf'||q.type==='multi'){
    const chosen=(a.sel||[]).map(i=>q.opts[i]);
    const right=chosen.length===q.key.length&&q.key.every(k=>chosen.includes(k));
    return{got:right?q.pts:0,tot:q.pts,you:chosen.map(o=>optLabel(q,o)).join(' · ')}}
  if(q.type==='match'){
    let got=0;q.pairs.forEach((p,i)=>{if((a.pick||{})[i]===p.right)got++});
    return{got:got*q.pts/q.pairs.length,tot:q.pts,you:q.pairs.map((p,i)=>(a.pick||{})[i]||'—').join(' · ')}}
  if(q.type==='cloze'){
    let got=0;
    q.blanks.forEach((b,i)=>{if(blankOK(q,b,(a.pick||{})[i]))got++});
    return{got:got*q.pts/q.blanks.length,tot:q.pts,you:q.blanks.map((b,i)=>(a.pick||{})[i]||'—').join(' · ')}}

/* dropdown: only her marked option is right. Typed: every accepted spelling is. */

}
function blankLabel(b,i){return b.ctx?`${b.ctx} ___`:(b.label&&!/^Answer \d+:?$/.test(b.label)?b.label.replace(/:$/,''):`Blank ${i+1}`)}

  if(q.type==='match')return q.pairs.map(p=>`${p.left} → ${p.right}`).join(' · ');
  if(q.type==='cloze')return q.blanks.map(b=>b.correct).join(' · ');
  return (q.key||[]).map(o=>optLabel(q,o)).join(' · ');
}
/* bare-letter options carry their text from the stem's lettered list (build-time) */
function optLabel(q,o){return q.ol&&q.ol[o]?`${o}. ${q.ol[o]}`:o}
/* the flat stem carries Canvas's literal "[ Select ]" where each dropdown sat */
const flatStem=q=>q.qt||String(q.q||'').replace(/\[ Select \]/g,'____');
/* ── ask an AI ────────────────────────────────────────────────────────
   Two buttons compose a prompt and copy it; this page sends nothing anywhere —
   you paste it into Gemini (or any AI chat) yourself. The shape is the one that
   gets a frozen brain moving: explain it like I'm stupid (one everyday analogy,
   mapped back to the real terms), in HER words, then a five-question blind quiz
   with instant feedback. The prompt carries her key, her notes and her "how far
   it goes" line so the AI teaches to her paper and stops where she stops —
   without that an AI happily teaches the Krebs cycle for a test that only asks
   you to rank three energy routes. An AI's quiz checks the analogy landed; only
   her questions here check that it would earn marks. */
const AI_CTX=META.aiCtx;
const AI_LBL='🤖 Explain like I’m stupid + quiz me';
const AI_SHAPE={mcq:'multiple choice',tf:'true or false',multi:'tick every answer that applies',match:'matching',cloze:'fill the blanks / dropdowns',essay:'a written answer marked one mark per step'};
const aiSteps=(extra,shape,stop)=>`Do this, in order:\n1. Explain it like I’m stupid: one everyday analogy, then map every part of the analogy back to the real term.\n2. Use my lecturer’s exact terms from above. Those words earn the marks; the analogy is scaffolding.\n${extra?'3. '+extra+'\n':''}${extra?4:3}. Then give me a 5-question blind quiz on it, ONE question at a time, with instant feedback after each answer, ${shape}.\n${stop}`;
function aiQuestionPrompt(q,withFig){
  const a=SIT.ans[q.id];
  const you=a?(a.text||((a.sel||[]).map(i=>optLabel(q,q.opts[i])).join(', ')||Object.values(a.pick||{}).join(', '))):'';
  const L=[AI_CTX+(q.authored?' This is a practice question a study tool wrote from my lecturer’s slides.':' This is one of my lecturer’s own practice questions.')+' I want to understand it, not memorise the answer.','',`Question: ${flatStem(q)}`];
  if(q.opts&&q.opts.length)L.push(`Options: ${q.opts.map(o=>optLabel(q,o)).join(' | ')}`);
  if(q.saq)L.push('The model answer, one mark per step: '+(q.saq.full||q.saq.steps).map((s,i)=>`(${i+1}) ${s}`).join(' '));
  else L.push(`Correct answer: ${keyText(q)}`);
  if(q.why)L.push(`The study tool’s explanation: ${q.why}${q.src?' (source: '+q.src+')':''}`);
  L.push(`My answer: ${you||'(none — I didn’t know)'}`);
  if(q.imgs&&q.imgs.length)L.push(withFig?'The question’s figure is pasted with this message. Read it before answering — the question is about it.':'This question has a diagram I can’t paste. Don’t guess what it shows; work from the text.');
  for(const r of q.refs||[]){
    if(r.t)L.push(`${r.k==='patton'?'The textbook says':r.k==='course'?'A file posted in my course (not by my lecturer) says':'My lecturer’s notes say'} (verbatim): “${r.t}” — ${r.src}`);
    else if(r.k==='slide')L.push(withFig?`My lecturer’s slide on this is pasted with this message — ${r.src}. Her wording on it is what earns the marks.`:`My lecturer’s slide on this: ${r.src} (an image, I can’t paste it).`);
  }
  if(hasHer(q)){const h=DATA.helpline[q.hl];L.push('','Her own worked answer for this topic, verbatim (her CAPITALS are the mark-earning words):',h.parts.map(p=>p.h+'\n'+p.t).join('\n'));}
  L.push('',aiSteps(you?'In one line, say what misconception my answer suggests.':'',`in the shape she uses (${AI_SHAPE[q.type]||'multiple choice'})`,'Stay inside this question and her notes. Don’t teach past them.'));
  return L.join('\n');
}
/* topic-first: the focus row's own `done` / `ask` / `cap` become the AI's brief,
   plus her worked helpline answer where she posted one */
function aiTopicPrompt(f){
  const L=[AI_CTX+` Topic: ${f.t} (${SYS[f.sys]||f.sys}).`,'','A study tool read my lecturers’ slides and their practice questions and wrote down the level. Here is what I have to be able to DO:',`“${f.done}”`,`How it gets asked: “${f.ask}”`];
  if(f.cap)L.push(`Where it ends — do NOT go past this: “${f.cap}”`);
  const h=(DATA.helpline||{})[f.id];
  if(h){let t=h.parts.map(p=>p.h+'\n'+p.t).join('\n');if(t.length>3000)t=t.slice(0,3000)+' …(trimmed)';
    L.push('','My lecturer’s own worked answer for this topic, verbatim (the CAPITALS are the mark-earning words):',t);}
  L.push('',aiSteps('','in the shapes described under “how it gets asked” above','Stay inside that level. Don’t teach past the “where it ends” line.'));
  return L.join('\n');
}
/* the question's own figures — or, when it has none, her slide (the build guarantees a
   question never carries both) — drawn onto ONE white png, each with its label, so a single
   paste lands every picture the AI needs. Same-origin images, so the canvas stays clean. */
function aiFigures(q){
  const f=[];
  for(const n of q.imgs||[])f.push({src:'img/'+n,label:q.imgs.length>1?'Question figure '+(f.length+1):'Question figure'});
  for(const r of q.refs||[])if(r.k==='slide'&&r.slide)f.push({src:'img/slides/'+r.slide,label:'My lecturer’s slide — '+r.src});
  return f;
}
function aiFigureBlob(q){
  const srcs=aiFigures(q); if(!srcs.length)return Promise.resolve(null);
  return Promise.all(srcs.map(s=>new Promise(res=>{const im=new Image();im.onload=()=>res({im,label:s.label});im.onerror=()=>res(null);im.src=s.src}))).then(all=>{
    const ok=all.filter(Boolean); if(!ok.length)return null;
    const PAD=16,LH=30,W=Math.min(1200,Math.max(...ok.map(x=>x.im.naturalWidth||900)));
    const rows=ok.map(x=>{const w=x.im.naturalWidth||900,h=x.im.naturalHeight||Math.round(w*0.7),s=Math.min(1,W/w);return {im:x.im,label:x.label,w:Math.round(w*s),h:Math.round(h*s)}});
    const c=document.createElement('canvas');c.width=W+PAD*2;c.height=rows.reduce((a,r)=>a+LH+r.h+PAD,PAD);
    const g=c.getContext('2d');g.fillStyle='#fff';g.fillRect(0,0,c.width,c.height);
    let y=PAD;for(const r of rows){g.fillStyle='#222';g.font='bold 17px system-ui,Segoe UI,sans-serif';g.fillText(r.label,PAD,y+20);y+=LH;g.drawImage(r.im,PAD+Math.round((W-r.w)/2),y,r.w,r.h);y+=r.h+PAD}
    return new Promise(res=>c.toBlob(res,'image/png'));
  });
}
/* copy: text + png in ONE clipboard item where the browser allows it (Chrome, Edge, Safari,
   Android Chrome), built inside the tap so Safari's gesture rule holds — the png is a promise
   because the figures are still being drawn. Anything else falls back to text only, and the
   text then says the picture could not come along. After a combined copy two small buttons
   let you re-copy just the text or just the figure, for an AI that keeps only one of them. */
function copyPrompt(btn,textFor,figP){
  const text=typeof textFor==='function'?textFor:()=>textFor;
  const done=(ok,fig)=>{btn.textContent=ok?(fig?'Copied ✓ prompt + figure — paste into Gemini (or any AI)':'Copied ✓ now paste it into Gemini (or any AI)'):'Copy blocked — select the text below and copy it';
    const nx=btn.nextElementSibling;
    if(!ok&&!(nx&&nx.classList.contains('aitext'))){const ta=document.createElement('textarea');ta.className='aitext';ta.readOnly=true;ta.value=text(false);btn.after(ta);ta.focus();ta.select()}
    if(fig&&!(nx&&nx.classList.contains('aisplit'))){const d=document.createElement('div');d.className='aisplit refsrc';d._btn=btn;
      d.innerHTML='Only one of them landed? <button class="btn ghost askai" data-aitext="1">📋 text only</button> <button class="btn ghost askai" data-aifig="1">🖼 figure only</button>';btn.after(d)}
    setTimeout(()=>btn.textContent=AI_LBL,4000)};
  const textOnly=()=>(navigator.clipboard?navigator.clipboard.writeText(text(false)):Promise.reject())
    .then(()=>done(true,false))
    .catch(()=>{const ta=document.createElement('textarea');ta.value=text(false);ta.style.position='fixed';ta.style.opacity='0';
      document.body.appendChild(ta);ta.select();let ok=false;try{ok=document.execCommand('copy')}catch(_){}
      ta.remove();done(ok,false)});
  if(figP&&navigator.clipboard&&navigator.clipboard.write&&window.ClipboardItem){
    let item=null;
    try{item=new ClipboardItem({'text/plain':new Blob([text(true)],{type:'text/plain'}),'image/png':figP.then(b=>{if(!b)throw new Error('no figure');return b})})}catch(_){}
    if(item){navigator.clipboard.write([item]).then(()=>{btn._aiFig=figP;btn._aiText=text(true);done(true,true)}).catch(textOnly);return}
  }
  textOnly();
}
function aiSplitCopy(s){
  const b=s.closest('.aisplit')._btn, was=s.textContent, flash=t=>{s.textContent=t;setTimeout(()=>s.textContent=was,2500)};
  const p=s.dataset.aitext?navigator.clipboard.writeText(b._aiText):navigator.clipboard.write([new ClipboardItem({'image/png':b._aiFig})]);
  p.then(()=>flash('Copied ✓')).catch(()=>flash('Copy blocked'));
}

$('#helpBtn').onclick=()=>{const H=META.help||{}, nAuth=DATA.questions.filter(q=>q.authored).length, nHer=DATA.questions.filter(q=>q.her).length, nCap=DATA.stats.n-nAuth-nHer, nNm=CLOSED.length-MOCKABLE.length, nNmW=ESSAYS.length-MOCK_ESSAYS.length;
  $('#help').innerHTML=`

  ${DATA.chains.length?'Warm-up chains are scaffolds built from the decks, not the lecturer’s material. ':''}

  <h3>Learn mode</h3>
  <p><b>Learn as you go</b> (and the <b>Learn</b> button beside each quiz) marks every question the moment you

  goes on the score chart; a wrong or skipped question still joins your misses pile${HAS.ref||HAS.vid?', and a right answer after a peek does not clear it':''}. <b>Sit</b> is the test version: the same questions, nothing shown until the end.</p>
  <p><b>How many at a time</b> (12 · 25 · 50 · 100 · All) sets the size of every dealt Learn set and of the

  runs them as one deck, Learn or Sit, every question of every ticked quiz. A Learn run saves itself after every
  Check; stop partway (or lose the tab) and the home page offers to pick it up where you were.</p>
  ${SAQD.length?`<h3>SAQ trainer — the ✍️ row under Write</h3>
  <p>A full model answer is hard to remember, so every written question here also has a <b>short version</b>: the same
  answer, one fact a line, a few words each, grouped under the question's own parts, with a memory hook. The
  <b style="color:var(--warn)">bold</b> words are the ones that earn the marks. <b>SAQ trainer</b> teaches them one question
  at a time: <b>1 Read</b> the short version, <b>2 Fill the gaps</b> (the lines disappear a round at a time until you can say the

  ${H.explain?`<h3>Where the explanations come from</h3><p>${H.explain}</p>`:''}
  <h3>Ask an AI — the 🤖 buttons</h3>

  real terms, in the lecturer’s words, then a five-question blind quiz with instant feedback — and it carries the
  key${HAS.ref?', the notes':''}${DATA.focus.length?' and the “where it ends” line':''}, so the AI teaches to this paper and stops where it stops.
  If the question has a figure, the copy carries that too, as one picture. This page sends nothing anywhere; you

  <h3>What’s held out</h3>
