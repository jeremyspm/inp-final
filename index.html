nd the nurse’s role in screening.</p>","qt":"Explain the purpose of health screening, the difference between organised and opportunistic screening, and the nurse’s role in screening.","imgs":[],"type":"essay","authored":1,"saq":{"steps":["Purpose: screening identifies people at risk before symptoms appear, so health issues are detected early and treated in time for better outcomes — but screening does not give a diagnosis.","Organised screening: national programmes overseen by the National Screening Unit, inviting the population groups at highest risk — e.g. BreastScreen Aotearoa, the National Cervical and Bowel Screening Programmes, newborn metabolic and hearing screening.","Opportunistic screening: a check or test a person asks for, or a health professional offers — e.g. blood pressure, blood glucose or cholesterol checks at a wellness clinic.","The nurse: educates and encourages people to take part, facilitates the assessments, explains the risks (false positives and false negatives) to ensure informed consent, and supports follow-up and communication after the result."],"src":"Question and model answer are the tool’s · from the Health Screening deck, slides 6, 9–11, 16–17 and 24–25"}},{"id":"q1efc88a0f3","quiz":"w-care","sys":"care","pts":5,"q":"List the five steps of the nursing process in order and state briefly what happens in each.","qh":"<p>List the five steps of the nursing process in order and state briefly what happens in each.</p>","qt":"List the five steps of the nursing process in order and state briefly what happens in each.","imgs":[],"type":"essay","authored":1,"saq":{"steps":["Assessment — collect data about the patient by observation, interview and examination (subjective and objective), then validate and document it.","Diagnosis (nursing) — actual and potential problems found in the assessment are prioritised and written as diagnostic statements; not a medical diagnosis.","Planning — patient-centred goals and outcome criteria are set, with priorities and a time frame.","Implementation — the nursing interventions are carried out: evidence-based, safe, within the nurse’s scope and compatible with medical orders.","Evaluation — the patient’s response to each intervention is analysed and the goal is judged met, partially met or not met; the process is ongoing and cyclical."],"src":"Question and model answer are the tool’s · from The Nursing Process 2026 deck, slides 8, 11, 17, 23, 29 and 33"}},{"id":"q512085f5ef","quiz":"w-care","sys":"care","pts":4,"q":"Define objective data and subjective data, and give one example of each from a patient admitted with nausea.","qh":"<p>Define objective data and subjective data, and give one example of each from a patient admitted with nausea.</p>","qt":"Define objective data and subjective data, and give one example of each from a patient admitted with nausea.","imgs":[],"type":"essay","authored":1,"saq":{"steps":["Objective data: observable and measurable facts — signs.","Example: pallor, sweating, a measured temperature or pulse, an observed vomit.","Subjective data: information that only the patient can feel and describe — symptoms.","Example: the patient saying “I feel like I’m about to be sick” or rating their nausea."],"src":"Question and model answer are the tool’s · from Holistic Health Assessment 2026 deck, slide 9; example from The Nursing Process 2026 deck, slide 21"}},{"id":"q4132224a2d","quiz":"w-care","sys":"care","pts":3,"q":"Give the three reasons nurses document that are taught in this course, with one sentence on each.","qh":"<p>Give the three reasons nurses document that are taught in this course, with one sentence on each.</p>","qt":"Give the three reasons nurses document that are taught in this course, with one sentence on each.","imgs":[],"type":"essay","authored":1,"saq":{"steps":["A legal requirement — the clinical record is a legal document and evidence of your practice; it may be examined months or years later (“if it isn’t documented, it didn’t happen”).","A professional responsibility — the Nursing Council’s standards of competence and Code of Conduct require clear, accurate, legible, timely records, signed, dated and timed.","A communication tool — it carries information between the multi-disciplinary team, gives an accurate account of care, allows problems to be detected early and supports continuity of care."],"src":"Question and model answer are the tool’s · from Clinical Documentation 2026 deck, slides 4–10"}},{"id":"qfe9b0fe412","quiz":"w-clin","sys":"clin","pts":4,"q":"Give the normal adult ranges taught in this course for oxygen saturation, blood pressure (systolic and diastolic) and temperature, and define tachycardia and bradycardia.","qh":"<p>Give the normal adult ranges taught in this course for oxygen saturation, blood pressure (systolic and diastolic) and temperature, and define tachycardia and bradycardia.</p>","qt":"Give the normal adult ranges taught in this course for oxygen saturation, blood pressure (systolic and diastolic) and temperature, and define tachycardia and bradycardia.","imgs":[],"type":"essay","authored":1,"saq":{"steps":["SpO2: 95–100%.","Blood pressure: systolic usually 110–140 mmHg, diastolic usually 60–90 mmHg.","Temperature: 36.5–37.5 °C (36–36.4 °C is usually considered safe; 37.6–37.9 °C is a low-grade fever; above 38 °C is pyrexia; below 35 °C is hypothermia).","Tachycardia: heart rate above 100 bpm. Bradycardia: heart rate below 60 bpm."],"src":"Question and model answer are the tool’s · from Vital Signs 2026 deck, slides 13, 17, 24 and 30–32"}},{"id":"q6a565f86cd","quiz":"w-clin","sys":"clin","pts":4,"q":"Define standard precautions, and distinguish them from transmission-based precautions, naming the three types of the latter.","qh":"<p>Define standard precautions, and distinguish them from transmission-based precautions, naming the three types of the latter.</p>","qt":"Define standard precautions, and distinguish them from transmission-based precautions, naming the three types of the latter.","imgs":[],"type":"essay","authored":1,"saq":{"steps":["Standard precautions: the MINIMUM precautions for ALL patients, whatever their known infection status, whenever contact with blood or body fluids is possible — because you cannot tell by looking who is infectious.","They include hand hygiene, PPE, respiratory hygiene and cough etiquette, safe sharps practice, linen and waste management, aseptic technique, reprocessing of equipment, and environmental cleaning.","Transmission-based precautions are ADDED for a known or suspected pathogen, according to how it spreads — PPE, single-room allocation, air-quality controls.","The three types: contact (e.g. MRSA, gastro infections), droplet (e.g. influenza, mumps, meningitis) and airborne (e.g. measles, chickenpox, TB, COVID-19 — N95/P2 respirator and a negative-pressure room)."],"src":"Question and model answer are the tool’s · from Infection Prevention & Control 2026 deck, slides 24, 26–27 and 48–52"}},{"id":"q1c156cf256","quiz":"w-clin","sys":"clin","pts":4,"q":"Define hypoglycaemia. Give two causes and two symptoms.","qh":"<p>Define hypoglycaemia. Give two causes and two symptoms.</p>","qt":"Define hypoglycaemia. Give two causes and two symptoms.","imgs":[],"type":"essay","authored":1,"saq":{"steps":["Definition: low blood glucose — a level below 4 mmol/L, or symptoms of hypoglycaemia at a level close to this (normal without diabetes is 4–7.5 mmol/L).","Causes (any two): too little carbohydrate with a meal · a missed or delayed meal or snack · physical activity without adjusting insulin or eating more · too much insulin · alcohol in excess or without food.","Symptoms (any two): shaky, sweaty or suddenly unwell · racing pulse · tingling around the mouth and tongue · suddenly “strange” and unable to concentrate · suddenly very hungry · pale · headache · restless or anxious.","Why it happens on insulin: injected insulin cannot be “switched off”, so glucose keeps moving into the cells and the liver does not release its store — the level keeps falling."],"src":"Question and model answer are the tool’s · from Diabetes Mellitus deck, slides 17 and 19–22"}},{"id":"q3a774d2cfe","quiz":"w-pop","sys":"pop","pts":3,"q":"Define the social determinants of health and give two examples, saying how each affects health.","qh":"<p>Define the social determinants of health and give two examples, saying how each affects health.</p>","qt":"Define the social determinants of health and give two examples, saying how each affects health.","imgs":[],"type":"essay","authored":1,"saq":{"steps":["Definition: the conditions in which people are born, grow, live, work and age — the societal factors that give rise to social position (access to power, money and resources) and therefore to health. They account for at least half of health outcomes and inequities.","Example (any two, one mark each, with the effect): housing — cold, damp, overcrowded homes lead to respiratory illness and communicable disease · food environments — food deserts and swamps in low-income areas drive obesity, cardiovascular disease and type 2 diabetes.","Work and employment — insecure or unsafe work raises physical and mental health risk · education — linked to better income, job stability and health · transport — poor public transport limits access to care, work and education · the health system itself — how accessible and affordable care is."],"src":"Question and model answer are the tool’s · from Social Determinants of Health deck, slides 7, 9, 16–17 and 28–39"}},{"id":"qdb011b35e5","quiz":"w-pop","sys":"pop","pts":5,"q":"The Waitangi Tribunal recommended five principles of Te Tiriti o Waitangi for the health sector. Name them (in te reo Māori or English) with a brief meaning for nursing.","qh":"<p>The Waitangi Tribunal recommended five principles of Te Tiriti o Waitangi for the health sector. Name them (in te reo Māori or English) with a brief meaning for nursing.</p>","qt":"The Waitangi Tribunal recommended five principles of Te Tiriti o Waitangi for the health sector. Name them (in te reo Māori or English) with a brief meaning for nursing.","imgs":[],"type":"essay","authored":1,"saq":{"steps":["Tino rangatiratanga — self-determination: Māori lead decisions about Māori health; nurses work alongside Māori, not for Māori.","Mana taurite — equity: a fair opportunity for good health; resources targeted where need is greatest — not the same thing for everyone.","Whakamarumarutia — active protection: health is a taonga; act to prevent harm and address inequities rather than only responding to problems.","Kōwhiringa — options: properly resourced, culturally appropriate choices, including kaupapa Māori services and Māori models of health.","Pātuitanga — partnership: Māori involved in planning, delivering and evaluating services — decisions made with the community, not for it. (The “three Ps” are outdated and should not be used.)"],"src":"Question and model answer are the tool’s · from Population Health vs Personal Health deck, slides 20–31"}},{"id":"q6d84562104","quiz":"w-pop","sys":"pop","pts":4,"q":"Define primordial, primary, secondary and tertiary prevention and give an example of each.","qh":"<p>Define primordial, primary, secondary and tertiary prevention and give an example of each.</p>","qt":"Define primordial, primary, secondary and tertiary prevention and give an example of each.","imgs":[],"type":"essay","authored":1,"saq":{"steps":["Primordial — prevents risk factors from developing in a population, through large-scale social and environmental change. Example: the Healthy Homes Initiative.","Primary (“Prevent”) — action before the onset of disease so that it never occurs. Example: vaccination clinics, sexual health education, PPE at work.","Secondary (“Screen”) — detect disease early and stop it progressing. Example: cervical screening, mammograms, colonoscopy.","Tertiary (“Treatment”) — manage an existing condition to prevent it worsening, further disability or death. Example: an insulin regime in diabetes to prevent cardiovascular or renal disease."],"src":"Question and model answer are the tool’s · from Demography & Epidemiology deck, slides 38–45"}},{"id":"qbc6c2ac958","quiz":"w-prof","sys":"prof","pts":3,"q":"Define informed consent, and name the two pieces of New Zealand law that make it a requirement.","qh":"<p>Define informed consent, and name the two pieces of New Zealand law that make it a requirement.</p>","qt":"Define informed consent, and name the two pieces of New Zealand law that make it a requirement.","imgs":[],"type":"essay","authored":1,"saq":{"steps":["Definition: the PROCESS of communicating to a patient the benefits, risks and alternatives of a procedure or treatment, so that the patient can make an informed decision to accept it or not — more than a signature on a piece of paper.","The Code of Health and Disability Services Consumers’ Rights, Right 7 — the right to make an informed choice and give informed consent (the Code is a regulation under the Health and Disability Commissioner Act 1994).","The New Zealand Bill of Rights Act 1990, section 11 — the right to refuse to undergo medical treatment."],"src":"Question and model answer are the tool’s · from Informed consent 2026 deck, slides 3–4 and 28"}},{"id":"q0bc7ba99d3","quiz":"w-prof","sys":"prof","pts":3,"q":"Who can give consent to treatment in New Zealand? Cover an adult, a 14-year-old, and an adult who is not competent.","qh":"<p>Who can give consent to treatment in New Zealand? Cover an adult, a 14-year-old, and an adult who is not competent.</p>","qt":"Who can give consent to treatment in New Zealand? Cover an adult, a 14-year-old, and an adult who is not competent.","imgs":[],"type":"essay","authored":1,"saq":{"steps":["Anyone aged 16 or over can consent to — or refuse — their own treatment.","Under 16: a parent, guardian or other person acting in the place of a parent gives consent (or a court order).","A person aged 16 or over who is not competent: a legal guardian or someone holding a current enduring power of attorney. The nurse must still act in the person’s best interests and take reasonable steps to find out their views."],"src":"Question and model answer are the tool’s · from Informed consent 2026 deck, slides 8 and 21"}},{"id":"q49db232e0a","quiz":"w-prof","sys":"prof","pts":3,"q":"Define evidence-based practice and name the three things it integrates.","qh":"<p>Define evidence-based practice and name the three things it integrates.</p>","qt":"Define evidence-based practice and name the three things it integrates.","imgs":[],"type":"essay","authored":1,"saq":{"steps":["Definition: a shift away from basing decisions on opinion and past practice, towards research and evidence guiding clinical decision-making, in order to improve patient outcomes.","It integrates (1) the best research evidence and (2) clinical expertise…","…and (3) the patient’s values and preferences."],"src":"Question and model answer are the tool’s · from Evidence-based Practice 2026 deck, slides 11 and 13"}}],"chains":[],"cases":[],"focus":[{"id":"nursing-process","sys":"care","tier":1,"t":"The nursing process (ADPIE)","flag":"LO1 X EC","done":"Name the five steps in order and say what happens in each; tell subjective from objective data; recognise a nursing diagnosis (not a medical one) and write one in three parts — problem, related to, as evidenced by; say what makes a goal well written; say what evaluation decides (met / partially met / not met).","ask":"Ten single-best-answer questions at definition level: “which is the first step”, “which is an example of subjective data”, “which is a nursing diagnosis” (Risk for infection), “which is a measurable outcome” (walk 50 metres with assistance within 48 hours). No scenario longer than a line.","cap":"The quiz never asks you to WRITE a diagnosis or a goal — it asks you to recognise a good one. Writing them is the short-answer risk, and the Case Study assessment already made you do it. LO1 is literally “apply the nursing process”, and ADPIE returns in Care Plans, Holistic Assessment and Discharge Planning.","src":"The Nursing Process 2026 deck · Nursing Process quiz","crit":"“Nursing process: Nursing care planning”","n":13,"all":13,"pts":17,"qz":4,"saq":1,"na":1},{"id":"care-plans","sys":"care","tier":1,"t":"Nursing care plans — diagnosis, SMART goal, interventions, rationale, evaluation","flag":"LO1 X EC","done":"Say what a care plan is for; pick the correctly prioritised NANDA-I diagnosis for a patient (life-threatening → safety → patient-identified → nurse-identified); spell out SMART; tell a short-term from a long-term goal; tell a nurse-initiated (independent) from a collaborative intervention; say what goes in the evaluation column and the three verdicts.","ask":"One-line patients: fractured ribs → Acute pain; immobile → Risk for Impaired Skin Integrity; “which outcome shows the plan is working” (pain 2/10) or “needs revision” (frequent hypoglycaemia). Plus one piece of trivia — what NANDA stood for before 2002.","cap":"You are not asked to produce a full five-column plan in a multi-choice. Rationale with citations was for the assignment, not the exam. Know the columns and what belongs in each.","src":"Nursing Care Plans 2026 deck · Nursing Care Plans quiz","crit":"“Nursing process: Nursing care planning”","n":11,"all":11,"pts":11,"qz":2,"saq":0,"na":0},{"id":"hha","sys":"care","tier":1,"t":"Holistic health assessment","flag":"LO1 LO3 X EC","done":"Define holism; list what each of the four aspects covers — physical, psychological, social (with cultural) and spiritual — and give a question you would ask under each; tell primary from secondary sources and subjective from objective data; know the two physical assessments the lecturers single out (vital signs, falls risk) and the Morse Fall Scale bands (<25 low · 25–45 moderate · >45 high); assess a wound with T.I.M.E. — Tissue, Inflammation/infection, Moisture balance, Epidermal edges — plus onset, duration, characteristics, location, accompanying symptoms.","ask":"“Which question assesses the PSYCHOLOGICAL aspect”, “which is an open-ended question”, “a family member tells you their mother is in pain — what source is this?” (secondary), “name two physical assessments done in a holistic assessment”.","cap":"No quiz touches the wound mnemonic T.I.M.E. — but “wound assessment” is on the lecturers’ exam themes list, so learn it from slide 24. The Lily scenario is not asked. It is the first stage of the nursing process — expect it to be asked as that.","src":"Holistic Health Assessment 2026 deck · Holistic Health Assessment quiz","crit":"“Emergency assessment, Holistic assessment, pain assessment, wound assessment, fall risk assessment” — one line across three rows (emergency assessment = the primary survey, under Vital signs; pain has its own row). No question here asks wound assessment (T.I.M.E., slide 24), and falls risk is asked only by name — never the Morse Fall Scale itself.","n":11,"all":11,"pts":14,"qz":2,"saq":1,"na":1},{"id":"sdoh","sys":"pop","tier":1,"t":"Social determinants of health, equity and the social gradient","flag":"LO2 X EC","done":"Define the social determinants; take any one — housing, food environment, work, education, transport, early childhood, stress, addiction, social exclusion — and say HOW it changes health; separate equity from equality and inequality from inequity; explain the social gradient; say why Te Tiriti makes equity an obligation.","ask":"“How does [stress / work / food / social exclusion / addiction] function as a determinant?” — the right answer is always the full causal sentence, the wrong ones are partial or blame the individual. Two straight equity questions and one on Te Tiriti. 14 questions: the biggest lecturer block in the bank.","cap":"No statistics are asked — not the 50% figure, not the disability numbers. The Rio Declaration is on a slide and nowhere in the quiz. LO2 is this lecture almost word for word, and equity-vs-equality comes back in Population Health, the Health Strategy and Community Needs Assessment.","src":"Social Determinants of Health deck · Social Determinants of Health quiz","crit":"“Health inequalities & inequities” · “Social and economic determinants of health” · “Social and economic inequalities in Aotearoa New Zealand”","n":15,"all":15,"pts":17,"qz":2,"saq":1,"na":1},{"id":"pop-health","sys":"pop","tier":1,"t":"Population health, the five Te Tiriti principles and PROGRESS","flag":"LO1 LO2 X EC","done":"Tell population health from personal health and give a nursing intervention at each level; name public-health measures and what each is for (smokefree, water quality, vaccination, emergency planning); name the five Tribunal principles — tino rangatiratanga, mana taurite, whakamarumarutia, kōwhiringa, pātuitanga — with a nursing meaning for each; spell out PROGRESS.","ask":"The quiz stays on the population/personal distinction and on everyday public health — “why is water quality relevant”, “the objective of smokefree environments” — plus one recall item (whooping cough = pertussis).","cap":"The lecturers’ quiz asks NOTHING on the five principles or PROGRESS, yet the deck spends a third of its slides on them and says outright never to use the “three Ps”. That gap is why they are in the tool’s written section. The five principles return in Community Needs Assessment and Tikanga — learn them once, here.","src":"Population Health vs Personal Health deck · Population Health quiz","crit":"“Personal Health v Population Health”","n":11,"all":11,"pts":15,"qz":2,"saq":1,"na":1},{"id":"ebp","sys":"prof","tier":1,"t":"Evidence-based practice and nurse inquiry","flag":"LO3 EC","done":"Define EBP as three things integrated — best research evidence, clinical expertise, patient values and preferences; give the five steps in order (question → find → appraise → implement → evaluate); rank the levels of evidence (systematic review at the top, expert opinion at the bottom); name a database (Cochrane, CINAHL, JBI); say what nurse inquiry is.","ask":"“Primary goal of EBP” (improve patient outcomes), “first step” (formulate a clinical question), “highest level of evidence” (systematic reviews), “which database”, “what is clinical expertise”. Two keys are “All of these”.","cap":"Gibbs and Kolb are pictured in the deck and never asked. No research-methods detail (RCT design, qualitative vs quantitative) is tested beyond the pyramid. LO3 opens with “discuss evidence-based practice”, which is why this small quiz sits in tier 1.","src":"Evidence-based Practice 2026 deck · Evidence-based Practice quiz","crit":"“Evidence-based practice”","n":10,"all":10,"pts":12,"qz":2,"saq":1,"na":1},{"id":"documentation","sys":"care","tier":1,"t":"Clinical documentation, ISBAR and SOAP","flag":"LO4 X EC","done":"Give the three reasons nurses document (legal, professional, communication); state the rules — black or blue pen, 24-hour time, sign with designation, no gaps, correct an error with ONE line plus “error” and initials, retrospective entries marked as such; say who owns the notes (the organisation); place a statement under the right ISBAR letter; say what each SOAP/SOAPIER letter stands for; give AI²DET.","ask":"Rule-recall: “what colour pen”, “why no gaps”, “who owns the notes”, “what do you do if you make a mistake”, “what is the P in SOAP”, and one applied item — which statement is the A in ISBAR (“temperature 39.3 and she is confused”). One on terminology: write cyanosis, not “blue lips”.","cap":"Abbreviation lists are in the deck; the quiz asks none. The legislation slide (HPCAA, HDC Act, Privacy Act) is not tested here — it is tested in the Knowledge Check and Informed Consent. ISBAR returns in Roles of Nurses with the same letters.","src":"Clinical Documentation 2026 deck · Clinical Documentation quiz","crit":"“Documentation, Communication (ISBAR(R)/SOAPIER)”","n":12,"all":12,"pts":14,"qz":3,"saq":1,"na":1},{"id":"health-literacy","sys":"clin","tier":1,"t":"Health literacy and patient education — Ask · Build · Check, teach-back","flag":"LO4 X EC","done":"Define health literacy at both levels (personal and organisational) and say it is not intelligence; give the consequences of low health literacy; run Ask–Build–Check on a patient and say what an “Ask” question sounds like; explain teach-back; adapt teaching to a child (play therapy) and to an adult; list practical steps — plain language, 3–5 key points, demonstrate, interpreter.","ask":"Half the quiz is small scenarios with the same right answer in different clothes: plain language + visual aids, demonstrate and have them show you, teach-back to confirm. One asks for an example of step A (“what do you already know about…?”), one on a six-year-old and an IV line (play therapy).","cap":"The Kōrero Mārama survey findings and the NZ framework’s three levels are on slides and not asked. Teach-back comes back in Discharge Planning and Tikanga as the same idea — one thing to learn, three places it scores.","src":"Health Literacy & Patient Education 2026 deck · Health Literacy quiz","crit":"“Health Literacy” · “Patient education”","n":10,"all":10,"pts":10,"qz":1,"saq":0,"na":0},{"id":"vitals","sys":"clin","tier":2,"t":"Vital signs, the primary survey and the Early Warning Score","flag":"LO3 EC","done":"Run A–E and say what is assessed under each; give the normal adult ranges (SpO₂ 95–100%, BP 110–140 / 60–90, temperature 36.5–37.5 °C) and the named alterations — tachy/bradypnoea, tachy/bradycardia, hypo/hypertension, pyrexia >38, hypothermia <35; AVPU; signs of respiratory distress; the first Korotkoff sound; when to count for a full minute; what the EWS is for and what triggers escalation.","ask":"Terminology and ranges: “RR of 32 is called…”, “temperature below 35 is…”, “normal SpO₂”, “what does A in AVPU stand for”, “first Korotkoff sound represents…”, “irregular pulse — what do you do”. Three keys are “All of these”.","cap":"You already passed the practical. The exam side is words and numbers, not technique. The exact EWS scoring bands are not asked — only its purpose.","src":"Vital Signs 2026 deck · Vital Signs quiz","crit":"“Vital signs, injections, blood glucose monitoring”, and the “Emergency assessment” of the assessment line (the primary survey, A–E). Injections have their own row (from the CLS page “Inpatient Prep – Injections”, since no lecture teaches them). Blood glucose numbers sit under Diabetes; the procedure is on the CLS page “Inpatient Prep – Blood Glucose Assessment”.","n":20,"all":20,"pts":23,"qz":5,"saq":1,"na":1},{"id":"ipc","sys":"clin","tier":2,"t":"Infection prevention and control","flag":"LO3 EC","done":"Define an HAI (appears 48 hours or more after admission) and name the common four; give the six links of the chain of infection in order; define standard precautions and list them; match a condition to contact, droplet or airborne precautions and the PPE each needs; give the donning order; say why hand hygiene comes first.","ask":"Match-the-precaution vignettes — diarrhoea → contact; a child with vesicles, suspected chickenpox → airborne; “what PPE for droplet” — plus “most effective method” (hand hygiene), the donning order, and two “All of these”.","cap":"Spaulding’s classification, sterilisation methods and the named organisms are in the deck and absent from the quiz. Doffing order is on a slide; only DONNING is asked.","src":"Infection Prevention & Control 2026 deck · IPC quiz","crit":"“Infection prevention and control”","n":13,"all":13,"pts":16,"qz":4,"saq":1,"na":1},{"id":"diabetes","sys":"clin","tier":2,"t":"Diabetes mellitus — type 1 vs type 2, hypo- and hyperglycaemia, DKA","flag":"LO3 EC","done":"Say what insulin does and where it is made; contrast type 1 (auto-immune, no insulin, usually young) with type 2 (resistance, lifestyle and genetics, 90–95%); give the normal blood glucose (4–7.5 mmol/L), the hypo line (<4) and its causes and symptoms; recognise DKA from a vignette — high glucose, ketones, vomiting, abdominal pain; list risk factors and long-term complications.","ask":"Eight plain recall questions: a common symptom (frequent urination), the hormone, which type in children, the normal fasting range, the cause of type 1 — and one vignette (glucose 30, ketones, vomiting → DKA). Two keys are “All of these”.","cap":"Treatment of hyperglycaemia step by step, HbA1c detail and the annual-check list are slides the quiz ignores. This is the only disease-specific lecture with a quiz — Long-term Conditions (9 Oct) may widen it.","src":"Diabetes Mellitus deck · Diabetes quiz","crit":"“Diabetes, Rheumatic fever”, and the “blood glucose monitoring” of the vital-signs line","n":10,"all":10,"pts":13,"qz":3,"saq":1,"na":1},{"id":"demo-epi","sys":"pop","tier":2,"t":"Demography, epidemiology and the levels of prevention","flag":"LO2 EC","done":"Define demography and epidemiology and say why a nurse needs each; give the five processes demographers study; tell observational from experimental studies; draw the epidemiological triangle and break it at each corner; define epidemic and endemic; place any example at primordial, primary, secondary or tertiary prevention.","ask":"Definitions first (“what is demography”, “which best describes epidemiology”), then prevention levels by example — preventing risk factors → primordial; an insulin regime for someone with diabetes → tertiary; preventing disease occurring → primary. One key term (incidence rate).","cap":"None of the New Zealand figures (fertility 1.83, life expectancy, the 90+ projections) is asked. The Prevent / Screen / Treat hooks from the deck are all the quiz needs.","src":"Demography & Epidemiology deck · Epidemiology & Demography quiz","crit":"“Demography & Epidemiology”","n":11,"all":11,"pts":14,"qz":2,"saq":1,"na":1},{"id":"consent","sys":"prof","tier":2,"t":"Informed consent","flag":"LO1 LO4 EC","done":"Define informed consent as a process; name its two legal roots (the Code of Rights, Right 7 · the NZ Bill of Rights Act, s 11); list what a patient must be told; say who can consent — 16 and over, a parent or guardian under 16, an EPOA or legal guardian for someone not competent; handle the three hard cases — emergency, surgery extended under anaesthetic, a patient under the Mental Health Act; give the nurse’s role (advocate, interpreter, call the team back, witness).","ask":"Short scenarios: limited English → professional interpreter; changes their mind mid-transfusion → stop and notify; dementia, not competent → legal guardian. Plus the age (16), who obtains consent (the person doing the procedure) and Gillick competence (true/false).","cap":"Gillick competence is asked in the quiz and is NOT on any slide in the deck — it is the one place the quiz reaches past the lecture, so read a paragraph on it. The NZNO duty-of-care slide is not tested.","src":"Informed consent 2026 deck · Informed Consent quiz","crit":"“Informed consent”","n":10,"all":10,"pts":14,"qz":2,"saq":2,"na":2},{"id":"pain","sys":"care","tier":2,"t":"Pain assessment — OLDCARTS, types of pain, pain scales","flag":"LO3 EC","done":"Give McCaffery’s definition and what it means for assessment; separate nociceptive (somatic, visceral) from neuropathic pain by cause and by the words a patient uses; separate acute from chronic; list behavioural and physiological responses; run OLDCARTS letter by letter; choose a scale for the patient in front of you (numeric, Wong-Baker FACES, FLACC); say when pain is assessed.","ask":"The lecturers’ Practice Quizzes (captured 27 Oct) ask two one-liners: the first thing to do for a patient complaining of pain (assess it with a pain scale), and when to assess pain (every time you check on your patient). The tool’s questions copy the shape of the quizzed lectures: definitions, “which type of pain is this” from a one-line description, and which letter of OLDCARTS a statement belongs under.","cap":"The second half of the deck — analgesic ladder, NSAIDs, opioids, routes — is pharmacology and belongs to the Pharm paper; the tool wrote nothing from it. The practice handout’s scenarios are the best rehearsal for a short answer.","src":"Pain Assessment BN2 deck + the Pain Assessment Practice Handout","crit":"“pain assessment”, inside the line “Emergency assessment, Holistic assessment, pain assessment, wound assessment, fall risk assessment”","n":6,"all":6,"pts":9,"qz":3,"saq":1,"na":4},{"id":"discharge","sys":"care","tier":2,"t":"Discharge planning","flag":"LO1 noquiz X EC","done":"Define discharge planning and say when it starts (at admission); give the four key elements; give the nurse’s role as coordinator; walk A–P–(prepare)–I–E for a patient; list what a written discharge summary contains; say why teach-back is a safety tool; work the Cyril Lear scenario — medicines, wound and District Nurse, mobility and falls, support at home.","ask":"Nobody knows — no lecturer question exists. The Cyril Lear scenario in the deck is the closest thing to a ready-made short answer in the whole course.","cap":"The bed-pressure slides (red days, acuity) are context, not content. Discharge planning is also one slide of Holistic Health Assessment, where it is said the same way.","src":"Discharge Planning Lecture deck","crit":"“Discharge planning”","n":6,"all":6,"pts":8,"qz":1,"saq":1,"na":6},{"id":"fcc","sys":"care","tier":2,"t":"Family-centred care and Whānau Ora","flag":"LO1 EC","done":"Give the Stats NZ definition of family beside the nursing one (whoever the person says); name the four shared functions of families; give the three elements of facilitating family-centred care with an action each; say what a genogram and ecomap are for; state what may be shared with family under the Health Information Privacy Code; define family violence; describe Whānau Ora — who, when, how it is funded, what it does.","ask":"The lecturers’ Practice Quizzes (captured 27 Oct) ask two one-liners: a principle of family-centred care (partnership), and what nursing practice now focuses on (the client). The deck ends on a Menti “recap and quiz” that was run live and not posted.","cap":"The history-of-the-family slides are scene-setting. Health Strategy Priority 1 appears here too — it is counted under the Health Strategy row.","src":"Family Centred Care deck","crit":"“Family centered care”","n":6,"all":6,"pts":8,"qz":2,"saq":1,"na":4},{"id":"cna","sys":"pop","tier":2,"t":"Community needs assessment — McMurray’s framework","flag":"LO1 LO2 noquiz X EC","done":"Give the four steps in order — Engage, Map, Analyse, Empower — and what the nurse does in each; say who key community members are; tell primary from secondary data and place a windscreen survey; fill a SWOT grid and say which halves help and harm; apply a Te Tiriti principle to a finding.","ask":"Nobody knows — no lecturer question exists. You have already been assessed on this once: it is the framework behind the Community Profile presentation, and the lecture notes say ANALYSE is the step students skip.","cap":"The eight aspects of the community profile belong to the assignment brief, not the exam. The five Te Tiriti principles here are the same five as in Population Health.","src":"Community Needs Assessment Framework deck","crit":"“Community needs assessment”","n":6,"all":6,"pts":8,"qz":1,"saq":1,"na":6},{"id":"tikanga","sys":"prof","tier":2,"t":"Tikanga best practice and Kawa Whakaruruhau (cultural safety)","flag":"LO1 LO4 noquiz X EC","done":"Define cultural safety and say who decides whether care was safe (the recipient); say why awareness, sensitivity and competence are not enough; define kawa, tikanga, tapu and noa; name the parts of the body that are tapu; give the principles of tikanga best practice with an action each — whakawhanaungatanga, manaakitanga, whānau-centred care, respect for tikanga and taonga, shared decision-making.","ask":"The lecturers’ only quiz here is the Module 11 video quiz (Te Tiriti, Māori Health, Kawa Whakaruruhau, Cultural Safety): 14 written questions about six short videos, such as what kawa, whakaruruhau and wairuatanga mean. It has no answers, so none of it is in this bank. Several of the deck’s slides are pictures with no text, so the tool’s questions come only from the slides that carry words.","cap":"A short deck (23 slides). Cultural safety is also a Nursing Council pou and turns up in the Pharm paper’s legal lecture — same definition.","src":"Tikanga Best Practice and Kawa Whakaruruhau deck","crit":"“Therapeutic use of self, cultural awareness and sensitivity” — the cultural half of that line. No lecture is called cultural awareness; this deck is where awareness and sensitivity are set against cultural safety.","n":6,"all":6,"pts":8,"qz":1,"saq":1,"na":6},{"id":"nzhs","sys":"pop","tier":2,"t":"New Zealand Health Strategy 2023 and Pae Ora","flag":"LO2 X EC","done":"Say what the Pae Ora (Healthy Futures) Act 2022 changed; give the strategy’s two long-term goals; list the six priority areas and recognise any one from its description; separate equity from equality; name the partner strategies (Pae Tū, Te Mana Ola…); give the three priorities of the Government Policy Statement 2024–27 — access, timeliness, quality; say what equity in action looks like for a nurse.","ask":"The lecturers’ Practice Quizzes (captured 27 Oct) ask two: which Act the 2023 strategy is published under (Pae Ora (Healthy Futures) Act 2022), and one of its main goals (health equity). The deck’s own learning outcomes are a list of things to “identify and describe” — 2 goals, 6 priorities — which is exactly how a short answer would be worded.","cap":"The politics of the Māori Health Authority’s disestablishment is context. The associated-strategies slides are a list nobody could be asked to reproduce.","src":"New Zealand Health Strategy 2023 deck","crit":"“2023 Health Strategy”","n":6,"all":6,"pts":8,"qz":2,"saq":1,"na":4},{"id":"tus","sys":"prof","tier":2,"t":"Therapeutic use of self — communication and emotional intelligence","flag":"LO4 EC","done":"Say what professional agency is for; name Watson’s theory and its idea of a caring moment; separate responsive from assertive communication with an example; list verbal and non-verbal elements and barriers; name the five components of emotional intelligence; separate surface acting from deep acting and place both under self-regulation.","ask":"The lecturers’ Practice Quizzes (captured 27 Oct) ask one: the two principles that underpin therapeutic use of self (competent communication and emotional intelligence). The deck’s role-plays (the frightened patient, the refused medication, the angry patient at the end of a shift) are scenario stems waiting to be used.","cap":"Watson’s ten carative factors are a picture on one slide — not reproducible, so not written into a question.","src":"Therapeutic Use of Self BN2 deck","crit":"“Therapeutic use of self, cultural awareness and sensitivity” — the cultural half is covered under Tikanga and Kawa Whakaruruhau.","n":5,"all":5,"pts":7,"qz":2,"saq":1,"na":4},{"id":"rheumatic-fever","sys":"clin","tier":2,"t":"Rheumatic fever and rheumatic heart disease","flag":"LO2 noquiz EC","done":"Define rheumatic fever as an auto-immune response — not an infection, not contagious — to a Group A Strep throat or skin infection that was not treated properly, 1–5 weeks later; say who it mainly affects (Māori and Pacific children aged 4–19) and why (crowding, inequity); list the symptoms — joint pain that moves joint to joint, fever, tiredness, chorea, rash, breathlessness, a new murmur; say how it is diagnosed (no single test: history, throat swab, Strep antibodies, ECG, echo); teach the ongoing care — penicillin every 28 days for at least 10 years or to age 21, never late, extra antibiotic cover and the wallet card before dental visits, every sore throat checked; say what rheumatic heart disease is (scarred mitral and/or aortic valves).","ask":"The lecturers do have a Rheumatic Fever quiz (10 questions), but it allows one attempt only and has not been sat, so none of its questions are here. The tool’s questions copy the quizzed lectures’ shape: definitions, “who does it affect”, the 28-day rule, and short scenarios (a child with jerky movements, a family going on holiday).","cap":"The two decks disagree on the acute antibiotic (Janine: penicillin; the guest speaker: oral amoxicillin, and “there is no treatment for ARF”), so the tool asks nothing that turns on it. The guest speaker’s hospital detail (CRP, ESR, warfarin and INR checks) goes no further than a list. Her equity slides tie this row to Social Determinants.","src":"Rheumatic Fever deck (Janine Craig) + Rheumatic Fever – Guest speaker deck (Jessica Murray, CNS KidzFirst), Canvas Module 8","crit":"“Diabetes, Rheumatic fever”","n":6,"all":6,"pts":9,"qz":1,"saq":1,"na":6},{"id":"ltc","sys":"clin","tier":2,"t":"Long-term conditions and self-management","flag":"EC","done":"Define a long-term condition (over 6 months, ongoing or recurring, a significant impact; also called NCDs), self-management (any way a person manages their own condition — ongoing, not one-off) and self-management support; list what a good self-manager does; say why interdependence matters to Māori, Pacific and South Asian peoples; name Wagner’s six components and define patient activation; say what Journey to Wellbeing — Huarahi Ora changed (whānau inclusive, culturally safe, community-designed); give the nurse’s role and the four essential components of programmes; work the asthma and coeliac examples.","ask":"The lecturers’ Long-Term Health Conditions quiz (captured 27 Oct; it sits in no Canvas module) is ten definition-level single-best-answers: which condition is long-term (hypertension), the treatment goal for long-term pain, what self-management support must do, interdependence, multi-morbidity, smoking cessation for COPD and the nurse’s role (empowering). Practice Quiz 1 adds one more: the older name for long-term conditions (chronic conditions). The deck’s own learning outcomes are “define”, “describe”, “identify” — short-answer verbs — and its last third is three “what would this person need to know and have access to?” cases: asthma, coeliac disease, CRPS.","cap":"Huarahi Ora’s 7 principles are on picture-only slides, and the CRPS case was a group exercise with no text — neither is asked. Te Kete Haerenga is a patient workbook; two questions come from it (its SMART ends in Trackable, not the care-plan template’s timely; its wheel is Te Whare Tapa Whā). Sits straight on top of Diabetes and Health Literacy.","src":"Self-management support for people with long-term conditions 2026 deck + Te Kete Haerenga workbook (Canvas, Module 9)","crit":"“Long term conditions & self-management”","n":12,"all":12,"pts":14,"qz":3,"saq":1,"na":1},{"id":"injections","sys":"clin","tier":2,"t":"Injections — routes, angles and sites (CLS Inpatient Prep)","flag":"noquiz EC","done":"Name the four parenteral routes and where each deposits the medicine (ID dermis · SC below the dermis · IM muscle · IV vein) with the angles (ID 15° · SC 45°, or 90° if 5 cm can be grasped · IM 90°); pick a subcutaneous site (the abdomen for heparin and insulin) and explain insulin site rotation and lipodystrophy; say why IM absorbs faster (muscle is more vascular); give the three IM sites with their maximum volumes and cautions (vastus lateralis 5 ml · ventrogluteal 4 ml, safe for all · deltoid 2 ml, radial and ulnar nerves); list what to check before choosing an IM site; give the advantages and disadvantages, including avoiding SC, IM and ID with bleeding tendencies.","ask":"Nobody knows — no lecturer question exists and no lecture teaches it. The exam themes list names injections beside vital signs and blood glucose monitoring; the only course material is this Clinical Learning Suite page.","cap":"Technique — drawing up from ampoules and vials, reconstituting, giving the injection — is the CLS practical and the Potter & Perry workbooks it links, not this page; the exam side is routes, angles, sites, volumes and reasons. Blood glucose monitoring has its own CLS page; its numbers are under Diabetes.","src":"CLS page “Inpatient Prep – Injections” (Canvas; adapted from Potter & Perry, ANZ ed. 2026)","crit":"“Vital signs, injections, blood glucose monitoring” — the injections part.","n":6,"all":6,"pts":9,"qz":1,"saq":1,"na":6},{"id":"phc","sys":"pop","tier":2,"t":"Primary health care and health promotion — Alma-Ata, the continuum, upstream to downstream","flag":"LO2 noquiz X EC","done":"Define primary health care (people-centred, most of a person’s health needs across a lifetime) and tell it from primary care (the first point of contact); give the Alma-Ata Declaration (1978) definition — essential care that is accessible, affordable and appropriate for all — and its five principles: accessibility, community participation, health promotion, appropriate technology, inter-sectoral collaboration, each with a nursing example; define health promotion (enabling people to increase control over, and improve, their health); name the Ottawa Charter’s three strategies — advocate, enable, mediate; name the five parts of the health promotion continuum — health education, health screening, community action, social marketing, influencing policy — with the deck’s NZ example of each; describe upstream, midstream and downstream approaches with an intervention for each.","ask":"Nobody knows — no lecturer question exists. The deck’s learning outcomes are all “discuss”: the origins, the principles, the NZ frameworks, the continuum, upstream/midstream/downstream — short-answer verbs, and the exam themes list names the principles and the three streams outright.","cap":"Nearly every slide is a picture of its text; the tool read them one by one. The Bangkok Charter (2005) is one slide; the NZ Health Strategy, Primary Health Care Strategy and Whānau Ora slides are pictures with no text (the Strategy has its own row). Slide 28 sets the Te Tiriti articles against health promotion — kāwanatanga, tino rangatiratanga, ōritetanga — the same idea as the Population Health principles.","src":"Primary Health Care & Health Promotion deck (Canvas, posted for Wed 14 Oct)","crit":"“Theory of Health Promotion, upstream/midstream/downstream factors” · “Principles of Primary Health Care”","n":7,"all":7,"pts":11,"qz":1,"saq":2,"na":7},{"id":"screening","sys":"prof","tier":2,"t":"Health screening and the Standards of Competence","flag":"noquiz EC","done":"Say what screening is for (finding people at risk before symptoms, for early intervention) and that it never gives a diagnosis; give the benefits and the risks — a false negative falsely reassures and delays diagnosis, a false positive causes anxiety and further tests; say what follows a positive result (a diagnostic test) and a negative one (screen again later); tell organised screening (national programmes run by the National Screening Unit that invite the highest-risk groups) from opportunistic (asked for, or offered by a health professional — the wellness clinics); name the six organised programmes with their key fact (BreastScreen 45–69 every 2 years · cervical HPV test every 5 years · bowel FIT every 2 years · newborn heel prick at 24–48 hours · newborn hearing before discharge · antenatal); give the nurse’s role; say a student nurse declines a telephone order or an overdue PRN — not in their scope.","ask":"No lecturer question asks screening. The lecturers’ Practice Quizzes (captured 27 Oct) ask two on student scope of practice: a doctor’s telephone order, and a busy preceptor asking you to give an overdue paracetamol. Both answers are “decline, it is not in a student nurse’s scope”.","cap":"Exact funding ages beyond BreastScreen are detail — the bowel starting age is mid-change in the deck (60, lowering to 58), so nothing turns on it. The wellness-clinic slides (BMI, urinalysis, peak flow) are the practical, not the paper. The Nursing Council Standards of Competence (2025, six pou) have no lecture deck — only the PDF on Canvas.","src":"Health Screening deck (Canvas, posted for Tue 20 Oct) · Practice Quizzes 1–3","crit":"“Health screening” · “Standards of Competence & BN2 Student Nurse scope of practice”","n":8,"all":8,"pts":11,"qz":3,"saq":1,"na":6},{"id":"self-care","sys":"prof","tier":2,"t":"Self-care, burnout and resilience","flag":"EC","done":"Define stress, burnout, compassion fatigue, self-care and resilience; give two differences between burnout and compassion fatigue; name a physical and an emotional self-care activity; say who a struggling student turns to first (their preceptor).","ask":"Common-sense single answers — regular exercise, journalling, 7–9 hours’ sleep, prioritise with a schedule, “all of these” for the signs of burnout.","cap":"The quiz can be passed on general knowledge; only the burnout / compassion-fatigue distinction needs the deck. Eight marks, and no learning outcome names it — but the lecturers’ exam themes list does, which is why it is not in the bottom band.","src":"Self-care in nursing deck · Self-care quiz","crit":"“Self-care in nursing”","n":8,"all":8,"pts":8,"qz":1,"saq":0,"na":0},{"id":"roles","sys":"prof","tier":2,"t":"Roles of nurses — aged care, primary, acute, mental health, informatics","flag":"X EC","done":"Define multi-morbidity, primary healthcare and acute care; name the three residential levels of aged care; say what recovery means in mental health and what interpersonal theory puts at the centre; run ISBAR; give an example of nursing informatics.","ask":"The lecturers’ Practice Quizzes (captured 27 Oct) ask two: the nurse as advocate when a client and family disagree about treatment, and who telemedicine helps most (people far from care). The deck is mostly videos and “a day in the life” timetables.","cap":"A survey lecture: a definition from each of five settings is as deep as it can go. ISBAR is the part that scores elsewhere (Clinical Documentation). The exam themes list names this lecture three times — roles, nursing informatics, continuum of care — which is why it is not in the bottom band.","src":"Roles of Nurses deck","crit":"“Roles of nurses” · “Nursing informatics” · “Continuum of care” — informatics and continuum of care are taught nowhere else, and one question here asks each (both the tool’s). “Continuum of care” is on no slide in those words; the nearest is the community-health slide: services cover “the entire health and social care continuum”.","n":6,"all":6,"pts":10,"qz":2,"saq":1,"na":4},{"id":"knowledge-check","sys":"prof","tier":3,"t":"Professional conduct basics (the orientation Knowledge Check)","flag":"","done":"Match Code of Conduct principles to their numbers (1 = dignity and individuality, 8 = public trust); name the NZNO social media guideline and the NCNZ Professional Boundaries guideline; state whose health information you may open on placement (only your own patients’).","ask":"“Which principle is this?” and “which guideline says this?” — six questions. The other ten in that quiz are about being a student here (attendance, extensions, plagiarism, online-exam rules) and are never dealt into a mock, so they are not counted on this row.","cap":"It sits in the orientation module, not the lecture series. The Code of Conduct’s eight principles are the only part with a life beyond this quiz — they return in the Pharm paper. It is the one row the lecturers’ exam themes list does not name.","src":"Knowledge Check quiz (orientation module)","n":6,"all":6,"pts":6,"qz":1,"saq":0,"na":0}],"helpline":{},"held":[{"quiz":"Te Tiriti, Māori Health, Kawa Whakaruruhau, Cultural Safety","why":"essay with no authored model answer","q":"What was your understanding about cultural safety and kawa whakaruruhau, prior t"},{"quiz":"Te Tiriti, Māori Health, Kawa Whakaruruhau, Cultural Safety","why":"essay with no authored model answer","q":"How does a simple welcome help build trust between nurses and patients?"},{"quiz":"Te Tiriti, Māori Health, Kawa Whakaruruhau, Cultural Safety","why":"essay with no authored model answer","q":"What is 'kawa'"},{"quiz":"Te Tiriti, Māori Health, Kawa Whakaruruhau, Cultural Safety","why":"essay with no authored model answer","q":"What is 'whakaruruhau'"},{"quiz":"Te Tiriti, Māori Health, Kawa Whakaruruhau, Cultural Safety","why":"essay with no authored model answer","q":"What is 'wairuatanga'"},{"quiz":"Te Tiriti, Māori Health, Kawa Whakaruruhau, Cultural Safety","why":"essay with no authored model answer","q":"According to Dean, what is the purpose of Pou 1: Maori Health"},{"quiz":"Te Tiriti, Māori Health, Kawa Whakaruruhau, Cultural Safety","why":"essay with no authored model answer","q":"What does the speaker say is \"the epitomy of kawa whakaruruhau\"?"},{"quiz":"Te Tiriti, Māori Health, Kawa Whakaruruhau, Cultural Safety","why":"essay with no authored model answer","q":"What examples are given of how we can uphold kawanatanga, tino rangatiratanga, o"},{"quiz":"Te Tiriti, Māori Health, Kawa Whakaruruhau, Cultural Safety","why":"essay with no authored model answer","q":"What example does she give for how do can embed rangatiratanga in our practice?"},{"quiz":"Te Tiriti, Māori Health, Kawa Whakaruruhau, Cultural Safety","why":"essay with no authored model answer","q":"What examples does she give of what tikanga looks like in nursing practice?"},{"quiz":"Te Tiriti, Māori Health, Kawa Whakaruruhau, Cultural Safety","why":"essay with no authored model answer","q":"What did she do to help the patient and whanau understand why they should stay i"},{"quiz":"Te Tiriti, Māori Health, Kawa Whakaruruhau, Cultural Safety","why":"essay with no authored model answer","q":"What did the nurse do to advocate for the kaumatua and his whānau?"},{"quiz":"Te Tiriti, Māori Health, Kawa Whakaruruhau, Cultural Safety","why":"essay with no authored model answer","q":"How did the nurse uphold tikanga for a patient who was on life support?"},{"quiz":"Te Tiriti, Māori Health, Kawa Whakaruruhau, Cultural Safety","why":"essay with no authored model answer","q":"What examples does she give about how nurses can demonstrate: 1. Whanaungatanga "}],"meta":{"id":"inp-final","prefix":"inpf.","title":"INP Final · Paper Sim","h1":"INP Final exam · Paper Sim","tool":{"kick":"Intro to Nursing Practice · 722.556","name":"INP Final exam","sub":"40 multi-choice + 15 short answers · 160 min","icon":"🩺","hue":"#16a34a"},"short":"INP Paper Sim","hub":"inp/exam","more":[{"sec":"Learn","href":"rep.html","ic":"🧠","t":"Write the short answers","s":"The lecturers’ own written questions (the Te Tiriti video quiz), as key words that come back over the days"},{"sec":"Learn","href":"cards.html","ic":"🗂","t":"Flashcards","s":"Anki, stripped down: Janine’s revision slides, the lecturers’ quiz answers and the tool’s short answers","hl":{"c":"#16a34a","c2":"#4ade80","kick":"Spaced repetition","go":"Study ›"}}],"paper":"Introduction to Nursing Practice","bankOf":"the INP lecturers’","who":"the INP lecturers","aiCtx":"I’m a first-year nursing student in New Zealand sitting the final exam for Introduction to Nursing Practice (40 multiple-choice + 15 short-answer questions).","sitting":{"what":"the INP final","date":"2026-11-02","when":"Mon 2 Nov · one of two sittings between 8 am and 4 pm, rooms 214, 215 and 314 (sitting times not published yet)","cohortClose":null},"shape":{"closed":40,"saq":15,"minutes":160,"mini":12},"shapeNote":"A full mock here is <b>40 multi-choice + 15 short answers</b> — the shape the course syllabus gives now (until October it said 60 + 10, and this mock dealt that until 12 Oct). It is timed <b>160 minutes</b>, the length of the old 1:00–3:40 pm slot: no length has been published for the two sittings on Mon 2 Nov, so treat the timer as a guide. The multi-choice are dealt mostly from the lecturers’ Canvas quizzes, plus some this tool wrote for lectures that have no quiz. <b>All fifteen short answers are this tool’s</b>, written from the lecture decks — Canvas has no written questions. The marks per short answer have not been published; here each is worth 2–6, one mark per point in its model answer.","sys":{"care":"Nursing process & assessment","clin":"Clinical knowledge","pop":"Population health & equity","prof":"Professional & legal","mixed":"Practice Quizzes (mixed topics)"},"sysShort":{"care":"Process","clin":"Clinical","pop":"Population","prof":"Professional","mixed":"Practice"},"hue":{"care":28,"clin":158,"pop":268,"prof":210},"playlist":null,"refLbl":{"slide":"Their slide","her":"Their notes","course":"Course file","patton":"Textbook"},"help":{"what":"Every practice quiz posted on Canvas for <b>Introduction to Nursing Practice</b>, unlocked: sit them as often as you like, marked instantly — or let the tool deal you mixed mock papers from the whole bank. The final is <b>Mon 2 Nov 2026 · one of two sittings between 8 am and 4 pm · rooms 214, 215 &amp; 314 · 40 multi-choice + 15 short answers · 50% of the paper</b> (course syllabus, Canvas calendar and timetable). Which sitting you are in, and how long it runs, are not published yet — the full mock keeps the old 1:00–3:40 pm slot’s 160 minutes. The syllabus said 60 + 10 until October; the mocks here changed to 40 + 15 on 12 Oct.","groups":"The four groups (Process · Clinical · Population · Professional) are <b>this tool’s sorting</b> of the lecturers’ quizzes, so a mock can be dealt in proportion and you can drill one area. The course itself runs by week, not by theme. One quiz = one lecture topic, except <b>Practice Quizzes 1–3</b>, which mix topics: under Pick my rep they sit together as “Practice”, and each of their questions is dealt and drilled under its own lecture’s group.","held":"<b>Added 27 Oct:</b> four lecturer quizzes the first capture missed because they sit in no Canvas module: <b>Long-Term Health Conditions</b> and <b>Practice Quizzes 1–3</b> (38 questions; the Practice Quizzes also ask about pain, family-centred care, the Health Strategy, therapeutic use of self, nurses’ roles and student scope of practice). Two quizzes are <b>not in here</b>: <b>Rheumatic Fever</b> (one attempt only, not sat), and the Module 11 <b>Te Tiriti / Kawa Whakaruruhau video quiz</b>, whose 14 written questions are about the videos and come with no answers. <b>The lecturers’ one-topic quizzes cover 15 of the course’s 26 lectures.</b> Ten taught lectures without one — Community Needs Assessment, Tikanga &amp; Kawa Whakaruruhau, Pain Assessment, Family-centred Care, NZ Health Strategy, Discharge Planning, Therapeutic Use of Self, Roles of Nurses, and (since 12 Oct) Rheumatic Fever and Long-term Conditions, whose own quiz turned up on 27 Oct — have questions <b>written by this tool from their lecture decks</b> (the rows ending “the tool’s questions”), each naming its slide. So do <b>injections</b>, which the lecturers’ Exam Content list names but no lecture teaches: those come from the Clinical Learning Suite page “Inpatient Prep – Injections”. So do the last two lectures, <b>Primary Health Care &amp; Health Promotion</b> (14 Oct) and <b>Health Screening</b> (20 Oct), added 30 Oct. They are a careful reading of the source, not the lecturers’ wording.","authored":"<b>Every row ending “the tool’s questions” was written by this tool, not the lecturers</b> — and since 27 Oct it is a small set: <b>50 multi-choice</b> for the twelve lectures the lecturers’ quizzes barely touch (five each where they ask nothing, three where they ask one or two), in the lecturers’ shape — a short stem, short options — and <b>26 short answers</b>, one per lecture (two for Primary Health Care, whose lecture is two exam themes) plus twelve on the quizzed topics, because the real paper has fifteen short answers and Canvas has none. Every practice run and mock deals the lecturers’ own questions before these. Each one is labelled as the tool’s and names the deck and slide it was written from. Marks per short answer are the tool’s (one per point in the model answer); the course has not published them. "},"focusCopy":{"intro":"One row per lecture — all 26 — plus injections (named on the exam themes list, taught only on a Clinical Learning Suite page) and the orientation Knowledge Check. Open a row for what you must be able to DO, how the lecturers’ own quiz asks it, and where it stops. Tick it when you can do it cold. <b>📌 on the exam themes list</b> marks a row the lecturers’ Exam Content page names; open the row for their exact words.","how":"<b>This is not a marks ranking, and it says so.</b> The lecturers’ quizzes give every lecture 8–14 marks, so the bank cannot separate the topics. On 8 Oct the lecturers posted an <b>Exam Content</b> page: 29 exam themes in one flat list, no order, no weighting. It names <b>27 of the 28 rows here — every lecture, and injections</b>; only the orientation Knowledge Check is missing. So it tells you what is examinable, not what is worth most, and it ranks nothing on its own. What it did change: Self-care and Roles of Nurses moved up out of the bottom band; injections got a row of their own, from the Clinical Learning Suite page; and it named things no question here asked — wound assessment, said on its row, and the upstream/midstream/downstream model, which the tool’s Primary Health Care questions ask since 30 Oct (scope of practice was on that list too, until Practice Quizzes 1 and 2 turned up asking it). The syllabus gives the paper as 40 multi-choice + 15 short answers, assessing learning outcomes 1–4. So the top band rests on the only emphasis on record — <b>a topic a learning outcome names outright, whose content also comes back in other lectures</b>. The middle band is everything else examinable, including the twelve lectures and the injections page whose only questions are this tool’s (⚠ no quiz exists). <b>The band above all of them is empty on purpose</b>: it fills from Revision One (Fri 23 Oct) and Revision Two (Tue 27 Oct) — whatever is named there outranks this whole list. Every count on a row is made by the build from the bank, and the build fails unless each of the bank’s questions sits in exactly one row.","sources":"the 19 Canvas quizzes with an answer key (191 questions, every stem read: 15 captured 19 Sep, 4 on 27 Oct), the 25 lecture decks, the Clinical Learning Suite page on injections, the Te Kete Haerenga workbook, the course syllabus (learning outcomes and exam shape), the lecturers’ Exam Content page (8 Oct) and the Canvas timetable.","t1w":"A learning outcome names these outright, and their content comes back in other lectures — the only emphasis the course has put on record so far.","t3w":"Thin, or about being a student rather than nursing practice. Read once, then leave.","critLbl":"Exam Content page","flagn":{"LO1":"LO1 · nursing process + Te Tiriti","LO2":"LO2 · determinants & inequities","LO3":"LO3 · evidence & assessment skills","LO4":"LO4 · communication","X":"comes back in other lectures","EC":"on the exam themes list"}}}};
/* META is everything that makes this sim one paper rather than another — names, the
   sitting, the real paper's shape, the groups, the storage prefix. The build emits it
   from sim.config.mjs; nothing below this line names a paper, a lecturer or a date. */
const META = DATA.meta;
/* 20 Oct 2026: a sim that has an exam on the hub (META.hub, e.g. 'inp/exam') sends its header link and ‹ Home
   back to that exam's sides, not to the hub's front page or this page's menu. */
const HUB = META.hub ? 'https://jeremyspm.github.io/#' + META.hub : '';
{ const b = document.querySelector('header .back');
  if (HUB && b) { b.href = HUB; b.textContent = '‹ ' + META.tool.name; b.title = 'Back to ' + META.tool.name + ' on the BN2 study tools'; } }
const FC = META.focusCopy || {};
/* references: q.refs = [{k:'slide'|'her'|'patton', src, slide|t, ...}] in authority order —
   her slide, her prose, Patton. A bank built with the older single q.ref still renders. */
for(const q of DATA.questions){ if(!q.refs) q.refs = q.ref ? [{k:q.ref.slide?'slide':'her', ...q.ref}] : []; }
const REF = {slide:{ic:'📖',lbl:'Her slide'}, her:{ic:'✍',lbl:'Her notes'}, course:{ic:'📄',lbl:'Course file'}, patton:{ic:'📕',lbl:'Patton'}};
for(const k in (META.refLbl||{})) if(REF[k]) REF[k].lbl = META.refLbl[k];
/* short versions of the written answers (content/shorts.js, gated by shorts.mjs, 26 Sep 2026). His rule (estate memory
   "saq-short-answers"): a written answer is learned from a SHORT version, a few words a line, cut from the full model answer.
   So wherever a written question is marked (Learn mode, the mock) you tick its short lines; q.saq.full keeps the full answer,
   folded underneath. A sim without content/shorts.js has none, and its written questions tick their full steps. */
const SHORTS = {"q4f37b4878a":{"id":"a-discharge:define discharge planning","title":"Discharge planning: definition and benefits","hook":"It starts on admission day, and it keeps people from coming back.","groups":[{"q":"Define it","facts":[{"t":"An **interdisciplinary** approach to **continuity of care**","of":[0]},{"t":"It helps the person **move smoothly** from one setting to another","of":[0]},{"t":"It keeps the **progress already made**, and it **begins at admission**","of":[0]}]},{"q":"Two benefits","facts":[{"t":"**Fewer readmissions**","of":[1]},{"t":"A **shorter length of hospital stay**","of":[1]},{"t":"**Less follow-up community care** needed","of":[1]},{"t":"Or: they leave **understanding their medicines** and the **warning signs**","of":[2]}]}]},"q24f27c30de":{"id":"a-fcc:name the three elements","title":"Family-centred care: the three elements","hook":"R-P-T: Relationship, Participation, Tailoring.","groups":[{"q":"1 · Relationship","facts":[{"t":"**Relationship**: a **mutually respectful partnership**","of":[0]},{"t":"Action: **invest time in building trust**","of":[0]}]},{"q":"2 · Participation","facts":[{"t":"**Participation and involvement** that respects their **autonomy**","of":[1]},{"t":"Action: **involve them in care**; find out **what is important** to them","of":[1]}]},{"q":"3 · Tailoring care","facts":[{"t":"**Tailoring care** to their **needs, strengths**, limits and context","of":[2]},{"t":"Action: help them make **informed decisions**; plan **realistic** care","of":[2]}]}]},"qd7c1545086":{"id":"a-pain:oldcarts","title":"OLDCARTS pain assessment","hook":"OLD CARTS: say the eight letters, then the word each one starts.","groups":[{"q":"The eight letters","facts":[{"t":"O · **Onset**: when did it start?","of":[0]},{"t":"L · **Location**: where is it? does it **radiate**?","of":[0]},{"t":"D · **Duration**: how long? does it come and go?","of":[1]},{"t":"C · **Characteristics**: what does it feel like?","of":[1]},{"t":"A · **Aggravating factors**: what makes it worse?","of":[2]},{"t":"R · **Relieving factors**: what makes it better?","of":[2]},{"t":"T · **Timing**: pattern or frequency, day or night","of":[3]},{"t":"S · **Severity**: rated on a **pain scale**, 0–10, at rest and moving","of":[3]}]}]},"q1efc88a0f3":{"id":"w-care:list the five steps of the nursing","title":"The nursing process, five steps","hook":"ADPIE: Assess, Diagnose, Plan, Implement, Evaluate, then round again.","groups":[{"q":"The five steps, in order","facts":[{"t":"1 **Assessment**: **collect data** by observation, interview, examination","of":[0]},{"t":"… **subjective and objective**; validate and document it","of":[0]},{"t":"2 **Diagnosis**: **actual and potential problems**, **prioritised**","of":[1]},{"t":"… written as **diagnostic statements**, not a medical diagnosis","of":[1]},{"t":"3 **Planning**: **patient-centred goals**, outcome criteria, a **time frame**","of":[2]},{"t":"4 **Implementation**: the **interventions are carried out**, **evidence-based**, safe","of":[3]},{"t":"5 **Evaluation**: the **patient’s response**; goal **met, partially met or not met**","of":[4]},{"t":"The process is **ongoing and cyclical**","of":[4]}]}]},"q512085f5ef":{"id":"w-care:define objective data","title":"Objective and subjective data","hook":"Objective = what YOU can see (signs). Subjective = what THEY feel (symptoms).","groups":[{"q":"Objective data","facts":[{"t":"**Observable and measurable** facts: **signs**","of":[0]},{"t":"e.g. **pallor**, **sweating**, a measured temperature, an observed vomit","of":[1]}]},{"q":"Subjective data","facts":[{"t":"What **only the patient can feel and describe**: **symptoms**","of":[2]},{"t":"e.g. **“I feel like I’m about to be sick”**, or **rating their nausea**","of":[3]}]}]},"q4132224a2d":{"id":"w-care:give the three reasons","title":"Why nurses document: three reasons","hook":"Legal, professional, communication. If it isn’t documented, it didn’t happen.","groups":[{"q":"The three reasons","facts":[{"t":"A **legal requirement**: a **legal document**, **evidence of your practice**","of":[0]},{"t":"“**If it isn’t documented, it didn’t happen**”","of":[0]},{"t":"A **professional responsibility**: **Nursing Council** standards, **Code of Conduct**","of":[1]},{"t":"Records **clear, accurate, legible, timely**; signed, dated, timed","of":[1]},{"t":"A **communication tool** across the **multi-disciplinary team**","of":[2]},{"t":"It spots problems **early** and supports **continuity of care**","of":[2]}]}]},"qfe9b0fe412":{"id":"w-clin:give the normal adult ranges","title":"Normal adult ranges","hook":"Sats 95–100, BP 110–140 over 60–90, temp 36.5–37.5, pulse 60–100.","groups":[{"q":"The normal ranges","facts":[{"t":"**SpO2**: **95–100%**","of":[0]},{"t":"BP: **systolic** usually **110–140**, **diastolic** usually **60–90** mmHg","of":[1]},{"t":"Temperature: **36.5–37.5 °C**","of":[2]},{"t":"Above **38 °C** is **pyrexia**; below **35 °C** is **hypothermia**","of":[2]}]},{"q":"Two definitions","facts":[{"t":"**Tachycardia**: a heart rate **above 100** bpm","of":[3]},{"t":"**Bradycardia**: a heart rate **below 60** bpm","of":[3]}]}]},"q6a565f86cd":{"id":"w-clin:define standard precautions","title":"Standard vs transmission-based precautions","hook":"Standard = everyone, always. Transmission-based = ADDED for a known bug.","groups":[{"q":"Standard precautions","facts":[{"t":"The **minimum** precautions for **all patients**","of":[0]},{"t":"Whenever **blood or body fluids** are possible: **you cannot tell by looking**","of":[0]},{"t":"e.g. **hand hygiene**, **PPE**, **safe sharps**, aseptic technique","of":[1]}]},{"q":"Transmission-based, and the three types","facts":[{"t":"**Added** for a **known or suspected pathogen**, by how it spreads","of":[2]},{"t":"**Contact**: MRSA, gastro","of":[3]},{"t":"**Droplet**: influenza, mumps","of":[3]},{"t":"**Airborne**: measles, TB; an **N95** and a **negative-pressure room**","of":[3]}]}]},"q1c156cf256":{"id":"w-clin:define hypoglycaemia","title":"Hypoglycaemia: definition, causes, symptoms","hook":"Under 4 is the floor: too little food, or too much insulin.","groups":[{"q":"Define it","facts":[{"t":"Blood glucose **below 4 mmol/L**","of":[0]}]},{"q":"Two causes","facts":[{"t":"A **missed or delayed meal**; **too little carbohydrate**","of":[1]},{"t":"**Too much insulin**; exercise without adjusting; **alcohol**","of":[1]}]},{"q":"Two symptoms","facts":[{"t":"**Shaky, sweaty**; a **racing pulse**; **pale**","of":[2]},{"t":"**Tingling around the mouth**; suddenly **very hungry**; **headache**","of":[2]}]},{"q":"Why it happens on insulin","facts":[{"t":"Injected insulin **cannot be switched off**, so the level **keeps falling**","of":[3]}]}]},"q5ccbdd42fa":{"id":"a-rf:a 12 year old is going home after treatment for rheumatic fever","title":"Going home after rheumatic fever","hook":"Every 28 days, never late, and every sore throat checked.","groups":[{"q":"Penicillin","facts":[{"t":"**Penicillin injections every 28 days**","of":[0]},{"t":"For **at least 10 years** or **until age 21**, whichever is longer","of":[0]},{"t":"The **first** is given **before leaving hospital**","of":[0]},{"t":"**Never miss or stop** them without the doctor","of":[1]},{"t":"Away from home: get it **early** or **arranged elsewhere**","of":[1]},{"t":"**District nurses** give it at **school**, **home** or a **clinic**","of":[1]}]},{"q":"Protecting the heart","facts":[{"t":"**Extra antibiotic cover** before **procedures**, **operations** or **dental visits**","of":[2]},{"t":"Carry the **rheumatic fever wallet card** for the dentist or doctor","of":[2]}]},{"q":"Staying well","facts":[{"t":"**Get every sore throat checked**","of":[3]},{"t":"**Dental hygiene**, **regular exercise** when safe, a **healthy weight**, **smoke-free**","of":[3]}]}]},"q24514917c6":{"id":"a-ltc:define a long term condition self management","title":"LTC, self-management, self-management support","hook":"Six months or more; the person runs it; we help them run it.","groups":[{"q":"Long-term condition","facts":[{"t":"Lasts, or is expected to last, **longer than 6 months**","of":[0]},{"t":"**Ongoing or recurring**, with a **significant impact** on life","of":[0]},{"t":"Also called **NCDs** or **chronic conditions**","of":[0]}]},{"q":"Self-management","facts":[{"t":"**Any way** a person **manages their condition** by **themselves**","of":[1]},{"t":"An **ongoing process**, **not a one-time event**","of":[1]}]},{"q":"Self-management support","facts":[{"t":"The **help, tools and techniques** to manage health **day to day**","of":[2]},{"t":"**Educating** and **motivating** them, in a **collaborative partnership**","of":[2]}]}]},"q66b40d9553":{"id":"a-inject:name the four parenteral injection routes","title":"Four injection routes and their angles","hook":"ID 15, SC 45, IM 90 — and IV straight into the vein.","groups":[{"q":"The four routes","facts":[{"t":"**Intradermal**: into the **dermis**, below the epidermis — **15°**","of":[0]},{"t":"**Subcutaneous**: just **below the dermis** — **45°**","of":[1]},{"t":"SC at **90°** if **5 cm** of tissue can be grasped","of":[1]},{"t":"**Intramuscular**: into a **muscle** — **90°**","of":[2]},{"t":"**Intravenous**: into a **vein**","of":[3]}]}]},"q3307488a1c":{"id":"a-phc:name the five principles of primary health care","title":"Five principles of primary health care","hook":"Alma-Ata, 1978: care that is accessible, affordable and appropriate for all.","groups":[{"q":"The five principles (Alma-Ata, 1978)","facts":[{"t":"**Accessibility**, **community participation**, **health promotion**","of":[0]},{"t":"**Appropriate technology**, **inter-sectoral collaboration**","of":[0]}]},{"q":"Accessibility","facts":[{"t":"The **first** and **most important** principle","of":[1]},{"t":"Services **available**, **affordable** and **reachable** for all","of":[1]},{"t":"e.g. **rural health nurses** bringing care to **remote** communities","of":[1]}]},{"q":"A second principle, any one","facts":[{"t":"Community participation: **planning**, **implementing**, **maintaining** services (**Whānau Ora**)","of":[2]},{"t":"Health promotion: **increase control** over their health (**school nurses**)","of":[2]},{"t":"Appropriate technology: **affordable**, **sustainable**, **culturally acceptable** (**telehealth**)","of":[2]},{"t":"Inter-sectoral: health with **education**, **housing**, **transport** (**public health nurses**)","of":[2]}]}]},"q1bc2c12197":{"id":"a-phc:health promotion can be upstream midstream or downstream","title":"Upstream, midstream and downstream","hook":"A river: fix the source, steer the flow, treat where it empties.","groups":[{"q":"Upstream","facts":[{"t":"The **root causes**: **social**, **economic**, **environmental** conditions","of":[0]},{"t":"Through **policy** and **community engagement**, **before** issues start","of":[0]},{"t":"e.g. **policy changes**, **community development**, **improving living conditions**","of":[0]}]},{"q":"Midstream","facts":[{"t":"Changes **individual behaviours** and **lifestyle factors**","of":[1]},{"t":"Issues have **started**; stop them **getting worse**","of":[1]},{"t":"e.g. **screenings**, **referrals**, **health education**, **social marketing**","of":[1]}]},{"q":"Downstream","facts":[{"t":"**Clinical care** and **treatment** for people **already** unwell","of":[2]},{"t":"e.g. **diabetes** or **hypertension**, **acute care**, **rehabilitation**","of":[2]}]}]},"q1b6d6b9dab":{"id":"a-screen:explain the purpose of health screening","title":"Health screening: purpose, types, the nurse","hook":"It finds risk early; it never gives a diagnosis.","groups":[{"q":"Purpose","facts":[{"t":"Finds people **at risk** **before symptoms** appear","of":[0]},{"t":"**Detected early**, treated **in time**, **better outcomes**","of":[0]},{"t":"It does **not** give a **diagnosis**","of":[0]}]},{"q":"Organised","facts":[{"t":"**National programmes** run by the **National Screening Unit**","of":[1]},{"t":"**Inviting** the groups at **highest risk**","of":[1]},{"t":"e.g. **BreastScreen Aotearoa**, **cervical**, **bowel**, **newborn** screening","of":[1]}]},{"q":"Opportunistic","facts":[{"t":"A test the person **asks for**, or a professional **offers**","of":[2]},{"t":"e.g. **blood pressure**, **blood glucose**, **cholesterol** at a **wellness clinic**","of":[2]}]},{"q":"The nurse","facts":[{"t":"**Educates** and **encourages** people to take part","of":[3]},{"t":"**Facilitates** the **assessments**","of":[3]},{"t":"Explains **false positives** and **false negatives**, for **informed consent**","of":[3]},{"t":"**Supports follow-up** after the result","of":[3]}]}]},"q94aa751ed3":{"id":"a-cna:what is a windscreen survey","title":"The windscreen survey","hook":"Drive through, look, take notes: your own eyes = primary data.","groups":[{"q":"What it is","facts":[{"t":"A quick **snapshot** of a community, by **driving through** and **observing**","of":[0]},{"t":"Aim: a general sense of its **strengths and needs**","of":[0]}]},{"q":"Two things to look for","facts":[{"t":"**Parks**, **schools**, **supermarkets and food access**","of":[1]},{"t":"**Housing conditions**, **transport**, **clinics** and pharmacies","of":[1]}]},{"q":"Primary or secondary data?","facts":[{"t":"**Primary data**: what **you observe yourself**","of":[2]},{"t":"It should then be **confirmed** with community groups and records","of":[2]}]}]},"q96c41cc04a":{"id":"a-nzhs:define health equity","title":"Health equity vs equality","hook":"Equality: the SAME for everyone. Equity: what each person NEEDS.","groups":[{"q":"Define health equity","facts":[{"t":"A **fair and just opportunity** to be **as healthy as possible**","of":[0]},{"t":"By **removing obstacles**: **poverty**, **discrimination**","of":[0]}]},{"q":"How it differs from equality","facts":[{"t":"**Equality**: everyone gets the **same resources**","of":[1]},{"t":"**Equity**: people get **what they need** to reach **similar outcomes**","of":[1]}]},{"q":"One priority group","fact
