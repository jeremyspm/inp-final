an Nursing Diagnosis** Association","of":[0],"ask":"Prior to 2002, the abbreviation NANDA stood for:"}]}]}},{"id":"rc-vitals-210127","group":"vitals","who":"hers","recall":true,"title":"Quiz recall · Practice Quiz 2","qt":"The INP lecturers’ own quiz questions (Practice Quiz 2), answered without their options. Type each answer.","source":"Questions and answers from the Canvas quiz “Practice Quiz 2”: each answer is the lecturer’s key, asked here without the options.","note":null,"short":{"title":"Quiz recall · Practice Quiz 2","hook":"","groups":[{"q":"Practice Quiz 2","facts":[{"t":"A heart rate over **100** beats per minute","of":[0],"ask":"Tachycardia is defined as:"}]}]}},{"id":"rc-ipc-210127","group":"ipc","who":"hers","recall":true,"title":"Quiz recall · Practice Quiz 2","qt":"The INP lecturers’ own quiz questions (Practice Quiz 2), answered without their options. Type each answer.","source":"Questions and answers from the Canvas quiz “Practice Quiz 2”: each answer is the lecturer’s key, asked here without the options.","note":null,"short":{"title":"Quiz recall · Practice Quiz 2","hook":"","groups":[{"q":"Practice Quiz 2","facts":[{"t":"**Hand hygiene**","of":[0],"ask":"What is the most essential aspect of infection control management?"}]}]}},{"id":"rc-hha-210127","group":"hha","who":"hers","recall":true,"title":"Quiz recall · Practice Quiz 2","qt":"The INP lecturers’ own quiz questions (Practice Quiz 2), answered without their options. Type each answer.","source":"Questions and answers from the Canvas quiz “Practice Quiz 2”: each answer is the lecturer’s key, asked here without the options.","note":null,"short":{"title":"Quiz recall · Practice Quiz 2","hook":"","groups":[{"q":"Practice Quiz 2","facts":[{"t":"**Assessment**","of":[0],"ask":"A client is complaining of pain following admission to the medical ward. The Physician orders analgesia to be administered PRN Q4 hourly. However, the RN would like to check the pain score before administering analgesia, what aspect of nursing care is being provided?"},{"t":"**Every time** you check on your patient","of":[0],"ask":"When would you carry out a pain assessment on a patient?"}]}]}},{"id":"rc-prof-210127","group":"prof","who":"hers","recall":true,"title":"Quiz recall · Practice Quiz 2","qt":"The INP lecturers’ own quiz questions (Practice Quiz 2), answered without their options. Type each answer.","source":"Questions and answers from the Canvas quiz “Practice Quiz 2”: each answer is the lecturer’s key, asked here without the options.","note":null,"short":{"title":"Quiz recall · Practice Quiz 2","hook":"","groups":[{"q":"Practice Quiz 2","facts":[{"t":"**Advocate**","of":[0],"ask":"The nurse is caring for a client with end-stage lung disease. The client wants to go home on Oxygen therapy and be comfortable. The family wants the client to undergo a new surgical procedure. The doctor explains the risks and benefits of the surgery to the family and the nurse discusses the clients' wishes with the family. The nurse is acting as the client's:"},{"t":"**Decline** as this is not in a student nurse's **scope of practice**","of":[0],"ask":"Your preceptor is busy writing clinical notes and asks you to give Mrs. Jones her Paracetamol tablets which are overdue. Your best response as a first-year student nurse is:"}]}]}},{"id":"rc-pop-210127","group":"pop","who":"hers","recall":true,"title":"Quiz recall · Practice Quiz 2","qt":"The INP lecturers’ own quiz questions (Practice Quiz 2), answered without their options. Type each answer.","source":"Questions and answers from the Canvas quiz “Practice Quiz 2”: each answer is the lecturer’s key, asked here without the options.","note":null,"short":{"title":"Quiz recall · Practice Quiz 2","hook":"","groups":[{"q":"Practice Quiz 2","facts":[{"t":"**Pae Ora** (Healthy Futures) Act 2022","of":[0],"ask":"The 2023 NZ Health Strategy is part of a collection of strategies published under the:"},{"t":"To achieve **health equity**","of":[0],"ask":"One of the main goals of the 2023 NZ Health Strategy is:"}]}]}},{"id":"rc-ebp-210129","group":"ebp","who":"hers","recall":true,"title":"Quiz recall · Evidence-based Practice","qt":"The INP lecturers’ own quiz questions (Evidence-based Practice), answered without their options. Type each answer.","source":"Questions and answers from the Canvas quiz “Evidence-based Practice”: each answer is the lecturer’s key, asked here without the options.","note":null,"short":{"title":"Quiz recall · Evidence-based Practice","hook":"","groups":[{"q":"Evidence-based Practice","facts":[{"t":"To improve **patient outcomes**","of":[0],"ask":"What is the primary goal of evidence-based practice (EBP) in nursing?"},{"t":"Formulating a **clinical question**","of":[0],"ask":"What is the first step in the evidence-based practice process?"},{"t":"**Systematic reviews**","of":[0],"ask":"What type of research is considered the highest level of evidence in evidence-based practice?"},{"t":"**Cochrane** library","of":[0],"ask":"Which database is commonly used to find evidence-based research articles?"},{"t":"To assess the **validity** and **reliability** of the findings","of":[0],"ask":"What is the purpose of critically appraising research evidence?"},{"t":"Skills and knowledge acquired through **clinical experience**","of":[0],"ask":"Which of the following best describes the concept of “clinical expertise” in evidence-based practice?"}]}]}},{"id":"rc-literacy-210130","group":"literacy","who":"hers","recall":true,"title":"Quiz recall · Health Literacy & Patient Education","qt":"The INP lecturers’ own quiz questions (Health Literacy & Patient Education), answered without their options. Type each answer.","source":"Questions and answers from the Canvas quiz “Health Literacy & Patient Education”: each answer is the lecturer’s key, asked here without the options.","note":null,"short":{"title":"Quiz recall · Health Literacy & Patient Education","hook":"","groups":[{"q":"Health Literacy & Patient Education","facts":[{"t":"**Play therapy**","of":[0],"ask":"A six year old child needs an IV luer inserted. An appropriate technique to teach them about this could be?"},{"t":"The ability to **understand** and **use health information** to make informed decisions","of":[0],"ask":"Which of the following best describes health literacy?"},{"t":"A method where patients are asked to **repeat back** the information to **confirm** understanding","of":[0],"ask":"What is the teach-back method in patient education?"},{"t":"Use **teach-back** method to confirm understanding","of":[0],"ask":"A nurse is educating a patient with low health literacy about managing hypertension. Which strategy should the nurse use to improve the patient’s understanding?"}]}]}},{"id":"q94aa751ed3","group":"tool","who":"tool","title":"The windscreen survey","qt":"What is a windscreen survey? Give two things a nurse would look for, and state whether the information is primary or secondary data.","scenario":null,"source":"Question and model answer are the tool’s · from the Community Needs Assessment Framework deck, slides 27, 29 and 30","steps":["A quick overview (“snapshot”) of a community gained by driving through it and observing, taking notes to analyse later — the aim is a general sense of its strengths and needs.","Any two of: parks and recreation spaces · schools and childcare · shops, supermarkets and food access · housing conditions · transport and access · clinics, hospitals and pharmacies · visible health behaviours such as people out walking.","It is PRIMARY data — what you observe yourself. It should then be confirmed by talking with community groups and by records such as immunisation rates and public health indicators."],"note":null,"short":{"id":"a-cna:what is a windscreen survey","title":"The windscreen survey","hook":"Drive through, look, take notes: your own eyes = primary data.","groups":[{"q":"What it is","facts":[{"t":"A quick **snapshot** of a community, by **driving through** and **observing**","of":[0]},{"t":"Aim: a general sense of its **strengths and needs**","of":[0]}]},{"q":"Two things to look for","facts":[{"t":"**Parks**, **schools**, **supermarkets and food access**","of":[1]},{"t":"**Housing conditions**, **transport**, **clinics** and pharmacies","of":[1]}]},{"q":"Primary or secondary data?","facts":[{"t":"**Primary data**: what **you observe yourself**","of":[2]},{"t":"It should then be **confirmed** with community groups and records","of":[2]}]}]}},{"id":"q405648f0e0","group":"tool","who":"tool","title":"Kawa Whakaruruhau (cultural safety)","qt":"Define Kawa Whakaruruhau (cultural safety) and state two things it requires of the nurse.","scenario":null,"source":"Question and model answer are the tool’s · from the Tikanga Best Practice and Kawa Whakaruruhau deck, slides 2 and 6","steps":["Definition: cultural safety is care that is judged safe by the RECIPIENT of care — the person’s and whānau experience defines the quality of the care, with the aim of equitable outcomes for Māori.","It requires critical self-reflection: the nurse examines how their own biases and attitudes affect their relationships with individuals, whānau and other health professionals.","It requires the nurse to recognise and address power imbalance, bias and racism — nurses are inadvertent bearers of power — and it goes beyond cultural awareness, sensitivity or competence."],"note":null,"short":{"id":"a-tikanga:define kawa whakaruruhau","title":"Kawa Whakaruruhau (cultural safety)","hook":"The PATIENT decides whether the care was safe, not the nurse.","groups":[{"q":"Define it","facts":[{"t":"Care **judged safe by the recipient** of care","of":[0]},{"t":"Aim: **equitable outcomes for Māori**","of":[0]}]},{"q":"Two things it requires","facts":[{"t":"**Critical self-reflection**: how your **own biases** affect relationships","of":[1]},{"t":"Recognising and addressing **power imbalance**, **bias and racism**","of":[2]},{"t":"It goes **beyond cultural awareness**, sensitivity or competence","of":[2]}]}]}},{"id":"qd7c1545086","group":"tool","who":"tool","title":"OLDCARTS pain assessment","qt":"OLDCARTS is the structured pain assessment tool taught in this course. State what each of its eight letters stands for.","scenario":null,"source":"Question and model answer are the tool’s · from the Pain Assessment deck, slides 33–42","steps":["O = Onset (when did it start?) · L = Location (where is it? does it radiate?)","D = Duration (how long does it last? does it come and go?) · C = Characteristics (what does it feel like?)","A = Aggravating factors (what makes it worse?) · R = Relieving factors (what makes it better — medications and other interventions)","T = Timing (pattern or frequency, day or night) · S = Severity (rated with an appropriate pain scale, e.g. 0–10 at rest and on movement)"],"note":null,"short":{"id":"a-pain:oldcarts","title":"OLDCARTS pain assessment","hook":"OLD CARTS: say the eight letters, then the word each one starts.","groups":[{"q":"The eight letters","facts":[{"t":"O · **Onset**: when did it start?","of":[0]},{"t":"L · **Location**: where is it? does it **radiate**?","of":[0]},{"t":"D · **Duration**: how long? does it come and go?","of":[1]},{"t":"C · **Characteristics**: what does it feel like?","of":[1]},{"t":"A · **Aggravating factors**: what makes it worse?","of":[2]},{"t":"R · **Relieving factors**: what makes it better?","of":[2]},{"t":"T · **Timing**: pattern or frequency, day or night","of":[3]},{"t":"S · **Severity**: rated on a **pain scale**, 0–10, at rest and moving","of":[3]}]}]}},{"id":"q24f27c30de","group":"tool","who":"tool","title":"Family-centred care: the three elements","qt":"Name the three elements of facilitating family-centred care and give one nursing action for each.","scenario":null,"source":"Question and model answer are the tool’s · from the Family Centred Care deck, slides 27–29 and 31–35","steps":["Relationship — establish a genuine, positive, mutually respectful partnership: find common ground, invest time in building trust, and (with the person’s permission) share relevant information.","Participation and involvement — enable the person and family to take part in care in a way that respects their autonomy: involve them in care, keep up communication, find out what is important to them.","Tailoring care — design care around the person’s and family’s needs, strengths, limitations and context: help them make informed decisions and plan care that is realistic (early intervention, health promotion, discharge planning)."],"note":null,"short":{"id":"a-fcc:name the three elements","title":"Family-centred care: the three elements","hook":"R-P-T: Relationship, Participation, Tailoring.","groups":[{"q":"1 · Relationship","facts":[{"t":"**Relationship**: a **mutually respectful partnership**","of":[0]},{"t":"Action: **invest time in building trust**","of":[0]}]},{"q":"2 · Participation","facts":[{"t":"**Participation and involvement** that respects their **autonomy**","of":[1]},{"t":"Action: **involve them in care**; find out **what is important** to them","of":[1]}]},{"q":"3 · Tailoring care","facts":[{"t":"**Tailoring care** to their **needs, strengths**, limits and context","of":[2]},{"t":"Action: help them make **informed decisions**; plan **realistic** care","of":[2]}]}]}},{"id":"q96c41cc04a","group":"tool","who":"tool","title":"Health equity vs equality","qt":"Define health equity, explain how it differs from equality, and name one group the New Zealand Health Strategy prioritises for equity.","scenario":null,"source":"Question and model answer are the tool’s · from the New Zealand Health Strategy 2023 deck, slides 5, 9–10 and 16","steps":["Health equity: everyone has a fair and just opportunity to be as healthy as possible — which means removing obstacles to health such as poverty, discrimination and their consequences.","Difference: equality gives everyone the SAME resources; equity gives people what they NEED in order to reach similar outcomes.","Any one of: Māori · Pacific peoples · disabled people · other groups with poorer outcomes (the deck also names rural and low-income communities). In the strategy equity rests on ōritetanga from Te Tiriti o Waitangi."],"note":null,"short":{"id":"a-nzhs:define health equity","title":"Health equity vs equality","hook":"Equality: the SAME for everyone. Equity: what each person NEEDS.","groups":[{"q":"Define health equity","facts":[{"t":"A **fair and just opportunity** to be **as healthy as possible**","of":[0]},{"t":"By **removing obstacles**: **poverty**, **discrimination**","of":[0]}]},{"q":"How it differs from equality","facts":[{"t":"**Equality**: everyone gets the **same resources**","of":[1]},{"t":"**Equity**: people get **what they need** to reach **similar outcomes**","of":[1]}]},{"q":"One priority group","facts":[{"t":"**Māori**, **Pacific peoples** or **disabled people**","of":[2]},{"t":"Equity rests on **ōritetanga** from **Te Tiriti o Waitangi**","of":[2]}]}]}},{"id":"q4f37b4878a","group":"tool","who":"tool","title":"Discharge planning: definition and benefits","qt":"Define discharge planning and state two benefits of doing it well.","scenario":null,"source":"Question and model answer are the tool’s · from the Discharge Planning deck, slides 3, 6, 8 and 10","steps":["Definition: an interdisciplinary approach to continuity of care — a process (identification, assessment, goal setting, planning, implementation, coordination, evaluation) that helps a person move smoothly from one setting or level of care to another without losing the progress already made. It begins at admission.","Benefit (any two, one mark each): fewer readmissions · shorter length of hospital stay · less follow-up community care needed.","Also accepted as a benefit: the patient and family leave understanding their medicines, warning signs, follow-up and who to contact — a safe link between hospital, community services and carers."],"note":null,"short":{"id":"a-discharge:define discharge planning","title":"Discharge planning: definition and benefits","hook":"It starts on admission day, and it keeps people from coming back.","groups":[{"q":"Define it","facts":[{"t":"An **interdisciplinary** approach to **continuity of care**","of":[0]},{"t":"It helps the person **move smoothly** from one setting to another","of":[0]},{"t":"It keeps the **progress already made**, and it **begins at admission**","of":[0]}]},{"q":"Two benefits","facts":[{"t":"**Fewer readmissions**","of":[1]},{"t":"A **shorter length of hospital stay**","of":[1]},{"t":"**Less follow-up community care** needed","of":[1]},{"t":"Or: they leave **understanding their medicines** and the **warning signs**","of":[2]}]}]}},{"id":"qf6ebfc539d","group":"tool","who":"tool","title":"Surface acting and deep acting","qt":"Define surface acting and deep acting, and say which component of emotional intelligence they belong to.","scenario":null,"source":"Question and model answer are the tool’s · from the Therapeutic Use of Self deck, slides 28–29","steps":["Surface acting: outwardly expressing an emotion you do not feel because the situation needs it — “putting on a mask” (“I don’t feel calm or kind, but I act calm and kind anyway”).","Deep acting: a real shift in how the nurse feels, reached by actively trying to understand the situation from the patient’s perspective.","Both are forms of emotional labour, which belongs to SELF-REGULATION — nurses still feel emotions, but not so intensely that they cannot function."],"note":null,"short":{"id":"a-tus:define surface acting","title":"Surface acting and deep acting","hook":"Surface = a mask. Deep = a real change of heart.","groups":[{"q":"Define them","facts":[{"t":"**Surface acting**: **expressing an emotion you do not feel**","of":[0]},{"t":"“**Putting on a mask**”","of":[0]},{"t":"**Deep acting**: a **real shift in how the nurse feels**","of":[1]},{"t":"… reached by seeing it from the **patient’s perspective**","of":[1]}]},{"q":"Which component?","facts":[{"t":"Both are **emotional labour**, which belongs to **self-regulation**","of":[2]}]}]}},{"id":"qce7c3bfad3","group":"tool","who":"tool","title":"ISBAR: what each part stands for","qt":"State what each part of the ISBAR handover tool stands for and what the nurse says under it.","scenario":null,"source":"Question and model answer are the tool’s · from the Roles of Nurses deck, slide 29","steps":["I — Introduction / Identify: who you are, where you are, why you are calling (and is this a good time to talk?).","S — Situation: what is happening now — “The situation is…”.","B — Background: what led to the situation — “By way of background…”.","A — Assessment: what you consider the problem to be — “My assessment is…”.","R — Request / Recommend: what should be done to correct the problem — “I recommend…”."],"note":null,"short":{"id":"a-roles:state what each part of the isbar","title":"ISBAR: what each part stands for","hook":"Who I am, what’s happening, what led here, what I think, what I want.","groups":[{"q":"Each part, and what you say","facts":[{"t":"I · **Introduction** / **Identify**: who and where you are, why calling","of":[0]},{"t":"S · **Situation**: what is happening **now**","of":[1]},{"t":"B · **Background**: what **led to** the situation","of":[2]},{"t":"A · **Assessment**: what you consider **the problem** to be","of":[3]},{"t":"R · **Request** / **Recommend**: what should be done","of":[4]}]}]}},{"id":"q5ccbdd42fa","group":"tool","who":"tool","title":"Going home after rheumatic fever","qt":"A 12-year-old is going home after treatment for rheumatic fever. Describe the ongoing management and protection the nurse would teach the child and their whānau.","scenario":null,"source":"Question and model answer are the tool’s · from the Rheumatic Fever lecture deck, slides 10–14; the guest speaker’s Rheumatic Fever deck (Jessica Murray, CNS KidzFirst), slide 13","steps":["Penicillin injections every 28 days for at least 10 years or until age 21, whichever is longer; the first is given before leaving hospital.","Never miss or stop them without the doctor: on holiday or moving, get it early or arranged elsewhere; district nurses can give it at school, at home or in a clinic.","Extra antibiotic cover before medical procedures, operations or dental visits, and carry the rheumatic fever wallet card to show the dentist or doctor.","Get every sore throat checked; good dental hygiene; regular exercise once the doctor says it is safe; a healthy weight; be smoke-free."],"note":null,"short":{"id":"a-rf:a 12 year old is going home after treatment for rheumatic fever","title":"Going home after rheumatic fever","hook":"Every 28 days, never late, and every sore throat checked.","groups":[{"q":"Penicillin","facts":[{"t":"**Penicillin injections every 28 days**","of":[0]},{"t":"For **at least 10 years** or **until age 21**, whichever is longer","of":[0]},{"t":"The **first** is given **before leaving hospital**","of":[0]},{"t":"**Never miss or stop** them without the doctor","of":[1]},{"t":"Away from home: get it **early** or **arranged elsewhere**","of":[1]},{"t":"**District nurses** give it at **school**, **home** or a **clinic**","of":[1]}]},{"q":"Protecting the heart","facts":[{"t":"**Extra antibiotic cover** before **procedures**, **operations** or **dental visits**","of":[2]},{"t":"Carry the **rheumatic fever wallet card** for the dentist or doctor","of":[2]}]},{"q":"Staying well","facts":[{"t":"**Get every sore throat checked**","of":[3]},{"t":"**Dental hygiene**, **regular exercise** when safe, a **healthy weight**, **smoke-free**","of":[3]}]}]}},{"id":"q24514917c6","group":"tool","who":"tool","title":"LTC, self-management, self-management support","qt":"Define a long-term condition, self-management, and self-management support.","scenario":null,"source":"Question and model answer are the tool’s · from the Long-term Conditions lecture deck (Self-management support for people with long-term conditions 2026), slides 3, 6–7, 13 and 45","steps":["Long-term condition: any condition lasting, or expected to last, longer than 6 months — ongoing or recurring — with a significant impact on people’s lives (also called NCDs or chronic conditions).","Self-management: any way in which a person with an LTC manages their condition(s) themselves — an ongoing process, not a one-time event.","Self-management support: the help, tools and techniques given to people with LTCs to manage their health day to day — educating and motivating them, in a collaborative partnership."],"note":null,"short":{"id":"a-ltc:define a long term condition self management","title":"LTC, self-management, self-management support","hook":"Six months or more; the person runs it; we help them run it.","groups":[{"q":"Long-term condition","facts":[{"t":"Lasts, or is expected to last, **longer than 6 months**","of":[0]},{"t":"**Ongoing or recurring**, with a **significant impact** on life","of":[0]},{"t":"Also called **NCDs** or **chronic conditions**","of":[0]}]},{"q":"Self-management","facts":[{"t":"**Any way** a person **manages their condition** by **themselves**","of":[1]},{"t":"An **ongoing process**, **not a one-time event**","of":[1]}]},{"q":"Self-management support","facts":[{"t":"The **help, tools and techniques** to manage health **day to day**","of":[2]},{"t":"**Educating** and **motivating** them, in a **collaborative partnership**","of":[2]}]}]}},{"id":"q66b40d9553","group":"tool","who":"tool","title":"Four injection routes and their angles","qt":"Name the four parenteral injection routes. For each, say where the medicine is deposited and, where the CLS Inpatient Prep page gives one, the needle angle.","scenario":null,"source":"Question and model answer are the tool’s · from the CLS page “Inpatient Prep – Injections”, the list of injection sites, the angles figure and “Subcutaneous injections”","steps":["Intradermal (ID): into the dermis, just below the epidermis — 15°.","Subcutaneous (SC): into the tissue just below the dermis — 45°, or 90° if 5 cm of tissue can be grasped.","Intramuscular (IM): into a muscle — 90°.","Intravenous (IV): into a vein."],"note":null,"short":{"id":"a-inject:name the four parenteral injection routes","title":"Four injection routes and their angles","hook":"ID 15, SC 45, IM 90 — and IV straight into the vein.","groups":[{"q":"The four routes","facts":[{"t":"**Intradermal**: into the **dermis**, below the epidermis — **15°**","of":[0]},{"t":"**Subcutaneous**: just **below the dermis** — **45°**","of":[1]},{"t":"SC at **90°** if **5 cm** of tissue can be grasped","of":[1]},{"t":"**Intramuscular**: into a **muscle** — **90°**","of":[2]},{"t":"**Intravenous**: into a **vein**","of":[3]}]}]}},{"id":"q1efc88a0f3","group":"tool","who":"tool","title":"The nursing process, five steps","qt":"List the five steps of the nursing process in order and state briefly what happens in each.","scenario":null,"source":"Question and model answer are the tool’s · from The Nursing Process 2026 deck, slides 8, 11, 17, 23, 29 and 33","steps":["Assessment — collect data about the patient by observation, interview and examination (subjective and objective), then validate and document it.","Diagnosis (nursing) — actual and potential problems found in the assessment are prioritised and written as diagnostic statements; not a medical diagnosis.","Planning — patient-centred goals and outcome criteria are set, with priorities and a time frame.","Implementation — the nursing interventions are carried out: evidence-based, safe, within the nurse’s scope and compatible with medical orders.","Evaluation — the patient’s response to each intervention is analysed and the goal is judged met, partially met or not met; the process is ongoing and cyclical."],"note":null,"short":{"id":"w-care:list the five steps of the nursing","title":"The nursing process, five steps","hook":"ADPIE: Assess, Diagnose, Plan, Implement, Evaluate, then round again.","groups":[{"q":"The five steps, in order","facts":[{"t":"1 **Assessment**: **collect data** by observation, interview, examination","of":[0]},{"t":"… **subjective and objective**; validate and document it","of":[0]},{"t":"2 **Diagnosis**: **actual and potential problems**, **prioritised**","of":[1]},{"t":"… written as **diagnostic statements**, not a medical diagnosis","of":[1]},{"t":"3 **Planning**: **patient-centred goals**, outcome criteria, a **time frame**","of":[2]},{"t":"4 **Implementation**: the **interventions are carried out**, **evidence-based**, safe","of":[3]},{"t":"5 **Evaluation**: the **patient’s response**; goal **met, partially met or not met**","of":[4]},{"t":"The process is **ongoing and cyclical**","of":[4]}]}]}},{"id":"q512085f5ef","group":"tool","who":"tool","title":"Objective and subjective data","qt":"Define objective data and subjective data, and give one example of each from a patient admitted with nausea.","scenario":null,"source":"Question and model answer are the tool’s · from Holistic Health Assessment 2026 deck, slide 9; example from The Nursing Process 2026 deck, slide 21","steps":["Objective data: observable and measurable facts — signs.","Example: pallor, sweating, a measured temperature or pulse, an observed vomit.","Subjective data: information that only the patient can feel and describe — symptoms.","Example: the patient saying “I feel like I’m about to be sick” or rating their nausea."],"note":null,"short":{"id":"w-care:define objective data","title":"Objective and subjective data","hook":"Objective = what YOU can see (signs). Subjective = what THEY feel (symptoms).","groups":[{"q":"Objective data","facts":[{"t":"**Observable and measurable** facts: **signs**","of":[0]},{"t":"e.g. **pallor**, **sweating**, a measured temperature, an observed vomit","of":[1]}]},{"q":"Subjective data","facts":[{"t":"What **only the patient can feel and describe**: **symptoms**","of":[2]},{"t":"e.g. **“I feel like I’m about to be sick”**, or **rating their nausea**","of":[3]}]}]}},{"id":"q4132224a2d","group":"tool","who":"tool","title":"Why nurses document: three reasons","qt":"Give the three reasons nurses document that are taught in this course, with one sentence on each.","scenario":null,"source":"Question and model answer are the tool’s · from Clinical Documentation 2026 deck, slides 4–10","steps":["A legal requirement — the clinical record is a legal document and evidence of your practice; it may be examined months or years later (“if it isn’t documented, it didn’t happen”).","A professional responsibility — the Nursing Council’s standards of competence and Code of Conduct require clear, accurate, legible, timely records, signed, dated and timed.","A communication tool — it carries information between the multi-disciplinary team, gives an accurate account of care, allows problems to be detected early and supports continuity of care."],"note":null,"short":{"id":"w-care:give the three reasons","title":"Why nurses document: three reasons","hook":"Legal, professional, communication. If it isn’t documented, it didn’t happen.","groups":[{"q":"The three reasons","facts":[{"t":"A **legal requirement**: a **legal document**, **evidence of your practice**","of":[0]},{"t":"“**If it isn’t documented, it didn’t happen**”","of":[0]},{"t":"A **professional responsibility**: **Nursing Council** standards, **Code of Conduct**","of":[1]},{"t":"Records **clear, accurate, legible, timely**; signed, dated, timed","of":[1]},{"t":"A **communication tool** across the **multi-disciplinary team**","of":[2]},{"t":"It spots problems **early** and supports **continuity of care**","of":[2]}]}]}},{"id":"qfe9b0fe412","group":"tool","who":"tool","title":"Normal adult ranges","qt":"Give the normal adult ranges taught in this course for oxygen saturation, blood pressure (systolic and diastolic) and temperature, and define tachycardia and bradycardia.","scenario":null,"source":"Question and model answer are the tool’s · from Vital Signs 2026 deck, slides 13, 17, 24 and 30–32","steps":["SpO2: 95–100%.","Blood pressure: systolic usually 110–140 mmHg, diastolic usually 60–90 mmHg.","Temperature: 36.5–37.5 °C (36–36.4 °C is usually considered safe; 37.6–37.9 °C is a low-grade fever; above 38 °C is pyrexia; below 35 °C is hypothermia).","Tachycardia: heart rate above 100 bpm. Bradycardia: heart rate below 60 bpm."],"note":null,"short":{"id":"w-clin:give the normal adult ranges","title":"Normal adult ranges","hook":"Sats 95–100, BP 110–140 over 60–90, temp 36.5–37.5, pulse 60–100.","groups":[{"q":"The normal ranges","facts":[{"t":"**SpO2**: **95–100%**","of":[0]},{"t":"BP: **systolic** usually **110–140**, **diastolic** usually **60–90** mmHg","of":[1]},{"t":"Temperature: **36.5–37.5 °C**","of":[2]},{"t":"Above **38 °C** is **pyrexia**; below **35 °C** is **hypothermia**","of":[2]}]},{"q":"Two definitions","facts":[{"t":"**Tachycardia**: a heart rate **above 100** bpm","of":[3]},{"t":"**Bradycardia**: a heart rate **below 60** bpm","of":[3]}]}]}},{"id":"q6a565f86cd","group":"tool","who":"tool","title":"Standard vs transmission-based precautions","qt":"Define standard precautions, and distinguish them from transmission-based precautions, naming the three types of the latter.","scenario":null,"source":"Question and model answer are the tool’s · from Infection Prevention & Control 2026 deck, slides 24, 26–27 and 48–52","steps":["Standard precautions: the MINIMUM precautions for ALL patients, whatever their known infection status, whenever contact with blood or body fluids is possible — because you cannot tell by looking who is infectious.","They include hand hygiene, PPE, respiratory hygiene and cough etiquette, safe sharps practice, linen and waste management, aseptic technique, reprocessing of equipment, and environmental cleaning.","Transmission-based precautions are ADDED for a known or suspected pathogen, according to how it spreads — PPE, single-room allocation, air-quality controls.","The three types: contact (e.g. MRSA, gastro infections), droplet (e.g. influenza, mumps, meningitis) and airborne (e.g. measles, chickenpox, TB, COVID-19 — N95/P2 respirator and a negative-pressure room)."],"note":null,"short":{"id":"w-clin:define standard precautions","title":"Standard vs transmission-based precautions","hook":"Standard = everyone, always. Transmission-based = ADDED for a known bug.","groups":[{"q":"Standard precautions","facts":[{"t":"The **minimum** precautions for **all patients**","of":[0]},{"t":"Whenever **blood or body fluids** are possible: **you cannot tell by looking**","of":[0]},{"t":"e.g. **hand hygiene**, **PPE**, **safe sharps**, aseptic technique","of":[1]}]},{"q":"Transmission-based, and the three types","facts":[{"t":"**Added** for a **known or suspected pathogen**, by how it spreads","of":[2]},{"t":"**Contact**: MRSA, gastro","of":[3]},{"t":"**Droplet**: influenza, mumps","of":[3]},{"t":"**Airborne**: measles, TB; an **N95** and a **negative-pressure room**","of":[3]}]}]}},{"id":"q1c156cf256","group":"tool","who":"tool","title":"Hypoglycaemia: definition, causes, symptoms","qt":"Define hypoglycaemia. Give two causes and two symptoms.","scenario":null,"source":"Question and model answer are the tool’s · from Diabetes Mellitus deck, slides 17 and 19–22","steps":["Definition: low blood glucose — a level below 4 mmol/L, or symptoms of hypoglycaemia at a level close to this (normal without diabetes is 4–7.5 mmol/L).","Causes (any two): too little carbohydrate with a meal · a missed or delayed meal or snack · physical activity without adjusting insulin or eating more · too much insulin · alcohol in excess or without food.","Symptoms (any two): shaky, sweaty or suddenly unwell · racing pulse · tingling around the mouth and tongue · suddenly “strange” and unable to concentrate · suddenly very hungry · pale · headache · restless or anxious.","Why it happens on insulin: injected insulin cannot be “switched off”, so glucose keeps moving into the cells and the liver does not release its store — the level keeps falling."],"note":null,"short":{"id":"w-clin:define hypoglycaemia","title":"Hypoglycaemia: definition, causes, symptoms","hook":"Under 4 is the floor: too little food, or too much insulin.","groups":[{"q":"Define it","facts":[{"t":"Blood glucose **below 4 mmol/L**","of":[0]}]},{"q":"Two causes","facts":[{"t":"A **missed or delayed meal**; **too little carbohydrate**","of":[1]},{"t":"**Too much insulin**; exercise without adjusting; **alcohol**","of":[1]}]},{"q":"Two symptoms","facts":[{"t":"**Shaky, sweaty**; a **racing pulse**; **pale**","of":[2]},{"t":"**Tingling around the mouth**; suddenly **very hungry**; **headache**","of":[2]}]},{"q":"Why it happens on insulin","facts":[{"t":"Injected insulin **cannot be switched off**, so the level **keeps falling**","of":[3]}]}]}},{"id":"q3a774d2cfe","group":"tool","who":"tool","title":"Social determinants of health","qt":"Define the social determinants of health and give two examples, saying how each affects health.","scenario":null,"source":"Question and model answer are the tool’s · from Social Determinants of Health deck, slides 7, 9, 16–17 and 28–39","steps":["Definition: the conditions in which people are born, grow, live, work and age — the societal factors that give rise to social position (access to power, money and resources) and therefore to health. They account for at least half of health outcomes and inequities.","Example (any two, one mark each, with the effect): housing — cold, damp, overcrowded homes lead to respiratory illness and communicable disease · food environments — food deserts and swamps in low-income areas drive obesity, cardiovascular disease and type 2 diabetes.","Work and employment — insecure or unsafe work raises physical and mental health risk · education — linked to better income, job stability and health · transport — poor public transport limits access to care, work and education · the health system itself — how accessible and affordable care is."],"note":null,"short":{"id":"w-pop:define the social determinants","title":"Social determinants of health","hook":"Where you are born, live, work and age shapes your health.","groups":[{"q":"Define them","facts":[{"t":"The conditions people are **born, grow, live, work and age** in","of":[0]},{"t":"They set **social position**: access to **power, money and resources**","of":[0]},{"t":"They account for **at least half** of health outcomes","of":[0]}]},{"q":"Two examples, with the effect","facts":[{"t":"**Housing**: **cold, damp, overcrowded** homes → **respiratory illness**","of":[1]},{"t":"**Food environments**: **food deserts** → **obesity**, **type 2 diabetes**","of":[1]},{"t":"**Work**: **insecure or unsafe** work → physical and **mental health risk**","of":[2]},{"t":"**Transport**: poor public transport **limits access** to care","of":[2]}]}]}},{"id":"qdb011b35e5","group":"tool","who":"tool","title":"Te Tiriti: the five health principles","qt":"The Waitangi Tribunal recommended five principles of Te Tiriti o Waitangi for the health sector. Name them (in te reo Māori or English) with a brief meaning for nursing.","scenario":null,"source":"Question and model answer are the tool’s · from Population Health vs Personal Health deck, slides 20–31","steps":["Tino rangatiratanga — self-determination: Māori lead decisions about Māori health; nurses work alongside Māori, not for Māori.","Mana taurite — equity: a fair opportunity for good health; resources targeted where need is greatest — not the same thing for everyone.","Whakamarumarutia — active protection: health is a taonga; act to prevent harm and address inequities rather than only responding to problems.","Kōwhiringa — options: properly resourced, culturally appropriate choices, including kaupapa Māori services and Māori models of health.","Pātuitanga — partnership: Māori involved in planning, delivering and evaluating services — decisions made with the community, not for it. (The “three Ps” are outdated and should not be used.)"],"note":null,"short":{"id":"w-pop:the waitangi tribunal","title":"Te Tiriti: the five health principles","hook":"Self-determination, equity, active protection, options, partnership.","groups":[{"q":"The five principles","facts":[{"t":"**Tino rangatiratanga**: **self-determination**; Māori **lead** Māori health","of":[0]},{"t":"**Mana taurite**: **equity**, resources where **need is greatest**","of":[1]},{"t":"**Whakamarumarutia**: **active protection**; health is a **taonga**","of":[2]},{"t":"**Kōwhiringa**: **options**, including **kaupapa Māori services**","of":[3]},{"t":"**Pātuitanga**: **partnership** in planning, delivering and evaluating","of":[4]},{"t":"The old **“three Ps”** are **outdated**","of":[4]}]}]}},{"id":"q6d84562104","group":"tool","who":"tool","title":"The four levels of prevention","qt":"Define primordial, primary, secondary and tertiary prevention and give an example of each.","scenario":null,"source":"Question and model answer are the tool’s · from Demography & Epidemiology deck, slides 38–45","steps":["Primordial — prevents risk factors from developing in a population, through large-scale social and environmental change. Example: the Healthy Homes Initiative.","Primary (“Prevent”) — action before the onset of disease so that it never occurs. Example: vaccination clinics, sexual health education, PPE at work.","Secondary (“Screen”) — detect disease early and stop it progressing. Example: cervical screening, mammograms, colonoscopy.","Tertiary (“Treatment”) — manage an existing condition to prevent it worsening, further disability or death. Example: an insulin regime in diabetes to prevent cardiovascular or renal disease."],"note":null,"short":{"id":"w-pop:define primordial","title":"The four levels of prevention","hook":"Before the risk, before the disease, catch it early, stop it worsening.","groups":[{"q":"Each level, with an example","facts":[{"t":"**Primordial**: stop **risk factors from developing**; e.g. **Healthy Homes Initiative**","of":[0]},{"t":"**Primary** (“**Prevent**”): **before the onset**; e.g. **vaccination**","of":[1]},{"t":"**Secondary** (“**Screen**”): **detect disease early**; e.g. **cervical screening**","of":[2]},{"t":"**Tertiary** (“**Treatment**”): stop it **worsening**; e.g. an **insulin regime**","of":[3]}]}]}},{"id":"qbc6c2ac958","group":"tool","who":"tool","title":"Informed consent and the two laws","qt":"Define informed consent, and name the two pieces of New Zealand law that make it a requirement.","scenario":null,"source":"Question and model answer are the tool’s · from Informed consent 2026 deck, slides 3–4 and 28","steps":["Definition: the PROCESS of communicating to a patient the benefits, risks and alternatives of a procedure or treatment, so that the patient can make an informed decision to accept it or not — more than a signature on a piece of paper.","The Code of Health and Disability Services Consumers’ Rights, Right 7 — the right to make an informed choice and give informed consent (the Code is a regulation under the Health and Disability Commissioner Act 1994).","The New Zealand Bill of Rights Act 1990, section 11 — the right to refuse to undergo medical treatment."],"note":null,"short":{"id":"w-prof:define informed consent","title":"Informed consent and the two laws","hook":"A PROCESS, not a signature. Code Right 7 + Bill of Rights s 11.","groups":[{"q":"Define it","facts":[{"t":"A **process** of communicating the **benefits, risks and alternatives**","of":[0]},{"t":"So the patient makes an **informed decision**: **more than a signature**","of":[0]}]},{"q":"The two laws","facts":[{"t":"The **Code of Health and Disability Services Consumers’ Rights**, **Right 7**","of":[1]},{"t":"The **Bill of Rights Act 1990**, **section 11**: the **right to refuse**","of":[2]}]}]}},{"id":"q0bc7ba99d3","group":"tool","who":"tool","title":"Who can consent to treatment in NZ","qt":"Who can give consent to treatment in New Zealand? Cover an adult, a 14-year-old, and an adult who is not competent.","scenario":null,"source":"Question and model answer are the tool’s · from Informed consent 2026 deck, slides 8 and 21","steps":["Anyone aged 16 or over can consent to — or refuse — their own treatment.","Under 16: a parent, guardian or other person acting in the place of a parent gives consent (or a court order).","A person aged 16 or over who is not competent: a legal guardian or someone holding a current enduring power of attorney. The nurse must still act in the person’s best interests and take reasonable steps to find out their views."],"note":null,"short":{"id":"w-prof:who can give consent","title":"Who can consent to treatment in NZ","hook":"16 and over: yourself. Under 16: a parent. Not competent: a guardian or attorney.","groups":[{"q":"Each person","facts":[{"t":"An adult: anyone **16 or over** can **consent to or refuse**","of":[0]},{"t":"A 14-year-old: a **parent, guardian** (or a **court order**)","of":[1]},{"t":"An adult **not competent**: a **legal guardian** or **enduring power of attorney**","of":[2]},{"t":"Still act in their **best interests**; find out **their views**","of":[2]}]}]}},{"id":"q49db232e0a","group":"tool","who":"tool","title":"Evidence-based practice: the three parts","qt":"Define evidence-based practice and name the three things it integrates.","scenario":null,"source":"Question and model answer are the tool’s · from Evidence-based Practice 2026 deck, slides 11 and 13","steps":["Definition: a shift away from basing decisions on opinion and past practice, towards research and evidence guiding clinical decision-making, in order to improve patient outcomes.","It integrates (1) the best research evidence and (2) clinical expertise…","…and (3) the patient’s values and preferences."],"note":null,"short":{"id":"w-prof:define evidence based practice","title":"Evidence-based practice: the three parts","hook":"Evidence + expertise + the patient.","groups":[{"q":"Define it","facts":[{"t":"A shift away from **opinion and past practice**","of":[0]},{"t":"… to **research and evidence** guiding decisions, to **improve patient outcomes**","of":[0]}]},{"q":"It integrates","facts":[{"t":"The **best research evidence**","of":[1]},{"t":"**Clinical expertise**","of":[1]},{"t":"The **patient’s values and preferences**","of":[2]}]}]}}],"counts":{"pieces":53,"hers":0,"recall":31,"tool":23},"facts":487};</script><script type="module" src="rep.js?v=d1596af7"></script></body></html>
