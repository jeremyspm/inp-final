<script>window.REP_DATA = {"version":1,"meta":{"prefix":"inpf.","hue":"#16a34a","icon":"🩺","kick":"Intro to Nursing Practice · 722.556","name":"Learn the short answers","sub":"Janine’s revision slides and the lecturers’ own quiz answers · read it, type it, it comes back","exam":"2026-11-02","last":"2026-11-01","examDay":"2026-11-02","who":"the INP lecturers","groupWord":"topics","how":"Lisa sets no practice short answers, so this page learns the written section from the lecturers’ own material. First, <b>Janine’s revision deck<\/b>, slide by slide, in her words: the question above each is the tool’s framing, every line under it is her slide. Then <b>the lecturers’ own quiz questions<\/b>, asked without their options, so you produce her key yourself. Last, in their own group and tagged, the tool’s 23 short answers.","home":"./"},"groups":[{"id":"process","title":"Nursing process & care plans","hue":28},{"id":"hha","title":"Holistic health assessment","hue":38},{"id":"consent","title":"Informed consent","hue":340},{"id":"literacy","title":"Health literacy & patient education","hue":190},{"id":"vitals","title":"Vital signs","hue":158},{"id":"ebp","title":"Evidence-based practice","hue":250},{"id":"docs","title":"Clinical documentation","hue":210},{"id":"selfcare","title":"Self-care in nursing","hue":300},{"id":"ipc","title":"Infection prevention & control","hue":120},{"id":"ltc","title":"Long-term conditions, diabetes & rheumatic fever","hue":0},{"id":"pop","title":"Population health & equity","hue":268},{"id":"prof","title":"Professional practice","hue":220},{"id":"tool","title":"The tool’s short answers","hue":45}],"questions":[{"id":"rv-np-def","group":"process","who":"hers","title":"The nursing process","qt":"What is the nursing process?","source":"Janine’s revision deck (Revision Semester 2 2026), slide 4","note":null,"short":{"title":"The nursing process","hook":"","groups":[{"q":"The nursing process","facts":[{"t":"An organised sequence of **problem-solving** steps","of":[0]},{"t":"Used to identify and manage the **actual & potential** health problems of patients","of":[1]},{"t":"It requires **critical thinking**","of":[2]},{"t":"It delivers **holistic**, patient-focused care","of":[3]}]}]}},{"id":"rv-np-adpie","group":"process","who":"hers","title":"ADPIE","qt":"Name the five steps of the nursing process, in order.","source":"Janine’s revision deck (Revision Semester 2 2026), slide 5","note":null,"short":{"title":"ADPIE","hook":"ADPIE","groups":[{"q":"ADPIE","facts":[{"t":"**Assessment**","of":[0]},{"t":"**Diagnosis** (nursing)","of":[1]},{"t":"**Planning**","of":[2]},{"t":"**Implementation**","of":[3]},{"t":"**Evaluation**","of":[4]}]}]}},{"id":"rv-np-data","group":"process","who":"hers","title":"Data and its sources","qt":"In assessment, define objective and subjective data, and name the three sources of data.","source":"Janine’s revision deck (Revision Semester 2 2026), slide 6","note":null,"short":{"title":"Data and its sources","hook":"","groups":[{"q":"Data and its sources","facts":[{"t":"Objective data: **observable** and **measurable** facts (**signs**)","of":[0]},{"t":"Subjective data: what only the patient **feels** & can describe (**symptoms**)","of":[1]},{"t":"Primary source: the **patient**","of":[2]},{"t":"Secondary source: **family**, reports, test results, **records**, other health care workers","of":[3]},{"t":"Tertiary source: **textbooks**, journals, policies","of":[4]}]}]}},{"id":"rv-np-dx","group":"process","who":"hers","title":"Nursing diagnosis","qt":"What is a nursing diagnosis, and how is it written?","source":"Janine’s revision deck (Revision Semester 2 2026), slide 7","note":null,"short":{"title":"Nursing diagnosis","hook":"","groups":[{"q":"Nursing diagnosis","facts":[{"t":"Problems or potential problems that can be prevented, reduced or resolved through **independent nursing interventions**","of":[0]},{"t":"**Prioritised**","of":[1]},{"t":"Written as **diagnostic statements**, using **NANDA**-I","of":[2]}]}]}},{"id":"rv-np-impl","group":"process","who":"hers","title":"Interventions must be…","qt":"Nursing interventions are evidence-based. What three things must they also be?","source":"Janine’s revision deck (Revision Semester 2 2026), slide 9","note":null,"short":{"title":"Interventions must be…","hook":"","groups":[{"q":"Interventions must be…","facts":[{"t":"**Safe**","of":[0]},{"t":"Within the **legal scope** of nursing practice","of":[1]},{"t":"Compatible with **medical orders**","of":[2]}]}]}},{"id":"rv-np-eval","group":"process","who":"hers","title":"Evaluation","qt":"What happens in the evaluation step of the nursing process?","source":"Janine’s revision deck (Revision Semester 2 2026), slide 10","note":null,"short":{"title":"Evaluation","hook":"","groups":[{"q":"Evaluation","facts":[{"t":"The nurse determines whether the patient has **achieved the goal**","of":[0]},{"t":"It analyses the patient’s **response** to each intervention — the **effectiveness** of care","of":[1]},{"t":"Each evaluation is **timed**, **dated** & **signed**","of":[2]},{"t":"Overall: the goal is **met**, **partially met**, or **not met**","of":[3]}]}]}},{"id":"rv-hha-holism","group":"hha","who":"hers","title":"Holism in nursing","qt":"What is holism in nursing, and what does a holistic health assessment cover?","source":"Janine’s revision deck (Revision Semester 2 2026), slide 12","note":null,"short":{"title":"Holism in nursing","hook":"","groups":[{"q":"Holism in nursing","facts":[{"t":"It goes beyond **physical** health","of":[0]},{"t":"It also addresses **psychological**, **social** & **spiritual** health","of":[1]},{"t":"The **whole condition** of the patient is considered, not just the presenting problem","of":[2]},{"t":"It identifies **actual and potential needs**, from which care is planned","of":[3]}]}]}},{"id":"rv-hha-phys","group":"hha","who":"hers","title":"Physical assessment","qt":"List what a physical assessment covers.","source":"Janine’s revision deck (Revision Semester 2 2026), slide 14","note":null,"short":{"title":"Physical assessment","hook":"","groups":[{"q":"Physical assessment","facts":[{"t":"Physical examination — **review of body systems**","of":[0]},{"t":"**Developmental** stage","of":[1]},{"t":"Level of independence with **ADL’s**","of":[2]},{"t":"Mobility — **falls risk** assessment","of":[3]},{"t":"Skin integrity — **wound** assessment","of":[4]},{"t":"**Sleep**, **diet**, **exercise**","of":[5]},{"t":"**Vital signs**","of":[6]},{"t":"**Diagnostic tests**","of":[7]}]}]}},{"id":"rv-hha-falls","group":"hha","who":"hers","title":"Falls","qt":"Who is at risk of falls, what raises the risk, and what can a fall lead to?","source":"Janine’s revision deck (Revision Semester 2 2026), slide 15","note":null,"short":{"title":"Falls","hook":"","groups":[{"q":"Falls","facts":[{"t":"Common in adults **65** years and older","of":[0]},{"t":"Risk factors: **balance** issues, **long-term** health conditions, impaired **vision**","of":[1]},{"t":"Can lead to **bruising**, **fractures**, **head injuries** or **death**","of":[2]},{"t":"A fall risk assessment finds a **low**, **moderate** or **high** risk","of":[3]}]}]}},{"id":"rv-hha-morse","group":"hha","who":"hers","title":"The Morse Fall Scale","qt":"Name the six areas of the Morse Fall Scale, and the score for a high risk of falling.","source":"Janine’s revision deck (Revision Semester 2 2026), slide 16","note":null,"short":{"title":"The Morse Fall Scale","hook":"","groups":[{"q":"The Morse Fall Scale","facts":[{"t":"**History** of falling","of":[0]},{"t":"**Secondary diagnosis**","of":[1]},{"t":"**Ambulatory aid**","of":[2]},{"t":"**IV** therapy / heparin lock","of":[3]},{"t":"**Gait**","of":[4]},{"t":"**Mental status**","of":[5]},{"t":"High risk: over **45**","of":[6]}]}]}},{"id":"rv-hha-time","group":"hha","who":"hers","title":"Wound assessment: T.I.M.E.","qt":"Wound assessment uses T.I.M.E. What does each letter stand for, with what you look for?","source":"Janine’s revision deck (Revision Semester 2 2026), slide 17 (and the Holistic Health Assessment deck, slide 24)","note":null,"short":{"title":"Wound assessment: T.I.M.E.","hook":"T.I.M.E.","groups":[{"q":"Wound assessment: T.I.M.E.","facts":[{"t":"T: **Tissue** — granulation, **slough**, **necrotic**, epithelial","of":[0]},{"t":"I: **Inflammation**/**Infection** — pain, **erythema**, swelling, **exudate**","of":[1]},{"t":"M: **Moisture** balance — dry, moist, wet, saturated, leaking","of":[2]},{"t":"E: **Epidermal edges** — wound **closure**, measurements","of":[3]}]}]}},{"id":"rv-hha-psych","group":"hha","who":"hers","title":"Psychological assessment","qt":"List what a psychological assessment covers.","source":"Janine’s revision deck (Revision Semester 2 2026), slide 18","note":null,"short":{"title":"Psychological assessment","hook":"","groups":[{"q":"Psychological assessment","facts":[{"t":"Level of **consciousness** / **orientation** to time, place & person","of":[0]},{"t":"**Cognition** / educational level","of":[1]},{"t":"**Communication** patterns","of":[2]},{"t":"**Memory**, long- and short-term","of":[3]},{"t":"**Mental health** history","of":[4]},{"t":"**Stressors** and **coping** mechanisms","of":[5]},{"t":"**Pain** assessment","of":[6]}]}]}},{"id":"rv-hha-social","group":"hha","who":"hers","title":"Social assessment","qt":"List what a social assessment covers.","source":"Janine’s revision deck (Revision Semester 2 2026), slide 19","note":null,"short":{"title":"Social assessment","hook":"","groups":[{"q":"Social assessment","facts":[{"t":"**Culture**, primary language / need for an **interpreter**","of":[0]},{"t":"**Family** situation and support","of":[1]},{"t":"**Employment** — effect of hospitalisation on **finances**","of":[2]},{"t":"**Lifestyle** factors — alcohol, drugs & smoking","of":[3]},{"t":"Social **relationships** & support, and the **community**","of":[4]}]}]}},{"id":"rv-hha-spirit","group":"hha","who":"hers","title":"Spiritual assessment","qt":"List what a spiritual assessment covers.","source":"Janine’s revision deck (Revision Semester 2 2026), slide 20","note":null,"short":{"title":"Spiritual assessment","hook":"","groups":[{"q":"Spiritual assessment","facts":[{"t":"Spiritual / **religious** practices & beliefs","of":[0]},{"t":"**Values**","of":[1]},{"t":"**Meaning** / purpose","of":[2]},{"t":"**Impact of illness** on spirituality","of":[3]},{"t":"Concerns around **death** & dying","of":[4]},{"t":"**Resuscitation** status","of":[5]}]}]}},{"id":"rv-ic-def","group":"consent","who":"hers","title":"Informed consent","qt":"Define informed consent, and name the two pieces of law that make it a right.","source":"Janine’s revision deck (Revision Semester 2 2026), slide 22 and slide 23","note":null,"short":{"title":"Informed consent","hook":"","groups":[{"q":"Informed consent","facts":[{"t":"Communicating the **benefits**, **risks**, and **alternatives** of a procedure or treatment","of":[0]},{"t":"So the patient can make an **informed decision** whether to accept it","of":[1]},{"t":"The Code of Health and Disability Services Consumers’ Rights: **Right 7**","of":[2]},{"t":"New Zealand **Bill of Rights** Act 1990, section 11: the right to **refuse**","of":[3]}]}]}},{"id":"rv-ic-who","group":"consent","who":"hers","title":"Who can consent","qt":"Who can give informed consent in New Zealand, and who can’t?","source":"Janine’s revision deck (Revision Semester 2 2026), slide 24 and slide 25","note":null,"short":{"title":"Who can consent","hook":"","groups":[{"q":"Who can consent","facts":[{"t":"Anyone **16** years and older, for their own treatment","of":[0]},{"t":"For someone 16+ who is incompetent: a **legal guardian** or **enduring power of attorney**","of":[1]},{"t":"Under 16: a **parent**, guardian or person in place of a parent","of":[2]},{"t":"A **Court Order**","of":[3]},{"t":"Can’t: a patient committed under the **Mental Health** (Compulsory Assessment & Treatment) Act 1992","of":[4]}]}]}},{"id":"rv-ic-role","group":"consent","who":"hers","title":"The nurse’s role in consent","qt":"Describe the nurse’s role in the consent process.","source":"Janine’s revision deck (Revision Semester 2 2026), slide 28","note":null,"short":{"title":"The nurse’s role in consent","hook":"","groups":[{"q":"The nurse’s role in consent","facts":[{"t":"Be an **advocate** for the patient","of":[0]},{"t":"Organise **interpreter** services and **whānau** support","of":[1]},{"t":"Ensure the medical team gave **all the information** in a way the patient understands","of":[2]},{"t":"Give the patient a chance to **ask questions**; verify they **understand**","of":[3]},{"t":"Sometimes **witness** the signature, and that the patient is of **legal age** and **competent**","of":[4]}]}]}},{"id":"rv-hl-def","group":"literacy","who":"hers","title":"Health literacy: two levels","qt":"Define personal and organisational health literacy.","source":"Janine’s revision deck (Revision Semester 2 2026), slide 30 and slide 31","note":null,"short":{"title":"Health literacy: two levels","hook":"","groups":[{"q":"Health literacy: two levels","facts":[{"t":"Personal: an individual’s ability to **find**, **understand**, & **use** information & services","of":[0]},{"t":"…to inform **health-related decisions** for themselves & others","of":[1]},{"t":"Organisational: how far **organisations** equitably **enable** individuals to find, understand & use information & services","of":[2]}]}]}},{"id":"rv-hl-poor","group":"literacy","who":"hers","title":"Poor health literacy","qt":"What does research show about people with poor health literacy?","source":"Janine’s revision deck (Revision Semester 2 2026), slide 32","note":null,"short":{"title":"Poor health literacy","hook":"","groups":[{"q":"Poor health literacy","facts":[{"t":"Less likely to use **prevention** services (screening)","of":[0]},{"t":"Less **knowledge** of their illness, treatment & medicines","of":[1]},{"t":"Less likely to **manage** a long-term condition","of":[2]},{"t":"More likely to be **hospitalised**","of":[3]},{"t":"More likely to use **emergency** services","of":[4]}]}]}},{"id":"rv-hl-factors","group":"literacy","who":"hers","title":"Factors affecting health literacy","qt":"What affects a person’s health literacy — and what doesn’t?","source":"Janine’s revision deck (Revision Semester 2 2026), slide 34","note":null,"short":{"title":"Factors affecting health literacy","hook":"","groups":[{"q":"Factors affecting health literacy","facts":[{"t":"Past **experiences**, resources & the quality of **information** received","of":[0]},{"t":"**Priorities** and **interests**","of":[1]},{"t":"**Stress** levels","of":[2]},{"t":"**Language** difficulties","of":[3]},{"t":"**Disabilities**","of":[4]},{"t":"Not determined by **intelligence** or **income**","of":[5]}]}]}},{"id":"rv-hl-learn","group":"literacy","who":"hers","title":"Optimal learning","qt":"What makes for optimal patient learning?","source":"Janine’s revision deck (Revision Semester 2 2026), slide 38","note":null,"short":{"title":"Optimal learning","hook":"","groups":[{"q":"Optimal learning","facts":[{"t":"The patient’s **motivation** to learn","of":[0]},{"t":"The patient’s **ability** to learn","of":[1]},{"t":"The learning **environment** — lighting, ventilation, temperature, quiet, private","of":[2]},{"t":"**Children** versus **adult** learners","of":[3]},{"t":"Appropriate **methods** & **resources**","of":[4]}]}]}},{"id":"rv-hl-abc","group":"literacy","who":"hers","title":"Ask, Build, Check","qt":"Name the 3 steps to better health literacy, and the gold-standard method.","source":"Janine’s revision deck (Revision Semester 2 2026), slide 39","note":null,"short":{"title":"Ask, Build, Check","hook":"","groups":[{"q":"Ask, Build, Check","facts":[{"t":"**Ask**","of":[0]},{"t":"**Build**","of":[1]},{"t":"**Check**","of":[2]},{"t":"**Teach back** — the gold standard: “Tell and **show me** what you understand”","of":[3]}]}]}},{"id":"rv-hl-steps","group":"literacy","who":"hers","title":"Practical steps for nurses","qt":"Give practical steps a nurse takes to support health literacy and patient education.","source":"Janine’s revision deck (Revision Semester 2 2026), slide 40","note":null,"short":{"title":"Practical steps for nurses","hook":"","groups":[{"q":"Practical steps for nurses","facts":[{"t":"Arrange **translation** services","of":[0]},{"t":"Use **simple language** or explain medical terms","of":[1]},{"t":"Limit information to **3-5 key points**","of":[2]},{"t":"Be **specific**, not general","of":[3]},{"t":"**Demonstrate**, draw pictures, use models, videos","of":[4]}]}]}},{"id":"rv-vs-abcde","group":"vitals","who":"hers","title":"The primary survey","qt":"A primary survey gives information in order of clinical importance. What does each letter cover?","source":"Janine’s revision deck (Revision Semester 2 2026), slide 42","note":null,"short":{"title":"The primary survey","hook":"","groups":[{"q":"The primary survey","facts":[{"t":"A: **Airway**","of":[0]},{"t":"B: **Breathing** — respirations & oxygen **saturations**","of":[1]},{"t":"C: **Circulation** — **blood pressure** & **pulse**","of":[2]},{"t":"D: **Disability** — level of **consciousness**","of":[3]},{"t":"E: **Exposure** — **temperature**","of":[4]}]}]}},{"id":"rv-vs-resp","group":"vitals","who":"hers","title":"Respirations","qt":"How do you count respirations, what is the adult normal range, and define the abnormal patterns?","source":"Janine’s revision deck (Revision Semester 2 2026), slide 45 and slide 46","note":null,"short":{"title":"Respirations","hook":"","groups":[{"q":"Respirations","facts":[{"t":"Count while taking the **pulse**, for **30 seconds** × 2 (a **full minute** if irregular)","of":[0]},{"t":"Normal adult: **12** to **20** breaths/min","of":[1]},{"t":"**Apnoea**: cessation of respirations","of":[2]},{"t":"**Bradypnoea**: slow, less than 12","of":[3]},{"t":"**Tachypnoea**: rapid, more than 20","of":[4]},{"t":"**Cheyne-Stokes**: irregular rate & depth with periods of **apnoea**","of":[5]}]}]}},{"id":"rv-vs-distress","group":"vitals","who":"hers","title":"Respiratory distress","qt":"List the signs of respiratory distress.","source":"Janine’s revision deck (Revision Semester 2 2026), slide 47","note":null,"short":{"title":"Respiratory distress","hook":"","groups":[{"q":"Respiratory distress","facts":[{"t":"**Nasal flaring**","of":[0]},{"t":"Use of **intercostal** muscles (rib **retraction**)","of":[1]},{"t":"**Cyanosis**","of":[2]},{"t":"**Tracheal tug**","of":[3]},{"t":"**Paradoxical** breathing","of":[4]},{"t":"Looks **anxious**","of":[5]}]}]}},{"id":"rv-vs-bp","group":"vitals","who":"hers","title":"Blood pressure","qt":"Define blood pressure, systolic and diastolic, with the normal adult ranges.","source":"Janine’s revision deck (Revision Semester 2 2026), slide 49 and slide 50","note":null,"short":{"title":"Blood pressure","hook":"","groups":[{"q":"Blood pressure","facts":[{"t":"The **force** of blood pushing against the walls of the **arteries**","of":[0]},{"t":"Measured with a **sphygmomanometer**, in **mmHg**","of":[1]},{"t":"Systolic: the **first sound** — the highest pressure as the heart **pumps**; normal **110–140**","of":[2]},{"t":"Diastolic: the **last sound** — as the heart **relaxes**; normal **60–90**","of":[3]}]}]}},{"id":"rv-vs-bpfactors","group":"vitals","who":"hers","title":"What changes blood pressure","qt":"Name the alterations of blood pressure, and the factors that affect it.","source":"Janine’s revision deck (Revision Semester 2 2026), slide 51","note":null,"short":{"title":"What changes blood pressure","hook":"","groups":[{"q":"What changes blood pressure","facts":[{"t":"**Hypertension**, **hypotension**, **postural** hypotension","of":[0]},{"t":"**Pain**, **anxiety**, **exertion**","of":[1]},{"t":"**White coat** syndrome","of":[2]},{"t":"**Age**, **medications**","of":[3]},{"t":"**Blood**/fluid loss","of":[4]}]}]}},{"id":"rv-vs-pulse","group":"vitals","who":"hers","title":"The pulse","qt":"What do you assess in a pulse, and what are the normal range and the alterations?","source":"Janine’s revision deck (Revision Semester 2 2026), slide 53 and slide 54","note":null,"short":{"title":"The pulse","hook":"","groups":[{"q":"The pulse","facts":[{"t":"**Rate**: 30 seconds × 2 (a **full minute** if irregular); normal **60** to **100** beats/min","of":[0]},{"t":"**Rhythm**: regular, irregular (**arrhythmia**)","of":[1]},{"t":"**Strength**: bounding, strong, weak, **thready**","of":[2]},{"t":"**Equality** — never check **carotid** pulses together","of":[3]},{"t":"**Bradycardia** below 60 · **tachycardia** above 100 · **asystole**: none","of":[4]}]}]}},{"id":"rv-vs-avpu","group":"vitals","who":"hers","title":"Consciousness: AVPU and GCS","qt":"How is level of consciousness assessed?","source":"Janine’s revision deck (Revision Semester 2 2026), slide 55","note":null,"short":{"title":"Consciousness: AVPU and GCS","hook":"","groups":[{"q":"Consciousness: AVPU and GCS","facts":[{"t":"A = **Alert**","of":[0]},{"t":"V = responsive to **Verbal** stimuli","of":[1]},{"t":"P = responsive to **Pain**","of":[2]},{"t":"U = **Unresponsive**","of":[3]},{"t":"The **Glasgow Coma Scale**: **eye** opening, **verbal**, **motor** response, scored **3** - **15**","of":[4]}]}]}},{"id":"rv-vs-temp","group":"vitals","who":"hers","title":"Temperature","qt":"What regulates body temperature, what is the normal range, and how is heat lost?","source":"Janine’s revision deck (Revision Semester 2 2026), slide 56","note":null,"short":{"title":"Temperature","hook":"","groups":[{"q":"Temperature","facts":[{"t":"The heat-regulating centre: the **hypothalamus**","of":[0]},{"t":"Heat loss: **radiation**, **conduction**, **convection** & **evaporation**","of":[1]},{"t":"Normal range **36.5** to **37.5** °C","of":[2]},{"t":"Sites: **oral**, **axillary**, **rectal**, **tympanic**, forehead","of":[3]},{"t":"Alterations: **pyrexia**/hyperthermia, **hypothermia**","of":[4]}]}]}},{"id":"rv-ebp-def","group":"ebp","who":"hers","title":"Evidence-based practice","qt":"Define evidence-based practice and name the three things it brings together.","source":"Janine’s revision deck (Revision Semester 2 2026), slide 58","note":null,"short":{"title":"Evidence-based practice","hook":"","groups":[{"q":"Evidence-based practice","facts":[{"t":"A shift away from **opinion** and **past practice**, toward **research** and evidence to guide decisions","of":[0]},{"t":"It involves best **research**, **clinical expertise**, & **patient values**","of":[1]},{"t":"…to improve **patient outcomes**","of":[2]}]}]}},{"id":"rv-ebp-levels","group":"ebp","who":"hers","title":"Levels of evidence","qt":"Rank the levels of evidence from strongest to weakest.","source":"Janine’s revision deck (Revision Semester 2 2026), slide 62 (its pyramid, strongest at the top)","note":null,"short":{"title":"Levels of evidence","hook":"","groups":[{"q":"Levels of evidence","facts":[{"t":"Strongest: **systematic review**","of":[0]},{"t":"**Non-randomised** controlled trial","of":[1]},{"t":"**Quantitative** study","of":[2]},{"t":"**Qualitative** study","of":[3]},{"t":"Weakest: **expert opinion**","of":[4]}]}]}},{"id":"rv-ebp-find","group":"ebp","who":"hers","title":"Finding the evidence","qt":"Name electronic databases for finding research evidence.","source":"Janine’s revision deck (Revision Semester 2 2026), slide 63","note":null,"short":{"title":"Finding the evidence","hook":"","groups":[{"q":"Finding the evidence","facts":[{"t":"**CINAHL**","of":[0]},{"t":"**Cochrane** Library","of":[1]},{"t":"**JBI** (Joanna Briggs Institute)","of":[2]},{"t":"**PubMed** and **MEDLINE**","of":[3]}]}]}},{"id":"rv-doc-why","group":"docs","who":"hers","title":"Why nurses document","qt":"Documentation in nursing is three things. Name them.","source":"Janine’s revision deck (Revision Semester 2 2026), slide 65","note":null,"short":{"title":"Why nurses document","hook":"","groups":[{"q":"Why nurses document","facts":[{"t":"A **legal** requirement","of":[0]},{"t":"A **professional** responsibility","of":[1]},{"t":"A **communication** tool","of":[2]}]}]}},{"id":"rv-doc-what","group":"docs","who":"hers","title":"What to document","qt":"What must be documented?","source":"Janine’s revision deck (Revision Semester 2 2026), slide 69","note":null,"short":{"title":"What to document","hook":"","groups":[{"q":"What to document","facts":[{"t":"What you **observed** and the nursing **interventions** you took","of":[0]},{"t":"Clinical **judgement**, **escalation**/referral & **evaluation** of care","of":[1]},{"t":"Care that could **not be given**, and why","of":[2]},{"t":"Deviations from **standard care**","of":[3]},{"t":"If care is **not recorded**, it is assumed it was **not given**","of":[4]}]}]}},{"id":"rv-doc-how","group":"docs","who":"hers","title":"How to document","qt":"How must an entry in the clinical notes be made?","source":"Janine’s revision deck (Revision Semester 2 2026), slide 70","note":null,"short":{"title":"How to document","hook":"","groups":[{"q":"How to document","facts":[{"t":"Patient **identifier label** (name, DOB, **NHI**) on every page","of":[0]},{"t":"**Date** and **time** (24-hr clock) at the top of the entry","of":[1]},{"t":"**Name**, **signature** & **designation** at the end","of":[2]},{"t":"**Chronological** order, at the time or as soon as possible","of":[3]},{"t":"At least every **8 hours**","of":[4]},{"t":"Legibly, in permanent **blue** or **black** ink","of":[5]}]}]}},{"id":"rv-doc-donts","group":"docs","who":"hers","title":"Don’ts of documentation","qt":"Give the don’ts of documentation.","source":"Janine’s revision deck (Revision Semester 2 2026), slide 71 and slide 72","note":null,"short":{"title":"Don’ts of documentation","hook":"","groups":[{"q":"Don’ts of documentation","facts":[{"t":"Don’t rely on your **memory**","of":[0]},{"t":"Don’t **erase**: cross an error out with **one line**, sign it, note it is an **error**","of":[1]},{"t":"Don’t leave **blank spaces**","of":[2]},{"t":"Don’t write for **another** health professional","of":[3]},{"t":"Don’t use **generalisations** (“condition unchanged”), **judgmental** language or **abbreviations**","of":[4]}]}]}},{"id":"rv-doc-isbar","group":"docs","who":"hers","title":"ISBAR(R)","qt":"What does each letter of ISBAR(R) stand for?","source":"Janine’s revision deck (Revision Semester 2 2026), slide 73","note":null,"short":{"title":"ISBAR(R)","hook":"","groups":[{"q":"ISBAR(R)","facts":[{"t":"I = **Identify**","of":[0]},{"t":"S = **Situation**","of":[1]},{"t":"B = **Background**","of":[2]},{"t":"A = **Assessment**","of":[3]},{"t":"R = **Recommendation**","of":[4]},{"t":"R = **Review**","of":[5]}]}]}},{"id":"rv-doc-ai2det","group":"docs","who":"hers","title":"AI2DET","qt":"What does AI2DET stand for, and what is it for?","source":"Janine’s revision deck (Revision Semester 2 2026), slide 74","note":null,"short":{"title":"AI2DET","hook":"","groups":[{"q":"AI2DET","facts":[{"t":"Steps for speaking with **patients** or **whānau** about care","of":[0]},{"t":"A = **Acknowledge**","of":[1]},{"t":"I = **Introduce**, I = **Identify**","of":[2]},{"t":"D = **Duration**","of":[3]},{"t":"E = **Explanation**","of":[4]},{"t":"T = **Thank you**","of":[5]}]}]}},{"id":"rv-sc-burnout","group":"selfcare","who":"hers","title":"Burnout","qt":"What is burnout, and what are its three characteristics?","source":"Janine’s revision deck (Revision Semester 2 2026), slide 79","note":null,"short":{"title":"Burnout","hook":"","groups":[{"q":"Burnout","facts":[{"t":"An **occupational** phenomenon, not a medical condition","of":[0]},{"t":"From long-term, **unmanaged workplace stress**","of":[1]},{"t":"**Exhaustion** — energy depletion","of":[2]},{"t":"Mental **distance** from one’s job — **cynicism**","of":[3]},{"t":"Reduced professional **efficacy**","of":[4]}]}]}},{"id":"rv-sc-cf","group":"selfcare","who":"hers","title":"Compassion fatigue","qt":"What is compassion fatigue, and how does it differ from burnout?","source":"Janine’s revision deck (Revision Semester 2 2026), slide 80 and slide 81","note":null,"short":{"title":"Compassion fatigue","hook":"","groups":[{"q":"Compassion fatigue","facts":[{"t":"The emotional demands of caring for patients through **suffering** — **secondary trauma**","of":[0]},{"t":"Leads to a lack of **empathy**; symptoms: **irritability**, anger, **depression**","of":[1]},{"t":"Burnout: nurses **still feel compassion**; caused by a negative **work environment**; builds **over time**","of":[2]},{"t":"Compassion fatigue: affects the ability to **feel compassion**; may **interfere** with relationships outside work","of":[3]}]}]}},{"id":"rv-sc-resilience","group":"selfcare","who":"hers","title":"Self-care and resilience","qt":"Define self-care and resilience, and how they connect.","source":"Janine’s revision deck (Revision Semester 2 2026), slide 82 and slide 83","note":null,"short":{"title":"Self-care and resilience","hook":"","groups":[{"q":"Self-care and resilience","facts":[{"t":"Self-care: **deliberate** actions to take care of all aspects of our health & wellbeing","of":[0]},{"t":"It is **not selfish**; a barrier to it is **procrastination**","of":[1]},{"t":"Resilience: the ability to **adapt** positively to stress and **recover** quickly from difficulties","of":[2]},{"t":"Self-care **builds resilience**, which protects against **burnout** & **compassion fatigue**","of":[3]}]}]}},{"id":"rv-ipc-hai","group":"ipc","who":"hers","title":"HAIs and MDROs","qt":"Define a healthcare-associated infection and a multi-drug resistant organism.","source":"Janine’s revision deck (Revision Semester 2 2026), slide 86","note":null,"short":{"title":"HAIs and MDROs","hook":"","groups":[{"q":"HAIs and MDROs","facts":[{"t":"HAI: acquired by patients during a stay in a **healthcare facility**","of":[0]},{"t":"From **cross-transmission**, **surgery**, and **medical devices**; the most reported **adverse event**","of":[1]},{"t":"MDRO: organisms **resistant** to antimicrobial medicines","of":[2]},{"t":"Common in hospitals, where **antibiotics** are heavily used","of":[3]}]}]}},{"id":"rv-ipc-std","group":"ipc","who":"hers","title":"Standard precautions","qt":"What are standard precautions, and what do they include?","source":"Janine’s revision deck (Revision Semester 2 2026), slide 88","note":null,"short":{"title":"Standard precautions","hook":"","groups":[{"q":"Standard precautions","facts":[{"t":"The **minimum** precautions for **all patients**, whatever their known status","of":[0]},{"t":"When contact with **blood** & bodily **fluids** is required","of":[1]},{"t":"**Hand hygiene** and **PPE**","of":[2]},{"t":"**Respiratory hygiene** & cough etiquette","of":[3]},{"t":"Safe **sharps**; **linen**/**waste** management","of":[4]},{"t":"**Aseptic** technique; **environmental** cleaning","of":[5]}]}]}},{"id":"rv-ipc-tbp","group":"ipc","who":"hers","title":"Transmission-based precautions","qt":"For contact, droplet and airborne precautions, give an example infection and the measures.","source":"Janine’s revision deck (Revision Semester 2 2026), slide 90, slides 91 and 92","note":null,"short":{"title":"Transmission-based precautions","hook":"","groups":[{"q":"Transmission-based precautions","facts":[{"t":"Contact (e.g. **MRSA**, gastro): **gowns** and **gloves**","of":[0]},{"t":"Droplet (e.g. **influenza**, mumps): gown, **medical mask**, **eye protection**, gloves","of":[1]},{"t":"Airborne (e.g. **measles**, **TB**, chickenpox): **N95**/P2 respirator and a **negative pressure** room","of":[2]}]}]}},{"id":"rv-ltc-def","group":"ltc","who":"hers","title":"Long-term conditions","qt":"Define a long-term condition, multi-morbidity and self-management.","source":"Janine’s revision deck (Revision Semester 2 2026), slide 94 and slide 95","note":null,"short":{"title":"Long-term conditions","hook":"","groups":[{"q":"Long-term conditions","facts":[{"t":"**Ongoing**, long-term or **recurring** conditions with a significant impact on people’s lives","of":[0]},{"t":"Also known as **chronic** conditions","of":[1]},{"t":"Several LTCs at once: **multi-morbidity**","of":[2]},{"t":"Self-management: how a person manages their condition **by themselves** — an **ongoing process**","of":[3]}]}]}},{"id":"rv-ltc-sms","group":"ltc","who":"hers","title":"Self-management support","qt":"What is self-management support, and what four components should its programmes have?","source":"Janine’s revision deck (Revision Semester 2 2026), slide 96, slides 102 and 103","note":null,"short":{"title":"Self-management support","hook":"","groups":[{"q":"Self-management support","facts":[{"t":"Help given to people with LTCs to manage their health **day to day** — a **collaborative partnership**","of":[0]},{"t":"**Health literacy**","of":[1]},{"t":"**Cultural relevance**","of":[2]},{"t":"**Behaviour change**","of":[3]},{"t":"The **role of the health professional**","of":[4]}]}]}},{"id":"rv-ltc-nurse","group":"ltc","who":"hers","title":"The nurse’s role in self-management","qt":"Describe the nurse’s role in self-management support.","source":"Janine’s revision deck (Revision Semester 2 2026), slide 100 and slide 101","note":null,"short":{"title":"The nurse’s role in self-management","hook":"","groups":[{"q":"The nurse’s role in self-management","facts":[{"t":"Provide **information** for informed decisions and **goals**","of":[0]},{"t":"Acknowledge people as **experts in their own lives**","of":[1]},{"t":"Support them to attend self-management **groups**","of":[2]},{"t":"Ensure it is **culturally appropriate**","of":[3]},{"t":"**Follow up** after education; **refer** to support agencies","of":[4]}]}]}},{"id":"rv-dm-def","group":"ltc","who":"hers","title":"Diabetes mellitus","qt":"What is diabetes mellitus, what causes it, and how is it treated?","source":"Janine’s revision deck (Revision Semester 2 2026), slide 105","note":null,"short":{"title":"Diabetes mellitus","hook":"","groups":[{"q":"Diabetes mellitus","facts":[{"t":"The body cannot control **blood sugar** — not enough **insulin**, or cells **resistant** to insulin","of":[0]},{"t":"Caused by an **auto-immune** response, **genetic** &/or **lifestyle** factors","of":[1]},{"t":"Treated with **insulin**, **oral medications** &/or **diet**","of":[2]},{"t":"An **annual** diabetes check matters","of":[3]}]}]}},{"id":"rv-dm-sx","group":"ltc","who":"hers","title":"Symptoms of diabetes","qt":"List the symptoms of type 1 diabetes, and what type 2 can add.","source":"Janine’s revision deck (Revision Semester 2 2026), slide 106","note":null,"short":{"title":"Symptoms of diabetes","hook":"","groups":[{"q":"Symptoms of diabetes","facts":[{"t":"Extreme hunger (**polyphagia**)","of":[0]},{"t":"Increased thirst (**polydipsia**)","of":[1]},{"t":"Frequent urination (**polyuria**)","of":[2]},{"t":"Unintentional **weight loss**, **blurry** vision, **tiredness**","of":[3]},{"t":"Type 2 adds: recurrent **infections** and sores **slow to heal**","of":[4]}]}]}},{"id":"rv-dm-bgl","group":"ltc","who":"hers","title":"Blood glucose","qt":"Give the normal blood glucose range, and define hypoglycaemia and hyperglycaemia.","source":"Janine’s revision deck (Revision Semester 2 2026), slide 107","note":null,"short":{"title":"Blood glucose","hook":"","groups":[{"q":"Blood glucose","facts":[{"t":"Normal without diabetes: **4** – **7.5** mmol/L","of":[0]},{"t":"Hypoglycaemia: less than **4** mmol/L","of":[1]},{"t":"Hyperglycaemia: over **7.5** mmol/L **fasting**","of":[2]},{"t":"…or over **11.1** mmol/L two hours after **meals**","of":[3]}]}]}},{"id":"rv-rf","group":"ltc","who":"hers","title":"Rheumatic fever","qt":"Describe rheumatic fever: its cause, who it affects, its symptoms and its ongoing management.","source":"Janine’s revision deck (Revision Semester 2 2026), slide 109","note":null,"short":{"title":"Rheumatic fever","hook":"","groups":[{"q":"Rheumatic fever","facts":[{"t":"A serious **auto-immune** disease after an untreated **Strep throat**","of":[0]},{"t":"Mostly **children** & teenagers, more in **Māori** & **Pacific** young people; **crowded** living raises the risk","of":[1]},{"t":"Up to **5 weeks** after: **fever**, aching **joints**, fatigue, **jerky movements**, heart issues","of":[2]},{"t":"**Penicillin** injections every **28 days**, and antibiotic cover for **dental** visits","of":[3]},{"t":"Complication: **rheumatic heart disease**","of":[4]}]}]}},{"id":"rc-ltc-210101","group":"ltc","who":"hers","recall":true,"title":"Quiz recall · Long-Term Health Conditions","qt":"The INP lecturers’ own quiz questions (Long-Term Health Conditions), answered without their options. Type each answer.","source":"Questions and answers from the Canvas quiz “Long-Term Health Conditions”: each answer is the lecturer’s key, asked here without the options.","note":null,"short":{"title":"Quiz recall · Long-Term Health Conditions","hook":"","groups":[{"q":"Long-Term Health Conditions","facts":[{"t":"**Smoking cessation**","of":[0],"ask":"What lifestyle modification is often recommended for patients with chronic obstructive pulmonary disease (COPD)?"},{"t":"**Multi-morbidity**","of":[0],"ask":"A 65-year-old patient has a health history of hypertension, type 2 diabetes and asthma. This is an example of:"},{"t":"**Pain management** and **improving function**","of":[0],"ask":"What is the primary treatment goal for patients with long-term pain?"},{"t":"**Prevent complications** and improve **quality of life**","of":[0],"ask":"What is the primary goal in managing long-term health conditions?"},{"t":"**Empowering** patients with **knowledge and skills** to manage their own health","of":[0],"ask":"What is an important component of the nurses' role in supporting self-management for patients with long-term conditions?"},{"t":"Engaging with people with long-term conditions within their **wider social context**","of":[0],"ask":"The concept of interdependence involves"}]}]}},{"id":"rc-ltc-210102","group":"ltc","who":"hers","recall":true,"title":"Quiz recall · Diabetes","qt":"The INP l art?"}]}]}},{"id":"rc-docs-210115","group":"docs","who":"hers","recall":true,"title":"Quiz recall · Clinical Documentation","qt":"The INP lecturers’ own quiz questions (Clinical Documentation), answered without their options. Type each answer.","source":"Questions and answers from the Canvas quiz “Clinical Documentation”: each answer is the lecturer’s key, asked here without the options.","note":null,"short":{"title":"Quiz recall · Clinical Documentation","hook":"","groups":[{"q":"Clinical Documentation","facts":[{"t":"**black**","of":[0],"ask":"What coloured pen should health professionals use when documenting in patient's notes?"},{"t":"the health care **organisation**","of":[0],"ask":"Who owns the patient's notes?"},{"t":"**plan**","of":[0],"ask":"SOAP/ SOAPIER charting is a problem-oriented frame work for documentation. What does the \"P\" stand for in SOAP/SOAPIER?"},{"t":"**cyanosis**","of":[0],"ask":"It is important to use the correct terminology when documenting. For example, instead of saying the patient had blue lips, you should write:"},{"t":"put a **line through** it, **initial** and write '**error**'","of":[0],"ask":"If you make a mistake writing in the clinical notes, you should:"},{"t":"be **dated**, **timed** and **signed** so the original entry can still be read clearly","of":[0],"ask":"Alterations or additions to clinical documentation should:"}]}]}},{"id":"rc-pop-210116","group":"pop","who":"hers","recall":true,"title":"Quiz recall · Epidemiology & Demography","qt":"The INP lecturers’ own quiz questions (Epidemiology & Demography), answered without their options. Type each answer.","source":"Questions and answers from the Canvas quiz “Epidemiology & Demography”: each answer is the lecturer’s key, asked here without the options.","note":null,"short":{"title":"Quiz recall · Epidemiology & Demography","hook":"","groups":[{"q":"Epidemiology & Demography","facts":[{"t":"The study of **populations**, including their **size**, **structure**, and **distribution**","of":[0],"ask":"What is demography?"},{"t":"The study of the **distribution** and **determinants** of health-related states or events in populations","of":[0],"ask":"Which of the following best describes epidemiology?"},{"t":"**Primordial**","of":[0],"ask":"Which level of Prevention focuses on preventing the development of risk factors for disease?"},{"t":"**Tertiary**","of":[0],"ask":"Insulin treatment regime for people with Diabetes in considered to be what level of prevention?"},{"t":"**Primary**","of":[0],"ask":"Which level of prevention focuses on preventing disease from occuring?"}]}]}},{"id":"rc-vitals-210117","group":"vitals","who":"hers","recall":true,"title":"Quiz recall · Practice Quiz 3","qt":"The INP lecturers’ own quiz questions (Practice Quiz 3), answered without their options. Type each answer.","source":"Questions and answers from the Canvas quiz “Practice Quiz 3”: each answer is the lecturer’s key, asked here without the options.","note":null,"short":{"title":"Quiz recall · Practice Quiz 3","hook":"","groups":[{"q":"Practice Quiz 3","facts":[{"t":"assess **physiological functioning** of the body","of":[0],"ask":"Vital signs are taken to:"},{"t":"measures **blood pressure**","of":[0],"ask":"The sphygmomanometer is an instrument that:"},{"t":"**apnoea**","of":[0],"ask":"What is the term that describes the absence of breathing?"},{"t":"**pyrexia**","of":[0],"ask":"What is the medical term for fever?"},{"t":"**respirations**","of":[0],"ask":"Which vital sign is most susceptible to conscious control?"},{"t":"**bradycardia**","of":[0],"ask":"Mrs Watson's heart rate is 48 beats per minute. The correct medical term for this is:"}]}]}},{"id":"rc-ltc-210117","group":"ltc","who":"hers","recall":true,"title":"Quiz recall · Practice Quiz 3","qt":"The INP lecturers’ own quiz questions (Practice Quiz 3), answered without their options. Type each answer.","source":"Questions and answers from the Canvas quiz “Practice Quiz 3”: each answer is the lecturer’s key, asked here without the options.","note":null,"short":{"title":"Quiz recall · Practice Quiz 3","hook":"","groups":[{"q":"Practice Quiz 3","facts":[{"t":"**hyperglycaemia**","of":[0],"ask":"An elevated blood sugar level is also known as:"}]}]}},{"id":"rc-prof-210117","group":"prof","who":"hers","recall":true,"title":"Quiz recall · Practice Quiz 3","qt":"The INP lecturers’ own quiz questions (Practice Quiz 3), answered without their options. Type each answer.","source":"Questions and answers from the Canvas quiz “Practice Quiz 3”: each answer is the lecturer’s key, asked here without the options.","note":null,"short":{"title":"Quiz recall · Practice Quiz 3","hook":"","groups":[{"q":"Practice Quiz 3","facts":[{"t":"**competent communication** & **emotional intelligence**","of":[0],"ask":"What are the two principles which underpin the therapeutic use of self in nursing?"}]}]}},{"id":"rc-ipc-210117","group":"ipc","who":"hers","recall":true,"title":"Quiz recall · Practice Quiz 3","qt":"The INP lecturers’ own quiz questions (Practice Quiz 3), answered without their options. Type each answer.","source":"Questions and answers from the Canvas quiz “Practice Quiz 3”: each answer is the lecturer’s key, asked here without the options.","note":null,"short":{"title":"Quiz recall · Practice Quiz 3","hook":"","groups":[{"q":"Practice Quiz 3","facts":[{"t":"Any time you are exposed to **body fluids**","of":[0],"ask":"When caring for patients you know to use standard precautions. This is used:"}]}]}},{"id":"rc-ipc-210118","group":"ipc","who":"hers","recall":true,"title":"Quiz recall · Infection Prevention & Control","qt":"The INP lecturers’ own quiz questions (Infection Prevention & Control), answered without their options. Type each answer.","source":"Questions and answers from the Canvas quiz “Infection Prevention & Control”: each answer is the lecturer’s key, asked here without the options.","note":null,"short":{"title":"Quiz recall · Infection Prevention & Control","hook":"","groups":[{"q":"Infection Prevention & Control","facts":[{"t":"**Hand hygiene**","of":[0],"ask":"What is the most effective method for preventing the spread of infections in healthcare settings?"},{"t":"**Contact precautions**","of":[0],"ask":"A patient with diarrhoea is admitted to the hospital. What type of precautions should be implemented?"},{"t":"**Airborne precautions**","of":[0],"ask":"A 5-year old child presents to the hospital covered in vesicular lesions. Chickenpox is suspected. What type of precautions should be implemented?"},{"t":"Breaking the **chain of infection**","of":[0],"ask":"Which of the following is a key principle of infection prevention and control?"},{"t":"**Gown**, a medical **mask**, **eye protection** and **gloves**","of":[0],"ask":"What personal protective equipment (PPE) should be worn by healthcare professionals when a patient is in Droplet precautions?"},{"t":"To **protect healthcare workers** from exposure to infectious agents","of":[0],"ask":"What is the primary purpose of using personal protective equipment (PPE) in infection prevention and control?"}]}]}},{"id":"rc-consent-210119","group":"consent","who":"hers","recall":true,"title":"Quiz recall · Informed Consent","qt":"The INP lecturers’ own quiz questions (Informed Consent), answered without their options. Type each answer.","source":"Questions and answers from the Canvas quiz “Informed Consent”: each answer is the lecturer’s key, asked here without the options.","note":null,"short":{"title":"Quiz recall · Informed Consent","hook":"","groups":[{"q":"Informed Consent","facts":[{"t":"**16** years old","of":[0],"ask":"In New Zealand, at what age can a person legally give informed consent for medical treatment?"},{"t":"The healthcare provider **performing the procedure**","of":[0],"ask":"Who is responsible for obtaining informed consent from a patient?"},{"t":"Use a **professional interpreter** to explain the procedure","of":[0],"ask":"A patient who speaks limited English requires a complex surgical procedure. The patient's doctors need to speak to the patient about this. What is the best course of action for obtaining informed consent?"},{"t":"**Respect** the patient’s decision, **stop** the transfusion and **notify the prescriber**","of":[0],"ask":"A patient initially consents to a blood transfusion but later changes their mind. What should the nurse do?"},{"t":"Consent to be obtained from the patient’s **legal guardian**","of":[0],"ask":"A patient with dementia who is deemed incompetent,is scheduled for a medical procedure and informed consent is required. What is the appropriate action in this situation?"}]}]}},{"id":"rc-vitals-210120","group":"vitals","who":"hers","recall":true,"title":"Quiz recall · Practice Quiz 1","qt":"The INP lecturers’ own quiz questions (Practice Quiz 1), answered without their options. Type each answer.","source":"Questions and answers from the Canvas quiz “Practice Quiz 1”: each answer is the lecturer’s key, asked here without the options.","note":null,"short":{"title":"Quiz recall · Practice Quiz 1","hook":"","groups":[{"q":"Practice Quiz 1","facts":[{"t":"**Dyspnoea**","of":[0],"ask":"Mrs. B becomes short of breath. This is called:"}]}]}},{"id":"rc-process-210120","group":"process","who":"hers","recall":true,"title":"Quiz recall · Practice Quiz 1","qt":"The INP lecturers’ own quiz questions (Practice Quiz 1), answered without their options. Type each answer.","source":"Questions and answers from the Canvas quiz “Practice Quiz 1”: each answer is the lecturer’s key, asked here without the options.","note":null,"short":{"title":"Quiz recall · Practice Quiz 1","hook":"","groups":[{"q":"Practice Quiz 1","facts":[{"t":"The **client**","of":[0],"ask":"Nursing practice now-a-days is focussed on:"}]}]}},{"id":"rc-ltc-210120","group":"ltc","who":"hers","recall":true,"title":"Quiz recall · Practice Quiz 1","qt":"The INP lecturers’ own quiz questions (Practice Quiz 1), answered without their options. Type each answer.",
