<script>window.CARD_DATA = {"version":1,"meta":{"prefix":"inpf.","hue":"#16a34a","icon":"🩺","kick":"Intro to Nursing Practice · 722.556","name":"Flashcards","sub":"Janine’s revision slides, the lecturers’ quiz answers and the tool’s short answers · Anki, stripped down","exam":"2026-11-02","how":"Lisa sets no practice short answers, so these come from the lecturers’ own material: <b>Janine’s revision deck<\/b> slide by slide (the question is the tool’s framing, every line of the answer is her slide), then <b>the lecturers’ own quiz questions<\/b> asked without their options, one card each, so you produce her key yourself. Last, in their own deck and tagged, the tool’s 26 short answers."},"decks":[{"id":"process","title":"Nursing process & care plans","hue":28,"n":15},{"id":"hha","title":"Holistic health assessment","hue":38,"n":14},{"id":"consent","title":"Informed consent","hue":340,"n":8},{"id":"literacy","title":"Health literacy & patient education","hue":190,"n":10},{"id":"vitals","title":"Vital signs","hue":158,"n":23},{"id":"ebp","title":"Evidence-based practice","hue":250,"n":9},{"id":"docs","title":"Clinical documentation","hue":210,"n":13},{"id":"selfcare","title":"Self-care in nursing","hue":300,"n":6},{"id":"ipc","title":"Infection prevention & control","hue":120,"n":11},{"id":"ltc","title":"Long-term conditions, diabetes & rheumatic fever","hue":0,"n":20},{"id":"pop","title":"Population health & equity","hue":268,"n":12},{"id":"prof","title":"Professional practice","hue":220,"n":9},{"id":"tool","title":"The tool’s short answers","hue":45,"n":26}],"cards":[{"id":"p:rv-np-def","deck":"process","kind":"Slide","title":"The nursing process","front":"What is the nursing process?","back":["An organised sequence of **problem-solving** steps","Used to identify and manage the **actual & potential** health problems of patients","It requires **critical thinking**","It delivers **holistic**, patient-focused care"],"heads":null,"full":null,"src":"Janine’s revision deck (Revision Semester 2 2026), slide 4","who":"hers"},{"id":"p:rv-np-adpie","deck":"process","kind":"Slide","title":"ADPIE","front":"Name the five steps of the nursing process, in order.","back":["**Assessment**","**Diagnosis** (nursing)","**Planning**","**Implementation**","**Evaluation**"],"heads":null,"full":null,"src":"Janine’s revision deck (Revision Semester 2 2026), slide 5","who":"hers"},{"id":"p:rv-np-data","deck":"process","kind":"Slide","title":"Data and its sources","front":"In assessment, define objective and subjective data, and name the three sources of data.","back":["Objective data: **observable** and **measurable** facts (**signs**)","Subjective data: what only the patient **feels** & can describe (**symptoms**)","Primary source: the **patient**","Secondary source: **family**, reports, test results, **records**, other health care workers","Tertiary source: **textbooks**, journals, policies"],"heads":null,"full":null,"src":"Janine’s revision deck (Revision Semester 2 2026), slide 6","who":"hers"},{"id":"p:rv-np-dx","deck":"process","kind":"Slide","title":"Nursing diagnosis","front":"What is a nursing diagnosis, and how is it written?","back":["Problems or potential problems that can be prevented, reduced or resolved through **independent nursing interventions**","**Prioritised**","Written as **diagnostic statements**, using **NANDA**-I"],"heads":null,"full":null,"src":"Janine’s revision deck (Revision Semester 2 2026), slide 7","who":"hers"},{"id":"p:rv-np-impl","deck":"process","kind":"Slide","title":"Interventions must be…","front":"Nursing interventions are evidence-based. What three things must they also be?","back":["**Safe**","Within the **legal scope** of nursing practice","Compatible with **medical orders**"],"heads":null,"full":null,"src":"Janine’s revision deck (Revision Semester 2 2026), slide 9","who":"hers"},{"id":"p:rv-np-eval","deck":"process","kind":"Slide","title":"Evaluation","front":"What happens in the evaluation step of the nursing process?","back":["The nurse determines whether the patient has **achieved the goal**","It analyses the patient’s **response** to each intervention — the **effectiveness** of care","Each evaluation is **timed**, **dated** & **signed**","Overall: the goal is **met**, **partially met**, or **not met**"],"heads":null,"full":null,"src":"Janine’s revision deck (Revision Semester 2 2026), slide 10","who":"hers"},{"id":"p:rv-hha-holism","deck":"hha","kind":"Slide","title":"Holism in nursing","front":"What is holism in nursing, and what does a holistic health assessment cover?","back":["It goes beyond **physical** health","It also addresses **psychological**, **social** & **spiritual** health","The **whole condition** of the patient is considered, not just the presenting problem","It identifies **actual and potential needs**, from which care is planned"],"heads":null,"full":null,"src":"Janine’s revision deck (Revision Semester 2 2026), slide 12","who":"hers"},{"id":"p:rv-hha-phys","deck":"hha","kind":"Slide","title":"Physical assessment","front":"List what a physical assessment covers.","back":["Physical examination — **review of body systems**","**Developmental** stage","Level of independence with **ADL’s**","Mobility — **falls risk** assessment","Skin integrity — **wound** assessment","**Sleep**, **diet**, **exercise**","**Vital signs**","**Diagnostic tests**"],"heads":null,"full":null,"src":"Janine’s revision deck (Revision Semester 2 2026), slide 14","who":"hers"},{"id":"p:rv-hha-falls","deck":"hha","kind":"Slide","title":"Falls","front":"Who is at risk of falls, what raises the risk, and what can a fall lead to?","back":["Common in adults **65** years and older","Risk factors: **balance** issues, **long-term** health conditions, impaired **vision**","Can lead to **bruising**, **fractures**, **head injuries** or **death**","A fall risk assessment finds a **low**, **moderate** or **high** risk"],"heads":null,"full":null,"src":"Janine’s revision deck (Revision Semester 2 2026), slide 15","who":"hers"},{"id":"p:rv-hha-morse","deck":"hha","kind":"Slide","title":"The Morse Fall Scale","front":"Name the six areas of the Morse Fall Scale, and the score for a high risk of falling.","back":["**History** of falling","**Secondary diagnosis**","**Ambulatory aid**","**IV** therapy / heparin lock","**Gait**","**Mental status**","High risk: over **45**"],"heads":null,"full":null,"src":"Janine’s revision deck (Revision Semester 2 2026), slide 16","who":"hers"},{"id":"p:rv-hha-time","deck":"hha","kind":"Slide","title":"Wound assessment: T.I.M.E.","front":"Wound assessment uses T.I.M.E. What does each letter stand for, with what you look for?","back":["T: **Tissue** — granulation, **slough**, **necrotic**, epithelial","I: **Inflammation**/**Infection** — pain, **erythema**, swelling, **exudate**","M: **Moisture** balance — dry, moist, wet, saturated, leaking","E: **Epidermal edges** — wound **closure**, measurements"],"heads":null,"full":null,"src":"Janine’s revision deck (Revision Semester 2 2026), slide 17 (and the Holistic Health Assessment deck, slide 24)","who":"hers"},{"id":"p:rv-hha-psych","deck":"hha","kind":"Slide","title":"Psychological assessment","front":"List what a psychological assessment covers.","back":["Level of **consciousness** / **orientation** to time, place & person","**Cognition** / educational level","**Communication** patterns","**Memory**, long- and short-term","**Mental health** history","**Stressors** and **coping** mechanisms","**Pain** assessment"],"heads":null,"full":null,"src":"Janine’s revision deck (Revision Semester 2 2026), slide 18","who":"hers"},{"id":"p:rv-hha-social","deck":"hha","kind":"Slide","title":"Social assessment","front":"List what a social assessment covers.","back":["**Culture**, primary language / need for an **interpreter**","**Family** situation and support","**Employment** — effect of hospitalisation on **finances**","**Lifestyle** factors — alcohol, drugs & smoking","Social **relationships** & support, and the **community**"],"heads":null,"full":null,"src":"Janine’s revision deck (Revision Semester 2 2026), slide 19","who":"hers"},{"id":"p:rv-hha-spirit","deck":"hha","kind":"Slide","title":"Spiritual assessment","front":"List what a spiritual assessment covers.","back":["Spiritual / **religious** practices & beliefs","**Values**","**Meaning** / purpose","**Impact of illness** on spirituality","Concerns around **death** & dying","**Resuscitation** status"],"heads":null,"full":null,"src":"Janine’s revision deck (Revision Semester 2 2026), slide 20","who":"hers"},{"id":"p:rv-ic-def","deck":"consent","kind":"Slide","title":"Informed consent","front":"Define informed consent, and name the two pieces of law that make it a right.","back":["Communicating the **benefits**, **risks**, and **alternatives** of a procedure or treatment","So the patient can make an **informed decision** whether to accept it","The Code of Health and Disability Services Consumers’ Rights: **Right 7**","New Zealand **Bill of Rights** Act 1990, section 11: the right to **refuse**"],"heads":null,"full":null,"src":"Janine’s revision deck (Revision Semester 2 2026), slide 22 and slide 23","who":"hers"},{"id":"p:rv-ic-who","deck":"consent","kind":"Slide","title":"Who can consent","front":"Who can give informed consent in New Zealand, and who can’t?","back":["Anyone **16** years and older, for their own treatment","For someone 16+ who is incompetent: a **legal guardian** or **enduring power of attorney**","Under 16: a **parent**, guardian or person in place of a parent","A **Court Order**","Can’t: a patient committed under the **Mental Health** (Compulsory Assessment & Treatment) Act 1992"],"heads":null,"full":null,"src":"Janine’s revision deck (Revision Semester 2 2026), slide 24 and slide 25","who":"hers"},{"id":"p:rv-ic-role","deck":"consent","kind":"Slide","title":"The nurse’s role in consent","front":"Describe the nurse’s role in the consent process.","back":["Be an **advocate** for the patient","Organise **interpreter** services and **whānau** support","Ensure the medical team gave **all the information** in a way the patient understands","Give the patient a chance to **ask questions**; verify they **understand**","Sometimes **witness** the signature, and that the patient is of **legal age** and **competent**"],"heads":null,"full":null,"src":"Janine’s revision deck (Revision Semester 2 2026), slide 28","who":"hers"},{"id":"p:rv-hl-def","deck":"literacy","kind":"Slide","title":"Health literacy: two levels","front":"Define personal and organisational health literacy.","back":["Personal: an individual’s ability to **find**, **understand**, & **use** information & services","…to inform **health-related decisions** for themselves & others","Organisational: how far **organisations** equitably **enable** individuals to find, understand & use information & services"],"heads":null,"full":null,"src":"Janine’s revision deck (Revision Semester 2 2026), slide 30 and slide 31","who":"hers"},{"id":"p:rv-hl-poor","deck":"literacy","kind":"Slide","title":"Poor health literacy","front":"What does research show about people with poor health literacy?","back":["Less likely to use **prevention** services (screening)","Less **knowledge** of their illness, treatment & medicines","Less likely to **manage** a long-term condition","More likely to be **hospitalised**","More likely to use **emergency** services"],"heads":null,"full":null,"src":"Janine’s revision deck (Revision Semester 2 2026), slide 32","who":"hers"},{"id":"p:rv-hl-factors","deck":"literacy","kind":"Slide","title":"Factors affecting health literacy","front":"What affects a person’s health literacy — and what doesn’t?","back":["Past **experiences**, resources & the quality of **information** received","**Priorities** and **interests**","**Stress** levels","**Language** difficulties","**Disabilities**","Not determined by **intelligence** or **income**"],"heads":null,"full":null,"src":"Janine’s revision deck (Revision Semester 2 2026), slide 34","who":"hers"},{"id":"p:rv-hl-learn","deck":"literacy","kind":"Slide","title":"Optimal learning","front":"What makes for optimal patient learning?","back":["The patient’s **motivation** to learn","The patient’s **ability** to learn","The learning **environment** — lighting, ventilation, temperature, quiet, private","**Children** versus **adult** learners","Appropriate **methods** & **resources**"],"heads":null,"full":null,"src":"Janine’s revision deck (Revision Semester 2 2026), slide 38","who":"hers"},{"id":"p:rv-hl-abc","deck":"literacy","kind":"Slide","title":"Ask, Build, Check","front":"Name the 3 steps to better health literacy, and the gold-standard method.","back":["**Ask**","**Build**","**Check**","**Teach back** — the gold standard: “Tell and **show me** what you understand”"],"heads":null,"full":null,"src":"Janine’s revision deck (Revision Semester 2 2026), slide 39","who":"hers"},{"id":"p:rv-hl-steps","deck":"literacy","kind":"Slide","title":"Practical steps for nurses","front":"Give practical steps a nurse takes to support health literacy and patient education.","back":["Arrange **translation** services","Use **simple language** or explain medical terms","Limit information to **3-5 key points**","Be **specific**, not general","**Demonstrate**, draw pictures, use models, videos"],"heads":null,"full":null,"src":"Janine’s revision deck (Revision Semester 2 2026), slide 40","who":"hers"},{"id":"p:rv-vs-abcde","deck":"vitals","kind":"Slide","title":"The primary survey","front":"A primary survey gives information in order of clinical importance. What does each letter cover?","back":["A: **Airway**","B: **Breathing** — respirations & oxygen **saturations**","C: **Circulation** — **blood pressure** & **pulse**","D: **Disability** — level of **consciousness**","E: **Exposure** — **temperature**"],"heads":null,"full":null,"src":"Janine’s revision deck (Revision Semester 2 2026), slide 42","who":"hers"},{"id":"p:rv-vs-resp","deck":"vitals","kind":"Slide","title":"Respirations","front":"How do you count respirations, what is the adult normal range, and define the abnormal patterns?","back":["Count while taking the **pulse**, for **30 seconds** × 2 (a **full minute** if irregular)","Normal adult: **12** to **20** breaths/min","**Apnoea**: cessation of respirations","**Bradypnoea**: slow, less than 12","**Tachypnoea**: rapid, more than 20","**Cheyne-Stokes**: irregular rate & depth with periods of **apnoea**"],"heads":null,"full":null,"src":"Janine’s revision deck (Revision Semester 2 2026), slide 45 and slide 46","who":"hers"},{"id":"p:rv-vs-distress","deck":"vitals","kind":"Slide","title":"Respiratory distress","front":"List the signs of respiratory distress.","back":["**Nasal flaring**","Use of **intercostal** muscles (rib **retraction**)","**Cyanosis**","**Tracheal tug**","**Paradoxical** breathing","Looks **anxious**"],"heads":null,"full":null,"src":"Janine’s revision deck (Revision Semester 2 2026), slide 47","who":"hers"},{"id":"p:rv-vs-bp","deck":"vitals","kind":"Slide","title":"Blood pressure","front":"Define blood pressure, systolic and diastolic, with the normal adult ranges.","back":["The **force** of blood pushing against the walls of the **arteries**","Measured with a **sphygmomanometer**, in **mmHg**","Systolic: the **first sound** — the highest pressure as the heart **pumps**; normal **110–140**","Diastolic: the **last sound** — as the heart **relaxes**; normal **60–90**"],"heads":null,"full":null,"src":"Janine’s revision deck (Revision Semester 2 2026), slide 49 and slide 50","who":"hers"},{"id":"p:rv-vs-bpfactors","deck":"vitals","kind":"Slide","title":"What changes blood pressure","front":"Name the alterations of blood pressure, and the factors that affect it.","back":["**Hypertension**, **hypotension**, **postural** hypotension","**Pain**, **anxiety**, **exertion**","**White coat** syndrome","**Age**, **medications**","**Blood**/fluid loss"],"heads":null,"full":null,"src":"Janine’s revision deck (Revision Semester 2 2026), slide 51","who":"hers"},{"id":"p:rv-vs-pulse","deck":"vitals","kind":"Slide","title":"The pulse","front":"What do you assess in a pulse, and what are the normal range and the alterations?","back":["**Rate**: 30 seconds × 2 (a **full minute** if irregular); normal **60** to **100** beats/min","**Rhythm**: regular, irregular (**arrhythmia**)","**Strength**: bounding, strong, weak, **thready**","**Equality** — never check **carotid** pulses together","**Bradycardia** below 60 · **tachycardia** above 100 · **asystole**: none"],"heads":null,"full":null,"src":"Janine’s revision deck (Revision Semester 2 2026), slide 53 and slide 54","who":"hers"},{"id":"p:rv-vs-avpu","deck":"vitals","kind":"Slide","title":"Consciousness: AVPU and GCS","front":"How is level of consciousness assessed?","back":["A = **Alert**","V = responsive to **Verbal** stimuli","P = responsive to **Pain**","U = **Unresponsive**","The **Glasgow Coma Scale**: **eye** opening, **verbal**, **motor** response, scored **3** - **15**"],"heads":null,"full":null,"src":"Janine’s revision deck (Revision Semester 2 2026), slide 55","who":"hers"},{"id":"p:rv-vs-temp","deck":"vitals","kind":"Slide","title":"Temperature","front":"What regulates body temperature, what is the normal range, and how is heat lost?","back":["The heat-regulating centre: the **hypothalamus**","Heat loss: **radiation**, **conduction**, **convection** & **evaporation**","Normal range **36.5** to **37.5** °C","Sites: **oral**, **axillary**, **rectal**, **tympanic**, forehead","Alterations: **pyrexia**/hyperthermia, **hypothermia**"],"heads":null,"full":null,"src":"Janine’s revision deck (Revision Semester 2 2026), slide 56","who":"hers"},{"id":"p:rv-ebp-def","deck":"ebp","kind":"Slide","title":"Evidence-based practice","front":"Define evidence-based practice and name the three things it brings together.","back":["A shift away from **opinion** and **past practice**, toward **research** and evidence to guide decisions","It involves best **research**, **clinical expertise**, & **patient values**","…to improve **patient outcomes**"],"heads":null,"full":null,"src":"Janine’s revision deck (Revision Semester 2 2026), slide 58","who":"hers"},{"id":"p:rv-ebp-levels","deck":"ebp","kind":"Slide","title":"Levels of evidence","front":"Rank the levels of evidence from strongest to weakest.","back":["Strongest: **systematic review**","**Non-randomised** controlled trial","**Quantitative** study","**Qualitative** study","Weakest: **expert opinion**"],"heads":null,"full":null,"src":"Janine’s revision deck (Revision Semester 2 2026), slide 62 (its pyramid, strongest at the top)","who":"hers"},{"id":"p:rv-ebp-find","deck":"ebp","kind":"Slide","title":"Finding the evidence","front":"Name electronic databases for finding research evidence.","back":["**CINAHL**","**Cochrane** Library","**JBI** (Joanna Briggs Institute)","**PubMed** and **MEDLINE**"],"heads":null,"full":null,"src":"Janine’s revision deck (Revision Semester 2 2026), slide 63","who":"hers"},{"id":"p:rv-doc-why","deck":"docs","kind":"Slide","title":"Why nurses document","front":"Documentation in nursing is three things. Name them.","back":["A **legal** requirement","A **professional** responsibility","A **communication** tool"],"heads":null,"full":null,"src":"Janine’s revision deck (Revision Semester 2 2026), slide 65","who":"hers"},{"id":"p:rv-doc-what","deck":"docs","kind":"Slide","title":"What to document","front":"What must be documented?","back":["What you **observed** and the nursing **interventions** you took","Clinical **judgement**, **escalation**/referral & **evaluation** of care","Care that could **not be given**, and why","Deviations from **standard care**","If care is **not recorded**, it is assumed it was **not given**"],"heads":null,"full":null,"src":"Janine’s revision deck (Revision Semester 2 2026), slide 69","who":"hers"},{"id":"p:rv-doc-how","deck":"docs","kind":"Slide","title":"How to document","front":"How must an entry in the clinical notes be made?","back":["Patient **identifier label** (name, DOB, **NHI**) on every page","**Date** and **time** (24-hr clock) at the top of the entry","**Name**, **signature** & **designation** at the end","**Chronological** order, at the time or as soon as possible","At least every **8 hours**","Legibly, in permanent **blue** or **black** ink"],"heads":null,"full":null,"src":"Janine’s revision deck (Revision Semester 2 2026), slide 70","who":"hers"},{"id":"p:rv-doc-donts","deck":"docs","kind":"Slide","title":"Don’ts of documentation","front":"Give the don’ts of documentation.","back":["Don’t rely on your **memory**","Don’t **erase**: cross an error out with **one line**, sign it, note it is an **error**","Don’t leave **blank spaces**","Don’t write for **another** health professional","Don’t use **generalisations** (“condition unchanged”), **judgmental** language or **abbreviations**"],"heads":null,"full":null,"src":"Janine’s revision deck (Revision Semester 2 2026), slide 71 and slide 72","who":"hers"},{"id":"p:rv-doc-isbar","deck":"docs","kind":"Slide","title":"ISBAR(R)","front":"What does each letter of ISBAR(R) stand for?","back":["I = **Identify**","S = **Situation**","B = **Background**","A = **Assessment**","R = **Recommendation**","R = **Review**"],"heads":null,"full":null,"src":"Janine’s revision deck (Revision Semester 2 2026), slide 73","who":"hers"},{"id":"p:rv-doc-ai2det","deck":"docs","kind":"Slide","title":"AI2DET","front":"What does AI2DET stand for, and what is it for?","back":["Steps for speaking with **patients** or **whānau** about care","A = **Acknowledge**","I = **Introduce**, I = **Identify**","D = **Duration**","E = **Explanation**","T = **Thank you**"],"heads":null,"full":null,"src":"Janine’s revision deck (Revision Semester 2 2026), slide 74","who":"hers"},{"id":"p:rv-sc-burnout","deck":"selfcare","kind":"Slide","title":"Burnout","front":"What is burnout, and what are its three characteristics?","back":["An **occupational** phenomenon, not a medical condition","From long-term, **unmanaged workplace stress**","**Exhaustion** — energy depletion","Mental **distance** from one’s job — **cynicism**","Reduced professional **efficacy**"],"heads":null,"full":null,"src":"Janine’s revision deck (Revision Semester 2 2026), slide 79","who":"hers"},{"id":"p:rv-sc-cf","deck":"selfcare","kind":"Slide","title":"Compassion fatigue","front":"What is compassion fatigue, and how does it differ from burnout?","back":["The emotional demands of caring for patients through **suffering** — **secondary trauma**","Leads to a lack of **empathy**; symptoms: **irritability**, anger, **depression**","Burnout: nurses **still feel compassion**; caused by a negative **work environment**; builds **over time**","Compassion fatigue: affects the ability to **feel compassion**; may **interfere** with relationships outside work"],"heads":null,"full":null,"src":"Janine’s revision deck (Revision Semester 2 2026), slide 80 and slide 81","who":"hers"},{"id":"p:rv-sc-resilience","deck":"selfcare","kind":"Slide","title":"Self-care and resilience","front":"Define self-care and resilience, and how they connect.","back":["Self-care: **deliberate** actions to take care of all aspects of our health & wellbeing","It is **not selfish**; a barrier to it is **procrastination**","Resilience: the ability to **adapt** positively to stress and **recover** quickly from difficulties","Self-care **builds resilience**, which protects against **burnout** & **compassion fatigue**"],"heads":null,"full":null,"src":"Janine’s revision deck (Revision Semester 2 2026), slide 82 and slide 83","who":"hers"},{"id":"p:rv-ipc-hai","deck":"ipc","kind":"Slide","title":"HAIs and MDROs","front":"Define a healthcare-associated infection and a multi-drug resistant organism.","back":["HAI: acquired by patients during a stay in a **healthcare facility**","From **cross-transmission**, **surgery**, and **medical devices**; the most reported **adverse event**","MDRO: organisms **resistant** to antimicrobial medicines","Common in hospitals, where **antibiotics** are heavily used"],"heads":null,"full":null,"src":"Janine’s revision deck (Revision Semester 2 2026), slide 86","who":"hers"},{"id":"p:rv-ipc-std","deck":"ipc","kind":"Slide","title":"Standard precautions","front":"What are standard precautions, and what do they include?","back":["The **minimum** precautions for **all patients**, whatever their known status","When contact with **blood** & bodily **fluids** is required","**Hand hygiene** and **PPE**","**Respiratory hygiene** & cough etiquette","Safe **sharps**; **linen**/**waste** management","**Aseptic** technique; **environmental** cleaning"],"heads":null,"full":null,"src":"Janine’s revision deck (Revision Semester 2 2026), slide 88","who":"hers"},{"id":"p:rv-ipc-tbp","deck":"ipc","kind":"Slide","title":"Transmission-based precautions","front":"For contact, droplet and airborne precautions, give an example infection and the measures.","back":["Contact (e.g. **MRSA**, gastro): **gowns** and **gloves**","Droplet (e.g. **influenza**, mumps): gown, **medical mask**, **eye protection**, gloves","Airborne (e.g. **measles**, **TB**, chickenpox): **N95**/P2 respirator and a **negative pressure** room"],"heads":null,"full":null,"src":"Janine’s revision deck (Revision Semester 2 2026), slide 90, slides 91 and 92","who":"hers"},{"id":"p:rv-ltc-def","deck":"ltc","kind":"Slide","title":"Long-term conditions","front":"Define a long-term condition, multi-morbidity and self-management.","back":["**Ongoing**, long-term or **recurring** conditions with a significant impact on people’s lives","Also known as **chronic** conditions","Several LTCs at once: **multi-morbidity**","Self-management: how a person manages their condition **by themselves** — an **ongoing process**"],"heads":null,"full":null,"src":"Janine’s revision deck (Revision Semester 2 2026), slide 94 and slide 95","who":"hers"},{"id":"p:rv-ltc-sms","deck":"ltc","kind":"Slide","title":"Self-management support","front":"What is self-management support, and what four components should its programmes have?","back":["Help given to people with LTCs to manage their health **day to day** — a **collaborative partnership**","**Health literacy**","**Cultural relevance**","**Behaviour change**","The **role of the health professional**"],"heads":null,"full":null,"src":"Janine’s revision deck (Revision Semester 2 2026), slide 96, slides 102 and 103","who":"hers"},{"id":"p:rv-ltc-nurse","deck":"ltc","kind":"Slide","title":"The nurse’s role in self-management","front":"Describe the nurse’s role in self-management support.","back":["Provide **information** for informed decisions and **goals**","Acknowledge people as **experts in their own lives**","Support them to attend self-management **groups**","Ensure it is **culturally appropriate**","**Follow up** after education; **refer** to support agencies"],"heads":null,"full":null,"src":"Janine’s revision deck (Revision Semester 2 2026), slide 100 and slide 101","who":"hers"},{"id":"p:rv-dm-def","deck":"ltc","kind":"Slide","title":"Diabetes mellitus","front":"What is diabetes mellitus, what causes it, and how is it treated?","back":["The body cannot control **blood sugar** — not enough **insulin**, or cells **resistant** to insulin","Caused by an **auto-immune** response, **genetic** &/or **lifestyle** factors","Treated with **insulin**, **oral medications** &/or **diet**","An **annual** diabetes check matters"],"heads":null,"full":null,"src":"Janine’s revision deck (Revision Semester 2 2026), slide 105","who":"hers"},{"id":"p:rv-dm-sx","deck":"ltc","kind":"Slide","title":"Symptoms of diabetes","front":"List the symptoms of type 1 diabetes, and what type 2 can add.","back":["Extreme hunger (**polyphagia**)","Increased thirst (**polydipsia**)","Frequent urination (**polyuria**)","Unintentional **weight loss**, **blurry** vision, **tiredness**","Type 2 adds: recurrent **infections** and sores **slow to heal**"],"heads":null,"full":null,"src":"Janine’s revision deck (Revision Semester 2 2026), slide 106","who":"hers"},{"id":"p:rv-dm-bgl","deck":"ltc","kind":"Slide","title":"Blood glucose","front":"Give the normal blood glucose range, and define hypoglycaemia and hyperglycaemia.","back":["Normal without diabetes: **4** – **7.5** mmol/L","Hypoglycaemia: less than **4** mmol/L","Hyperglycaemia: over **7.5** mmol/L **fasting**","…or over **11.1** mmol/L two hours after **meals**"],"heads":null,"full":null,"src":"Janine’s revision deck (Revision Semester 2 2026), slide 107","who":"hers"},{"id":"p:rv-rf","deck":"ltc","kind":"Slide","title":"Rheumatic fever","front":"Describe rheumatic fever: its cause, who it affects, its symptoms and its ongoing management.","back":["A serious **auto-immune** disease after an untreated **Strep throat**","Mostly **children** & teenagers, more in **Māori** & **Pacific** young people; **crowded** living raises the risk","Up to **5 weeks** after: **fever**, aching **joints**, fatigue, **jerky movements**, heart issues","**Penicillin** injections every **28 days**, and antibiotic cover for **dental** visits","Complication: **rheumatic heart disease**"],"heads":null,"full":null,"src":"Janine’s revision deck (Revision Semester 2 2026), slide 109","who":"hers"},{"id":"r:rc-ltc-210101:0","deck":"ltc","kind":"Quiz question","front":"What lifestyle modification is often recommended for patients with chronic obstructive pulmonary disease (COPD)?","back":["**Smoking cessation**"],"src":"Questions and answers from the Canvas quiz “Long-Term Health Conditions”: each answer is the lecturer’s key, asked here without the options.","who":"hers"},{"id":"r:rc-ltc-210101:1","deck":"ltc","kind":"Quiz question","front":"A 65-year-old patient has a health history of hypertension, type 2 diabetes and asthma. This is an example of:","back":["**Multi-morbidity**"],"src":"Questions and answers from the Canvas quiz “Long-Term Health Conditions”: ea ital Signs”: each answer is the lecturer’s key, asked here without the options.","who":"hers"},{"id":"r:rc-vitals-210111:5","deck":"vitals","kind":"Quiz question","front":"A nurse is assessing a patient’s pulse and notes it is irregular. What is the best course of action for the nurse?","back":["Count the pulse for a **full minute**"],"src":"Questions and answers from the Canvas quiz “Vital Signs”: each answer is the lecturer’s key, asked here without the options.","who":"hers"},{"id":"r:rc-vitals-210111:6","deck":"vitals","kind":"Quiz question","front":"What is the primary purpose of the Early Warning Score (EWS) chart?","back":["To assist with the **recognition** and appropriate **response** to clinical **deterioration**"],"src":"Questions and answers from the Canvas quiz “Vital Signs”: each answer is the lecturer’s key, asked here without the options.","who":"hers"},{"id":"r:rc-docs-210115:0","deck":"docs","kind":"Quiz question","front":"What coloured pen should health professionals use when documenting in patient's notes?","back":["**black**"],"src":"Questions and answers from the Canvas quiz “Clinical Documentation”: each answer is the lecturer’s key, asked here without the options.","who":"hers"},{"id":"r:rc-docs-210115:1","deck":"docs","kind":"Quiz question","front":"Who owns the patient's notes?","back":["the health care **organisation**"],"src":"Questions and answers from the Canvas quiz “Clinical Documentation”: each answer is the lecturer’s key, asked here without the options.","who":"hers"},{"id":"r:rc-docs-210115:2","deck":"docs","kind":"Quiz question","front":"SOAP/ SOAPIER charting is a problem-oriented frame work for documentation. What does the \"P\" stand for in SOAP/SOAPIER?","back":["**plan**"],"src":"Questions and answers from the Canvas quiz “Clinical Documentation”: each answer is the lecturer’s key, asked here without the options.","who":"hers"},{"id":"r:rc-docs-210115:3","deck":"docs","kind":"Quiz question","front":"It is important to use the correct terminology when documenting. For example, instead of saying the patient had blue lips, you should write:","back":["**cyanosis**"],"src":"Questions and answers from the Canvas quiz “Clinical Documentation”: each answer is the lecturer’s key, asked here without the options.","who":"hers"},{"id":"r:rc-docs-210115:4","deck":"docs","kind":"Quiz question","front":"If you make a mistake writing in the clinical notes, you should:","back":["put a **line through** it, **initial** and write '**error**'"],"src":"Questions and answers from the Canvas quiz “Clinical Documentation”: each answer is the lecturer’s key, asked here without the options.","who":"hers"},{"id":"r:rc-docs-210115:5","deck":"docs","kind":"Quiz question","front":"Alterations or additions to clinical documentation should:","back":["be **dated**, **timed** and **signed** so the original entry can still be read clearly"],"src":"Questions and answers from the Canvas quiz “Clinical Documentation”: each answer is the lecturer’s key, asked here without the options.","who":"hers"},{"id":"r:rc-pop-210116:0","deck":"pop","kind":"Quiz question","front":"What is demography?","back":["The study of **populations**, including their **size**, **structure**, and **distribution**"],"src":"Questions and answers from the Canvas quiz “Epidemiology & Demography”: each answer is the lecturer’s key, asked here without the options.","who":"hers"},{"id":"r:rc-pop-210116:1","deck":"pop","kind":"Quiz question","front":"Which of the following best describes epidemiology?","back":["The study of the **distribution** and **determinants** of health-related states or events in populations"],"src":"Questions and answers from the Canvas quiz “Epidemiology & Demography”: each answer is the lecturer’s key, asked here without the options.","who":"hers"},{"id":"r:rc-pop-210116:2","deck":"pop","kind":"Quiz question","front":"Which level of Prevention focuses on preventing the development of risk factors for disease?","back":["**Primordial as quiz “Infection Prevention & Control”: each answer is the lecturer’s key, asked here without the options.","who":"hers"},{"id":"r:rc-ipc-210118:1","deck":"ipc","kind":"Quiz question","front":"A patient with diarrhoea is admitted to the hospital. What type of precautions should be implemented?","back":["**Contact precautions**"],"src":"Questions and answers from the Canvas quiz “Infection Prevention & Control”: each answer is the lecturer’s key, asked here without the options.","who":"hers"},{"id":"r:rc-ipc-210118:2","deck":"ipc","kind":"Quiz question","front":"A 5-year old child presents to the hospital covered in vesicular lesions. Chickenpox is suspected. What type of precautions should be implemented?","back":["**Airborne precautions**"],"src":"Questions and answers from the Canvas quiz “Infection Prevention & Control”: each answer is the lecturer’s key, asked here without the options.","who":"hers"},{"id":"r:rc-ipc-210118:3","deck":"ipc","kind":"Quiz question","front":"Which of the following is a key principle of infection prevention and control?","back":["Breaking the **chain of infection**"],"src":"Questions and answers from the Canvas quiz “Infection Prevention & Control”: each answer is the lecturer’s key, asked here without the options.","who":"hers"},{"id":"r:rc-ipc-210118:4","deck":"ipc","kind":"Quiz question","front":"What personal protective equipment (PPE) should be worn by healthcare professionals when a patient is in Droplet precautions?","back":["**Gown**, a medical **mask**, **eye protection** and **gloves**"],"src":"Questions and answers from the Canvas quiz “Infection Prevention & Control”: each answer is the lecturer’s key, asked here without the options.","who":"hers"},{"id":"r:rc-ipc-210118:5","deck":"ipc","kind":"Quiz question","front":"What is the primary purpose of using personal protective equipment (PPE) in infection prevention and control?","back":["To **protect healthcare workers** from exposure to infectious agents"],"src":"Questions and answers from the Canvas quiz “Infection Prevention & Control”: each answer is the lecturer’s key, asked here without the options.","who":"hers"},{"id":"r:rc-consent-210119:0","deck":"consent","kind":"Quiz question","front":"In New Zealand, at what age can a person legally give informed consent for medical treatment?","back":["**16** years old"],"src":"Questions and answers from the Canvas quiz “Informed Consent”: each answer is the lecturer’s key, asked here without the options.","who":"hers"},{"id":"r:rc-consent-210119:1","deck":"consent","kind":"Quiz question","front":"Who is responsible for obtaining informed consent from a patient?","back":["The healthcare provider **performing the procedure**"],"src":"Questions and answers from the Canvas quiz “Informed Consent”: each answer is the lecturer’s key, asked here without the options.","who":"hers"},{"id":"r:rc-consent-210119:2","deck":"consent","kind":"Quiz question","front":"A patient who speaks limited English requires a complex surgical procedure. The patient's doctors need to speak to the patient about this. What is the best course of action for obtaining informed consent?","back":["Use a **professional interpreter** to explain the procedure"],"src":"Questions and answers from the Canvas quiz “Informed Consent”: each answer is the lecturer’s key, asked here without the options.","who":"hers"},{"id":"r:rc-consent-210119:3","deck":"consent","kind":"Quiz question","front":"A patient initially consents to a blood transfusion but later changes their mind. What should the nurse do?","back":["**Respect** the patient’s decision, **stop** the transfusion and **notify the prescriber**"],"src":"Questions and answers from the Canvas quiz “Informed Consent”: each answer is the lecturer’s key, asked here without the options.","who":"hers"},{"id":"r:rc-consent-210119:4","deck":"consent","kind":"Quiz question","front":"A patient with dementia who is deemed incompetent,is scheduled for a medical procedure and informed consent is required. What is the appropriate action in this situation?","back":["Consent to be obtained from the patient’s **legal guardian**"],"src":"Questions and answers from the Canvas quiz “Informed Consent”: each answer is the lecturer’s key, asked here without the options.","who":"hers"},{"id":"r:rc-vitals-210120:0","deck":"vitals","kind":"Quiz question","front":"Mrs. B becomes short of breath. This is called:","back":["**Dyspnoea**"],"src":"Questions and answers from the Canvas quiz “Practice Quiz 1”: each answer is the lecturer’s key, asked here without the options.","who":"hers"},{"id":"r:rc-process-210120:0","deck":"process","kind":"Quiz question","front":"Nursing practice now-a-days is focussed on:","back":["The **client**"],"src":"Questions and answers from the Canvas quiz “Practice Quiz 1”: each answer is the lecturer’s key, asked here without the options.","who":"hers"},{"id":"r:rc-ltc-210120:0","deck":"ltc","kind":"Quiz question","front":"The term 'long term conditions' was also known as:","back":["**Chronic** conditions"],"src":"Questions and answers from the Canvas quiz “Practice Quiz 1”: each answer is the lecturer’s key, asked here without the options.","who":"hers"},{"id":"r:rc-hha-210120:0","deck":"hha","kind":"Quiz question","front":"Mrs. B is complaining of pain, the first action you would do is:","back":["**Assess** her pain using the **pain scale**"],"src":"Questions and answers from the Canvas quiz “Practice Quiz 1”: each answer is the lecturer’s key, asked here without the options.","who":"hers"},{"id":"r:rc-prof-210120:0","deck":"prof","kind":"Quiz question","front":"Dr Z asks you to write down an emergency medication order over the telephone. As a first year student nurse you would say:","back":["I cannot as it is not in my **scope of practice** and inform the **RN preceptor**"],"src":"Questions and answers from the Canvas quiz “Practice Quiz 1”: each answer is the lecturer’s key, asked here without the options.","who":"hers"},{"id":"r:rc-docs-210120:0","deck":"docs","kind":"Quiz question","front":"Which one of the following is the main purpose of documentation?","back":["it promotes compliance with **legal requirements**"],"src":"Questions and answers from the Canvas quiz “Practice Quiz 1”: each answer is the lecturer’s key, asked here without the options.","who":"hers"},{"id":"r:rc-hha-210122:0","deck":"hha","kind":"Quiz question","front":"Which of the following best describes a holistic health assessment?","back":["Includes **physical**, **psychological**, **social**, and **spiritual** aspects"],"src":"Questions and answers from the Canvas quiz “Holistic Health Assessment”: each answer is the lecturer’s key, asked here without the options.","who":"hers"},{"id":"r:rc-hha-210122:1","deck":"hha","kind":"Quiz question","front":"A family member tells you their elderly mother is in pain. What source of data is this?","back":["**Secondary** source"],"src":"Questions and answers from the Canvas quiz “Holistic Health Assessment”: each answer is the lecturer’s key, asked here without the options.","who":"hers"},{"id":"r:rc-hha-210122:2","deck":"hha","kind":"Quiz question","front":"What are two (2) physical assessments conducted during a holistic health assessment?","back":["**Vital signs** assessment and **Falls risk** assessment"],"src":"Questions and answers from the Canvas quiz “Holistic Health Assessment”: each answer is the lecturer’s key, asked here without the options.","who":"hers"},{"id":"r:rc-process-210126:0","deck":"process","kind":"Quiz question","front":"A nurse is developing a care plan for a patient with fractured ribs. Which of the following is an appropriately prioritised NANDA-I nursing diagnosis?","back":["**Acute pain**"],"src":"Questions and answers from the Canvas quiz “Nursing Care Plans”: each answer is the lecturer’s key, asked here without the options.","who":"hers"},{"id":"r:rc-process-210126:1","deck":"process","kind":"Quiz question","front":"Prior to 2002, the abbreviation NANDA
