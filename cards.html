and benefits of the surgery to the family and the nurse discusses the clients' wishes with the family. The nurse is acting as the client's:","back":["**Advocate**"],"src":"Questions and answers from the Canvas quiz “Practice Quiz 2”: each answer is the lecturer’s key, asked here without the options.","who":"hers"},{"id":"r:rc-prof-210127:1","deck":"prof","kind":"Quiz question","front":"Your preceptor is busy writing clinical notes and asks you to give Mrs. Jones her Paracetamol tablets which are overdue. Your best response as a first-year student nurse is:","back":["**Decline** as this is not in a student nurse's **scope of practice**"],"src":"Questions and answers from the Canvas quiz “Practice Quiz 2”: each answer is the lecturer’s key, asked here without the options.","who":"hers"},{"id":"r:rc-pop-210127:0","deck":"pop","kind":"Quiz question","front":"The 2023 NZ Health Strategy is part of a collection of strategies published under the:","back":["**Pae Ora** (Healthy Futures) Act 2022"],"src":"Questions and answers from the Canvas quiz “Practice Quiz 2”: each answer is the lecturer’s key, asked here without the options.","who":"hers"},{"id":"r:rc-pop-210127:1","deck":"pop","kind":"Quiz question","front":"One of the main goals of the 2023 NZ Health Strategy is:","back":["To achieve **health equity**"],"src":"Questions and answers from the Canvas quiz “Practice Quiz 2”: each answer is the lecturer’s key, asked here without the options.","who":"hers"},{"id":"r:rc-ebp-210129:0","deck":"ebp","kind":"Quiz question","front":"What is the primary goal of evidence-based practice (EBP) in nursing?","back":["To improve **patient outcomes**"],"src":"Questions and answers from the Canvas quiz “Evidence-based Practice”: each answer is the lecturer’s key, asked here without the options.","who":"hers"},{"id":"r:rc-ebp-210129:1","deck":"ebp","kind":"Quiz question","front":"What is the first step in the evidence-based practice process?","back":["Formulating a **clinical question**"],"src":"Questions and answers from the Canvas quiz “Evidence-based Practice”: each answer is the lecturer’s key, asked here without the options.","who":"hers"},{"id":"r:rc-ebp-210129:2","deck":"ebp","kind":"Quiz question","front":"What type of research is considered the highest level of evidence in evidence-based practice?","back":["**Systematic reviews**"],"src":"Questions and answers from the Canvas quiz “Evidence-based Practice”: each answer is the lecturer’s key, asked here without the options.","who":"hers"},{"id":"r:rc-ebp-210129:3","deck":"ebp","kind":"Quiz question","front":"Which database is commonly used to find evidence-based research articles?","back":["**Cochrane** library"],"src":"Questions and answers from the Canvas quiz “Evidence-based Practice”: each answer is the lecturer’s key, asked here without the options.","who":"hers"},{"id":"r:rc-ebp-210129:4","deck":"ebp","kind":"Quiz question","front":"What is the purpose of critically appraising research evidence?","back":["To assess the **validity** and **reliability** of the findings"],"src":"Questions and answers from the Canvas quiz “Evidence-based Practice”: each answer is the lecturer’s key, asked here without the options.","who":"hers"},{"id":"r:rc-ebp-210129:5","deck":"ebp","kind":"Quiz question","front":"Which of the following best describes the concept of “clinical expertise” in evidence-based practice?","back":["Skills and knowledge acquired through **clinical experience**"],"src":"Questions and answers from the Canvas quiz “Evidence-based Practice”: each answer is the lecturer’s key, asked here without the options.","who":"hers"},{"id":"r:rc-literacy-210130:0","deck":"literacy","kind":"Quiz question","front":"A six year old child needs an IV luer inserted. An appropriate technique to teach them about this could be?","back":["**Play therapy**"],"src":"Questions and answers from the Canvas quiz “Health Literacy & Patient Education”: each answer is the lecturer’s key, asked here without the options.","who":"hers"},{"id":"r:rc-literacy-210130:1","deck":"literacy","kind":"Quiz question","front":"Which of the following best describes health literacy?","back":["The ability to **understand** and **use health information** to make informed decisions"],"src":"Questions and answers from the Canvas quiz “Health Literacy & Patient Education”: each answer is the lecturer’s key, asked here without the options.","who":"hers"},{"id":"r:rc-literacy-210130:2","deck":"literacy","kind":"Quiz question","front":"What is the teach-back method in patient education?","back":["A method where patients are asked to **repeat back** the information to **confirm** understanding"],"src":"Questions and answers from the Canvas quiz “Health Literacy & Patient Education”: each answer is the lecturer’s key, asked here without the options.","who":"hers"},{"id":"r:rc-literacy-210130:3","deck":"literacy","kind":"Quiz question","front":"A nurse is educating a patient with low health literacy about managing hypertension. Which strategy should the nurse use to improve the patient’s understanding?","back":["Use **teach-back** method to confirm understanding"],"src":"Questions and answers from the Canvas quiz “Health Literacy & Patient Education”: each answer is the lecturer’s key, asked here without the options.","who":"hers"},{"id":"w:q94aa751ed3","deck":"tool","kind":"Tool’s question","title":"The windscreen survey","front":"What is a windscreen survey? Give two things a nurse would look for, and state whether the information is primary or secondary data.","back":["A quick **snapshot** of a community, by **driving through** and **observing**","Aim: a general sense of its **strengths and needs**","**Parks**, **schools**, **supermarkets and food access**","**Housing conditions**, **transport**, **clinics** and pharmacies","**Primary data**: what **you observe yourself**","It should then be **confirmed** with community groups and records"],"heads":[["What it is",2],["Two things to look for",2],["Primary or secondary data?",2]],"full":["A quick overview (“snapshot”) of a community gained by driving through it and observing, taking notes to analyse later — the aim is a general sense of its strengths and needs.","Any two of: parks and recreation spaces · schools and childcare · shops, supermarkets and food access · housing conditions · transport and access · clinics, hospitals and pharmacies · visible health behaviours such as people out walking.","It is PRIMARY data — what you observe yourself. It should then be confirmed by talking with community groups and by records such as immunisation rates and public health indicators."],"src":"Question and model answer are the tool’s · from the Community Needs Assessment Framework deck, slides 27, 29 and 30","who":"tool"},{"id":"w:q405648f0e0","deck":"tool","kind":"Tool’s question","title":"Kawa Whakaruruhau (cultural safety)","front":"Define Kawa Whakaruruhau (cultural safety) and state two things it requires of the nurse.","back":["Care **judged safe by the recipient** of care","Aim: **equitable outcomes for Māori**","**Critical self-reflection**: how your **own biases** affect relationships","Recognising and addressing **power imbalance**, **bias and racism**","It goes **beyond cultural awareness**, sensitivity or competence"],"heads":[["Define it",2],["Two things it requires",3]],"full":["Definition: cultural safety is care that is judged safe by the RECIPIENT of care — the person’s and whānau experience defines the quality of the care, with the aim of equitable outcomes for Māori.","It requires critical self-reflection: the nurse examines how their own biases and attitudes affect their relationships with individuals, whānau and other health professionals.","It requires the nurse to recognise and address power imbalance, bias and racism — nurses are inadvertent bearers of power — and it goes beyond cultural awareness, sensitivity or competence."],"src":"Question and model answer are the tool’s · from the Tikanga Best Practice and Kawa Whakaruruhau deck, slides 2 and 6","who":"tool"},{"id":"w:qd7c1545086","deck":"tool","kind":"Tool’s question","title":"OLDCARTS pain assessment","front":"OLDCARTS is the structured pain assessment tool taught in this course. State what each of its eight letters stands for.","back":["O · **Onset**: when did it start?","L · **Location**: where is it? does it **radiate**?","D · **Duration**: how long? does it come and go?","C · **Characteristics**: what does it feel like?","A · **Aggravating factors**: what makes it worse?","R · **Relieving factors**: what makes it better?","T · **Timing**: pattern or frequency, day or night","S · **Severity**: rated on a **pain scale**, 0–10, at rest and moving"],"heads":null,"full":["O = Onset (when did it start?) · L = Location (where is it? does it radiate?)","D = Duration (how long does it last? does it come and go?) · C = Characteristics (what does it feel like?)","A = Aggravating factors (what makes it worse?) · R = Relieving factors (what makes it better — medications and other interventions)","T = Timing (pattern or frequency, day or night) · S = Severity (rated with an appropriate pain scale, e.g. 0–10 at rest and on movement)"],"src":"Question and model answer are the tool’s · from the Pain Assessment deck, slides 33–42","who":"tool"},{"id":"w:q24f27c30de","deck":"tool","kind":"Tool’s question","title":"Family-centred care: the three elements","front":"Name the three elements of facilitating family-centred care and give one nursing action for each.","back":["**Relationship**: a **mutually respectful partnership**","Action: **invest time in building trust**","**Participation and involvement** that respects their **autonomy**","Action: **involve them in care**; find out **what is important** to them","**Tailoring care** to their **needs, strengths**, limits and context","Action: help them make **informed decisions**; plan **realistic** care"],"heads":[["1 · Relationship",2],["2 · Participation",2],["3 · Tailoring care",2]],"full":["Relationship — establish a genuine, positive, mutually respectful partnership: find common ground, invest time in building trust, and (with the person’s permission) share relevant information.","Participation and involvement — enable the person and family to take part in care in a way that respects their autonomy: involve them in care, keep up communication, find out what is important to them.","Tailoring care — design care around the person’s and family’s needs, strengths, limitations and context: help them make informed decisions and plan care that is realistic (early intervention, health promotion, discharge planning)."],"src":"Question and model answer are the tool’s · from the Family Centred Care deck, slides 27–29 and 31–35","who":"tool"},{"id":"w:q96c41cc04a","deck":"tool","kind":"Tool’s question","title":"Health equity vs equality","front":"Define health equity, explain how it differs from equality, and name one group the New Zealand Health Strategy prioritises for equity.","back":["A **fair and just opportunity** to be **as healthy as possible**","By **removing obstacles**: **poverty**, **discrimination**","**Equality**: everyone gets the **same resources**","**Equity**: people get **what they need** to reach **similar outcomes**","**Māori**, **Pacific peoples** or **disabled people**","Equity rests on **ōritetanga** from **Te Tiriti o Waitangi**"],"heads":[["Define health equity",2],["How it differs from equality",2],["One priority group",2]],"full":["Health equity: everyone has a fair and just opportunity to be as healthy as possible — which means removing obstacles to health such as poverty, discrimination and their consequences.","Difference: equality gives everyone the SAME resources; equity gives people what they NEED in order to reach similar outcomes.","Any one of: Māori · Pacific peoples · disabled people · other groups with poorer outcomes (the deck also names rural and low-income communities). In the strategy equity rests on ōritetanga from Te Tiriti o Waitangi."],"src":"Question and model answer are the tool’s · from the New Zealand Health Strategy 2023 deck, slides 5, 9–10 and 16","who":"tool"},{"id":"w:q4f37b4878a","deck":"tool","kind":"Tool’s question","title":"Discharge planning: definition and benefits","front":"Define discharge planning and state two benefits of doing it well.","back":["An **interdisciplinary** approach to **continuity of care**","It helps the person **move smoothly** from one setting to another","It keeps the **progress already made**, and it **begins at admission**","**Fewer readmissions**","A **shorter length of hospital stay**","**Less follow-up community care** needed","Or: they leave **understanding their medicines** and the **warning signs**"],"heads":[["Define it",3],["Two benefits",4]],"full":["Definition: an interdisciplinary approach to continuity of care — a process (identification, assessment, goal setting, planning, implementation, coordination, evaluation) that helps a person move smoothly from one setting or level of care to another without losing the progress already made. It begins at admission.","Benefit (any two, one mark each): fewer readmissions · shorter length of hospital stay · less follow-up community care needed.","Also accepted as a benefit: the patient and family leave understanding their medicines, warning signs, follow-up and who to contact — a safe link between hospital, community services and carers."],"src":"Question and model answer are the tool’s · from the Discharge Planning deck, slides 3, 6, 8 and 10","who":"tool"},{"id":"w:qf6ebfc539d","deck":"tool","kind":"Tool’s question","title":"Surface acting and deep acting","front":"Define surface acting and deep acting, and say which component of emotional intelligence they belong to.","back":["**Surface acting**: **expressing an emotion you do not feel**","“**Putting on a mask**”","**Deep acting**: a **real shift in how the nurse feels**","… reached by seeing it from the **patient’s perspective**","Both are **emotional labour**, which belongs to **self-regulation**"],"heads":[["Define them",4],["Which component?",1]],"full":["Surface acting: outwardly expressing an emotion you do not feel because the situation needs it — “putting on a mask” (“I don’t feel calm or kind, but I act calm and kind anyway”).","Deep acting: a real shift in how the nurse feels, reached by actively trying to understand the situation from the patient’s perspective.","Both are forms of emotional labour, which belongs to SELF-REGULATION — nurses still feel emotions, but not so intensely that they cannot function."],"src":"Question and model answer are the tool’s · from the Therapeutic Use of Self deck, slides 28–29","who":"tool"},{"id":"w:qce7c3bfad3","deck":"tool","kind":"Tool’s question","title":"ISBAR: what each part stands for","front":"State what each part of the ISBAR handover tool stands for and what the nurse says under it.","back":["I · **Introduction** / **Identify**: who and where you are, why calling","S · **Situation**: what is happening **now**","B · **Background**: what **led to** the situation","A · **Assessment**: what you consider **the problem** to be","R · **Request** / **Recommend**: what should be done"],"heads":null,"full":["I — Introduction / Identify: who you are, where you are, why you are calling (and is this a good time to talk?).","S — Situation: what is happening now — “The situation is…”.","B — Background: what led to the situation — “By way of background…”.","A — Assessment: what you consider the problem to be — “My assessment is…”.","R — Request / Recommend: what should be done to correct the problem — “I recommend…”."],"src":"Question and model answer are the tool’s · from the Roles of Nurses deck, slide 29","who":"tool"},{"id":"w:q5ccbdd42fa","deck":"tool","kind":"Tool’s question","title":"Going home after rheumatic fever","front":"A 12-year-old is going home after treatment for rheumatic fever. Describe the ongoing management and protection the nurse would teach the child and their whānau.","back":["**Penicillin injections every 28 days**","For **at least 10 years** or **until age 21**, whichever is longer","The **first** is given **before leaving hospital**","**Never miss or stop** them without the doctor","Away from home: get it **early** or **arranged elsewhere**","**District nurses** give it at **school**, **home** or a **clinic**","**Extra antibiotic cover** before **procedures**, **operations** or **dental visits**","Carry the **rheumatic fever wallet card** for the dentist or doctor","**Get every sore throat checked**","**Dental hygiene**, **regular exercise** when safe, a **healthy weight**, **smoke-free**"],"heads":[["Penicillin",6],["Protecting the heart",2],["Staying well",2]],"full":["Penicillin injections every 28 days for at least 10 years or until age 21, whichever is longer; the first is given before leaving hospital.","Never miss or stop them without the doctor: on holiday or moving, get it early or arranged elsewhere; district nurses can give it at school, at home or in a clinic.","Extra antibiotic cover before medical procedures, operations or dental visits, and carry the rheumatic fever wallet card to show the dentist or doctor.","Get every sore throat checked; good dental hygiene; regular exercise once the doctor says it is safe; a healthy weight; be smoke-free."],"src":"Question and model answer are the tool’s · from the Rheumatic Fever lecture deck, slides 10–14; the guest speaker’s Rheumatic Fever deck (Jessica Murray, CNS KidzFirst), slide 13","who":"tool"},{"id":"w:q24514917c6","deck":"tool","kind":"Tool’s question","title":"LTC, self-management, self-management support","front":"Define a long-term condition, self-management, and self-management support.","back":["Lasts, or is expected to last, **longer than 6 months**","**Ongoing or recurring**, with a **significant impact** on life","Also called **NCDs** or **chronic conditions**","**Any way** a person **manages their condition** by **themselves**","An **ongoing process**, **not a one-time event**","The **help, tools and techniques** to manage health **day to day**","**Educating** and **motivating** them, in a **collaborative partnership**"],"heads":[["Long-term condition",3],["Self-management",2],["Self-management support",2]],"full":["Long-term condition: any condition lasting, or expected to last, longer than 6 months — ongoing or recurring — with a significant impact on people’s lives (also called NCDs or chronic conditions).","Self-management: any way in which a person with an LTC manages their condition(s) themselves — an ongoing process, not a one-time event.","Self-management support: the help, tools and techniques given to people with LTCs to manage their health day to day — educating and motivating them, in a collaborative partnership."],"src":"Question and model answer are the tool’s · from the Long-term Conditions lecture deck (Self-management support for people with long-term conditions 2026), slides 3, 6–7, 13 and 45","who":"tool"},{"id":"w:q66b40d9553","deck":"tool","kind":"Tool’s question","title":"Four injection routes and their angles","front":"Name the four parenteral injection routes. For each, say where the medicine is deposited and, where the CLS Inpatient Prep page gives one, the needle angle.","back":["**Intradermal**: into the **dermis**, below the epidermis — **15°**","**Subcutaneous**: just **below the dermis** — **45°**","SC at **90°** if **5 cm** of tissue can be grasped","**Intramuscular**: into a **muscle** — **90°**","**Intravenous**: into a **vein**"],"heads":null,"full":["Intradermal (ID): into the dermis, just below the epidermis — 15°.","Subcutaneous (SC): into the tissue just below the dermis — 45°, or 90° if 5 cm of tissue can be grasped.","Intramuscular (IM): into a muscle — 90°.","Intravenous (IV): into a vein."],"src":"Question and model answer are the tool’s · from the CLS page “Inpatient Prep – Injections”, the list of injection sites, the angles figure and “Subcutaneous injections”","who":"tool"},{"id":"w:q3307488a1c","deck":"tool","kind":"Tool’s question","title":"Five principles of primary health care","front":"Name the five principles of primary health care from the Alma-Ata Declaration, and describe two of them with a nursing example.","back":["**Accessibility**, **community participation**, **health promotion**","**Appropriate technology**, **inter-sectoral collaboration**","The **first** and **most important** principle","Services **available**, **affordable** and **reachable** for all","e.g. **rural health nurses** bringing care to **remote** communities","Community participation: **planning**, **implementing**, **maintaining** services (**Whānau Ora**)","Health promotion: **increase control** over their health (**school nurses**)","Appropriate technology: **affordable**, **sustainable**, **culturally acceptable** (**telehealth**)","Inter-sectoral: health with **education**, **housing**, **transport** (**public health nurses**)"],"heads":[["The five principles (Alma-Ata, 1978)",2],["Accessibility",3],["A second principle, any one",4]],"full":["The five principles (Alma-Ata Declaration, 1978): accessibility, community participation, health promotion, appropriate technology and inter-sectoral collaboration.","Accessibility, the first and most important: health services are available, affordable and reachable for all, regardless of location or socioeconomic status — e.g. rural health nurses bringing care to remote communities.","A second, any one of: community participation — the community is involved in planning, implementing and maintaining its health services (Whānau Ora nurses); health promotion — enabling people to increase control over their health (school nurses); appropriate technology — affordable, sustainable and culturally acceptable (telehealth); inter-sectoral collaboration — health working with education, housing and transport (public health nurses)."],"src":"Question and model answer are the tool’s · from the Primary Health Care & Health Promotion deck, slides 7 and 9–19","who":"tool"},{"id":"w:q1bc2c12197","deck":"tool","kind":"Tool’s question","title":"Upstream, midstream and downstream","front":"Health promotion can be upstream, midstream or downstream. Describe each approach and give a nursing intervention for each.","back":["The **root causes**: **social**, **economic**, **environmental** conditions","Through **policy** and **community engagement**, **before** issues start","e.g. **policy changes**, **community development**, **improving living conditions**","Changes **individual behaviours** and **lifestyle factors**","Issues have **started**; stop them **getting worse**","e.g. **screenings**, **referrals**, **health education**, **social marketing**","**Clinical care** and **treatment** for people **already** unwell","e.g. **diabetes** or **hypertension**, **acute care**, **rehabilitation**"],"heads":[["Upstream",3],["Midstream",3],["Downstream",2]],"full":["Upstream: addresses the root causes of health issues — social, economic and environmental conditions — through policy and community engagement, to prevent health issues before they start; e.g. policy changes, community development, improving living conditions.","Midstream: modifies individual behaviours and lifestyle factors once issues have started to show, to stop them getting worse; e.g. screenings, referrals, support services, health education and social marketing.","Downstream: clinical care and treatment for people already experiencing health problems; e.g. managing chronic conditions such as diabetes or hypertension, acute care, administering medications, rehabilitation."],"src":"Question and model answer are the tool’s · from the Primary Health Care & Health Promotion deck, slides 37–47","who":"tool"},{"id":"w:q1b6d6b9dab","deck":"tool","kind":"Tool’s question","title":"Health screening: purpose, types, the nurse","front":"Explain the purpose of health screening, the difference between organised and opportunistic screening, and the nurse’s role in screening.","back":["Finds people **at risk** **before symptoms** appear","**Detected early**, treated **in time**, **better outcomes**","It does **not** give a **diagnosis**","**National programmes** run by the **National Screening Unit**","**Inviting** the groups at **highest risk**","e.g. **BreastScreen Aotearoa**, **cervical**, **bowel**, **newborn** screening","A test the person **asks for**, or a professional **offers**","e.g. **blood pressure**, **blood glucose**, **cholesterol** at a **wellness clinic**","**Educates** and **encourages** people to take part","**Facilitates** the **assessments**","Explains **false positives** and **false negatives**, for **informed consent**","**Supports follow-up** after the result"],"heads":[["Purpose",3],["Organised",3],["Opportunistic",2],["The nurse",4]],"full":["Purpose: screening identifies people at risk before symptoms appear, so health issues are detected early and treated in time for better outcomes — but screening does not give a diagnosis.","Organised screening: national programmes overseen by the National Screening Unit, inviting the population groups at highest risk — e.g. BreastScreen Aotearoa, the National Cervical and Bowel Screening Programmes, newborn metabolic and hearing screening.","Opportunistic screening: a check or test a person asks for, or a health professional offers — e.g. blood pressure, blood glucose or cholesterol checks at a wellness clinic.","The nurse: educates and encourages people to take part, facilitates the assessments, explains the risks (false positives and false negatives) to ensure informed consent, and supports follow-up and communication after the result."],"src":"Question and model answer are the tool’s · from the Health Screening deck, slides 6, 9–11, 16–17 and 24–25","who":"tool"},{"id":"w:q1efc88a0f3","deck":"tool","kind":"Tool’s question","title":"The nursing process, five steps","front":"List the five steps of the nursing process in order and state briefly what happens in each.","back":["1 **Assessment**: **collect data** by observation, interview, examination","… **subjective and objective**; validate and document it","2 **Diagnosis**: **actual and potential problems**, **prioritised**","… written as **diagnostic statements**, not a medical diagnosis","3 **Planning**: **patient-centred goals**, outcome criteria, a **time frame**","4 **Implementation**: the **interventions are carried out**, **evidence-based**, safe","5 **Evaluation**: the **patient’s response**; goal **met, partially met or not met**","The process is **ongoing and cyclical**"],"heads":null,"full":["Assessment — collect data about the patient by observation, interview and examination (subjective and objective), then validate and document it.","Diagnosis (nursing) — actual and potential problems found in the assessment are prioritised and written as diagnostic statements; not a medical diagnosis.","Planning — patient-centred goals and outcome criteria are set, with priorities and a time frame.","Implementation — the nursing interventions are carried out: evidence-based, safe, within the nurse’s scope and compatible with medical orders.","Evaluation — the patient’s response to each intervention is analysed and the goal is judged met, partially met or not met; the process is ongoing and cyclical."],"src":"Question and model answer are the tool’s · from The Nursing Process 2026 deck, slides 8, 11, 17, 23, 29 and 33","who":"tool"},{"id":"w:q512085f5ef","deck":"tool","kind":"Tool’s question","title":"Objective and subjective data","front":"Define objective data and subjective data, and give one example of each from a patient admitted with nausea.","back":["**Observable and measurable** facts: **signs**","e.g. **pallor**, **sweating**, a measured temperature, an observed vomit","What **only the patient can feel and describe**: **symptoms**","e.g. **“I feel like I’m about to be sick”**, or **rating their nausea**"],"heads":[["Objective data",2],["Subjective data",2]],"full":["Objective data: observable and measurable facts — signs.","Example: pallor, sweating, a measured temperature or pulse, an observed vomit.","Subjective data: information that only the patient can feel and describe — symptoms.","Example: the patient saying “I feel like I’m about to be sick” or rating their nausea."],"src":"Question and model answer are the tool’s · from Holistic Health Assessment 2026 deck, slide 9; example from The Nursing Process 2026 deck, slide 21","who":"tool"},{"id":"w:q4132224a2d","deck":"tool","kind":"Tool’s question","title":"Why nurses document: three reasons","front":"Give the three reasons nurses document that are taught in this course, with one sentence on each.","back":["A **legal requirement**: a **legal document**, **evidence of your practice**","“**If it isn’t documented, it didn’t happen**”","A **professional responsibility**: **Nursing Council** standards, **Code of Conduct**","Records **clear, accurate, legible, timely**; signed, dated, timed","A **communication tool** across the **multi-disciplinary team**","It spots problems **early** and supports **continuity of care**"],"heads":null,"full":["A legal requirement — the clinical record is a legal document and evidence of your practice; it may be examined months or years later (“if it isn’t documented, it didn’t happen”).","A professional responsibility — the Nursing Council’s standards of competence and Code of Conduct require clear, accurate, legible, timely records, signed, dated and timed.","A communication tool — it carries information between the multi-disciplinary team, gives an accurate account of care, allows problems to be detected early and supports continuity of care."],"src":"Question and model answer are the tool’s · from Clinical Documentation 2026 deck, slides 4–10","who":"tool"},{"id":"w:qfe9b0fe412","deck":"tool","kind":"Tool’s question","title":"Normal adult ranges","front":"Give the normal adult ranges taught in this course for oxygen saturation, blood pressure (systolic and diastolic) and temperature, and define tachycardia and bradycardia.","back":["**SpO2**: **95–100%**","BP: **systolic** usually **110–140**, **diastolic** usually **60–90** mmHg","Temperature: **36.5–37.5 °C**","Above **38 °C** is **pyrexia**; below **35 °C** is **hypothermia**","**Tachycardia**: a heart rate **above 100** bpm","**Bradycardia**: a heart rate **below 60** bpm"],"heads":[["The normal ranges",4],["Two definitions",2]],"full":["SpO2: 95–100%.","Blood pressure: systolic usually 110–140 mmHg, diastolic usually 60–90 mmHg.","Temperature: 36.5–37.5 °C (36–36.4 °C is usually considered safe; 37.6–37.9 °C is a low-grade fever; above 38 °C is pyrexia; below 35 °C is hypothermia).","Tachycardia: heart rate above 100 bpm. Bradycardia: heart rate below 60 bpm."],"src":"Question and model answer are the tool’s · from Vital Signs 2026 deck, slides 13, 17, 24 and 30–32","who":"tool"},{"id":"w:q6a565f86cd","deck":"tool","kind":"Tool’s question","title":"Standard vs transmission-based precautions","front":"Define standard precautions, and distinguish them from transmission-based precautions, naming the three types of the latter.","back":["The **minimum** precautions for **all patients**","Whenever **blood or body fluids** are possible: **you cannot tell by looking**","e.g. **hand hygiene**, **PPE**, **safe sharps**, aseptic technique","**Added** for a **known or suspected pathogen**, by how it spreads","**Contact**: MRSA, gastro","**Droplet**: influenza, mumps","**Airborne**: measles, TB; an **N95** and a **negative-pressure room**"],"heads":[["Standard precautions",3],["Transmission-based, and the three types",4]],"full":["Standard precautions: the MINIMUM precautions for ALL patients, whatever their known infection status, whenever contact with blood or body fluids is possible — because you cannot tell by looking who is infectious.","They include hand hygiene, PPE, respiratory hygiene and cough etiquette, safe sharps practice, linen and waste management, aseptic technique, reprocessing of equipment, and environmental cleaning.","Transmission-based precautions are ADDED for a known or suspected pathogen, according to how it spreads — PPE, single-room allocation, air-quality controls.","The three types: contact (e.g. MRSA, gastro infections), droplet (e.g. influenza, mumps, meningitis) and airborne (e.g. measles, chickenpox, TB, COVID-19 — N95/P2 respirator and a negative-pressure room)."],"src":"Question and model answer are the tool’s · from Infection Prevention & Control 2026 deck, slides 24, 26–27 and 48–52","who":"tool"},{"id":"w:q1c156cf256","deck":"tool","kind":"Tool’s question","title":"Hypoglycaemia: definition, causes, symptoms","front":"Define hypoglycaemia. Give two causes and two symptoms.","back":["Blood glucose **below 4 mmol/L**","A **missed or delayed meal**; **too little carbohydrate**","**Too much insulin**; exercise without adjusting; **alcohol**","**Shaky, sweaty**; a **racing pulse**; **pale**","**Tingling around the mouth**; suddenly **very hungry**; **headache**","Injected insulin **cannot be switched off**, so the level **keeps falling**"],"heads":[["Define it",1],["Two causes",2],["Two symptoms",2],["Why it happens on insulin",1]],"full":["Definition: low blood glucose — a level below 4 mmol/L, or symptoms of hypoglycaemia at a level close to this (normal without diabetes is 4–7.5 mmol/L).","Causes (any two): too little carbohydrate with a meal · a missed or delayed meal or snack · physical activity without adjusting insulin or eating more · too much insulin · alcohol in excess or without food.","Symptoms (any two): shaky, sweaty or suddenly unwell · racing pulse · tingling around the mouth and tongue · suddenly “strange” and unable to concentrate · suddenly very hungry · pale · headache · restless or anxious.","Why it happens on insulin: injected insulin cannot be “switched off”, so glucose keeps moving into the cells and the liver does not release its store — the level keeps falling."],"src":"Question and model answer are the tool’s · from Diabetes Mellitus deck, slides 17 and 19–22","who":"tool"},{"id":"w:q3a774d2cfe","deck":"tool","kind":"Tool’s question","title":"Social determinants of health","front":"Define the social determinants of health and give two examples, saying how each affects health.","back":["The conditions people are **born, grow, live, work and age** in","They set **social position**: access to **power, money and resources**","They account for **at least half** of health outcomes","**Housing**: **cold, damp, overcrowded** homes → **respiratory illness**","**Food environments**: **food deserts** → **obesity**, **type 2 diabetes**","**Work**: **insecure or unsafe** work → physical and **mental health risk**","**Transport**: poor public transport **limits access** to care"],"heads":[["Define them",3],["Two examples, with the effect",4]],"full":["Definition: the conditions in which people are born, grow, live, work and age — the societal factors that give rise to social position (access to power, money and resources) and therefore to health. They account for at least half of health outcomes and inequities.","Example (any two, one mark each, with the effect): housing — cold, damp, overcrowded homes lead to respiratory illness and communicable disease · food environments — food deserts and swamps in low-income areas drive obesity, cardiovascular disease and type 2 diabetes.","Work and employment — insecure or unsafe work raises physical and mental health risk · education — linked to better income, job stability and health · transport — poor public transport limits access to care, work and education · the health system itself — how accessible and affordable care is."],"src":"Question and model answer are the tool’s · from Social Determinants of Health deck, slides 7, 9, 16–17 and 28–39","who":"tool"},{"id":"w:qdb011b35e5","deck":"tool","kind":"Tool’s question","title":"Te Tiriti: the five health principles","front":"The Waitangi Tribunal recommended five principles of Te Tiriti o Waitangi for the health sector. Name them (in te reo Māori or English) with a brief meaning for nursing.","back":["**Tino rangatiratanga**: **self-determination**; Māori **lead** Māori health","**Mana taurite**: **equity**, resources where **need is greatest**","**Whakamarumarutia**: **active protection**; health is a **taonga**","**Kōwhiringa**: **options**, including **kaupapa Māori services**","**Pātuitanga**: **partnership** in planning, delivering and evaluating","The old **“three Ps”** are **outdated**"],"heads":null,"full":["Tino rangatiratanga — self-determination: Māori lead decisions about Māori health; nurses work alongside Māori, not for Māori.","Mana taurite — equity: a fair opportunity for good health; resources targeted where need is greatest — not the same thing for everyone.","Whakamarumarutia — active protection: health is a taonga; act to prevent harm and address inequities rather than only responding to problems.","Kōwhiringa — options: properly resourced, culturally appropriate choices, including kaupapa Māori services and Māori models of health.","Pātuitanga — partnership: Māori involved in planning, delivering and evaluating services — decisions made with the community, not for it. (The “three Ps” are outdated and should not be used.)"],"src":"Question and model answer are the tool’s · from Population Health vs Personal Health deck, slides 20–31","who":"tool"},{"id":"w:q6d84562104","deck":"tool","kind":"Tool’s question","title":"The four levels of prevention","front":"Define primordial, primary, secondary and tertiary prevention and give an example of each.","back":["**Primordial**: stop **risk factors from developing**; e.g. **Healthy Homes Initiative**","**Primary** (“**Prevent**”): **before the onset**; e.g. **vaccination**","**Secondary** (“**Screen**”): **detect disease early**; e.g. **cervical screening**","**Tertiary** (“**Treatment**”): stop it **worsening**; e.g. an **insulin regime**"],"heads":null,"full":["Primordial — prevents risk factors from developing in a population, through large-scale social and environmental change. Example: the Healthy Homes Initiative.","Primary (“Prevent”) — action before the onset of disease so that it never occurs. Example: vaccination clinics, sexual health education, PPE at work.","Secondary (“Screen”) — detect disease early and stop it progressing. Example: cervical screening, mammograms, colonoscopy.","Tertiary (“Treatment”) — manage an existing condition to prevent it worsening, further disability or death. Example: an insulin regime in diabetes to prevent cardiovascular or renal disease."],"src":"Question and model answer are the tool’s · from Demography & Epidemiology deck, slides 38–45","who":"tool"},{"id":"w:qbc6c2ac958","deck":"tool","kind":"Tool’s question","title":"Informed consent and the two laws","front":"Define informed consent, and name the two pieces of New Zealand law that make it a requirement.","back":["A **process** of communicating the **benefits, risks and alternatives**","So the patient makes an **informed decision**: **more than a signature**","The **Code of Health and Disability Services Consumers’ Rights**, **Right 7**","The **Bill of Rights Act 1990**, **section 11**: the **right to refuse**"],"heads":[["Define it",2],["The two laws",2]],"full":["Definition: the PROCESS of communicating to a patient the benefits, risks and alternatives of a procedure or treatment, so that the patient can make an informed decision to accept it or not — more than a signature on a piece of paper.","The Code of Health and Disability Services Consumers’ Rights, Right 7 — the right to make an informed choice and give informed consent (the Code is a regulation under the Health and Disability Commissioner Act 1994).","The New Zealand Bill of Rights Act 1990, section 11 — the right to refuse to undergo medical treatment."],"src":"Question and model answer are the tool’s · from Informed consent 2026 deck, slides 3–4 and 28","who":"tool"},{"id":"w:q0bc7ba99d3","deck":"tool","kind":"Tool’s question","title":"Who can consent to treatment in NZ","front":"Who can give consent to treatment in New Zealand? Cover an adult, a 14-year-old, and an adult who is not competent.","back":["An adult: anyone **16 or over** can **consent to or refuse**","A 14-year-old: a **parent, guardian** (or a **court order**)","An adult **not competent**: a **legal guardian** or **enduring power of attorney**","Still act in their **best interests**; find out **their views**"],"heads":null,"full":["Anyone aged 16 or over can consent to — or refuse — their own treatment.","Under 16: a parent, guardian or other person acting in the place of a parent gives consent (or a court order).","A person aged 16 or over who is not competent: a legal guardian or someone holding a current enduring power of attorney. The nurse must still act in the person’s best interests and take reasonable steps to find out their views."],"src":"Question and model answer are the tool’s · from Informed consent 2026 deck, slides 8 and 21","who":"tool"},{"id":"w:q49db232e0a","deck":"tool","kind":"Tool’s question","title":"Evidence-based practice: the three parts","front":"Define evidence-based practice and name the three things it integrates.","back":["A shift away from **opinion and past practice**","… to **research and evidence** guiding decisions, to **improve patient outcomes**","The **best research evidence**","**Clinical expertise**","The **patient’s values and preferences**"],"heads":[["Define it",2],["It integrates",3]],"full":["Definition: a shift away from basing decisions on opinion and past practice, towards research and evidence guiding clinical decision-making, in order to improve patient outcomes.","It integrates (1) the best research evidence and (2) clinical expertise…","…and (3) the patient’s values and preferences."],"src":"Question and model answer are the tool’s · from Evidence-based Practice 2026 deck, slides 11 and 13","who":"tool"}]};</script><script type="module" src="cards.js?v=c2b2075c"></script></body></html>
